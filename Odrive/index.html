<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>City Drive v3</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#87ceeb;touch-action:none;}
#joystick {position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.12);z-index:5;}
#stick {position:absolute;left:55px;top:55px;width:30px;height:30px;border-radius:50%;background:#00ff66;}
#minimap {position:fixed;top:10px;right:10px;width:150px;height:150px;background:rgba(0,0,0,0.4);border:1px solid #0f0;z-index:6;}
</style>
</head>
<body>
<div id="joystick"><div id="stick"></div></div>
<canvas id="minimap"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>

// ===== SCENE & CAMERA =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 3000);
camera.position.set(0,1.6,0);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// ===== LIGHT =====
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.2));
const sun = new THREE.DirectionalLight(0xffffff,0.8);
sun.position.set(300,400,200);
scene.add(sun);

// ===== PLAYER =====
const player = new THREE.Object3D();
scene.add(player);
player.add(camera);
let speed=0,steer=0;

// ===== GROUND =====
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1500,1500),new THREE.MeshLambertMaterial({color:0x222222}));
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// ===== ROADS & SIDEWALKS =====
function createRoad(x,z,w,d){
  const shape = new THREE.Shape();
  shape.moveTo(-w/2,-d/2); shape.lineTo(w/2,-d/2); shape.lineTo(w/2,d/2); shape.lineTo(-w/2,d/2); shape.lineTo(-w/2,-d/2);
  const geo = new THREE.ShapeGeometry(shape);
  const mesh = new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:0x000000}));
  mesh.rotation.x=-Math.PI/2; mesh.position.set(x,0.01,z);
  scene.add(mesh);
  return mesh;
}
function createSidewalk(x,z,w,d){
  const geo = new THREE.BoxGeometry(w,0.2,d);
  const mesh = new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:0x777777}));
  mesh.position.set(x,0.2,z); scene.add(mesh); return mesh;
}

// ===== TRAFFIC LIGHTS =====
const lights = [];
function createTrafficLight(x,z){
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,3,16),new THREE.MeshLambertMaterial({color:0x222222}));
  pole.position.set(x,1.5,z); scene.add(pole);

  const createLights = () => {
    const group = new THREE.Group();
    const radius=0.2, spacing=0.25;
    const colors=[0xff0000,0xffff00,0x00ff00];
    colors.forEach((color,i)=>{
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius,16,16), new THREE.MeshBasicMaterial({color:color}));
      mesh.position.y = 2.0 - i*spacing;
      group.add(mesh);
    });
    group.position.set(x,0,z); scene.add(group);
    return group;
  }

  const group1 = createLights();
  const group2 = group1.clone(); group2.rotation.y=Math.PI/2; scene.add(group2);
  lights.push({groups:[group1,group2],timer:0});
}

// ===== BUILDINGS & SIDEWALKS & TRAFFIC LIGHTS =====
const colliders=[]; const lods=[];
function createBuilding(x,z,w,d,h,type){
  let color = 0xffaa33; if(type===1) color=0x33aaff; if(type===2) color=0xaaff33;
  const geo = new THREE.BoxGeometry(w,h,d); const mat = new THREE.MeshLambertMaterial({color});
  const mesh = new THREE.Mesh(geo,mat); mesh.position.set(x,h/2,z); scene.add(mesh);
  lods.push(mesh); colliders.push(new THREE.Box3().setFromObject(mesh));

  const sidewalk = createSidewalk(x,z,w+6,d+6);
  const hw = (w+6)/2, hd=(d+6)/2;
  createTrafficLight(x+hw,z+hd); createTrafficLight(x+hw,z-hd);
  createTrafficLight(x-hw,z+hd); createTrafficLight(x-hw,z-hd);
  return mesh;
}

// ===== SAMPLE CITY =====
const rows=[-70,-120,-200]; const cols=[-120,-40,40,120];
rows.forEach(z=>{cols.forEach(x=>{
  const h = 15 + Math.random()*20; const t = Math.floor(Math.random()*3);
  createBuilding(x,z,30,20,h,t);
})});

// ===== NPC VEHICLES =====
const npcs=[];
function createNPC(x,z){
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(4,2,8),new THREE.MeshLambertMaterial({color:0xff0000}));
  body.position.y=1.5; group.add(body);

  const wheelGeo = new THREE.CylinderGeometry(0.8,0.8,0.4,16);
  const wheelMat = new THREE.MeshLambertMaterial({color:0x222222});
  const wheelPositions=[[1,-0.5,3],[1,-0.5,-3],[-1,-0.5,3],[-1,-0.5,-3]];
  wheelPositions.forEach(pos=>{
    const wheel = new THREE.Mesh(wheelGeo,wheelMat); wheel.rotation.z=Math.PI/2;
    wheel.position.set(pos[0],pos[1]+0.5,pos[2]); group.add(wheel);
  });

  group.position.set(x,0,z);
  group.userData.speed = 0.2 + Math.random()*0.15;
  group.userData.dir = chooseTarget(); group.userData.targetPos = group.position.clone();
  scene.add(group); npcs.push(group);
}
function chooseTarget(){ return Math.floor(Math.random()*4); }
[-80,-40,40,120].forEach(x=>createNPC(x,-50));

// ===== JOYSTICK =====
let joyX=0,joyY=0; const joy=document.getElementById("joystick"); const stick=document.getElementById("stick");
joy.addEventListener("touchmove",e=>{
  const r=joy.getBoundingClientRect(); const t=e.touches[0];
  let x=t.clientX-r.left-70; let y=t.clientY-r.top-70;
  x=Math.max(-45,Math.min(45,x)); y=Math.max(-45,Math.min(45,y));
  stick.style.transform=`translate(${x}px,${y}px)`;
  joyX = -x/45; joyY = y/45;
});
joy.addEventListener("touchend",()=>{stick.style.transform="translate(0,0)";joyX=joyY=0;});

// ===== COLLISIONS =====
function collide(pos){
  const pBox=new THREE.Box3(new THREE.Vector3(pos.x-1,0,pos.z-1),new THREE.Vector3(pos.x+1,2,pos.z+1));
  if(colliders.some(b=>b.intersectsBox(pBox))) return true;
  for(const npc of npcs){ if(new THREE.Box3().setFromObject(npc).intersectsBox(pBox)) return true; }
  return false;
}

// ===== MINI MAP =====
const mini=document.getElementById("minimap"); const miniCtx=mini.getContext("2d");
function drawMinimap(){
  miniCtx.fillStyle="rgba(0,0,0,0.4)"; miniCtx.fillRect(0,0,mini.width,mini.height);
  miniCtx.fillStyle="#888"; lods.forEach(lod=>{
    const pos=lod.position; const mx=mini.width/2+(pos.x-player.position.x)*0.15;
    const mz=mini.height/2+(pos.z-player.position.z)*0.15; miniCtx.fillRect(mx-2,mz-2,4,4);
  });
  miniCtx.fillStyle="#0f0"; miniCtx.fillRect(mini.width/2-3,mini.height/2-3,6,6);
  miniCtx.fillStyle="#f00"; npcs.forEach(npc=>{
    const pos = npc.position; const mx=mini.width/2+(pos.x-player.position.x)*0.15;
    const mz=mini.height/2+(pos.z-player.position.z)*0.15; miniCtx.fillRect(mx-2,mz-2,4,4);
  });
}

// ===== LOOP =====
function animate(){
  requestAnimationFrame(animate);

  // PLAYER
  speed+=joyY*0.03; steer+=joyX*0.0025;
  speed*=0.94; steer*=0.85; const prev=player.position.clone();
  player.rotation.y += steer;
  player.position.x += Math.sin(player.rotation.y)*speed;
  player.position.z += Math.cos(player.rotation.y)*speed;
  if(collide(player.position)){player.position.copy(prev);speed=0;}

  // NPC movement
  npcs.forEach(npc=>{
    let dir = npc.userData.dir; let delta = npc.userData.speed;
    let target = npc.userData.targetPos.clone();
    if(dir===0) target.z += delta; else if(dir===1) target.x += delta;
    else if(dir===2) target.z -= delta; else target.x -= delta;

    npc.position.lerp(target,0.05);
    npc.children.forEach(c=>{ if(c.geometry.type==="CylinderGeometry") c.rotation.x += 0.1; });
    if(Math.random()<0.01){npc.userData.dir=chooseTarget();}
    npc.userData.targetPos = target;
  });

  // Traffic lights logic
  lights.forEach(l=>{
    l.timer+=0.02;
    const cycle = Math.floor(l.timer)%6;
    l.groups.forEach(g=>{
      g.children[0].material.color.set(cycle<2?0xff0000:0x220000);
      g.children[1].material.color.set(cycle===2?0xffff00:0x222200);
      g.children[2].material.color.set(cycle>=4?0x00ff00:0x002200);
    });
  });

  renderer.render(scene,camera); drawMinimap();
}
animate();

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
