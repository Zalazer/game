<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LazerRoulette</title>

<style>
html,body{
    margin:0;
    padding:0;
    background:#070707;
    color:#fff;
    overflow:hidden;
    font-family:Arial Black, Arial, sans-serif;
}

#title{
    text-align: center;
    font-size: 34px;
    margin: 21px 0 10px 0;
    color: #d4af37;
    text-shadow: 0 0 6px red, 0 0 18px #aa0000;
}

.section{
    position:relative;
    overflow:hidden;
    touch-action:none;
}

#wheelWrap{ height:42vh; }
#historyWrap{ height:9vh; border-top:1px solid #333; border-bottom:1px solid #333; }
#tableWrap{ height:32vh; }
#stats{ height:12vh; padding:8px; font-size:14px; }

canvas{
    display:block;
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<div id="title">LazerRoulette</div>

<div id="wheelWrap" class="section">
    <canvas id="wheel"></canvas>
</div>

<div id="historyWrap" class="section">
    <canvas id="history"></canvas>
</div>

<div id="tableWrap" class="section">
    <canvas id="table"></canvas>
</div>

<div id="stats">
Игрок: Lazer<br>
Баланс: 1000<br>
Текущая ставка: 0<br>
История ставок: —
</div>

<script>
/* =====================================================
   УТИЛИТЫ
===================================================== */
function resizeCanvas(c){
    const dpr = devicePixelRatio || 1;
    const w = c.clientWidth;
    const h = c.clientHeight;
    c.width  = w * dpr;
    c.height = h * dpr;
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
}

/* =====================================================
   ДАННЫЕ РУЛЕТКИ
===================================================== */
const wheelNumbers=[
0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,
8,23,10,5,24,16,33,1,20,14,31,9,22,18,
29,7,28,12,35,3,26
];
const reds=[32,19,21,25,34,27,36,30,23,5,16,1,14,9,18,7,12,3];
const getColor=n=>n===0?'#1fa055':(reds.includes(n)?'#c22':'#000');
const SLICE=Math.PI*2/wheelNumbers.length;

/* =====================================================
   СОСТОЯНИЕ ШАРИКА
===================================================== */
let ballAngle=-Math.PI/2;
let ballRadius=0;
let speed=0;
let direction=1;
let lastDirection=1;
let spinning=false;
let slowing=false;
let bouncing=false;
let bouncesLeft=0;

/* =====================================================
   ПОДСВЕТКА + ИСТОРИЯ
===================================================== */
let history=[];
let winningNumber = null; // Выигрышный номер
let highlightTime = 0;

/* =====================================================
   СВАЙПЫ И ЗУМ
===================================================== */
const wheelCanvas=document.getElementById('wheel');
let wheelState={x:0,y:0,zoom:1,ox:0,oy:0,startDist:0};

const historyCanvas=document.getElementById('history');
let historyState={x:0,y:0,zoom:1,ox:0,oy:0,startDist:0};

const tableCanvas=document.getElementById('table');
let tableState={x:0,y:0,zoom:1,ox:0,oy:0,startDist:0};

function setupPanZoom(canvas,state,maxZoom=3){
    let pointers=[];
    canvas.addEventListener('pointerdown',e=>{
        canvas.setPointerCapture(e.pointerId);
        pointers.push(e);
        state.ox=state.x;
        state.oy=state.y;
        if(pointers.length===2){
            state.startDist=Math.hypot(
                pointers[0].clientX-pointers[1].clientX,
                pointers[0].clientY-pointers[1].clientY
            );
        }
    });

    canvas.addEventListener('pointermove',e=>{
        for(let i=0;i<pointers.length;i++){
            if(pointers[i].pointerId===e.pointerId) pointers[i]=e;
        }
        if(pointers.length===1){
            const dx=e.clientX-pointers[0].clientX;
            const dy=e.clientY-pointers[0].clientY;
            state.x=state.ox+dx;
            state.y=state.oy+dy;
        }
        if(pointers.length===2){
            const dist=Math.hypot(
                pointers[0].clientX-pointers[1].clientX,
                pointers[0].clientY-pointers[1].clientY
            );
            state.zoom=Math.min(maxZoom,Math.max(1,state.zoom*dist/state.startDist));
            state.startDist=dist;
        }
    });

    canvas.addEventListener('pointerup',e=>{
        canvas.releasePointerCapture(e.pointerId);
        pointers=pointers.filter(p=>p.pointerId!==e.pointerId);
    });
}

setupPanZoom(wheelCanvas, wheelState,3);
setupPanZoom(historyCanvas, historyState,3);
setupPanZoom(tableCanvas, tableState,8);

/* =====================================================
   WHEEL
===================================================== */
const wctx=wheelCanvas.getContext('2d');

function drawWheel(){
    resizeCanvas(wheelCanvas);
    const cw=wheelCanvas.clientWidth;
    const ch=wheelCanvas.clientHeight;
    const ctx=wctx;

    ctx.clearRect(0,0,cw,ch);
    ctx.save();
    ctx.translate(cw/2+wheelState.x,ch/2+wheelState.y);
    ctx.scale(wheelState.zoom,wheelState.zoom);

    const R=Math.min(cw,ch)*0.45;
    const POCKET_R=R*0.78;
    const TRACK_R=R*0.93;

    ctx.rotate(-Math.PI/2 - SLICE/2);

    // Сектора
    for(let i=0;i<wheelNumbers.length;i++){
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.arc(0,0,R,i*SLICE,(i+1)*SLICE);
        ctx.fillStyle=getColor(wheelNumbers[i]);
        ctx.fill();
    }

    // Карманы
    for(let i=0;i<wheelNumbers.length;i++){
        const a=i*SLICE+SLICE/2;
        ctx.beginPath();
        ctx.arc(Math.cos(a)*POCKET_R,Math.sin(a)*POCKET_R,R*0.045,0,Math.PI*2);
        ctx.fillStyle='#111';
        ctx.fill();
        ctx.strokeStyle='#d4af37';
        ctx.lineWidth=2;
        ctx.stroke();
    }

    // Числа
    ctx.font=(R*0.065)+'px Arial';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillStyle='#fff';
    for(let i=0;i<wheelNumbers.length;i++){
        ctx.save();
        ctx.rotate(i*SLICE+SLICE/2);
        ctx.translate(R*0.88,0);
        ctx.rotate(Math.PI/2);
        ctx.fillText(wheelNumbers[i],0,0);
        ctx.restore();
    }

    // Центр
    ctx.beginPath();
    ctx.arc(0,0,R*0.18,0,Math.PI*2);
    ctx.fillStyle='#111';
    ctx.fill();
    ctx.strokeStyle='#d4af37';
    ctx.lineWidth=5;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-R*0.08,0); ctx.lineTo(R*0.08,0);
    ctx.moveTo(0,-R*0.08); ctx.lineTo(0,R*0.08);
    ctx.stroke();

    // Шарик
    if(!ballRadius) ballRadius=TRACK_R;
    ctx.beginPath();
    ctx.arc(
        Math.cos(ballAngle)*ballRadius,
        Math.sin(ballAngle)*ballRadius,
        R*0.03,0,Math.PI*2
    );
    ctx.fillStyle='#fff';
    ctx.shadowColor='gold';
    ctx.shadowBlur=8;
    ctx.fill();
    ctx.shadowBlur=0;

    ctx.restore();

    // ФИЗИКА
    if(spinning){
        ballAngle += speed * direction;
        speed *= 0.995;
        
        if(speed < 0.04 && !slowing){
            slowing = true;
            bouncing = true;
            bouncesLeft = 1 + Math.floor(Math.random()*5);
        }
        
        if(bouncing && bouncesLeft > 0 && Math.random() < 0.03){
            direction *= Math.random() < 0.5 ? -1 : 1;
            speed *= 0.7;
            bouncesLeft--;
        }
        
        if(speed < 0.012){
            spinning = false;
            slowing = false;
            bouncing = false;
            
            // РЕЗУЛЬТАТ
            const angle = ((ballAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
            const idx = Math.round(angle / SLICE) % wheelNumbers.length;
            const resultNumber = wheelNumbers[idx];
            
            history.unshift(resultNumber);
            winningNumber = resultNumber; // Запускаем подсветку!
            ballAngle = idx * SLICE + SLICE / 2;
            ballRadius = POCKET_R;
            highlightTime = 0;
        }
    }
}

wheelCanvas.onclick = () => {
    if(!spinning){
        // Очищаем подсветку при новом спине
        winningNumber = null;
        spinning = true;
        slowing = false;
        bouncing = false;
        speed = 0.22 + Math.random() * 0.08;
        direction = -lastDirection;
        lastDirection = direction;
        ballRadius = TRACK_R * 0.95;
    }
};

/* =====================================================
   HISTORY
===================================================== */
const hctx=historyCanvas.getContext('2d');

function drawHistory(){
    resizeCanvas(historyCanvas);
    const w = historyCanvas.clientWidth;
    const h = historyCanvas.clientHeight;
    const ctx = hctx;

    ctx.clearRect(0,0,w,h);
    ctx.font = '22px Arial';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';

    const spacing = 50;
    const startX = w - 30 + historyState.x;
    const cy = h/2 + historyState.y;
    const time = performance.now() * 0.006;

    history.forEach((n,i) => {
        if(n === undefined) return;
        const cx = startX - i * spacing;
        const r = 20;

        ctx.fillStyle = getColor(n);
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#d4af37';
        ctx.stroke();

        if(i === 0){
            const pulse = 0.5 + 0.5 * Math.sin(time);
            const glowR = r + 8 + pulse * 6;
            const grad = ctx.createRadialGradient(cx, cy, r + 2, cx, cy, glowR);
            grad.addColorStop(0.0, 'rgba(255,215,0,0.0)');
            grad.addColorStop(0.25,'rgba(255,215,0,0.9)');
            grad.addColorStop(0.6, 'rgba(255,215,0,0.6)');
            grad.addColorStop(1.0, 'rgba(255,215,0,0.0)');

            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
            ctx.strokeStyle = grad;
            ctx.lineWidth = 6;
            ctx.shadowColor = 'rgba(255,215,0,1)';
            ctx.shadowBlur = 22 + pulse * 14;
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r + 1.5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,215,0,0.9)';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 0;
            ctx.stroke();
            ctx.restore();
        }

        ctx.fillStyle = '#fff';
        ctx.fillText(n, cx, cy);
    });
}






/* =====================================================
   TABLE С 14 столбцами (13 чисел + C1/C2/C3)
===================================================== */
const tctx = tableCanvas.getContext('2d');

function getWinningCells(number) {
    if (number === null || number === undefined) return [];
    
    const cells = [];
    const w = tableCanvas.clientWidth;
    const h = tableCanvas.clientHeight;
    const cols = 14;
    const cellW = w / cols;
    const cellH = h / 7.5;

    const numRows = [
        [3,6,9,12,15,18,21,24,27,30,33,36],
        [2,5,8,11,14,17,20,23,26,29,32,35],
        [1,4,7,10,13,16,19,22,25,28,31,34]
    ];

    // 0. НОЛЬ
    if (number === 0){
        cells.push({x: 0, y: 0, w: cellW, h: cellH * 3});
        return cells;
    }

    // 1. ТОЧНАЯ КЛЕТКА (столбцы 1–12)
    for (let r = 0; r < 3; r++){
        for (let c = 0; c < 12; c++){
            if (numRows[r][c] === number){
                cells.push({x: (c+1) * cellW, y: r * cellH, w: cellW, h: cellH});
            }
        }
    }

    // 2. DOZENS (только если НЕ пересекает пустое место)
    if (number >= 1 && number <= 12) cells.push({x: 1*cellW, y: cellH*3, w: cellW*4, h: cellH});
    else if (number >= 13 && number <= 24) cells.push({x: 5*cellW, y: cellH*3, w: cellW*4, h: cellH});
    else if (number >= 25 && number <= 36) cells.push({x: 9*cellW, y: cellH*3, w: cellW*4, h: cellH});

    // 3. 5-я СТРОКА — БЕЗ ПУСТЫХ МЕСТ ПОД C1/C2/C3!
    if (number >= 1 && number <= 18) cells.push({x: 1*cellW, y: cellH*4, w: cellW*2, h: cellH});
    
    // 19-36 — только до 11-го столбца (НЕ касается 12-14!)
    if (number >= 19 && number <= 36) {
        cells.push({x: 11*cellW, y: cellH*4, w: cellW*2, h: cellH}); // Только 11-12!
    }

    // Even/Red/Black/Odd — только слева (до 10-го столбца)
    if (number % 2 === 0) cells.push({x: 3*cellW, y: cellH*4, w: cellW*2, h: cellH});  // Even
    if (number % 2 === 1) cells.push({x: 9*cellW, y: cellH*4, w: cellW*2, h: cellH});  // Odd
    if (reds.includes(number)) cells.push({x: 5*cellW, y: cellH*4, w: cellW*2, h: cellH}); // Red
    else cells.push({x: 7*cellW, y: cellH*4, w: cellW*2, h: cellH}); // Black

    // 4. C1/C2/C3 (14-й столбец) — только числовые колонки!
    const colIndex = (number - 1) % 3;
    if (colIndex === 0) cells.push({x: 13*cellW, y: 2*cellH, w: cellW, h: cellH}); // C1
    else if (colIndex === 1) cells.push({x: 13*cellW, y: 1*cellH, w: cellW, h: cellH}); // C2
    else cells.push({x: 13*cellW, y: 0*cellH, w: cellW, h: cellH}); // C3

    return cells;
}





function drawTable(){
    resizeCanvas(tableCanvas);
    const w = tableCanvas.clientWidth;
    const h = tableCanvas.clientHeight;
    const cols = 14; // 14 столбцов!
    const rows = 3;
    const cellW = w / cols;
    const cellH = h / 7.5;
    
    tctx.clearRect(0,0,w,h);
    tctx.save();
    tctx.translate(tableState.x, tableState.y);
    tctx.scale(tableState.zoom, tableState.zoom);

    tctx.font = '14px Arial';
    tctx.textAlign = 'center';
    tctx.textBaseline = 'middle';
    tctx.lineWidth = 1;

    // Ряды с числами + C1/C2/C3
    const numRows = [
        [0,3,6,9,12,15,18,21,24,27,30,33,36,'C3'],
        [0,2,5,8,11,14,17,20,23,26,29,32,35,'C2'],
        [0,1,4,7,10,13,16,19,22,25,28,31,34,'C1']
    ];

    // ОСНОВНАЯ СЕТКА (столбцы 1-14)
    for(let r=0; r<rows; r++){
        for(let c=1; c<14; c++){ // До 14-го столбца!
            let val = numRows[r][c];
            let x = c * cellW;
            let y = r * cellH;

            if (typeof val === 'number'){
                tctx.fillStyle = getColor(val); // Фон по цвету рулетки!
            } else {
                tctx.fillStyle = '#d4af37';
            }
            tctx.fillRect(x,y,cellW,cellH);
            tctx.strokeStyle = '#000';
            tctx.strokeRect(x,y,cellW,cellH);
            tctx.fillStyle = '#fff';
            tctx.fillText(val, x + cellW/2, y + cellH/2);
        }
    }

    // НОЛЬ
    const zeroX = 0, zeroY = 0, zeroW = cellW, zeroH = cellH * rows;
    tctx.fillStyle = '#0a7a2f';
    tctx.fillRect(zeroX, zeroY, zeroW, zeroH);
    tctx.strokeStyle = '#000';
    tctx.strokeRect(zeroX, zeroY, zeroW, zeroH);
    tctx.fillStyle = '#fff';
    tctx.font = '16px Arial';
    tctx.fillText('0', zeroX + zeroW/2, zeroY + zeroH/2);

    // DOZENS
    const dozenLabels = ['Dozen 1','Dozen 2','Dozen 3'];
    for(let i=0; i<3; i++){
        let x = (1 + i*4) * cellW;
        let y = cellH * rows;
        tctx.fillStyle = '#d4af37';
        tctx.fillRect(x,y,cellW*4,cellH);
        tctx.strokeStyle = '#000';
        tctx.strokeRect(x,y,cellW*4,cellH);
        tctx.fillStyle = '#fff';
        tctx.fillText(dozenLabels[i], x + cellW*2, y + cellH/2);
    }

    // 5-я СТРОКА
    const fifthLabels = ['1-18','Even','Red','Black','Odd','19-36'];
    for(let i=0; i<6; i++){
        let x = (1 + i*2) * cellW;
        let y = cellH * (rows + 1);
        tctx.fillStyle = '#d4af37';
        tctx.fillRect(x,y,cellW*2,cellH);
        tctx.strokeStyle = '#000';
        tctx.strokeRect(x,y,cellW*2,cellH);

        if(fifthLabels[i] === 'Red' || fifthLabels[i] === 'Black'){
            const cx = x + cellW, cy = y + cellH/2;
            const hw = cellW, hh = cellH/2;
            tctx.beginPath();
            tctx.moveTo(cx, cy - hh);
            tctx.lineTo(cx + hw, cy);
            tctx.lineTo(cx, cy + hh);
            tctx.lineTo(cx - hw, cy);
            tctx.closePath();
            tctx.fillStyle = fifthLabels[i] === 'Red' ? '#c22' : '#000';
            tctx.fill();
        }

        tctx.fillStyle = '#fff';
        tctx.fillText(fifthLabels[i], x + cellW, y + cellH/2);
    }

    // ПОДСВЕТКА
    if(winningNumber !== null){
        highlightTime += 0.12;
        const pulse = Math.sin(highlightTime) * 0.4 + 0.6;
        
        tctx.lineWidth = 4 + pulse * 2;
        tctx.strokeStyle = `rgba(255, 215, 0, ${0.9})`;
        tctx.shadowColor = '#ffd700';
        tctx.shadowBlur = 10 + pulse * 6;
        tctx.lineJoin = 'round';
        tctx.lineCap = 'round';

        const winningCells = getWinningCells(winningNumber);
        winningCells.forEach(cell => {
            tctx.strokeRect(cell.x, cell.y, cell.w, cell.h);
        });
        
        tctx.shadowBlur = 0;
    }

    tctx.restore();
}




/* =====================================================
   LOOP
===================================================== */
function loop(){
    drawWheel();
    drawHistory();
    drawTable();
    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
