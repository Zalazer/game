<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zalazerans - Leningrad-style Preferans game against a bot</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>


<style>
body {
    background: #0e5a2f;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
}

h2 {
    margin: 10px 0;
}

#scoreboardTable{
    width: 320px;
    margin: 10px auto;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border: 2px solid #fff;
    border-radius: 8px;
    overflow: hidden;
}

.cell{
    border: 1px solid #fff;
    padding: 6px;
    text-align: center;
    background: rgba(255,255,255,0.05);
}

.header{
    font-weight: bold;
    background: rgba(255,255,255,0.1);
}

.label{
    background: rgba(0,0,0,0.3);
}

.total{
    font-weight: bold;
    color: gold;
}

#table {
    margin-top: 20px;
}

.hand {
    margin: 10px 0;
    display: flex;
    justify-content: center;
}

#playerHand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 5px;
}

.player-row {
    display: flex;
    justify-content: center;
    gap: 3px;
    min-height: 60px;
}


#playerNick{
    color: cyan;
    font-weight: bold;
}

#botNick{
    color: #ff6666;
    font-weight: bold;
}


.card {
    width: 42px;
    height: 64px;
    border-radius: 6px;
    background: white;
    color: black;
    line-height: 64px;
    font-size: 15px;
    margin: 3px;
    cursor: pointer;
    font-weight: bold;
    text-align: center;
}

.card.red {
    color: red;
}

.card.highlight {
    box-shadow: 0 0 10px yellow;
}

#botHand {
    display: flex;
    justify-content: center;
    flex-wrap: nowrap;
    gap: 2px;
    margin-top: 0px;
}

#botHand .card {
    width: 22px;
    height: 34px;
    margin: 1px;
    border-radius: 4px;
    background: #222;
    color: #222;
    cursor: default;
}

#center {
    margin-top: 10px;
    display: flex;
    justify-content: center;
}

#gameTable {
    width: 80%;
    max-width: 420px;
    height: 90px;
    background: linear-gradient(180deg,#0b6d38,#09592e);
    border: 2px solid #0f8c4a;
    border-radius: 12px;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: center;
}

#tableCards {
    display: flex;
    gap: 10px;
}

button {
    padding: 9px 12px;
    margin: 2px;
    font-size: 14px;
    border-radius: 10px;
    background: linear-gradient(145deg,#1faa59,#15803d);
    color: white;
    border: none;
    white-space: nowrap;
    flex: 1;
}

#controls {
    display: flex;
    justify-content: center;
    gap: 4px;
    flex-wrap: wrap;
    margin: 5px auto;
    max-width: 420px;
}

#discardControls {
    margin-top: 5px;
}

#log {
    height: 180px;
    overflow-y: auto;
    border-top: 1px solid #aaa;
    margin-top: 10px;
    padding: 10px;
    background: #06341d;
    text-align: left;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    scroll-behavior: smooth;
}



</style>
</head>
<body>

<h2></h2>

<!-- Таблица результатов -->
<div id="scoreboardTable">
    <div class="cell header" id="playerNick">PLAYER</div>
    <div class="cell header"></div>
    <div class="cell header" id="botNick">BOT</div>

    <div class="cell" id="playerHill">0</div>
    <div class="cell label">Гора</div>
    <div class="cell" id="botHill">0</div>

    <div class="cell" id="playerPool">0</div>
    <div class="cell label">Пуля</div>
    <div class="cell" id="botPool">0</div>

    <div class="cell" id="playerWhist">0</div>
    <div class="cell label">Висты</div>
    <div class="cell" id="botWhist">0</div>

    <div class="cell total" id="playerTotal">0</div>
    <div class="cell label">Тотал</div>
    <div class="cell total" id="botTotal">0</div>
</div>

<div id="table">
    <div id="botHand" class="hand"></div>

 <div id="center">
    <div id="gameTable" style="position: relative; display: flex; align-items: center; justify-content: center;">
        <!-- СЧЁТЧИКИ ПО БОКАМ СТОЛА -->
        <div id="playerTricksCount" style="
            position: absolute; 
            left: 8px; 
            top: 50%; 
            transform: translateY(-50%); 
            font-size: 32px; 
            font-weight: bold; 
            color: cyan; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); 
            z-index: 20;
            width: 45px;
            text-align: center;
        ">0</div>
        
        <div id="tableCards" style="position: relative; z-index: 10; display: flex; gap: 10px;"></div>
        
        <div id="botTricksCount" style="
            position: absolute; 
            right: 8px; 
            top: 50%; 
            transform: translateY(-50%); 
            font-size: 32px; 
            font-weight: bold; 
            color: #ff6666; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); 
            z-index: 20;
            width: 45px;
            text-align: center;
        ">0</div>
    </div>
</div>





    <div id="playerHand" class="hand">
        <div id="rowSpades" class="player-row"></div>
        <div id="rowHearts" class="player-row"></div>
        <div id="rowDiamonds" class="player-row"></div>
        <div id="rowClubs" class="player-row"></div>
    </div>
</div>

<div id="controls"></div>
<div id="discardControls"></div>
<div id="log"></div>

<script>
// ===== Базовые данные =====
const suits = ["♠","♥","♦","♣"];
const ranks = ["7","8","9","10","J","Q","K","A"];

let deck = [];
let playerHand = [];
let botHand = [];
let talon = [];

let tableCards = []; // [{card, owner}]

let currentLevel = null;  // выбранный уровень игры
let auctionStep = "level"; // "level" или "suit"


let trump = null;           // "♠","♥","♦","♣" или null для БК
let contract = null;        // например "6♠","7БК","мизер"
let declarer = null;        // "player" | "bot"
let phase = "deal";         // deal | auction | trump | discard | play | scoring
let turn = "player";

let playerTricks = 0;
let botTricks = 0;

let score = {
    pool: 0,
    hill: 0,
    whist: 0
};


function logMsg(msg){
    const el = document.getElementById("log");
    const newMsg = document.createElement("div");
    newMsg.innerHTML = msg;
    newMsg.style.opacity = "0";
    newMsg.style.transition = "opacity 0.3s ease";
    
    // НОВОЕ СООБЩЕНИЕ В ВЕРХ
    el.insertBefore(newMsg, el.firstChild);
    
    // плавная анимация появления
    requestAnimationFrame(()=>{
        newMsg.style.opacity = "1";
    });
    
    // скроллим к верху (к новому сообщению)
    el.scrollTop = 0;
}


function updateScore(){
    document.getElementById("playerHill").innerText  = score.hill;
    document.getElementById("playerPool").innerText  = score.pool;
    document.getElementById("playerWhist").innerText = score.whist;

    // ЛЕНИНГРАДКА: 1 очко в пуле ≈ 2 очка в горе, 1 очко в горе ≈ 10 вистов
    // переводим всё в висты, чтобы тотал был осмысленным
    const poolInWhist = score.pool * 5;    // 1 пуля = 20 вистов
    const hillInWhist = score.hill * 10;   // 1 гора = 10 вистов
    const totalWhist  = poolInWhist - hillInWhist - score.whist;
    const total       = totalWhist / 10;   // удобнее как десятые

    document.getElementById("playerTotal").innerText = total.toFixed(1);

    // бот зеркально
    document.getElementById("botHill").innerText  = -score.hill;
    document.getElementById("botPool").innerText  = -score.pool;
    document.getElementById("botWhist").innerText = -score.whist;
    document.getElementById("botTotal").innerText = (-total).toFixed(1);
}



// ===== Колода =====
function createDeck(){
    deck = [];
    for(let s of suits){
        for(let r of ranks){
            deck.push({suit:s, rank:r});
        }
    }
}

function shuffleDeck(){
    for(let i = deck.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
    }
}

function rankIndex(card){
    return ranks.indexOf(card.rank);
}

function cardPower(card){
    return rankIndex(card);
}


// ===== Утилита: превращаем массив карт в мини-карточки для лога =====
function cardsToHTML(cards){
    return cards.map(c => {
        const color = (c.suit === "♥" || c.suit === "♦") ? "#ff4444" : "#000000";
        return `<span style="
            display:inline-block;
            border:1px solid #333;
            border-radius:4px;
            padding:2px 4px;
            margin-right:3px;
            font-weight:bold;
            color:${color};
            background:#fff;
            font-size:14px;
        ">${c.rank}${c.suit}</span>`;
    }).join("");
}


// ===== Отрисовка =====
function sortPlayerHand(){
    const suitOrder = { "♠":0, "♥":1, "♦":2, "♣":3 };
    playerHand.sort((a,b)=>{
        if(suitOrder[a.suit] !== suitOrder[b.suit]){
            return suitOrder[a.suit] - suitOrder[b.suit];
        }
        return rankIndex(a) - rankIndex(b);
    });
}

let selectedDiscard = [];

function renderHands(){
    // бот
    const bh = document.getElementById("botHand");
    bh.innerHTML = "";
    botHand.forEach(()=>{
        const div = document.createElement("div");
        div.className = "card";
        bh.appendChild(div);
    });

    // стол
    const th = document.getElementById("tableCards");
    th.innerHTML = "";
    tableCards.forEach(obj=>{
        const c = obj.card;
        const div = document.createElement("div");
        div.className = "card";
        if(c.suit==="♥" || c.suit==="♦") div.classList.add("red");
        div.innerText = c.rank + c.suit;
        th.appendChild(div);
    });
    highlightTrick();

    // игрок
    sortPlayerHand();
    const rows = {
        "♠": document.getElementById("rowSpades"),
        "♥": document.getElementById("rowHearts"),
        "♦": document.getElementById("rowDiamonds"),
        "♣": document.getElementById("rowClubs")
    };
    for(let s of suits){
        rows[s].innerHTML = "";
    }

    playerHand.forEach((c,i)=>{
        const div = document.createElement("div");
        div.className = "card";
        if(c.suit==="♥" || c.suit==="♦") div.classList.add("red");
        div.innerText = c.rank + c.suit;

        if(phase === "play" && turn === "player" && isLegalMove(c)) {
            div.classList.add("highlight");
            div.onclick = ()=> playerPlay(i);
        } else if(phase === "discard" && declarer === "player"){
            if(selectedDiscard.includes(i)) div.style.boxShadow = "0 0 10px cyan";
            div.onclick = ()=> pickDiscard(i);
        } else {
            div.onclick = null;
        }

        rows[c.suit].appendChild(div);
    });

    // ✅ СЧЁТЧИКИ В КОНЦЕ ФУНКЦИИ — обновляются всегда!
    document.getElementById("playerTricksCount").innerText = playerTricks;
    document.getElementById("botTricksCount").innerText = botTricks;
}




// ===== Правила хода =====
// При наличии масти хода — обязан класть её;
// если масти нет и есть козырь (в козырной игре) — обязан козырь;
// если нет ни масти, ни козырей, можно любую.[web:5][web:9]
function isLegalMove(card){
    if(tableCards.length === 0) return true;
    const leadSuit = tableCards[0].card.suit;

    const hasLead = playerHand.some(c => c.suit === leadSuit);
    if(hasLead){
        return card.suit === leadSuit;
    }

    if(trump){ // в бескозырке этого блока нет
        const hasTrump = playerHand.some(c => c.suit === trump);
        if(hasTrump){
            return card.suit === trump;
        }
    }

    return true;
}

// ===== Сброс игрока =====
function pickDiscard(i){
    const idx = selectedDiscard.indexOf(i);
    if(idx >= 0){
        selectedDiscard.splice(idx,1);
    } else {
        if(selectedDiscard.length < 2){
            selectedDiscard.push(i);
        }
    }
    renderHands();
    const controls = document.getElementById("discardControls");
    if(selectedDiscard.length === 2){
        controls.innerHTML = '<button onclick="confirmDiscard()">Сбросить выбранные</button>';
    } else {
        controls.innerHTML = "";
    }
}

function confirmDiscard(){
    selectedDiscard.sort((a,b)=>b-a);
    for(let i of selectedDiscard){
        playerHand.splice(i,1);
    }
    selectedDiscard = [];
    document.getElementById("discardControls").innerHTML = "";

    logMsg("Игрок сбросил две карты и готов играть.");
    startPlay(declarer === "player" ? "player" : "bot");
}






// ===== Раздача и торговля =====
function dealHands(){
    playerHand = [];
    botHand = [];
    talon = [];
    tableCards = [];
    playerTricks = 0;
    botTricks = 0;
    trump = null;
    contract = null;
    declarer = null;
    selectedDiscard = [];

    for(let i=0;i<10;i++){
        playerHand.push(deck.pop());
        botHand.push(deck.pop());
    }
    talon.push(deck.pop());
    talon.push(deck.pop());

    renderHands();

    // ✅ Лог только с картами игрока
    logMsg("Карты игрока: " + cardsToHTML(playerHand) + "<br>Новая сдача.");
    startAuction();
}



// контракты: 6♠,6♥,6♦,6♣,6БК,7♠,...,10БК + мизер[web:5][web:10]
const allBids = [
    "пас",
    "6♠","6♥","6♦","6♣","6БК",
    "7♠","7♥","7♦","7♣","7БК",
    "8♠","8♥","8♦","8♣","8БК",
    "9♠","9♥","9♦","9♣","9БК",
    "10♠","10♥","10♦","10♣","10БК",
    "мизер"
];



function startAuction(){
    phase = "auction";
    auctionStep = "level";
    currentLevel = null;
    const controls = document.getElementById("controls");
    controls.innerHTML = "";
    logMsg("Началась торговля. Шаг 1: выберите уровень.");

    // Кнопки уровней ОДИН РЯД + МИЗЕР ПОСЛЕ 10 + КОМПАКТНО
    const levels = ["пас", "6", "7", "8", "9", "10", "мизер"];
    controls.style.flexWrap = "nowrap";
    controls.style.justifyContent = "space-evenly";
    controls.style.gap = "0px"; // минимальные промежутки
    
    levels.forEach(level=>{
        const btn = document.createElement("button");
        btn.innerText = level;
        btn.style.fontSize = "16px";        // чуть меньше
        btn.style.padding = "10px 1px";     // минимальные отступы
        btn.style.margin = "1px";           // ещё меньше
        btn.style.flex = "1";
        btn.style.minWidth = "0";           // разрешаем сжатие
        btn.style.maxWidth = "48px";        // жёсткий лимит ширины
        btn.style.fontWeight = "bold";
        btn.onclick = ()=> selectLevel(level);
        controls.appendChild(btn);
    });
}


// Выбор уровня
function selectLevel(level){
    const controls = document.getElementById("controls");
    controls.innerHTML = "";

    if(level === "пас"){
        logMsg("Игрок сказал: пас");
        setTimeout(botBid, 600);
        return;
    }

    currentLevel = level;
    auctionStep = "suit";

    logMsg("Уровень " + level + ". Шаг 2: выберите масть.");

    // ===== КНОПКИ МАСТЕЙ =====
    const suitButtons = [
        {suit:"♠", color:"#000"},
        {suit:"♥", color:"#ff4444"},
        {suit:"♦", color:"#ff4444"},
        {suit:"♣", color:"#000"},
        {suit:"БК", color:"#fff"}
    ];

    controls.style.flexWrap = "nowrap";
    controls.style.justifyContent = "space-evenly";
    controls.style.gap = "0px";

    suitButtons.forEach(data=>{
        const btn = document.createElement("button");

        // размер шрифта: БК чуть меньше
        const fontSize = data.suit === "БК" ? "22px" : "28px";

        btn.innerHTML = '<span style="color:'+data.color+'; font-size:'+fontSize+';">'+data.suit+'</span>';

        btn.style.flex = "1";
        btn.style.minWidth = "0";
        btn.style.maxWidth = "48px";
        btn.style.fontWeight = "bold";
        btn.style.padding = "0";
        btn.style.margin = "1px";
        btn.style.height = "40px";

        // вертикальное и горизонтальное центрирование
        btn.style.display = "flex";
        btn.style.alignItems = "center";
        btn.style.justifyContent = "center";

        btn.onclick = ()=> selectSuit(data.suit);

        controls.appendChild(btn);
    });

    // ===== КНОПКА ПАС =====
    const pasBtn = document.createElement("button");
    pasBtn.innerText = "пас";

    pasBtn.style.flex = "1";
    pasBtn.style.minWidth = "0";
    pasBtn.style.maxWidth = "48px";
    pasBtn.style.fontWeight = "bold";
    pasBtn.style.height = "40px";
    pasBtn.style.margin = "1px";
    pasBtn.style.fontSize = "16px";

    pasBtn.style.display = "flex";
    pasBtn.style.alignItems = "center";
    pasBtn.style.justifyContent = "center";

    pasBtn.onclick = ()=>{
        logMsg("Игрок передумал и сказал: пас");
        setTimeout(botBid, 600);
    };

    controls.appendChild(pasBtn);
}







// Финальный выбор масти
function selectSuit(suit){
    let fullContract;
    if(currentLevel === "мизер"){
        fullContract = "мизер";
    } else {
        fullContract = currentLevel + suit;
    }

    contract = fullContract;
    auctionStep = "level"; // сбрасываем шаг

    // Лог контракта в виде мини-кнопок
    logContractMini(contract);

    setTimeout(botBid, 600);
}




function evaluateHand(hand){
    let s = 0;
    hand.forEach(c=>{
        s += rankIndex(c) + 1;
        if(c.rank === "A") s += 3;
        if(c.rank === "K") s += 2;
    });
    return s;
}



function playerBid(bid){
    if(phase !== "auction") return;
    contract = bid;

    // ===== Лог игрока в стиле мини-кнопок =====
    if(bid === "пас" || bid === "мизер"){
        logMsg("Игрок сказал: " + bid);
    } else {
        let number, suit;
        if(bid.endsWith("БК")){
            number = bid.slice(0, bid.length - 2); // "7БК" → "7"
            suit = "БК";
        } else {
            number = bid.slice(0, bid.length - 1); // "8♣" → "8"
            suit = bid.slice(-1);                  // "8♣" → "♣"
        }

        const color = (suit === "♥" || suit === "♦") ? "#ff4444" : (suit === "БК" ? "#ffffff" : "#000000");

        const miniContract = `
            <span style="
                display:inline-block;
                background:#4CAF50;
                color:#fff;
                border-radius:4px;
                padding:2px 6px;
                margin-right:2px;
                font-weight:bold;
                font-size:14px;
                text-align:center;
            ">${number}</span>
            <span style="
                display:inline-block;
                background:#4CAF50;
                color:${color};
                border-radius:4px;
                padding:2px 6px;
                margin-right:4px;
                font-weight:bold;
                font-size:14px;
                text-align:center;
            ">${suit}</span>
        `;

        logMsg("Игрок сказал: " + miniContract);
    }

    setTimeout(botBid, 600);
}



function handHighCardPoints(hand) {
    let hcp = 0;
    for (let c of hand) {
        if (c.rank === "A") hcp += 4;
        if (c.rank === "K") hcp += 3;
        if (c.rank === "Q") hcp += 2;
        if (c.rank === "J") hcp += 1;
    }
    return hcp;
}




function botBid(){
    if(phase !== "auction") return;
    const strength = evaluateHand(botHand);
    const hcp = handHighCardPoints(botHand);
    const shape = handShape(botHand);

    // === сначала выберем лучшую масть по силе ===
    let bestSuit = "♣";   // по умолчанию клевер, если все масти равны
    let bestScore = 0;

    ["♠", "♥", "♦", "♣"].forEach(suit => {
        const cardsInSuit = botHand.filter(c => c.suit === suit);
        const highCardsInSuit = cardsInSuit.filter(c => ["A","K","Q"].includes(c.rank)).length;
        const score = cardsInSuit.length * 10 + highCardsInSuit * 20;

        if(score > bestScore){
            bestScore = score;
            bestSuit = suit;
        }
    });

    let botChoice = "пас";

    // МИЗЕР: если очень слабая рука
    if (strength < 12 && hcp < 10 && contract !== "мизер") {
        botChoice = "мизер";
    }

    // БК: если есть сильные старшие и нет явно длинной масти
    else if (hcp >= 22 && shape[0] <= 4) {
        botChoice = "7БК";
    }

    // длинный козырь: 5+ карт в одной масти
    else if (shape[0] >= 5) {
        botChoice = "7" + bestSuit;   // 7♠, 7♥, 7♦, 7♣
    }

    // умеренная сила, масть не длинная
    else if (strength > 30) {
        botChoice = "6" + bestSuit;   // 6♠, 6♥, 6♦, 6♣
    }

    // слабая рука — вообще не играем
    else {
        botChoice = "пас";
    }

    // ===== Лог бота в стиле мини-кнопок (без оптимизации, как у тебя) =====
    if(botChoice === "пас" || botChoice === "мизер"){
        logMsg("Бот сказал: " + botChoice);
    } else {
        let number, suit;
        if(botChoice.endsWith("БК")){
            number = botChoice.slice(0, botChoice.length - 2); // "7БК" → "7"
            suit = "БК";
        } else {
            number = botChoice.slice(0, botChoice.length - 1); // "7♣" → "7"
            suit = botChoice.slice(-1);                        // "7♣" → "♣"
        }

        const color = (suit === "♥" || suit === "♦") ? "#ff4444" : (suit === "БК" ? "#ffffff" : "#000000");

        const miniContract = `
            <span style="
                display:inline-block;
                background:#4CAF50;
                color:#fff;
                border-radius:4px;
                padding:2px 6px;
                margin-right:2px;
                font-weight:bold;
                font-size:14px;
                text-align:center;
            ">${number}</span>
            <span style="
                display:inline-block;
                background:#4CAF50;
                color:${color};
                border-radius:4px;
                padding:2px 6px;
                margin-right:4px;
                font-weight:bold;
                font-size:14px;
                text-align:center;
            ">${suit}</span>
        `;

        logMsg("Бот сказал: " + miniContract);
    }

    determineAuctionWinner(contract, botChoice);
}






function handShape(hand) {
    const suits = ["♠","♥","♦","♣"];
    const count = {};
    for (let s of suits) count[s] = 0;

    for (let c of hand) {
        count[c.suit]++;
    }

    const dist = suits.map(s => count[s]);
    dist.sort((a,b) => b - a);
    return dist;
}





function bidIndex(bid){
    return allBids.indexOf(bid);
}







// ===== Определение победителя торгов =====
function determineAuctionWinner(playerBid, botBid){
    const p = bidIndex(playerBid);
    const b = bidIndex(botBid);

    if((p <= 0) && (b <= 0)){
        logMsg("Оба пас. Новая сдача.");
        setTimeout(startGame,1500);
        return;
    }

    let winner;

    if(p > b){
        winner = "player";
        declarer = "player";
        contract = playerBid;
        logMsg("Игрок выиграл торговлю: " + contract + ".");
    } else if(b > p){
        winner = "bot";
        declarer = "bot";
        contract = botBid;
        logMsg("Бот выиграл торговлю: " + contract + ".");
    } else {
        winner = "player"; // при равной ставке выигрывает игрок
        declarer = "player";
        contract = playerBid;
        logMsg("Равная ставка, контракт у игрока: " + contract + ".");
    }

    // ⚡ Сразу передаем победителя в прикуп
    pickTalon(winner);
}

// ===== Прикуп и козырь/БК =====
function pickTalon(winner){
    phase = "trump";

    if(talon.length > 0){
        logMsg("Прикуп: " + cardsToHTML(talon));
    }

    if(winner === "player"){
        playerHand = playerHand.concat(talon);
        talon = [];
        sortPlayerHand();
        renderHands();

        applyTrumpFromContract();

        phase = "discard";
        selectedDiscard = [];
        logMsg("Выберите 2 карты для сброса.");
        renderHands();
    } else {
        botHand = botHand.concat(talon);
        talon = [];

        applyTrumpFromContract();

        phase = "discard";
        // вызываем умный сброс бота
        setTimeout(botDiscard, 700);
    }
}

// ===== Умный сброс бота =====
function botDiscard(){
    // не трогаем козыри и сильные карты (A,K)
    let candidate = botHand.filter(c => !trump || c.suit !== trump);
    candidate = candidate.filter(c => !["A","K"].includes(c.rank));

    if(candidate.length < 2) candidate = botHand.slice(); // fallback
    const toDiscard = candidate.slice(0,2);
    toDiscard.forEach(c=>{
        const idx = botHand.indexOf(c);
        if(idx >= 0) botHand.splice(idx,1);
    });

    phase = "play";
    startPlay(declarer === "bot" ? "bot" : "player");
}





// ===== Установка козыря из контракта =====
function applyTrumpFromContract(){
    if(!contract) return;

    if(contract === "мизер"){
        trump = null;
        return;
    }

    const lastChar = contract.slice(-1);

    if(lastChar === "К"){
        trump = null; // БК — без козыря
    } else if(["♠","♥","♦","♣"].includes(lastChar)){
        trump = lastChar;
    } else {
        trump = null;
    }
}


// ===== Лог контракта в мини-карточках =====
function logContractMini(contract){
    if(contract === "мизер"){
        logMsg('<span style="display:inline-block; padding:2px 6px; margin:2px; font-size:14px; font-weight:bold; background:#4CAF50; color:#fff; border-radius:4px;">МИЗЕР</span>');
        return;
    }

    const numTricks = contract.slice(0, contract.length-1);
    const suit = contract.slice(-1);

    if(suit === "БК") suitColor = "#ffd700";

        display:inline-block;
        padding:2px 6px;

        font-size:14px;

        color:#fff;
        border-radius:4px;
    ">${numTricks}</span>`;

    const suitHtml = `<span style="
        display:inline-block;

    logMsg("Контракт: " + numHtml + suitHtml);
}









// ===== Розыгрыш =====
function startPlay(firstPlayer){
    phase = "play";
    turn = firstPlayer;
    document.getElementById("controls").innerHTML = "";
    document.getElementById("discardControls").innerHTML = "";

    // Контракт и козырь уже показаны в логе при торговле, лишний вывод убран
    renderHands();
    
    if(turn === "bot"){
        setTimeout(botPlay, 800);
    }
}


function playerPlay(i){
    if(phase !== "play" || turn !== "player" || !playerHand[i]) return;

    const card = playerHand[i];

    if(!isLegalMove(card)){
        logMsg("Нужно ходить в масть, при её отсутствии — бить козырем (если есть).");
        return;
    }

    tableCards.push({card, owner:"player"});
    playerHand.splice(i,1);

    renderHands();

    if(tableCards.length === 2){
        // взятка укомплектована
        turn = null;
        setTimeout(resolveTrick, 700);
    } else {
        // очередь бота
        turn = "bot";
        setTimeout(botPlay, 700);
    }
}


function botPlay(){
    if(phase !== "play" || turn !== "bot" || botHand.length === 0) return;

    const leadSuit = tableCards.length ? tableCards[0].card.suit : null;
    let playable;

    if(!leadSuit){
        // бот ходит первым — любая карта
        playable = botHand.slice();
    } else {
        const hasLeadSuit = botHand.some(c => c.suit === leadSuit);
        if(hasLeadSuit){
            playable = botHand.filter(c => c.suit === leadSuit);
        } else if(trump && botHand.some(c => c.suit === trump)){
            playable = botHand.filter(c => c.suit === trump);
            logMsg("Бот бьёт козырем (нет масти хода).");
        } else {
            playable = botHand.slice();
        }
    }

    if(!playable || playable.length === 0) playable = botHand.slice();

    const chosen = chooseBotCard(playable, leadSuit);
    tableCards.push({card:chosen, owner:"bot"});

    const idx = botHand.indexOf(chosen);
    if(idx >= 0) botHand.splice(idx,1);

    renderHands();

    if(tableCards.length === 2){
        turn = null;
        setTimeout(resolveTrick, 700);
    } else {
        turn = "player";
        renderHands();
    }
}


function chooseBotCard(candidates, leadSuit){
    if(candidates.length === 0) return botHand[0];

    const isDeclarer = declarer === "bot";
    const isMiser = contract === "мизер";
    const isBk = contract.endsWith("БК");
    const leadCard = tableCards.length ? tableCards[0].card : null;
    let best = candidates[0];

    // 1. Сначала определим, какие карты могут перебить
    const cardsThatCanBeat = candidates.filter(card => {
        if(card.suit !== leadSuit) return false;
        return cardPower(card) > cardPower(leadCard);
    });

    // 2. Если БК и нет козыря, выбираем минимальную карту в масти, если можем
    if(isBk && !trump){
        const cardsInSuit = candidates.filter(c => c.suit === leadSuit);
        if(cardsInSuit.length > 0){
            return cardsInSuit
                .sort((a, b) => cardPower(a) - cardPower(b))[0];
        }
    }

    // 3. Если можем перебить, выбираем минимальную карту, которая перебивает
    if(cardsThatCanBeat.length > 0){
        const weakestBeatCard = cardsThatCanBeat
            .sort((a, b) => cardPower(a) - cardPower(b))[0];
        return weakestBeatCard;
    }

    // 4. Если не можем перебить, выбираем минимальную карту в масти
    const cardsInSuit = candidates.filter(c => c.suit === leadSuit);
    if(cardsInSuit.length > 0){
        const weakestCardInSuit = cardsInSuit
            .sort((a, b) => cardPower(a) - cardPower(b))[0];
        return weakestCardInSuit;
    }

    // 5. Если нет масти хода, бьём козырём минимальной картой
    const trumpCards = candidates.filter(c => c.suit === trump);
    if(trumpCards.length > 0){
        return trumpCards
            .sort((a, b) => cardPower(a) - cardPower(b))[0];
    }

    // 6. иначе — любая карта
    return candidates[0];

    // 7. оставим score только для обычных игр
    if(!isBk){
        let bestScore = -10000;
        for(let card of candidates){
            let score = 0;

            // МИЗЕР
            if(isMiser){
                if(isDeclarer){
                    if(card.suit !== leadSuit && card.suit !== trump){
                        score -= 10;
                    } else if(card.suit === trump || card.suit === leadSuit){
                        score -= 100;
                    }
                } else {
                    if(card.suit === leadSuit){
                        const leadPower = cardPower(leadCard);
                        const myPower = cardPower(card);
                        if(myPower > leadPower){
                            score += 40;
                        } else {
                            score -= 20;
                        }
                    } else if(card.suit === trump){
                        score += 30;
                    }
                }
            }

            // ОБЫЧНЫЕ ИГРЫ
            else {
                if(!leadSuit){
                    if(trump && card.suit === trump){
                        score += 50;
                    } else if(["A","K"].includes(card.rank)){
                        score += 30;
                    } else {
                        score -= 10;
                    }
                } else {
                    if(card.suit === leadSuit){
                        const leadPower = cardPower(leadCard);
                        const myPower = cardPower(card);
                        if(myPower > leadPower){
                            score += 40;
                        } else {
                            score -= 20;
                        }
                    } else if(trump && card.suit === trump){
                        score += 60;
                    } else {
                        score -= 5;
                    }
                }
            }

            // 3. Учёт структуры масти (длинная масть)
            if(card.suit === leadSuit && card.suit !== trump){
                const otherSame = botHand.filter(c => c.suit === card.suit).length;
                if(otherSame > 2 && card.rank !== "A" && card.rank !== "K"){
                    score += 10;
                }
            }

            if(score > bestScore){
                bestScore = score;
                best = card;
            }
        }
    }
}






// ===== Определение взятки =====
function resolveTrick(){
    if(tableCards.length !== 2) return;

    const first  = tableCards[0];
    const second = tableCards[1];
    const leadSuit = first.card.suit;

    let winnerObj;

    if(!trump){
        // БЕЗ КОЗЫРЯ: только масть хода
        if(second.card.suit !== leadSuit){
            winnerObj = first;
        } else {
            winnerObj = cardPower(first.card) > cardPower(second.card) ? first : second;
        }
    } else {
        const firstTrump  = first.card.suit === trump;
        const secondTrump = second.card.suit === trump;

        if(firstTrump && !secondTrump){
            winnerObj = first;
        } else if(!firstTrump && secondTrump){
            winnerObj = second;
        } else if(firstTrump && secondTrump){
            winnerObj = cardPower(first.card) > cardPower(second.card) ? first : second;
        } else {
            if(second.card.suit !== leadSuit){
                winnerObj = first;
            } else {
                winnerObj = cardPower(first.card) > cardPower(second.card) ? first : second;
            }
        }
    }

    const winner = winnerObj.owner;

    if(winner === "player") playerTricks++;
    else botTricks++;

    // ✅ Лог взятки с мини-картами
    const trickCardsHTML = tableCards.map(tc => tc.card).map(c => cardsToHTML([c])).join("");
    logMsg((winner === "player" ? "Игрок" : "Бот") + " взял взятку: " + trickCardsHTML);

    // блокируем любые ходы на время показа взятки
    phase = "play";
    turn = null;
    renderHands();

    setTimeout(() => {
        tableCards = [];
        renderHands();

        // конец раздачи
        if(playerHand.length === 0 && botHand.length === 0){
            setTimeout(endRound, 600);
            return;
        }

        // ход получает взявший взятку
        turn = winner;
        if(turn === "bot"){
            setTimeout(botPlay, 700);
        } else {
            renderHands();
        }
    }, 700);
}

// ===== Подсчёт =====
const contractCost = { "6":2, "7":4, "8":6, "9":8, "10":10, "мизер":10 };

function endRound(){
    phase = "scoring";
    logMsg("Раздача окончена. Игрок взял " + playerTricks + " взяток, бот взял " + botTricks + ".");

    const level = contract === "мизер" ? 10 : parseInt(contract) || 10;
    const need = {"6":2, "7":4, "8":6, "9":8, "10":10, "мизер":10}[level.toString()] || 10;
    const declarerIsPlayer = declarer === "player";
    const declTricks = declarerIsPlayer ? playerTricks : botTricks;
    const defTricks  = declarerIsPlayer ? botTricks  : playerTricks;

    // ИГРЫ 6–10
    if (contract !== "мизер") {
        if (declTricks >= level) {
            if (declarerIsPlayer) {
                score.pool += need;
                logMsg("Игрок выполнил контракт: +" + need + " в пулю.");
            } else {
                score.pool -= need;
                logMsg("Бот выполнил контракт: игроку -" + need + " в пулю.");
            }
        } else {
            const lost = level - declTricks;
            const hillAdd = need * 2;   // ремиз: двойная цена в гору
            if (declarerIsPlayer) {
                score.hill += hillAdd;
                logMsg("Игрок ремиз: +" + hillAdd + " в гору.");
            } else {
                score.hill -= hillAdd;
                logMsg("Бот ремиз: игроку -" + hillAdd + " в гору.");
            }
        }

        // Висты: 1 взятка защитника = 2 виста
        const whistPoints = defTricks * 2;
        if (declarerIsPlayer) {
            score.whist += whistPoints;
            logMsg("Бот получил " + defTricks + " вистов (" + whistPoints + " очков).");
        } else {
            score.whist -= whistPoints;
            logMsg("Игрок получил " + defTricks + " вистов (" + whistPoints + " очков).");
        }
    }

    // МИЗЕР
    else {
        if (declTricks === 0) {
            if (declarerIsPlayer) {
                score.pool += need;
                logMsg("Игрок выполнил мизер: +" + need + " в пулю.");
            } else {
                score.pool -= need;
                logMsg("Бот выполнил мизер: игроку -" + need + " в пулю.");
            }
        } else {
            const hillAdd = need * 2;
            if (declarerIsPlayer) {
                score.hill += hillAdd;
                logMsg("Игрок завалил мизер: +" + hillAdd + " в гору.");
            } else {
                score.hill -= hillAdd;
                logMsg("Бот завалил мизер: игроку -" + hillAdd + " в гору.");
            }
        }
    }

    updateScore();
    setTimeout(startGame, 2500);
}

}

    shuffleDeck();
    logMsg("<hr>");

// старт
startGame();
