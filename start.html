<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Start</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0b0b;
}
#iframeMain {
    width: 100vw;
    height: 100vh;
    border: none;
    display: block;
}
</style>
</head>
<body>
<iframe id="iframeMain" src=""></iframe>

<script>
(async function(){
    // Подготовка WebApp Telegram
    if(window.Telegram && window.Telegram.WebApp){
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    }

    // Загружаем main.html через iframe
    const iframe = document.getElementById('iframeMain');
    iframe.src = 'main.html';

    // Если нужно, чтобы iframe занимал реально всю рабочую область Telegram
    function resizeFrame(){
        iframe.style.width = window.innerWidth + 'px';
        iframe.style.height = window.innerHeight + 'px';
    }
    window.addEventListener('resize', resizeFrame);
    resizeFrame();
})();
</script>
</body>
</html>
