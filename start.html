<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>Game Console</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="prefetch" href="PokerLazer/index.html">
<link rel="prefetch" href="StarDropper/index.html">
<link rel="prefetch" href="ChronoMonsters/index.html">
<link rel="prefetch" href="LazerRoulette/index.html">
<link rel="prefetch" href="Odrive/index.html">
<link rel="prefetch" href="ZalazerWars/index.html">
<link rel="prefetch" href="Zalazerans/index.html">
<link rel="prefetch" href="EquaLazer/index.html">
<link rel="prefetch" href="ZaCheckers/index.html">
<link rel="prefetch" href="ZaChess/index.html">
<link rel="prefetch" href="Generator/index.html">
<link rel="prefetch" href="ZalazerChat/index.html">
<link rel="prefetch" href="BrokenRoute/index.html">

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  overflow:hidden;
  background:#0b0b0b;
  color:#eaeaea;
  font-family:Arial,sans-serif;
  touch-action:manipulation;
}

body{
  height:100dvh;
  position:fixed;
  inset:0;
}

#menu{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  height:100%;
  padding:
    calc(20px + env(safe-area-inset-top))
    0
    env(safe-area-inset-bottom);
}

#menuContent{
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-y:auto;
  overflow-x:hidden;
  padding-bottom:12px;
}

h1{
  font-size:28px;
  margin-bottom:24px;
  text-align:center;
}

.btn{
  width:260px;
  padding:10px;
  margin:3px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#1c1c1c;
  color:#fff;
  cursor:pointer;
}

.btn:hover{
  background:#2c2c2c;
}

.btn:disabled{
  opacity:.55;
  cursor:default;
}

.btn-new{
  background:#222016;
  border:1px solid #5c4a18;
  color:#ffd36a;
}

.btn-new:hover{
  background:#2c2716;
}

#gameContainer{
  display:none;
  flex-direction:column;
  width:100%;
  height:100%;
  position:relative;
  transform:translateZ(0);
}

#topBar{
  width:100%;
  background:rgba(17,17,17,0.98);

  padding:
    calc(10px + env(safe-area-inset-top))
    10px
    10px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  z-index:10;
  flex-wrap:wrap;
}

.topBtn{
  font-size:15px;
  padding:8px 14px;
  border-radius:8px;
  background:#222;
  border:none;
  color:#fff;
  cursor:pointer;
}

.topBtn:hover{
  background:#2d2d2d;
}

#gameFrameWrapper{
  flex:1;
  position:relative;
  overflow:hidden;
  background:#000;
}

iframe#gameFrame{
  border:none;
  width:100%;
  height:100%;
  display:block;
  transform:translateZ(0);
  contain:strict;
  background:#000;
}

#rulesOverlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.96);
  z-index:20;
  display:none;
}

#rulesFrame{
  width:100%;
  height:100%;
  border:none;
  background:#000;
}

hr.rules-footer-sep{
  margin:0;
  border:0;
  border-top:1px solid #333;
}

.rules-footer{
  width:100%;
  text-align:center;
  font-size:12px;
  opacity:.85;
  padding:8px 0 12px 0;
  background:rgba(11,11,11,.95);
}

.rules-copyright{
  line-height:1.5;
  margin-bottom:6px;
}

.rules-contact-btn{
  background:#151515;
  color:#ffd36a;
  border:1px solid #333;
  padding:6px 16px;
  cursor:pointer;
  font-size:12px;
  border-radius:4px;
}

.rules-contact-btn:hover{
  background:#1e1e1e;
  border-color:#ffd36a;
}

.rules-note{
  margin-top:6px;
  font-size:11px;
  opacity:.5;
}

#feedbackModal{
  display:none;
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.95);
  z-index:30;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}

#feedbackModal textarea{
  width:80%;
  height:100px;
  margin-bottom:12px;
  padding:8px;
  border-radius:6px;
  border:none;
  resize:none;
  font-size:14px;
  background:#161616;
  color:#fff;
}

#feedbackPhotoWrapper{
  display:flex;
  align-items:center;
  width:80%;
  margin-bottom:6px;
}

#feedbackPhotoWrapper input{
  flex:1;
}

#removePhotoBtn{
  margin-left:8px;
  cursor:pointer;
  background:#550000;
  color:#fff;
  border:none;
  border-radius:4px;
  padding:4px 8px;
  display:none;
}

#oldVersionWarning{
  width:80%;
  font-size:12px;
  color:#ffcc33;
  margin-bottom:6px;
  text-align:center;
  display:none;
}

#feedbackModal .feedback-buttons{
  display:flex;
  justify-content:space-between;
  width:80%;
  margin-top:8px;
}

#feedbackModal .feedback-buttons button{
  flex:1;
  margin:0 4px;
  padding:10px 0;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#1c1c1c;
  color:#fff;
}

#feedbackModal .feedback-buttons button:hover{
  background:#2c2c2c;
}

#feedbackStatus{
  margin-top:6px;
  font-size:14px;
  color:#ffd36a;
  text-align:center;
  max-width:80%;
  overflow-wrap:anywhere;
}

#exitConfirm{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
}

#exitConfirm .popup{
  background:#1c1c1c;
  color:#fff;
  padding:20px;
  border-radius:12px;
  width:80%;
  max-width:320px;
  text-align:center;
}

#exitConfirm .popup p{
  margin-bottom:20px;
  font-size:16px;
}

#exitConfirm .popup button{
  margin:0 10px;
  padding:10px 0;
  width:100px;
  border:none;
  border-radius:6px;
  background:#222;
  color:#fff;
  font-size:14px;
  cursor:pointer;
}

#exitConfirm .popup button:hover{
  background:#2c2c2c;
}

</style>
</head>

<body>

<div id="menu">

  <div id="menuContent">

    <button class="btn" onclick="loadGame('PokerLazer')">♠️ PokerLazer</button>
    <button class="btn" onclick="loadGame('StarDropper')">⭐ StarDropper</button>
    <button class="btn" onclick="loadGame('ChronoMonsters')">🧠 ChronoMonsters</button>
    <button class="btn" onclick="loadGame('LazerRoulette')">🎡 LazerRoulette</button>
    <button class="btn" onclick="loadGame('Odrive')">🏎️ Odrive</button>
    <button class="btn" onclick="loadGame('ZalazerWars')">💥 ZalazerWars</button>
    <button class="btn" onclick="loadGame('Zalazerans')">🎴 Zalazerans</button>
    <button class="btn" onclick="loadGame('EquaLazer')">↕️ EquaLazer</button>
    <button class="btn" onclick="loadGame('ZaCheckers')">♟️ ZaCheckers</button>
    <button class="btn" onclick="loadGame('ZaChess')">♚ ZaChess</button>
    <button class="btn" onclick="loadGame('Generator')">💰 Generator</button>

    <button class="btn btn-new" onclick="loadGame('ZalazerChat')">
      💬 ZalazerChat
    </button>

    <button class="btn btn-new" onclick="loadGame('BrokenRoute')">
      🛣️ BrokenRoute
    </button>

  </div>

  <div>

    <hr class="rules-footer-sep">

    <div class="rules-footer">

      <div class="rules-copyright">
        © 2026 <strong>ZALAZER</strong><br>
        All code and content are protected by copyright law.<br>
        All rights reserved.
      </div>

      <button
        class="rules-contact-btn"
        onclick="openFeedbackModal()"
      >
        Send Feedback / Screenshot
      </button>

      <div class="rules-note">
        Feedback can include text and screenshot.
        No reply guaranteed.
      </div>

    </div>

  </div>

</div>

<div id="gameContainer">

  <div id="topBar">

    <button
      class="topBtn"
      onclick="handleBack()"
    >
      ← Back
    </button>

    <button
      class="topBtn"
      onclick="openRules()"
    >
      Game Rules
    </button>

    <button
      class="topBtn"
      id="muteBtn"
      onclick="toggleMute()"
    >
      🔊
    </button>

  </div>

  <div id="gameFrameWrapper">

    <iframe
      id="gameFrame"
      allow="autoplay; fullscreen"
      allowfullscreen
      playsinline
      loading="eager"
    ></iframe>

    <div id="rulesOverlay">

      <iframe
        id="rulesFrame"
        loading="lazy"
      ></iframe>

    </div>

  </div>

</div>

<div id="feedbackModal">

  <textarea
    id="feedbackText"
    placeholder="Enter your feedback..."
  ></textarea>

  <div id="feedbackPhotoWrapper">

    <input
      type="file"
      id="feedbackPhoto"
      accept="image/*"
      onchange="toggleRemoveBtn()"
    >

    <button
      id="removePhotoBtn"
      onclick="removeFeedbackPhoto()"
    >
      ✖
    </button>

  </div>

  <div id="oldVersionWarning">
    ⚠️ Your Telegram version is old.
    Upload photo directly in chat —
    the bot will get it automatically.
  </div>

  <div class="feedback-buttons">

    <button
      id="sendFeedbackBtn"
      onclick="sendFeedback()"
    >
      Send ✅
    </button>

    <button onclick="closeFeedbackModal()">
      Cancel ❌
    </button>

  </div>

  <div id="feedbackStatus"></div>

</div>

<div id="exitConfirm">

  <div class="popup">

    <p>
      Exit game? Progress will be lost.
    </p>

    <button onclick="confirmExit(true)">
      OK
    </button>

    <button onclick="confirmExit(false)">
      Cancel
    </button>

  </div>

</div>

<audio id="musicMenu" src="music-menu.mp3" loop preload="none"></audio>
<audio id="music-PokerLazer" src="music-PokerLazer.mp3" loop preload="none"></audio>
<audio id="music-StarDropper" src="music-StarDropper.mp3" loop preload="none"></audio>
<audio id="music-ChronoMonsters" src="music-ChronoMonsters.mp3" loop preload="none"></audio>
<audio id="music-LazerRoulette" src="music-LazerRoulette.mp3" loop preload="none"></audio>
<audio id="music-Odrive" src="music-Odrive.mp3" loop preload="none"></audio>
<audio id="music-ZalazerWars" src="music-ZalazerWars.mp3" loop preload="none"></audio>
<audio id="music-Zalazerans" src="music-Zalazerans.mp3" loop preload="none"></audio>
<audio id="music-EquaLazer" src="music-EquaLazer.mp3" loop preload="none"></audio>
<audio id="music-ZaCheckers" src="music-ZaCheckers.mp3" loop preload="none"></audio>
<audio id="music-ZaChess" src="music-ZaChess.mp3" loop preload="none"></audio>
<audio id="music-Generator" src="music-Generator.mp3" loop preload="none"></audio>
<audio id="music-ZalazerChat" src="music-ZalazerChat.mp3" loop preload="none"></audio>
<audio id="music-BrokenRoute" src="music-BrokenRoute.mp3" loop preload="none"></audio>

<script>

let tg = null;

let canUploadFile = false;

let currentGame = '';

let inRules = false;

let isMuted = false;

let loadingGame = false;

const fadeIntervals = new Map();

function safeClone(obj) {

  try {

    return structuredClone(obj);

  } catch {

    return JSON.parse(JSON.stringify(obj));
  }
}

function initTelegram() {

  if (
    window.Telegram &&
    window.Telegram.WebApp
  ) {

    tg = window.Telegram.WebApp;

    tg.ready();

    tg.expand();

    if (tg.BackButton) {

      tg.BackButton.show();

      tg.BackButton.onClick(() => {
        handleBack();
      });
    }

    canUploadFile =
      typeof tg.uploadFile === 'function';

    const photoInput =
      document.getElementById('feedbackPhoto');

    const warning =
      document.getElementById('oldVersionWarning');

    if (!canUploadFile) {

      photoInput.disabled = true;

      warning.style.display = 'block';

    } else {

      photoInput.disabled = false;

      warning.style.display = 'none';
    }

  } else {

    document.getElementById(
      'feedbackPhoto'
    ).disabled = true;
  }
}

initTelegram();

switchMusic(tracks.menu);

document.body.addEventListener(
  'touchstart',
  () => {

    document
      .querySelectorAll('audio')
      .forEach(a => {

        a.play()
          .then(() => a.pause())
          .catch(() => {});
      });

  },
  { once:true }
);

const menu =
  document.getElementById('menu');

const gameContainer =
  document.getElementById('gameContainer');

const gameFrame =
  document.getElementById('gameFrame');

const rulesOverlay =
  document.getElementById('rulesOverlay');

const rulesFrame =
  document.getElementById('rulesFrame');

const muteBtn =
  document.getElementById('muteBtn');

const exitConfirm =
  document.getElementById('exitConfirm');

const tracks = {

  menu:
    document.getElementById('musicMenu'),

  PokerLazer:
    document.getElementById('music-PokerLazer'),

  StarDropper:
    document.getElementById('music-StarDropper'),

  ChronoMonsters:
    document.getElementById('music-ChronoMonsters'),

  LazerRoulette:
    document.getElementById('music-LazerRoulette'),

  Odrive:
    document.getElementById('music-Odrive'),

  ZalazerWars:
    document.getElementById('music-ZalazerWars'),

  Zalazerans:
    document.getElementById('music-Zalazerans'),

  EquaLazer:
    document.getElementById('music-EquaLazer'),

  ZaCheckers:
    document.getElementById('music-ZaCheckers'),

  ZaChess:
    document.getElementById('music-ZaChess'),

  Generator:
    document.getElementById('music-Generator'),

  ZalazerChat:
    document.getElementById('music-ZalazerChat'),

  BrokenRoute:
    document.getElementById('music-BrokenRoute')
};

function stopFade(track) {

  const id =
    fadeIntervals.get(track);

  if (id) {

    clearInterval(id);

    fadeIntervals.delete(track);
  }
}

function fadeIn(track, volume = 0.4) {

  if (!track || isMuted) return;

  stopFade(track);

  track.volume = 0;

  track.play().catch(() => {});

  const id = setInterval(() => {

    track.volume =
      Math.min(
        track.volume + 0.05,
        volume
      );

    if (track.volume >= volume) {

      stopFade(track);
    }

  }, 50);

  fadeIntervals.set(track, id);
}

function fadeOut(track) {

  if (!track) {
    return Promise.resolve();
  }

  return new Promise(res => {

    stopFade(track);

    const id = setInterval(() => {

      track.volume =
        Math.max(
          track.volume - 0.05,
          0
        );

      if (track.volume <= 0) {

        track.pause();

        stopFade(track);

        res();
      }

    }, 50);

    fadeIntervals.set(track, id);
  });
}

async function switchMusic(next) {

  const p =
    Object.values(tracks)
      .filter(Boolean)
      .filter(t => t !== next)
      .map(t => fadeOut(t));

  await Promise.all(p);

  fadeIn(next);
}

async function loadGame(game) {

  if (loadingGame) return;

  loadingGame = true;

  currentGame = game;

  inRules = false;

  rulesOverlay.style.display = 'none';

  rulesFrame.src = '';

  menu.style.display = 'none';

  gameContainer.style.display = 'flex';

  gameFrame.style.visibility = 'hidden';

  gameFrame.src = '';

  await new Promise(r =>
    requestAnimationFrame(r)
  );

  await new Promise(r =>
    requestAnimationFrame(r)
  );

  const timeout = setTimeout(() => {

    gameFrame.style.visibility = 'visible';

    loadingGame = false;

  }, 15000);

  gameFrame.onload = async () => {

    clearTimeout(timeout);

    gameFrame.style.visibility = 'visible';

    try {

      gameFrame.contentWindow?.dispatchEvent(
        new Event('resize')
      );

    } catch {}

    setTimeout(() => {

      try {

        gameFrame.contentWindow?.dispatchEvent(
          new Event('resize')
        );

      } catch {}

    }, 120);

    await switchMusic(tracks[game]);

    loadingGame = false;
  };

  gameFrame.src =
    game + '/index.html';
}

function handleBack() {

  if (loadingGame) return;

  try {

    const win =
      gameFrame?.contentWindow;

    const modal =
      win?.document?.getElementById(
        'leaderboardModal'
      );

    if (
      modal &&
      modal.style.display === 'flex'
    ) {

      modal.style.display = 'none';

      return;
    }

    const overlay =
      win?.document?.getElementById(
        'overlay'
      );

    if (
      overlay &&
      overlay.style.display === 'block'
    ) {

      overlay.style.display = 'none';

      return;
    }

  } catch {}

  if (inRules) {

    inRules = false;

    rulesOverlay.style.display = 'none';

    rulesFrame.src = '';

    return;
  }

  if (!currentGame) {

    tg?.close?.();

    return;
  }

  exitConfirm.style.display = 'flex';
}

function confirmExit(ok) {

  exitConfirm.style.display = 'none';

  if (ok) {
    backToMenu();
  }
}

async function backToMenu() {

  await switchMusic(tracks.menu);

  gameFrame.onload = null;

  gameFrame.src = '';

  rulesFrame.src = '';

  gameContainer.style.display = 'none';

  menu.style.display = 'flex';

  currentGame = '';

  inRules = false;
}

function openRules() {

  if (!currentGame) return;

  inRules = true;

  rulesFrame.src =
    currentGame +
    '/' +
    currentGame +
    '-rules.html';

  rulesOverlay.style.display = 'block';
}

function toggleMute() {

  isMuted = !isMuted;

  Object
    .values(tracks)
    .filter(Boolean)
    .forEach(t => {

      t.muted = isMuted;

      if (isMuted) {
        t.pause();
      }
    });

  if (!isMuted) {

    if (currentGame) {

      fadeIn(tracks[currentGame]);

    } else {

      fadeIn(tracks.menu);
    }
  }

  muteBtn.textContent =
    isMuted ? '🔇' : '🔊';
}

const feedbackModal =
  document.getElementById(
    'feedbackModal'
  );

const feedbackText =
  document.getElementById(
    'feedbackText'
  );

const feedbackPhoto =
  document.getElementById(
    'feedbackPhoto'
  );

const feedbackStatus =
  document.getElementById(
    'feedbackStatus'
  );

const sendFeedbackBtn =
  document.getElementById(
    'sendFeedbackBtn'
  );

function openFeedbackModal() {

  feedbackModal.style.display = 'flex';
}

function closeFeedbackModal() {

  feedbackModal.style.display = 'none';

  feedbackText.value = '';

  feedbackPhoto.value = '';

  feedbackStatus.textContent = '';

  toggleRemoveBtn();
}

function toggleRemoveBtn() {

  document.getElementById(
    'removePhotoBtn'
  ).style.display =

    feedbackPhoto.files.length
      ? 'inline-block'
      : 'none';
}

function removeFeedbackPhoto() {

  feedbackPhoto.value = '';

  toggleRemoveBtn();

  feedbackStatus.textContent = '';
}

async function fetchWithTimeout(
  url,
  options = {},
  timeout = 25000
) {

  const controller =
    new AbortController();

  const id = setTimeout(() => {
    controller.abort();
  }, timeout);

  try {

    return await fetch(
      url,
      {
        ...options,
        signal:controller.signal
      }
    );

  } finally {

    clearTimeout(id);
  }
}


async function sendFeedback() {

  if (!tg) {

    feedbackStatus.textContent =
      'Works only inside Telegram';

    return;
  }

  const text =
    feedbackText.value.trim();

  if (
    !text &&
    !feedbackPhoto.files.length
  ) {

    feedbackStatus.textContent =
      'Add text or photo';

    return;
  }

  sendFeedbackBtn.disabled = true;

  feedbackStatus.textContent =
    'Sending...';

  let photoBase64 = null;

  if (feedbackPhoto.files.length) {

    const file =
      feedbackPhoto.files[0];

    if (
      file.size >
      8 * 1024 * 1024
    ) {

      feedbackStatus.textContent =
        'Photo too large';

      sendFeedbackBtn.disabled = false;

      return;
    }

    try {

      photoBase64 =
        await new Promise(
          (resolve,reject) => {

            const reader =
              new FileReader();

            reader.onload =
              e => resolve(
                e.target.result
              );

            reader.onerror =
              reject;

            reader.readAsDataURL(file);
          }
        );

    } catch {

      feedbackStatus.textContent =
        'Photo read error';

      sendFeedbackBtn.disabled = false;

      return;
    }
  }

  let ticket = null;

  try {

    const tResp =
      await fetchWithTimeout(
        '/__ticket',
        {
          method:'POST',
          headers:{
            'Content-Type':
              'application/json'
          }
        }
      );

    const tJson =
      await tResp.json();

    ticket = tJson.k;

    if (!ticket) {
      throw new Error();
    }

  } catch {

    feedbackStatus.textContent =
      'Ticket error';

    sendFeedbackBtn.disabled = false;

    return;
  }

  const userObj =
    safeClone(
      tg.initDataUnsafe?.user || {}
    );

  const payload = {

    type:'feedback',

    page:'console',

    text:
      text.slice(0, 5000),

    photo:photoBase64,

    ts:Date.now(),

    user:userObj
  };

  try {

    const resp =
      await fetchWithTimeout(
        '/__emit',
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({
            k:ticket,
            d:payload
          })
        }
      );

    let result = null;

    try {

      result =
        await resp.json();

    } catch {}

    if (result?.ok) {

      feedbackStatus.textContent =
        '✅ Sent!';

      feedbackText.value = '';

      feedbackPhoto.value = '';

      toggleRemoveBtn();

    } else {

      feedbackStatus.textContent =
        'Failed';
    }

  } catch (e) {

    feedbackStatus.textContent =

      e.name === 'AbortError'
        ? 'Server timeout'
        : 'Error: ' + e.message;
  }

  sendFeedbackBtn.disabled = false;
}

toggleRemoveBtn();

</script>
</body>
</html>
