<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Game Console</title>

<!-- ✅ TELEGRAM SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; }
html, body {
  margin:0; padding:0; width:100%; height:100%;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:#0b0b0b; color:#eaeaea;
  overflow:hidden;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;
}

#menu { display:flex; flex-direction:column; justify-content:space-between; height:100%; padding:20px 0; }
#menuContent { display:flex; flex-direction:column; align-items:center; }
h1 { font-size:clamp(24px, 5vw, 32px); margin-bottom:24px; text-align:center; line-height:1.2; }
.btn { 
  width:90vw; max-width:280px; padding:16px; margin:10px; font-size:clamp(16px, 4vw, 20px); 
  border:none; border-radius:12px; background:#1c1c1c; color:#fff; cursor:pointer; 
  touch-action:manipulation;
  transition: all 0.2s ease;
  -webkit-appearance: none;
}
.btn:active { background:#2c2c2c; transform: scale(0.98); }
.btn:hover { background:#2c2c2c; }

#gameContainer { display:none; flex-direction:column; width:100%; height:100%; position:relative; }
#topBar { 
  width:100%; background:rgba(17,17,17,0.98); padding:12px; display:flex; justify-content:space-between; align-items:center; z-index:10; 
  backdrop-filter: blur(10px);
}
.topBtn { 
  font-size:clamp(14px, 3.5vw, 16px); padding:10px 16px; border-radius:10px; background:#222; border:none; color:#fff; cursor:pointer; 
  touch-action:manipulation; transition: all 0.2s ease; -webkit-appearance: none;
  min-width: 70px; text-align:center;
}
.topBtn:active { background:#333; transform: scale(0.98); }

#gameFrameWrapper { flex:1; position:relative; overflow:hidden; background:#000; }
iframe#gameFrame { border:none; width:100%; height:100%; }
iframe#gameFrame::-webkit-scrollbar { display: none; }

#rulesOverlay { position:absolute; inset:0; background:rgba(0,0,0,0.96); z-index:20; display:none; }
#rulesFrame { width:100%; height:100%; border:none; }
#rulesFrame::-webkit-scrollbar { display: none; }

hr.rules-footer-sep { margin:0; border:0; border-top:1px solid #333; }
.rules-footer { width:100%; text-align:center; font-size:clamp(11px, 2.5vw, 13px); opacity:0.85; padding:12px 0; background:rgba(11,11,11,0.95); }
.rules-copyright { line-height:1.4; margin-bottom:8px; }
.rules-contact-btn { background:#151515; color:#ffd36a; border:1px solid #333; padding:8px 20px; cursor:pointer; font-size:clamp(11px, 2.5vw, 13px); border-radius:6px; touch-action:manipulation; transition: all 0.2s ease; }
.rules-contact-btn:active { background:#1e1e1e; border-color:#ffd36a; transform: scale(0.98); }
.rules-note { margin-top:8px; font-size:clamp(10px, 2.2vw, 11px); opacity:0.5; }

#feedbackModal { 
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:30; flex-direction:column; align-items:center; 
  justify-content:center; padding:20px; max-height:100vh; overflow-y:auto;
}
#feedbackModal textarea { 
  width:90vw; max-width:400px; height:120px; margin-bottom:16px; padding:12px; border-radius:8px; border:1px solid #333; resize:vertical; 
  font-size:16px; font-family:inherit; background:#1a1a1a; color:#fff; -webkit-appearance: none;
}
#feedbackPhotoWrapper { display:flex; align-items:center; width:90vw; max-width:400px; margin-bottom:12px; }
#feedbackPhotoWrapper input { flex:1; padding:10px; border-radius:8px; border:1px solid #333; background:#1a1a1a; color:#fff; }
#removePhotoBtn { margin-left:12px; cursor:pointer; background:#550000; color:#fff; border:none; border-radius:6px; padding:8px 12px; display:inline-block; font-size:14px; touch-action:manipulation; }
#removePhotoBtn:active { background:#660000; transform: scale(0.98); }
#oldVersionWarning { width:90vw; max-width:400px; font-size:13px; color:#ffcc33; margin-bottom:12px; text-align:center; display:none; padding:8px; border-radius:6px; background:rgba(255,204,51,0.1); }

#feedbackModal .feedback-buttons { display:flex; justify-content:space-between; width:90vw; max-width:400px; margin-top:12px; gap:8px; }
#feedbackModal .feedback-buttons button { flex:1; padding:14px 0; font-size:clamp(15px, 4vw, 17px); border:none; border-radius:8px; cursor:pointer; background:#1c1c1c; color:#fff; touch-action:manipulation; transition: all 0.2s ease; -webkit-appearance: none; }
#feedbackModal .feedback-buttons button:active { background:#2c2c2c; transform: scale(0.98); }
#feedbackStatus { margin-top:12px; font-size:16px; color:#ffd36a; text-align:center; min-height:20px; }

.doc-signature { display:none; opacity:0.15; }

/* iOS Safe Area */
@supports (padding: max(0px)) {
  #menu, #gameContainer { padding-bottom: env(safe-area-inset-bottom); padding-top: env(safe-area-inset-top); }
  #topBar { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
}

/* Landscape orientation */
@media (orientation: landscape) and (max-height: 500px) {
  #menuContent { justify-content: center; padding: 10px 0; }
  .btn { margin: 6px; padding: 12px; }
}

/* High DPI displays */
@media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
  .btn, .topBtn, .rules-contact-btn { border-width: 0.5px; }
}
</style>
</head>

<body>

<!-- ===== MENU ===== -->
<div id="menu">
  <div id="menuContent">
    <h1>🎮 Game Console</h1>
    <button class="btn" onclick="loadGame('PokerLazer')">♠️ PokerLazer</button>
    <button class="btn" onclick="loadGame('StarDropper')">⭐ StarDropper</button>
    <button class="btn" onclick="loadGame('ChronoMonsters')">🧠 ChronoMonsters</button>
    <button class="btn" onclick="loadGame('LazerRoulette')">🎡 LazerRoulette</button>
    <button class="btn" onclick="loadGame('Odrive')">🏎️ Odrive</button>
  </div>

  <div>
    <hr class="rules-footer-sep">
    <div class="rules-footer">
      <div class="rules-copyright">
        © 2026 <strong>ZALAZER</strong><br>
        All code and content are protected by copyright law.<br>
        All rights reserved.
      </div>
      <button class="rules-contact-btn" onclick="openFeedbackModal()">Send Feedback / Screenshot</button>
      <div class="rules-note">Feedback can include text and screenshot. No reply guaranteed.</div>
    </div>
  </div>
</div>

<!-- ===== GAME ===== -->
<div id="gameContainer">
  <div id="topBar">
    <button class="topBtn" onclick="handleBack()">← Back</button>
    <button class="topBtn" onclick="openRules()">Game Rules</button>
    <button class="topBtn" id="muteBtn" onclick="toggleMute()">🔊</button>
  </div>

  <div id="gameFrameWrapper">
    <iframe id="gameFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock"></iframe>
    <div id="rulesOverlay"><iframe id="rulesFrame" sandbox="allow-scripts allow-same-origin"></iframe></div>
  </div>
</div>

<!-- ===== FEEDBACK MODAL ===== -->
<div id="feedbackModal">
  <textarea id="feedbackText" placeholder="Enter your feedback..." maxlength="2000"></textarea>
  <div id="feedbackPhotoWrapper">
    <input type="file" id="feedbackPhoto" accept="image/*" onchange="toggleRemoveBtn()" />
    <button id="removePhotoBtn" onclick="removeFeedbackPhoto()">✖</button>
  </div>
  <div id="oldVersionWarning">⚠️ Your Telegram version is old. Upload photo directly in chat — the bot will get it automatically.</div>
  <div class="feedback-buttons">
    <button id="sendFeedbackBtn" onclick="sendFeedback()">Send ✅</button>
    <button onclick="closeFeedbackModal()">Cancel ❌</button>
  </div>
  <div id="feedbackStatus"></div>
</div>

<div class="doc-signature">© 2026 ZALAZER · Game Console</div>

<!-- ===== AUDIO ===== -->
<audio id="musicMenu" src="music-menu.mp3" loop preload="metadata"></audio>
<audio id="music-PokerLazer" src="music-PokerLazer.mp3" loop preload="metadata"></audio>
<audio id="music-StarDropper" src="music-StarDropper.mp3" loop preload="metadata"></audio>
<audio id="music-ChronoMonsters" src="music-ChronoMonsters.mp3" loop preload="metadata"></audio>
<audio id="music-LazerRoulette" src="music-LazerRoulette.mp3" loop preload="metadata"></audio>
<audio id="music-Odrive" src="music-Odrive.mp3" loop preload="metadata"></audio>

<script>
let tg = null;
let canUploadFile = false;
let audioUnlocked = false;
let gameLoadTimeout = null;
let isIOS = false;
let isAndroid = false;
let orientationHandler = null;
let touchStartY = 0;
let isScrolling = false;

document.addEventListener('DOMContentLoaded', () => {
  detectPlatform();
  initTelegram();
  initTouchGestures();
  initAudioUnlock();
  toggleRemoveBtn();
  
  // Prevent zoom on iOS
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('gestureend', e => e.preventDefault());
});

function detectPlatform() {
  const ua = navigator.userAgent.toLowerCase();
  isIOS = /iphone|ipad|ipod/.test(ua);
  isAndroid = /android/.test(ua);
  
  if (isIOS) {
    document.body.classList.add('ios');
    document.documentElement.style.setProperty('--ios-statusbar-height', `${window.innerHeight - screen.height}px`);
  } else if (isAndroid) {
    document.body.classList.add('android');
  }
}

function initTouchGestures() {
  // iOS pull-to-refresh prevention
  if (isIOS) {
    document.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    
    document.addEventListener('touchmove', (e) => {
      const touchY = e.touches[0].clientY;
      const deltaY = touchY - touchStartY;
      if (deltaY > 10 && window.scrollY === 0) {
        e.preventDefault();
      }
    }, { passive: false });
  }
  
  // Double-tap zoom prevention
  let lastTap = 0;
  document.addEventListener('touchend', (e) => {
    const now = new Date().getTime();
    const timeSince = now - lastTap;
    if (timeSince < 300 && timeSince > 0) {
      e.preventDefault();
    }
    lastTap = now;
  }, { passive: false });
}

function initAudioUnlock() {
  // User interaction unlock for both platforms
  ['click', 'touchstart', 'keydown'].forEach(event => {
    document.addEventListener(event, unlockAudioWrapper, { once: true, passive: true });
  });
  
  // iOS specific: unlock on first user interaction
  if (isIOS) {
    document.addEventListener('touchstart', unlockAudioWrapper, { once: true, passive: true });
  }
}

function unlockAudioWrapper() {
  unlockAudio();
  // Remove listeners after first unlock
  ['click', 'touchstart', 'keydown'].forEach(event => {
    document.removeEventListener(event, unlockAudioWrapper);
  });
}

function initTelegram() {
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      
      // iOS: request viewport height
      if (isIOS && tg.viewportHeight) {
        tg.requestViewport();
      }
      
      console.log("Telegram WebApp detected", { isIOS, isAndroid });

      canUploadFile = typeof tg.uploadFile === 'function';

      const photoInput = document.getElementById('feedbackPhoto');
      const warning = document.getElementById('oldVersionWarning');

      if (!canUploadFile) {
        photoInput.disabled = true;
        warning.style.display = 'block';
      } else {
        photoInput.disabled = false;
        warning.style.display = 'none';
      }
      
      // Telegram haptic feedback
      if (tg.HapticFeedback) {
        window.tgHaptic = tg.HapticFeedback.impactOccurred.bind(tg.HapticFeedback, 'light');
      }
    } else {
      handleNonTelegram();
    }
  } catch (e) {
    console.log('Telegram init error', e);
    handleNonTelegram();
  }
}

function handleNonTelegram() {
  const photoInput = document.getElementById('feedbackPhoto');
  const warning = document.getElementById('oldVersionWarning');
  if (photoInput && warning) {
    photoInput.disabled = true;
    warning.textContent = "WebApp not detected. Upload not available.";
    warning.style.display = 'block';
  }
}

/* ===== GAME & AUDIO LOGIC ===== */
const menu = document.getElementById('menu');
const gameContainer = document.getElementById('gameContainer');
const gameFrame = document.getElementById('gameFrame');
const rulesOverlay = document.getElementById('rulesOverlay');
const rulesFrame = document.getElementById('rulesFrame');
const muteBtn = document.getElementById('muteBtn');

const feedbackModal = document.getElementById('feedbackModal');
const feedbackText = document.getElementById('feedbackText');
const feedbackPhoto = document.getElementById('feedbackPhoto');
const feedbackStatus = document.getElementById('feedbackStatus');
const sendFeedbackBtn = document.getElementById('sendFeedbackBtn');

const tracks = {
  menu: document.getElementById('musicMenu'),
  PokerLazer: document.getElementById('music-PokerLazer'),
  StarDropper: document.getElementById('music-StarDropper'),
  ChronoMonsters: document.getElementById('music-ChronoMonsters'),
  LazerRoulette: document.getElementById('music-LazerRoulette'),
  Odrive: document.getElementById('music-Odrive')
};

let currentGame = '';
let inRules = false;
let fadeIntervals = new Map();
let isMuted = false;

/* ===== AUDIO ===== */
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;

  // Cross-platform audio unlock
  Object.values(tracks).forEach(t => {
    if (t) {
      t.muted = true;
      t.volume = 0.1; // Low volume for unlock
      t.play().catch(()=>{});
      setTimeout(() => { 
        t.pause(); 
        t.currentTime = 0; 
        t.volume = 0.4;
      }, 100);
    }
  });
}

function fadeIn(track, volume = 0.4) {
  if (isMuted || !track) return;
  const prevId = fadeIntervals.get(track);
  if (prevId) clearInterval(prevId);

  track.muted = false;
  track.volume = 0;
  track.play().catch(()=>{});

  // Haptic feedback if available
  if (window.tgHaptic) tgHaptic();

  const id = setInterval(() => {
    track.volume = Math.min(track.volume + 0.05, volume);
    if (track.volume >= volume) {
      clearInterval(id);
      fadeIntervals.delete(track);
    }
  }, 50);
  fadeIntervals.set(track, id);
}

function fadeOut(track) {
  return new Promise(resolve => {
    if (!track) { resolve(); return; }

    const prevId = fadeIntervals.get(track);
    if (prevId) clearInterval(prevId);

    const id = setInterval(() => {
      track.volume = Math.max(track.volume - 0.05, 0);
      if (track.volume <= 0) {
        track.pause();
        track.currentTime = 0;
        clearInterval(id);
        fadeIntervals.delete(track);
        resolve();
      }
    }, 50);
    fadeIntervals.set(track, id);
  });
}

async function switchMusic(nextTrack) {
  const promises = Object.values(tracks)
    .filter(t => t !== nextTrack)
    .map(t => fadeOut(t));
  await Promise.all(promises);
  fadeIn(nextTrack);
}

/* ===== GAME FLOW ===== */
async function loadGame(game) {
  unlockAudio();
  currentGame = game; 
  inRules = false;

  if (gameLoadTimeout) clearTimeout(gameLoadTimeout);
  gameFrame.src = 'about:blank';

  // Smooth transition
  menu.style.opacity = '0';
  menu.style.transition = 'opacity 0.3s ease';
  
  setTimeout(() => {
    menu.style.display = 'none';
    gameContainer.style.display = 'flex';
    gameContainer.style.opacity = '1';
  }, 150);

  await switchMusic(tracks[game]);

  gameLoadTimeout = setTimeout(() => {
    gameFrame.src = game + '/index.html';
    // iOS: force reflow
    if (isIOS) {
      gameFrame.style.transform = 'translateZ(0)';
    }
  }, 100);
}

async function backToMenu() {
  if (gameLoadTimeout) clearTimeout(gameLoadTimeout);
  await switchMusic(tracks.menu);
  gameFrame.src = 'about:blank';
  
  gameContainer.style.opacity = '0';
  gameContainer.style.transition = 'opacity 0.3s ease';
  
  setTimeout(() => {
    gameContainer.style.display = 'none';
    menu.style.display = 'flex';
    menu.style.opacity = '1';
    currentGame = '';
  }, 300);
}

function openRules() {
  if (!currentGame) return;
  inRules = true;
  rulesFrame.src = currentGame + '/' + currentGame + '-rules.html';
  rulesOverlay.style.display = 'block';
  
  // Haptic feedback
  if (window.tgHaptic) tgHaptic();
}

function handleBack() {
  // Haptic feedback
  if (window.tgHaptic) tgHaptic();
  
  if (inRules) { 
    inRules = false; 
    rulesOverlay.style.display = 'none'; 
    rulesFrame.src = ''; 
    return; 
  }
  backToMenu();
}

/* ===== MUTE ===== */
function toggleMute() {
  isMuted = !isMuted;
  Object.values(tracks).forEach(t => {
    if (t) {
      t.muted = isMuted;
      if (isMuted) {
        t.pause();
      } else {
        if (currentGame) fadeIn(tracks[currentGame]); 
        else fadeIn(tracks.menu); 
      }
    }
  });
  muteBtn.textContent = isMuted ? "🔇" : "🔊";
  
  // Haptic feedback
  if (window.tgHaptic) tgHaptic();
}

/* ===== FEEDBACK MODAL ===== */
function openFeedbackModal() { 
  feedbackModal.style.display = 'flex'; 
  if (isIOS) {
    feedbackText.focus();
  }
  
  // Haptic feedback
  if (window.tgHaptic) tgHaptic();
}

function closeFeedbackModal() { 
  feedbackModal.style.display = 'none'; 
  feedbackText.value = ''; 
  feedbackPhoto.value = ''; 
  feedbackStatus.textContent = ''; 
  toggleRemoveBtn(); 
}

function toggleRemoveBtn() { 
  const removeBtn = document.getElementById('removePhotoBtn');
  if (removeBtn) {
    removeBtn.style.display = feedbackPhoto.files.length ? 'inline-block' : 'none'; 
  }
}

function removeFeedbackPhoto() { 
  feedbackPhoto.value = ''; 
  toggleRemoveBtn(); 
  feedbackStatus.textContent = ''; 
}

/* ===== SEND FEEDBACK ===== */
async function sendFeedback() {
  if (!tg) { 
    feedbackStatus.textContent = "Feedback works only inside Telegram WebApp"; 
    return; 
  }
  const text = feedbackText.value.trim();
  if (!text && !feedbackPhoto.files.length) { 
    feedbackStatus.textContent = "Add text or photo"; 
    return; 
  }

  sendFeedbackBtn.disabled = true;
  feedbackStatus.textContent = "Sending...";

  let photoBase64 = null;
  if (feedbackPhoto.files.length) {
    const file = feedbackPhoto.files[0];
    
    // iOS: handle large images
    if (isIOS && file.size > 5 * 1024 * 1024) {
      feedbackStatus.textContent = "Photo too large (max 5MB)";
      sendFeedbackBtn.disabled = false;
      return;
    }
    
    photoBase64 = await new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
  }

  // GET ONE-TIME KEY
  let ticket = null;
  try {
    const tResp = await fetch('https://game.shooleeyack.workers.dev/__ticket', {
      method: 'POST', 
      headers: {'Content-Type': 'application/json'},
      cache: 'no-cache'
    });
    const tJson = await tResp.json();
    ticket = tJson.k;
  } catch (e) { 
    feedbackStatus.textContent = "Cannot get ticket from server"; 
    sendFeedbackBtn.disabled = false; 
    return; 
  }

  // FULL USER INFO
  try {
    const userObj = tg.initDataUnsafe?.user || {};
    const payload = {
      type: 'feedback',
      page: 'console',
      text,
      photo: photoBase64,
      ts: Date.now(),
      platform: isIOS ? 'iOS' : isAndroid ? 'Android' : 'Other',
      user: {
        id: userObj.id,
        username: userObj.username,
        first_name: userObj.first_name,
        last_name: userObj.last_name,
        is_bot: userObj.is_bot,
        language_code: userObj.language_code
      }
    };

    const resp = await fetch('https://game.shooleeyack.workers.dev/__emit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ k: ticket, d: payload }),
      cache: 'no-cache'
    });
    const result = await resp.json();
    if (result.ok) {
      feedbackStatus.textContent = "✅ Feedback sent!";
      feedbackText.value = ''; 
      feedbackPhoto.value = ''; 
      toggleRemoveBtn();
      
      // Auto-close after success
      setTimeout(closeFeedbackModal, 1500);
    } else {
      feedbackStatus.textContent = "Failed to send feedback";
    }
  } catch (e) { 
    feedbackStatus.textContent = "Error sending feedback: " + e.message; 
  }
  sendFeedbackBtn.disabled = false;
}

// Prevent context menu on long press
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());

// iOS orientation handling
if (isIOS) {
  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      tg?.requestViewport?.();
    }, 100);
  });
}

// PWA support
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>

</body>
</html>
