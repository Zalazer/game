<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarDropper</title>
<style>
/* ================== БАЗОВЫЕ СТИЛИ ================== */
html, body {
    margin:0;
    padding:0;
    overflow:hidden;
    background:#000;
}
canvas {
    display:block;
    background:#000;
    touch-action:none;
    user-select:none;
}
button {
    position:absolute;
    left:50%;
    top:65%;
    transform:translate(-50%,-50%);
    padding:12px 24px;
    font-size:20px;
    cursor:pointer;
    display:none;
    z-index:10;
    background:#222;
    color:#fff;
    border:none;
    border-radius:6px;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<button id="actionBtn"></button>

<script>
/* ================== CANVAS SETUP ================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const btn = document.getElementById('actionBtn');

function resizeCanvas(){
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

/* ================== КОНСТАНТЫ И ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ================== */
const GAME_WIDTH = 360;
const GAME_HEIGHT = 640;
const ROUND_TIME = 60;
const MAX_MISSED = 5;

function sx(x){ return x * canvas.clientWidth / GAME_WIDTH; }
function sy(y){ return y * canvas.clientHeight / GAME_HEIGHT; }

/* ================== ОБЪЕКТЫ И СОСТОЯНИЕ ИГРЫ ================== */
const cannon = { x: GAME_WIDTH/2, y: GAME_HEIGHT-40, width:40, height:12 };
let bullets = [];
let balls = [];
let flashes = [];

let round = 1;
let timeLeft = ROUND_TIME;
let lastTime = performance.now();
let gameState = 'playing'; // 'playing', 'roundEnd', 'gameOver'

let hit = 0;
let missed = 0;
let shots = 0;
let lastSecond = ROUND_TIME;
let ammo = 1000;

let bestRound = Number(localStorage.getItem('bestRound')||1);
let totalHit = Number(localStorage.getItem('totalHit')||0);
let gameOverReason = '';
let timerAlpha = 0;
let timerTargetAlpha = 0;

/* ================== ОБРАБОТКА ВВОДА ================== */
canvas.addEventListener('pointerdown', e=>{
    if(gameState!=='playing') return;
    const rect = canvas.getBoundingClientRect();
    cannon.x = (e.clientX - rect.left)*GAME_WIDTH/rect.width;
    fire();
});

canvas.addEventListener('pointermove', e=>{
    if(e.buttons!==1 || gameState!=='playing') return;
    const rect = canvas.getBoundingClientRect();
    cannon.x = (e.clientX - rect.left)*GAME_WIDTH/rect.width;
});

/* ================== АУДИО ================== */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Выстрел лазером (тише)
function laserShot(){ 
    if(ammo<=0) return;
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(1200,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(300,audioCtx.currentTime+0.2);
    g.gain.setValueAtTime(0.003,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);
    o.connect(g).connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime+0.2);
}

// Попадание по цели (громче)
function splashHit(){
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(150,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(50,audioCtx.currentTime+0.3);
    g.gain.setValueAtTime(0.5,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
    o.connect(g).connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime+0.3);
}

// Звуки смерти/тики
function beep(f,d,type='sine',vol=0.1){
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type=type; o.frequency.value=f; g.gain.value=vol;
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+d);
}

const sfx = { 
    shot: laserShot, 
    hit: splashHit, 
    death: ()=>beep(80,0.5,'triangle',0.15), 
    tick: ()=>beep(600,0.04,'sine',0.05) 
};

/* ================== ФУНКЦИИ ИГРЫ ================== */
function fire(){
    if(ammo<=0) return;
    bullets.push({x:cannon.x,y:cannon.y,r:4,speed:9});
    shots++;
    ammo--;
    sfx.shot();
}

function update(dt){
    if(gameState!=='playing') return;
    timeLeft -= dt;
    if(timeLeft<=0){ timeLeft=0; endRound(); }

    // Таймер прозрачный
    const sec=Math.ceil(timeLeft);
    if(sec!==lastSecond){ 
        lastSecond=sec; 
        timerTargetAlpha=0.35; 
        if(sec<=5) sfx.tick();
    }
    timerAlpha += (timerTargetAlpha-timerAlpha)*5*dt;
    timerTargetAlpha *= Math.exp(-dt*4);

    // Обновление пуль
    bullets = bullets.filter(b=>{ b.y-=b.speed; return b.y>0; });

    // Обновление целей
    balls = balls.filter(ball=>{
        ball.y += ball.speed;

        // Проверка на столкновение с пушкой
        if(ball.y+ball.r >= cannon.y && ball.x>cannon.x-cannon.width/2 && ball.x<cannon.x+cannon.width/2){
            gameOverReason = 'Collided with target';
            sfx.death(); gameOver();
            return false;
        }

        // Проверка на пропущенные цели
        if(ball.y > GAME_HEIGHT+20){
            missed++;
            if(missed>=MAX_MISSED){
                gameOverReason = 'Missed 5 targets';
                sfx.death(); gameOver();
            }
            return false;
        }

        return true;
    });

    // Проверка попаданий
    for(let i=balls.length-1;i>=0;i--){
        for(let j=bullets.length-1;j>=0;j--){
            if(Math.hypot(balls[i].x-bullets[j].x,balls[i].y-bullets[j].y)<balls[i].r+bullets[j].r){
                bullets.splice(j,1); 
                hit++; 
                totalHit++; 
                ammo+=10; 
                sfx.hit();
                flashes.push({x:balls[i].x,y:balls[i].y,r:balls[i].r,alpha:1});
                balls.splice(i,1); 
                break;
            }
        }
    }

    // Обновление flash-анимаций
    flashes.forEach(f=>f.alpha *= Math.exp(-dt*6));
    flashes = flashes.filter(f=>f.alpha>0);

    // ===== SPAWN BALLS WITH INCREASING DIFFICULTY (+10% per round) =====
    const difficultyMultiplier = 1 + (round-1)*0.1;
    if(Math.random() < 0.025*difficultyMultiplier){
        balls.push({x:Math.random()*GAME_WIDTH, y:-20, r:14, speed:(2+Math.random()*2)*difficultyMultiplier});
    }
}

/* ================== ОТРИСОВКА ================== */
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Пушка
    ctx.fillStyle='#fff';
    ctx.fillRect(sx(cannon.x-cannon.width/2), sy(cannon.y), sx(cannon.width), sy(cannon.height));

    // Пули
    ctx.fillStyle='red';
    bullets.forEach(b=>{ ctx.beginPath(); ctx.arc(sx(b.x),sy(b.y),sx(b.r),0,Math.PI*2); ctx.fill(); });

    // Цели
    balls.forEach(b=>{ ctx.beginPath(); ctx.arc(sx(b.x),sy(b.y),sx(b.r),0,Math.PI*2); ctx.fillStyle='dodgerblue'; ctx.fill(); });

    // Flash-анимации
    flashes.forEach(f=>{ ctx.beginPath(); ctx.arc(sx(f.x),sy(f.y),sx(f.r),0,Math.PI*2); ctx.fillStyle=`rgba(255,150,150,${f.alpha})`; ctx.fill(); });

    // Таймер
    ctx.save();
    ctx.globalAlpha = timerAlpha;
    ctx.fillStyle='rgba(255,255,255,1)';
    ctx.font='bold 200px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(Math.ceil(timeLeft), canvas.clientWidth/2, canvas.clientHeight/2);
    ctx.restore();

    // HUD
    const hudOffset = 35;
    ctx.font='14px Arial'; ctx.textAlign='left';
    ctx.fillStyle=(ammo<50)?'orange':'#fff';
    ctx.fillText(`Round: ${round} (Best ${bestRound})`,10,18+hudOffset);
    ctx.fillText(`Missed: ${missed}/${MAX_MISSED}`,10,36+hudOffset);
    ctx.fillText(`Hit: ${hit}`,10,54+hudOffset);
    ctx.fillText(`Shots: ${shots}`,10,72+hudOffset);
    ctx.fillText(`Ammo: ${ammo}`,10,90+hudOffset);
    ctx.fillText(`Total Hit: ${totalHit}`,10,108+hudOffset);

    // Мерцание при критических пропусках
    if(missed>=4 && gameState==='playing'){
        ctx.fillStyle = `rgba(255,0,0,${0.15 + Math.sin(Date.now()/120)*0.05})`;
        ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);
    }

    // Round End Overlay
    if(gameState==='roundEnd'){
        ctx.fillStyle='rgba(0,0,0,0.65)';
        ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);
        ctx.textAlign='center'; ctx.fillStyle='yellow'; ctx.font='bold 24px Arial';
        ctx.fillText(`Round ${round} passed`, canvas.clientWidth/2, canvas.clientHeight/2-90);
        ctx.font='bold 20px Arial';
        ctx.fillText(`Shots: ${shots}, Hits: ${hit}`, canvas.clientWidth/2, canvas.clientHeight/2-60);
    }

    // Game Over Overlay
    if(gameState==='gameOver'){
        ctx.fillStyle='rgba(0,0,0,0.65)';
        ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);
        ctx.textAlign='center'; ctx.fillStyle='red'; ctx.font='bold 32px Arial';
        ctx.fillText('Game Over', canvas.clientWidth/2, canvas.clientHeight/2-90);
        ctx.font='bold 22px Arial';
        ctx.fillText(gameOverReason, canvas.clientWidth/2, canvas.clientHeight/2-60);
        ctx.font='bold 20px Arial';
        ctx.fillText(`Shots: ${shots}, Hits: ${hit}`, canvas.clientWidth/2, canvas.clientHeight/2-30);
    }
}

/* ================== КНОПКИ ================== */
function showButton(label,callback){
    btn.textContent = label;
    btn.style.display='block';
    btn.onclick = ()=>{ btn.style.display='none'; callback(); };
}

function endRound(){ 
    gameState='roundEnd'; 
    showButton('Start next round', nextRound);
}

function gameOver(){
    gameState='gameOver';
    bestRound = Math.max(bestRound, round);
    localStorage.setItem('bestRound', bestRound);
    localStorage.setItem('totalHit', totalHit);
    showButton('Restart Game', restart);
}

function nextRound(){
    bullets=[]; balls=[]; flashes=[]; shots=0; hit=0; 
    timeLeft=ROUND_TIME; missed=0; timerAlpha=0; timerTargetAlpha=0; 
    gameState='playing'; lastTime=performance.now();
    round++; // увеличение раунда при старте нового
}

function restart(){
    bullets=[]; balls=[]; flashes=[];
    round=1; hit=0; missed=0; shots=0; ammo=1000;
    timeLeft=ROUND_TIME; timerAlpha=0; timerTargetAlpha=0;
    gameState='playing'; lastTime=performance.now();
}

/* ================== LOOP ================== */
function loop(now){
    const dt=(now-lastTime)/1000; 
    lastTime=now;
    update(dt); 
    draw();
    requestAnimationFrame(loop);
}
loop(performance.now());

</script>
</body>
</html>
