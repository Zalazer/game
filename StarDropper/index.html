<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- viewport можно оставить, но теперь он не критичен -->
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>StarDropper</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}

/* canvas = всё приложение */
canvas {
    display: block;
    background: #000;

    touch-action: none;
    user-select: none;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<script>
/* ===== CANVAS SETUP (КЛЮЧ) ===== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;

    const w = window.innerWidth;
    const h = window.innerHeight;

    canvas.width  = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);

    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);

/* ===== GAME SPACE (логические координаты) ===== */
const GAME_WIDTH  = 360;
const GAME_HEIGHT = 640;

function sx(x) { return x * canvas.clientWidth  / GAME_WIDTH; }
function sy(y) { return y * canvas.clientHeight / GAME_HEIGHT; }

/* ===== GAME OBJECTS ===== */
const cannon = {
    x: GAME_WIDTH / 2,
    y: GAME_HEIGHT - 40,
    width: 40,
    height: 12
};

let bullets = [];
let balls   = [];

/* ===== INPUT ===== */
canvas.addEventListener('pointerdown', e => {
    const rect = canvas.getBoundingClientRect();
    const px = (e.clientX - rect.left) * GAME_WIDTH / rect.width;
    cannon.x = px;
    fireBullet();
});

canvas.addEventListener('pointermove', e => {
    if (e.buttons !== 1) return;
    const rect = canvas.getBoundingClientRect();
    const px = (e.clientX - rect.left) * GAME_WIDTH / rect.width;
    cannon.x = px;
});

/* ===== GAME LOGIC ===== */
function fireBullet() {
    bullets.push({
        x: cannon.x,
        y: cannon.y,
        r: 4,
        speed: 9
    });
}

function update() {
    bullets = bullets.filter(b => {
        b.y -= b.speed;
        return b.y > 0;
    });

    balls = balls.filter(ball => {
        ball.y += ball.speed;
        return ball.y < GAME_HEIGHT + 20;
    });

    for (let i = balls.length - 1; i >= 0; i--) {
        for (let j = bullets.length - 1; j >= 0; j--) {
            const dx = balls[i].x - bullets[j].x;
            const dy = balls[i].y - bullets[j].y;
            if (Math.hypot(dx, dy) < balls[i].r + bullets[j].r) {
                balls.splice(i, 1);
                bullets.splice(j, 1);
                break;
            }
        }
    }

    if (Math.random() < 0.025) {
        balls.push({
            x: Math.random() * GAME_WIDTH,
            y: -20,
            r: 14,
            speed: 2 + Math.random() * 2
        });
    }
}

/* ===== DRAW ===== */
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // cannon
    ctx.fillStyle = '#fff';
    ctx.fillRect(
        sx(cannon.x - cannon.width / 2),
        sy(cannon.y),
        sx(cannon.width),
        sy(cannon.height)
    );

    // bullets
    ctx.fillStyle = 'red';
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(sx(b.x), sy(b.y), sx(b.r), 0, Math.PI * 2);
        ctx.fill();
    });

    // balls
    ctx.fillStyle = 'dodgerblue';
    balls.forEach(ball => {
        ctx.beginPath();
        ctx.arc(sx(ball.x), sy(ball.y), sx(ball.r), 0, Math.PI * 2);
        ctx.fill();
    });
}

/* ===== LOOP ===== */
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
