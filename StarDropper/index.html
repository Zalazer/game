<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- 🔑 КЛЮЧЕВОЙ ФИКС -->
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>StarDropper</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}

/* canvas управляет жестами сам */
canvas {
    display: block;
    margin: 0 auto;
    background: #000;

    touch-action: none;        /* запрещаем браузерные жесты */
    user-select: none;
}
</style>
</head>

<body>

<canvas id="gameCanvas" width="320" height="480"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

/* ===== GAME OBJECTS ===== */
const cannon = {
    x: canvas.width / 2,
    y: canvas.height - 30,
    width: 30,
    height: 10
};

let bullets = [];
let balls   = [];

/* ===== TOUCH CONTROL ===== */
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    cannon.x = touch.clientX - rect.left;
    fireBullet();
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    cannon.x = touch.clientX - rect.left;
}, { passive: false });

/* ===== GAME LOGIC ===== */
function fireBullet() {
    bullets.push({
        x: cannon.x,
        y: cannon.y,
        radius: 3,
        speed: 7
    });
}

function update() {
    bullets = bullets.filter(b => {
        b.y -= b.speed;
        return b.y > 0;
    });

    balls = balls.filter(ball => {
        ball.y += ball.speed;
        return ball.y < canvas.height;
    });

    // collisions
    for (let i = balls.length - 1; i >= 0; i--) {
        for (let j = bullets.length - 1; j >= 0; j--) {
            const dx = balls[i].x - bullets[j].x;
            const dy = balls[i].y - bullets[j].y;
            if (Math.hypot(dx, dy) < balls[i].radius + bullets[j].radius) {
                balls.splice(i, 1);
                bullets.splice(j, 1);
                break;
            }
        }
    }

    if (Math.random() < 0.02) {
        balls.push({
            x: Math.random() * canvas.width,
            y: -10,
            radius: 10,
            speed: 2 + Math.random() * 2
        });
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#fff';
    ctx.fillRect(
        cannon.x - cannon.width / 2,
        cannon.y,
        cannon.width,
        cannon.height
    );

    ctx.fillStyle = 'red';
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.fillStyle = 'blue';
    balls.forEach(ball => {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
    });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
