<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ZalazerWars</title>
<style>
body{margin:0;background:#222;color:#fff;font-family:Arial;text-align:center;display:flex;flex-direction:column;align-items:center;}
canvas{background:#87CEEB;border:2px solid black;display:block;}
.controls{display:flex;justify-content:center;gap:10px;margin:5px 0;flex-wrap:wrap;}
button{font-size:32px;padding:15px 30px;border-radius:12px;cursor:pointer;}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.9);color:white;font-size:64px;flex-direction:column;visibility:hidden;}
#leaderboard{font-size:32px;margin-top:20px;}
</style>
</head>
<body>

<h2 style="font-size:26px"></h2>
<canvas id="game"></canvas>

<div class="controls">
<button onclick="move(-10)">◀ Move</button>
<button onclick="move(10)">Move ▶</button>
<button onclick="angle+=5">Angle +</button>
<button onclick="angle-=5">Angle -</button>
<button onclick="power+=1">Power +</button>
<button onclick="power-=1">Power -</button>
<button onclick="shoot()">Shoot</button>
</div>

<div id="overlay">
  <div id="resultText"></div>
  <div id="leaderboard"></div>
  <button onclick="restartGame()">Restart</button>
</div>

<script>
const BASE_W = 900;
const BASE_H = 500;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resizeCanvas(){
  const scale = Math.min(window.innerWidth/BASE_W, window.innerHeight/BASE_H);
  canvas.width = BASE_W * scale;
  canvas.height = BASE_H * scale;
  ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

// ===== GAME CODE =====
const W = BASE_W, H = BASE_H;
let terrain = new Array(W);

function generateTerrain(){
  for(let x=0;x<W;x++){
    terrain[x] = 350 + Math.sin(x*0.01)*40;
  }
}

function drawTerrain(){
  ctx.fillStyle='#5a3b1a';
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(let x=0;x<W;x++) ctx.lineTo(x, terrain[x]);
  ctx.lineTo(W,H);
  ctx.fill();
  
  ctx.strokeStyle='white';
  ctx.lineWidth=2;
  ctx.beginPath();
  let mid = Math.floor(W/2);
  ctx.moveTo(mid, terrain[mid]);
  ctx.lineTo(mid, H);
  ctx.stroke();
}

function groundY(x){
  x=Math.max(0,Math.min(W-1,Math.floor(x)));
  return terrain[x];
}

// ===== AUDIO (ОРИГИНАЛ) =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playShootSound(){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(150,audioCtx.currentTime);
  gain.gain.setValueAtTime(0.1,audioCtx.currentTime);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime+0.12);
}

function playHitSound(){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type='triangle';
  osc.frequency.setValueAtTime(400,audioCtx.currentTime);
  gain.gain.setValueAtTime(0.15,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime+0.3);
}

function playExplodeSound(){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(100,audioCtx.currentTime);
  gain.gain.setValueAtTime(0.2,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime+0.3);
}

// ===== CHARACTERS =====
let player={x:150,y:0,hp:100,hits:[]};
let allCharacters=[], botsLeft=[], botsRight=[];

let turn='player';
let projectile=null;
let angle=45;
let power=10;
let wind=0;
let gameOver=false;

let round=1;
let roundDamage=0;
let totalDamage=0;
let leaderboard=[];

// ===== INIT =====
function place(w){
  let ground = groundY(w.x) - 10;

  // если провалился — поднимаем
  if(w.y > ground){
    w.y = ground;
  } else {
    w.y = ground;
  }
}


function initLevel(){
  botsLeft=[]; botsRight=[]; allCharacters=[];

  player={x:150,y:0,hp:100,hits:[]};
  allCharacters.push(player);

  for(let i=0;i<round-1;i++){
    let b={x:150-50*(i+1),y:0,hp:100,hits:[]};
    botsLeft.push(b);
    allCharacters.push(b);
  }

  for(let i=0;i<round;i++){
    let b={x:750+50*i,y:0,hp:100,hits:[]};
    botsRight.push(b);
    allCharacters.push(b);
  }

  allCharacters.forEach(place);

  turn='player';
  projectile=null;
  wind=(Math.random()-0.5)*0.2;
  roundDamage=0;
}

function initGame(){
  generateTerrain();
  initLevel();
  gameOver=false;
  document.getElementById('overlay').style.visibility='hidden';
}

// ===== DRAW =====
function drawWorm(w,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(w.x,w.y,10,0,Math.PI*2);
  ctx.fill();

  const idx = allCharacters.indexOf(w);
  const barW=200/2.8;
  const barH=32/0.9;
  const y=w.y-50 - idx*15;

  ctx.fillStyle='red';
  ctx.fillRect(w.x-barW/2,y,barW,barH);

  ctx.fillStyle='lime';
  ctx.fillRect(w.x-barW/2,y,barW*(Math.max(0,w.hp)/100),barH);

  ctx.strokeStyle='white';
  ctx.strokeRect(w.x-barW/2,y,barW,barH);

  ctx.fillStyle='black';
  ctx.font='32px Arial';
  ctx.textAlign='center';
  ctx.fillText(Math.max(0,w.hp),w.x,y+barH-6);

  for(let i=w.hits.length-1;i>=0;i--){
    let h=w.hits[i];
    ctx.fillStyle='yellow';
    ctx.font='20px Arial';
    ctx.fillText('-'+h.amount,h.x,h.y);
    h.y-=1.5;
    h.life-=1;
    if(h.life<=0) w.hits.splice(i,1);
  }
}

function drawAim(){
  if(turn!=='player'||gameOver) return;
  let r=angle*Math.PI/180;
  let x=player.x,y=player.y;
  let vx=Math.cos(r)*power,vy=-Math.sin(r)*power;

  ctx.strokeStyle='white';
  ctx.beginPath();

  for(let i=0;i<30;i++){
    x+=vx;
    y+=vy;
    vy+=0.4;
    vx+=wind;
    ctx.lineTo(x,y);
  }

  ctx.stroke();
}

function drawProjectile(){
  if(!projectile) return;
  ctx.beginPath();
  ctx.arc(projectile.x,projectile.y,5,0,Math.PI*2);
  ctx.fill();
}

function drawWind(){
  ctx.fillStyle='white';
  ctx.font='75px Arial';
  ctx.textAlign='center';
  ctx.fillText('Wind '+(wind>0?'→':(wind<0?'←':'↔'))+' '+wind.toFixed(2),W/2,80);
}

function updateHeader(){
  document.querySelector('h2').innerText =
    `Round ${round} | Score ${roundDamage} | Total ${totalDamage}`;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawTerrain();

  allCharacters.forEach(w=>{
    let color='cyan';
    if(botsLeft.includes(w)) color='orange';
    if(botsRight.includes(w)) color='red';
    drawWorm(w,color);
  });

  drawAim();
  drawProjectile();
  drawWind();
  updateHeader();
}

// ===== DAMAGE =====
function applyDamage(w,dmg){

  // ❌ если уже мёртв — игнор
  if(w.hp <= 0) return;

  w.hp -= dmg;

  // защита от минуса
  let realDmg = dmg;
  if(w.hp < 0){
    realDmg += w.hp; // вычитаем лишний урон
    w.hp = 0;
  }

  w.hits.push({x:w.x,y:w.y-20,amount:realDmg,life:100});
  playHitSound();

  if(projectile && projectile.owner==='player'){

  // 🎯 враги (botsRight)
  if(botsRight.includes(w)){
    roundDamage += realDmg;
    totalDamage += realDmg;
  }

  // 💀 попадание в себя
  else if(w === player){
    roundDamage -= realDmg;
    totalDamage -= realDmg;
  }

  // 🤝 союзные боты
  else if(botsLeft.includes(w)){
    roundDamage -= realDmg;
    totalDamage -= realDmg;
  }
}
}



// ===== PHYSICS (ОРИГИНАЛ) =====
function explode(x,y){
  playExplodeSound();

  let radius=40;
  for(let i=0;i<W;i++){
    let dx=i-x, dy=terrain[i]-y;
    let dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<radius) terrain[i]+=(radius-dist);
  }

  allCharacters.forEach(w=>{
    let dist=Math.hypot(w.x-x,w.y-y);
    if(dist<50){
      let dmg=Math.floor(50-dist);
      applyDamage(w,dmg);
    }
  });

  // 🔥 ВАЖНО — фикс после изменения земли
  allCharacters.forEach(place);

  projectile=null;
  nextTurn();
}




function updateProjectile(){
  if(!projectile) return;

  projectile.x+=projectile.vx;
  projectile.y+=projectile.vy;
  projectile.vy+=0.4;
  projectile.vx+=wind;

  allCharacters.forEach(w=>{
    if(projectile && Math.hypot(projectile.x-w.x,projectile.y-w.y)<10){
      applyDamage(w,20);
      projectile=null;
      nextTurn();
    }
  });

  if(projectile && projectile.y>=groundY(projectile.x)){
    explode(projectile.x,projectile.y);
    return;
  }

  if(projectile && (projectile.x<0||projectile.x>W||projectile.y>H)){
    projectile=null;
    nextTurn();
  }
}

// ===== TURN =====
function nextTurn(){
  allCharacters.forEach(place);
  wind=(Math.random()-0.5)*0.2;

  if(player.hp<=0){
    endGame();
    return;
  }

  if(botsRight.every(b=>b.hp<=0)){
    levelWin();
    return;
  }

  turn=(turn==='player')?'bot':'player';

  if(turn==='bot'){
    setTimeout(botAction,500);
  }
}

// ===== BOT (ОРИГИНАЛ) =====
function botAction(){
  if(gameOver) return;

  let botsAlive = botsRight.filter(b=>b.hp>0);
  if(botsAlive.length===0){
    nextTurn();
    return;
  }

  let bot = botsAlive[Math.floor(Math.random()*botsAlive.length)];

  // move
  let bestX = bot.x;
  let minDiff = Infinity;

  for(let dx=-30;dx<=30;dx+=5){
    let x = bot.x+dx;
    if(x<W/2+10) x=W/2+10;
    if(x>W-10) x=W-10;
    let diff = Math.abs(groundY(x)-bot.y);
    if(diff<minDiff){ minDiff=diff; bestX=x; }
  }

  bot.x += Math.sign(bestX-bot.x)*5;
  place(bot);

  setTimeout(()=>{
    let targetX = player.x + (Math.random()*20-10);
    let targetY = player.y + (Math.random()*10-5);

    let dx = targetX - bot.x;
    let dy = bot.y - targetY;

    if(Math.abs(dx)<30 && dy>0){
      nextTurn();
      return;
    }

    let g = 0.4;
    let distance = Math.abs(dx);
    let angleRad = Math.atan((dy + 0.5*g*distance*distance/100)/distance);
    let powerCalc = distance/(Math.cos(angleRad)*12);

    powerCalc=Math.min(Math.max(powerCalc,5),15);
    angleRad += (Math.random()*0.12-0.06);
    powerCalc *= (0.95 + Math.random()*0.1);

    if(dx<0) angleRad=Math.PI-angleRad;

    projectile={
      x:bot.x,
      y:bot.y,
      vx:Math.cos(angleRad)*powerCalc+wind*5,
      vy:-Math.sin(angleRad)*powerCalc,
      owner:'bot'
    };

    playShootSound();
  },400);
}

// ===== LEVEL =====
function levelWin(){
  round++;
  initLevel();
}

// ===== END =====
function endGame(){
  gameOver=true;

  leaderboard.push({round,total:totalDamage});
  leaderboard.sort((a,b)=>b.total-a.total);

  let top10=leaderboard.slice(0,10);

  let html='<b>Leaderboard:</b><br>';
  top10.forEach((l,i)=>{
    html+=`${i+1}. Round ${l.round} Total ${l.total}<br>`;
  });

  document.getElementById('resultText').innerText='You Lose!';
  document.getElementById('leaderboard').innerHTML=html;
  document.getElementById('overlay').style.visibility='visible';
}

// ===== PLAYER =====
function move(dx){
  if(turn!=='player'||projectile||gameOver) return;

  let newX = player.x + dx;
  if(newX<10) newX=10;
  if(newX>W/2-10) newX=W/2-10;

  player.x=newX;
  place(player);
}

function shoot(){
  if(turn!=='player'||projectile||gameOver) return;

  let r=angle*Math.PI/180;

  projectile={
    x:player.x,
    y:player.y,
    vx:Math.cos(r)*power,
    vy:-Math.sin(r)*power,
    owner:'player'
  };

  playShootSound();
}

function restartGame(){
  round=1;
  totalDamage=0;
  initGame();
}

// ===== LOOP =====
function loop(){
  updateProjectile();
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('keydown',e=>{
  if(turn!=='player') return;
  if(e.key==='ArrowLeft') move(-5);
  if(e.key==='ArrowRight') move(5);
});

initGame();
loop();
</script>
</body>
</html>
