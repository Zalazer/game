<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ZalazerWars</title>



<!-- TELEGRAM SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>


<style>
body{margin:0;background:#222;color:#fff;font-family:Arial;text-align:center;display:flex;flex-direction:column;align-items:center;}
canvas{background:#87CEEB;border:2px solid black;display:block;}
.controls{display:flex;justify-content:center;gap:10px;margin:5px 0;flex-wrap:wrap;}


button {
  font-size: 32px;
  padding: 15px 30px;
  border-radius: 25px; /* сильно скругленные края */
  cursor: pointer;
  border: none;
  color: white;
  font-weight: bold;
  background: linear-gradient(145deg, #1b5e20, #2e7d32, #388e3c, #43a047); /* тёмно-зелёный градиент */
  background-size: 400% 400%;
  animation: candyGradient 5s ease infinite;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  transition: transform 0.2s;
}

button:hover {
  transform: scale(1.05);
}

/* Анимация градиента */
@keyframes candyGradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}



#overlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:flex-start; /* 🔥 вверх */
  padding-top:40px;           /* 🔥 отступ сверху */
  background:rgba(0,0,0,0.9);
  color:white;
  font-size:48px;             /* 🔥 чуть меньше */
  flex-direction:column;
  visibility:hidden;
}



#leaderboard{font-size:32px;margin-top:20px;}
</style>
</head>
<body>

<h2 style="font-size:26px"></h2>
<canvas id="game"></canvas>

<div class="controls">
<button onclick="move(-10)">◀ Move</button>
<button onclick="move(10)">Move ▶</button>
<button onclick="angle+=5">Angle +</button>
<button onclick="angle-=5">Angle -</button>
<button onclick="power+=1">Power +</button>
<button onclick="power-=1">Power -</button>
<button onclick="shoot()">Shoot</button>
</div>

<div id="overlay">
  <div id="resultText"></div>
  <div id="leaderboard"></div>
  <button onclick="restartGame()">Restart</button>
</div>

<script>
const WORLD_MARGIN = 10;

const BASE_W = 900;
const BASE_H = 500;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resizeCanvas(){
  const scale = Math.min(window.innerWidth/BASE_W, window.innerHeight/BASE_H);
  canvas.width = BASE_W * scale;
  canvas.height = BASE_H * scale;
  ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

// ===== GAME CODE =====
const W = BASE_W, H = BASE_H;
let terrain = new Array(W);



function generateTerrain(){
  let base = 300 + Math.random()*80;     // базовая высота
  let amp1 = 20 + Math.random()*40;      // первая волна
  let amp2 = 10 + Math.random()*25;      // вторая волна
  let freq1 = 0.005 + Math.random()*0.02;
  let freq2 = 0.01 + Math.random()*0.03;
  let phase = Math.random()*Math.PI*2;

  for(let x=0;x<W;x++){
    terrain[x] =
      base +
      Math.sin(x*freq1 + phase)*amp1 +
      Math.sin(x*freq2)*amp2;
  }
}



function drawTerrain(){
  ctx.fillStyle='#5a3b1a';
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(let x=0;x<W;x++) ctx.lineTo(x, terrain[x]);
  ctx.lineTo(W,H);
  ctx.fill();
  
  ctx.strokeStyle='white';
  ctx.lineWidth=2;
  ctx.beginPath();
  let mid = Math.floor(W/2);
  ctx.moveTo(mid, terrain[mid]);
  ctx.lineTo(mid, H);
  ctx.stroke();
}

function groundY(x){
  x=Math.max(0,Math.min(W-1,Math.floor(x)));
  return terrain[x];
}

// ===== AUDIO (ОРИГИНАЛ) =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playShootSound(){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(150,audioCtx.currentTime);
  gain.gain.setValueAtTime(0.1,audioCtx.currentTime);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime+0.12);
}

function playHitSound(){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type='triangle';
  osc.frequency.setValueAtTime(400,audioCtx.currentTime);
  gain.gain.setValueAtTime(0.15,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime+0.3);
}

function playExplodeSound(){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(100,audioCtx.currentTime);
  gain.gain.setValueAtTime(0.2,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime+0.3);
}



async function sendScoreToServer(){
  const tg = window.Telegram?.WebApp?.initDataUnsafe?.user;

  const userId = tg?.id || "guest";
  const nick = tg?.username || tg?.first_name || "Player";

  try{
    // 1️⃣ получаем ticket
    const t = await fetch("/__ticket", { method:"POST" });
    const { k } = await t.json();

    // 2️⃣ отправляем score
    await fetch("/__emit", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        k,
        d:{
          type:"score",
          game:"ZalazerWars",
          score: totalDamage,
          round: round,
          nick: nick,
          user:{ id:userId }
        }
      })
    });

  }catch(e){
    console.log("Send score error", e);
  }
}



async function getLeaderboard(){
  const tg = window.Telegram?.WebApp?.initDataUnsafe?.user;
  const userId = tg?.id || "";

  try{
    const res = await fetch(`/__leaders?game=ZalazerWars&user=${userId}`);
    return await res.json();
  }catch(e){
    console.log(e);
    return null;
  }
}



// ===== CHARACTERS =====
let player={x:150,y:0,hp:100,hits:[]};
let allCharacters=[], botsLeft=[], botsRight=[];

let turn='player';
let projectile=null;
let angle=45;
let power=10;
let wind=0;
let gameOver=false;

let round=1;
let roundDamage=0;
let totalDamage=0;
let leaderboard=[];

// ===== INIT =====
function place(w){
  // ограничение по X (чтобы не улетали за края)
  if(w.x < WORLD_MARGIN) w.x = WORLD_MARGIN;
  if(w.x > W - WORLD_MARGIN) w.x = W - WORLD_MARGIN;

  let ground = groundY(w.x) - 10;

  // если земля разрушена и стала ниже — не даём падать ниже канваса
  if(ground > H - WORLD_MARGIN){
    ground = H - WORLD_MARGIN;
  }

  // фикс провала
  if(w.y > ground){
    w.y = ground;
  } else {
    w.y = ground;
  }

  // 🔥 анти-баг: если вдруг ушёл ниже канваса
  if(w.y > H - WORLD_MARGIN){
    w.y = H - WORLD_MARGIN;
  }

  // 🔥 анти-баг: если ушёл вверх (редко, но бывает)
  if(w.y < WORLD_MARGIN){
    w.y = WORLD_MARGIN;
  }
}


function initLevel(){

generateTerrain();

  botsLeft=[]; botsRight=[]; allCharacters=[];

  player={x:150,y:0,hp:100,hits:[]};
  allCharacters.push(player);

  for(let i=0;i<round-1;i++){
    let b={x:150-50*(i+1),y:0,hp:100,hits:[]};
    botsLeft.push(b);
    allCharacters.push(b);
  }

  for(let i=0;i<round;i++){

let b={
  x:750+50*i,
  y:0,
  hp:100,
  hits:[],
  memory:{ lastShots: [], dangerX: null }
};

    botsRight.push(b);
    allCharacters.push(b);
  }

  allCharacters.forEach(place);

  turn='player';
  projectile=null;
  wind=(Math.random()-0.5)*0.2;
  roundDamage=0;
}

function initGame(){
  generateTerrain();
  initLevel();
  gameOver=false;
  document.getElementById('overlay').style.visibility='hidden';
}

// ===== DRAW =====
function drawWorm(w,color){
  if(w.mergedToTerrain) return; // уже в земле — не рисуем

  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(w.x,w.y,10,0,Math.PI*2);
  ctx.fill();

  // Полоска здоровья
  const idx = allCharacters.indexOf(w);
  const barW=200/2.8;
  const barH=32/0.9;
  const y=w.y-50 - idx*15;

  ctx.fillStyle='red';
  ctx.fillRect(w.x-barW/2,y,barW,barH);

  ctx.fillStyle='lime';
  ctx.fillRect(w.x-barW/2,y,barW*(Math.max(0,w.hp)/100),barH);

  ctx.strokeStyle='white';
  ctx.strokeRect(w.x-barW/2,y,barW,barH);

  ctx.fillStyle='black';
  ctx.font='32px Arial';
  ctx.textAlign='center';
  ctx.fillText(Math.max(0,w.hp),w.x,y+barH-6);

  // Всплывающий урон
  for(let i=w.hits.length-1;i>=0;i--){
    let h=w.hits[i];
    ctx.fillStyle='yellow';
    ctx.font='20px Arial';
    ctx.fillText('-'+h.amount,h.x,h.y);
    h.y-=1.5;
    h.life-=1;
    if(h.life<=0) w.hits.splice(i,1);
  }
}



function drawAim(){
  if(turn!=='player'||gameOver) return;
  let r=angle*Math.PI/180;
  let x=player.x,y=player.y;
  let vx=Math.cos(r)*power,vy=-Math.sin(r)*power;

  ctx.strokeStyle='white';
  ctx.beginPath();

  for(let i=0;i<30;i++){
    x+=vx;
    y+=vy;
    vy+=0.4;
    vx+=wind;
    ctx.lineTo(x,y);
  }

  ctx.stroke();
}

function drawProjectile(){
  if(!projectile) return;
  ctx.beginPath();
  ctx.arc(projectile.x,projectile.y,5,0,Math.PI*2);
  ctx.fill();
}

function drawWind(){
  ctx.fillStyle='white';
  ctx.font='75px Arial';
  ctx.textAlign='center';
  ctx.fillText('Wind '+(wind>0?'→':(wind<0?'←':'↔'))+' '+wind.toFixed(2),W/2,80);
}

function updateHeader(){
  document.querySelector('h2').innerText =
    `Round ${round} | Score ${roundDamage} | Total ${totalDamage}`;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawTerrain();

  allCharacters.forEach(w=>{
    let color='cyan';
    if(botsLeft.includes(w)) color='orange';
    if(botsRight.includes(w)) color='red';
    drawWorm(w,color);
  });

  drawAim();
  drawProjectile();
  drawWind();
  updateHeader();
}


// ===== DAMAGE =====
function applyDamage(w, dmg) {

  // ❌ если уже мёртв — игнор
  if (w.hp <= 0) return;

  // уменьшаем здоровье
  w.hp -= dmg;

  // защита от минуса
  let realDmg = dmg;
  if (w.hp < 0) {
    realDmg += w.hp; // вычитаем лишний урон
    w.hp = 0;
  }

  // всплывающий урон
  w.hits.push({ x: w.x, y: w.y - 20, amount: realDmg, life: 100 });
  playHitSound();

  // расчёт очков
  if (projectile && projectile.owner === 'player') {

    // 🎯 враги (botsRight)
    if (botsRight.includes(w)) {
      roundDamage += realDmg;
      totalDamage += realDmg;
    }

    // 💀 попадание в себя
    else if (w === player) {
      roundDamage -= realDmg;
      totalDamage -= realDmg;
    }

    // 🤝 союзные боты
    else if (botsLeft.includes(w)) {
      roundDamage -= realDmg;
      totalDamage -= realDmg;
    }
  }

  // ===== ПРЕВРАЩЕНИЕ В ЗЕМЛЮ =====
  if (w.hp <= 0 && !w.mergedToTerrain) {
    w.mergedToTerrain = true; // помечаем, чтобы не делать дважды

    // делаем небольшую площадку на месте персонажа
    let xStart = Math.max(0, Math.floor(w.x - 10));
    let xEnd = Math.min(W - 1, Math.floor(w.x + 10));
    for (let x = xStart; x <= xEnd; x++) {
      terrain[x] = Math.min(H, Math.max(terrain[x], w.y)); // поднимаем землю до уровня персонажа
    }

    // удаляем персонажа из массивов, чтобы не рисовался
    let idx = allCharacters.indexOf(w);
    if (idx !== -1) allCharacters.splice(idx, 1);
    if (botsRight.includes(w)) botsRight.splice(botsRight.indexOf(w), 1);
    if (botsLeft.includes(w)) botsLeft.splice(botsLeft.indexOf(w), 1);
  }
}




// ===== PHYSICS (ОРИГИНАЛ) =====
function explode(x,y){
  playExplodeSound();

  let radius = 40;

  // ===== ДЕФОРМАЦИЯ ЗЕМЛИ =====
  for(let i=0;i<W;i++){
    let dx = i - x;
    let dy = terrain[i] - y;
    let dist = Math.sqrt(dx*dx + dy*dy);

    if(dist < radius){
      terrain[i] += (radius - dist);

      // ограничение снизу (земля не уходит за экран)
      if(terrain[i] > H - 5){
        terrain[i] = H - 5;
      }
    }
  }

  // ===== УРОН =====
  allCharacters.forEach(w=>{
    let dist = Math.hypot(w.x - x, w.y - y);
    if(dist < 50){
      let dmg = Math.floor(50 - dist);
      applyDamage(w, dmg);
    }
  });

  // ===== ОБУЧЕНИЕ БОТА =====
  if(projectile && projectile.owner === 'bot' && projectile.botRef){
    let bot = projectile.botRef;

    if(!bot.memory){
      bot.memory = { lastShots: [] };
    }

    bot.memory.lastShots.push({
      angle: projectile.angle,
      power: projectile.power,
      hitX: x
    });

    // ограничиваем память (последние 5 выстрелов)
    if(bot.memory.lastShots.length > 5){
      bot.memory.lastShots.shift();
    }
  }

  // ===== СТАБИЛИЗАЦИЯ =====
  allCharacters.forEach(place);

  // очищаем снаряд
  projectile = null;

  nextTurn();
}





function updateProjectile(){
  if(!projectile) return;

  // движение
  projectile.x += projectile.vx;
  projectile.y += projectile.vy;
  projectile.vy += 0.4;
  projectile.vx += wind;

  // возраст снаряда (для защиты от самопопадания)
  if(projectile.life === undefined) projectile.life = 0;
  projectile.life++;

  // ===== СТОЛКНОВЕНИЕ С ПЕРСОНАЖАМИ =====
  allCharacters.forEach(w=>{
    if(!projectile) return;

    // ❌ игнор первых кадров (вылет из ствола)
    if(projectile.life < 8) return;

    // ❌ игнор владельца на старте
    if(projectile.owner === 'player' && w === player && projectile.life < 20) return;
    if(projectile.owner === 'bot' && projectile.botRef === w && projectile.life < 20) return;

    if(Math.hypot(projectile.x - w.x, projectile.y - w.y) < 10){
      explode(projectile.x, projectile.y); // 💥 только взрыв
      return;
    }
  });

  // ===== СТОЛКНОВЕНИЕ С ЗЕМЛЁЙ =====
  if(projectile && projectile.y >= groundY(projectile.x)){
    explode(projectile.x, projectile.y);
    return;
  }

  // ===== ВЫЛЕТ ЗА КАРТУ =====
  if(projectile && (
    projectile.x < -50 ||
    projectile.x > W + 50 ||
    projectile.y > H + 50
  )){
    projectile = null;
    nextTurn();
  }
}





// ===== TURN =====
function nextTurn(){
  allCharacters.forEach(place);

  setTimeout(()=> allCharacters.forEach(place), 0);

  wind=(Math.random()-0.5)*0.2;

  if(player.hp<=0){
    endGame();
    return;
  }

  if(botsRight.every(b=>b.hp<=0)){
    levelWin();
    return;
  }

  turn=(turn==='player')?'bot':'player';

  if(turn==='bot'){
    setTimeout(botAction,500);
  }
}



// ===== BOT (ОРИГИНАЛ) =====
function botAction(){
  if(gameOver) return;

  // Берём живых ботов
  let botsAlive = botsRight.filter(b=>b.hp>0);
  if(botsAlive.length===0){
    nextTurn();
    return;
  }

  // Случайный бот
  let bot = botsAlive[Math.floor(Math.random()*botsAlive.length)];

  // ===== 1️⃣ Найти безопасное место =====
  let bestX = bot.x;
  let minDiff = Infinity;
  for(let dx=-30; dx<=30; dx+=5){
    let x = bot.x + dx;
    if(x < W/2 + 10) x = W/2 + 10;
    if(x > W - 10) x = W - 10;
    let diff = Math.abs(groundY(x) - bot.y);
    if(diff < minDiff){
      minDiff = diff;
      bestX = x;
    }
  }
  bot.x += Math.sign(bestX - bot.x) * 5;
  place(bot);

  setTimeout(()=>{
    // ===== 2️⃣ Цель — игрок =====
    let dx = player.x - bot.x;
    let dy = player.y - bot.y;
    let g = 0.4;

    let angleRad = Math.PI/4; // стартовый угол 45°
    let powerCalc = 5;
    let step = 0.2;
    let found = false;
    let sign = dx >= 0 ? 1 : -1;

    // Подбор силы, чтобы попасть
    for(let p=5; p<=30; p+=step){
      let vx = Math.cos(angleRad)*p*sign + wind*5;
      let vy = -Math.sin(angleRad)*p;
      let x=bot.x, y=bot.y;
      let hit = false;

      for(let t=0; t<1000; t++){
        x += vx; y += vy; vy += g; vx += wind;
        if(Math.abs(x-player.x)<10 && Math.abs(y-player.y)<10){
          hit=true; break;
        }
        if(y>=groundY(x)) break;
      }

      if(hit){ powerCalc=p; found=true; break; }
    }

    if(!found) powerCalc=15; // если не нашли — берём максимум

    // ===== 3️⃣ Добавляем небольшую погрешность 5% =====
    powerCalc *= 0.95 + Math.random()*0.1; // ±5% ошибки

    // ===== 4️⃣ Выстрел =====
    projectile = {
      x: bot.x,
      y: bot.y-5,
      vx: Math.cos(angleRad)*powerCalc*sign + wind*5,
      vy: -Math.sin(angleRad)*powerCalc,
      owner:'bot',
      botRef: bot
    };

    playShootSound();
  }, 400);
}




// ===== LEVEL =====
function levelWin(){
  round++;
  initLevel();
}

// ===== END =====
async function endGame(){
  gameOver = true;

  // сохраняем локально (как раньше)
  leaderboard.push({round,total:totalDamage});
  leaderboard.sort((a,b)=>b.total-a.total);

  let localTop = leaderboard.slice(0,5);

  // пробуем сервер
  let data = null;
  try{
    await sendScoreToServer();
    data = await getLeaderboard();
  }catch(e){
    console.log("Server unavailable");
  }

  let html = '';

  // ===== 🌍 GLOBAL =====
  html += '<b>🏆 Global Top:</b><br>';

  if(data?.globalTop?.length){
    data.globalTop.forEach((l,i)=>{
      html += `${i+1}. ${l.nick} — ${l.score}<br>`;
    });
  } else {
    html += '<i>No server data</i><br>';
  }

  // ===== 👤 PERSONAL =====
  html += '<br><b>👤 Your Top:</b><br>';

  if(data?.userTop?.length){
    data.userTop.forEach((l,i)=>{
      html += `${i+1}. ${l.score}<br>`;
    });
  } else {
    html += '<i>No server data</i><br>';
  }

  // ===== 💻 LOCAL =====
  html += '<br><b>💻 Local Top:</b><br>';

  localTop.forEach((l,i)=>{
    html += `${i+1}. Round ${l.round} — ${l.total}<br>`;
  });

  // ===== RESULT (🔥 РАЗДЕЛЁН НА 2 СТРОКИ) =====
  document.getElementById('resultText').innerHTML =
    `You Lose!<br>
     <span style="font-size:28px; opacity:0.8;">
       Current Score: ${totalDamage}
     </span>`;

  document.getElementById('leaderboard').innerHTML = html;
  document.getElementById('overlay').style.visibility = 'visible';
}



// ===== PLAYER =====
function move(dx){
  if(turn!=='player'||projectile||gameOver) return;

  let newX = player.x + dx;
  if(newX<10) newX=10;
  if(newX>W/2-10) newX=W/2-10;

  player.x=newX;
  place(player);
}




function shoot(){
  if(turn!=='player'||projectile||gameOver) return;

  let r=angle*Math.PI/180;

  projectile={
  x:player.x,
  y:player.y,
  vx:Math.cos(r)*power,
  vy:-Math.sin(r)*power,
  owner:'player',
  life:0
};

  playShootSound();
}





function restartGame(){
  round=1;
  totalDamage=0;
  initGame();
}

// ===== LOOP =====
function loop(){
  updateProjectile();
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('keydown',e=>{
  if(turn!=='player') return;
  if(e.key==='ArrowLeft') move(-5);
  if(e.key==='ArrowRight') move(5);
});

initGame();
loop();
