<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>International Checkers 10x10</title>


<!-- TELEGRAM SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>


    <style>
        body {
            margin: 0;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #menu {
            text-align: center;
        }

        button {
            padding: 10px 18px;
            margin: 6px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #3498db;
            color: white;
        }

        #game {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        #topbar {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #board {
            display: grid;
            width: min(95vw, 95vh);
            height: min(95vw, 95vh);
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            border: 4px solid white;
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .whiteCell {
            background: #eee;
        }

        .blackCell {
            background: #444;
        }

        .piece {
            width: 70%;
            height: 70%;
            border-radius: 50%;
            position: relative;
            transition: 0.15s;
        }

        .whitePiece {
            background: #fff;
            border: 3px solid black;
        }

        .blackPiece {
            background: #000;
            border: 3px solid white;
        }

        .king::after {
            content: "";
            position: absolute;
            width: 40%;
            height: 40%;
            border-radius: 50%;
            top: 30%;
            left: 30%;
            background: gold;
        }

        .selected {
            outline: 4px solid yellow;
        }

        .move {
            outline: 3px solid lime;
        }

        .lastMove {
            background: rgba(0, 255, 0, 0.25);
        }

        #status {
            margin-top: 8px;
            font-size: 18px;
        }

        #difficulty {
            font-size: 22px;
            padding: 6px;
        }

        #moveCounter {
            font-size: 18px;
            padding: 6px;
        }
    </style>
</head>



<body><div id="menu">
<h1>International Checkers 10×10</h1>
<p>White always moves first</p>
<button onclick="startGame('white')">Play White</button>
<button onclick="startGame('black')">Play Black</button>
<br><br>
<select id="difficulty">
<option value="3">Easy</option>
<option value="5">Medium</option>
<option value="6" selected>Champion</option>
</select>
</div><div id="game">
<div id="topbar">
<button onclick="newGame()">New Game</button>
<button onclick="resign()">Resign</button>
<div id="timer">00:00</div>
<div id="moveCounter">Moves: 0 / 60</div>
</div>
<div id="board"></div>
<div id="status"></div>
</div><!-- короткие звуки --><audio id="moveSound" preload="auto">
<source src="https://actions.google.com/sounds/v1/foley/wood_tap.ogg" type="audio/ogg">
</audio>
<audio id="captureSound" preload="auto">
<source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" type="audio/ogg">
</audio><script>
let board=[]
let playerColor
let botColor
let turn='white'
let selected=null
let possibleMoves=[]
let difficulty=6
let moveCounter=0
let timer=0
let timerInterval
let lastMoveCells=[]

function startGame(color){
playerColor=color
botColor=color==='white'?'black':'white'
difficulty=parseInt(document.getElementById('difficulty').value)

document.getElementById('menu').style.display='none'
document.getElementById('game').style.display='flex'

initBoard()
startTimer()
drawBoard()
updateStatus()
updateMoveCounter()

if(botColor==='white') setTimeout(botMove,100)
}

function newGame(){location.reload()}
function resign(){alert('You resigned');location.reload()}

function startTimer(){
timerInterval=setInterval(()=>{
timer++
let m=Math.floor(timer/60).toString().padStart(2,'0')
let s=(timer%60).toString().padStart(2,'0')
document.getElementById('timer').innerText=m+':'+s
},1000)
}


function updateMoveCounter(){
document.getElementById('moveCounter').innerText='Moves: '+moveCounter+' / 60'
}

function initBoard(){
board=[]
for(let r=0;r<10;r++){
board[r]=[]
for(let c=0;c<10;c++){
if((r+c)%2===1 && r<4) board[r][c]={color:'black',king:false}
else if((r+c)%2===1 && r>5) board[r][c]={color:'white',king:false}
else board[r][c]=null
}
}
}

function drawBoard(){
const b=document.getElementById('board')
b.innerHTML=''

for(let r=0;r<10;r++){
for(let c=0;c<10;c++){
let vr=playerColor==='white'?r:9-r
let vc=playerColor==='white'?c:9-c

const cell=document.createElement('div')
cell.className='cell '+((vr+vc)%2===0?'whiteCell':'blackCell')
cell.onclick=()=>cellClick(vr,vc)

if(lastMoveCells.some(m=>m.r===vr&&m.c===vc)) cell.classList.add('lastMove')
if(selected && possibleMoves.some(m=>m.to.r===vr&&m.to.c===vc)) cell.classList.add('move')

const p=board[vr][vc]
if(p){
const piece=document.createElement('div')
piece.className='piece '+(p.color==='white'?'whitePiece':'blackPiece')
if(p.king) piece.classList.add('king')
if(selected && selected.r===vr && selected.c===vc) piece.classList.add('selected')
cell.appendChild(piece)
}

b.appendChild(cell)
}
}
}

function cellClick(r,c){
if(turn!==playerColor) return
const p=board[r][c]

if(p && p.color===playerColor){
selected={r,c}
possibleMoves=getMoves(board,playerColor).filter(m=>m.from.r===r && m.from.c===c)
drawBoard()
return
}

if(selected){
const move=possibleMoves.find(m=>m.to.r===r && m.to.c===c)
if(move){
applyMove(board,move)
playMoveSound(move)
lastMoveCells=[move.from,move.to,...(move.captures||[])]


let nextCaptures=getMoves(board,playerColor).filter(m=>m.from.r===move.to.r && m.from.c===move.to.c && m.captures)

if(move.captures && nextCaptures.length>0){
selected={r:move.to.r,c:move.to.c}
possibleMoves=nextCaptures

drawBoard()
return
}

turn=botColor
selected=null


drawBoard()
updateStatus()
setTimeout(botMove,50)
}
}
}

function playMoveSound(move){
let audio = move.captures ? document.getElementById('captureSound') : document.getElementById('moveSound')
audio.currentTime = 0
audio.play().catch(()=>{})
}

function updateStatus(){document.getElementById('status').innerText='Turn: '+turn}
function inBoard(r,c){return r>=0&&r<10&&c>=0&&c<10}

function getMoves(b,color){
let captures=[]
let moves=[]

for(let r=0;r<10;r++){
for(let c=0;c<10;c++){
const p=b[r][c]
if(!p||p.color!==color) continue

const pm=getPieceMoves(b,r,c,p)
captures=captures.concat(pm.captures)
moves=moves.concat(pm.moves)
}
}

if(captures.length>0){
let max=Math.max(...captures.map(m=>m.captures.length))
return captures.filter(m=>m.captures.length===max)
}

return moves
}

function getPieceMoves(b,r,c,p){
let moves=[]
let captures=[]
const dirs=[[1,1],[1,-1],[-1,1],[-1,-1]]

if(p.king){
for(const d of dirs){
let i=1
while(inBoard(r+d[0]*i,c+d[1]*i) && !b[r+d[0]*i][c+d[1]*i]){
moves.push({from:{r,c},to:{r:r+d[0]*i,c:c+d[1]*i}})
i++
}

if(inBoard(r+d[0]*i,c+d[1]*i) && b[r+d[0]*i][c+d[1]*i] && b[r+d[0]*i][c+d[1]*i].color!==p.color){
let j=i+1
while(inBoard(r+d[0]*j,c+d[1]*j) && !b[r+d[0]*j][c+d[1]*j]){
captures.push({from:{r,c},to:{r:r+d[0]*j,c:c+d[1]*j},captures:[{r:r+d[0]*i,c:c+d[1]*i}]})
j++
}
}
}
}else{
for(const d of dirs){
let r1=r+d[0]
let c1=c+d[1]
let r2=r+d[0]*2
let c2=c+d[1]*2

if(inBoard(r1,c1)&&!b[r1][c1] && ((p.color==='white'&&d[0]==-1)||(p.color==='black'&&d[0]==1))) moves.push({from:{r,c},to:{r:r1,c:c1}})

if(inBoard(r2,c2) && b[r1][c1] && b[r1][c1].color!==p.color && !b[r2][c2]) captures.push({from:{r,c},to:{r:r2,c:c2},captures:[{r:r1,c:c1}]})
}
}

return {moves,captures}
}

function applyMove(b,m){
const p=b[m.from.r][m.from.c]
b[m.from.r][m.from.c]=null

// звук взятия сразу при удалении
if(m.captures){
for(const c of m.captures){
b[c.r][c.c]=null
}
}

b[m.to.r][m.to.c]=p
if(p.color==='white' && m.to.r===0) p.king=true
if(p.color==='black' && m.to.r===9) p.king=true
}

function cloneBoard(b){return JSON.parse(JSON.stringify(b))}

function botMove() {
    if (turn !== botColor) return;

    const moves = getMoves(board, botColor);
    if (moves.length === 0) {
        alert('You win!'); // игрок побеждает, если у бота нет ходов
        location.reload();
        return;
    }

    // выбираем лучший ход бота
    let bestMove = moves[0];
    let bestScore = -9999;
    for (const m of moves) {
        const copy = cloneBoard(board);
        applyMove(copy, m);
        let score = evaluate(copy);
        if (m.captures) score += 20;
        if (score > bestScore) {
            bestScore = score;
            bestMove = m;
        }
    }

    applyMove(board, bestMove);
    playMoveSound(bestMove);
    lastMoveCells = [bestMove.from, bestMove.to, ...(bestMove.captures || [])];

    // проверка на серию взятий у бота
    let nextCaptures = getMoves(board, botColor).filter(
        m => m.from.r === bestMove.to.r && m.from.c === bestMove.to.c && m.captures
    );
    if (bestMove.captures && nextCaptures.length > 0) {
        drawBoard();
        setTimeout(botMove, 50);
        return;
    }

    // после завершения хода бота проверяем конец игры
    const playerPieces = board.flat().filter(p => p && p.color === playerColor).length;
    const botPieces = board.flat().filter(p => p && p.color === botColor).length;

    if (playerPieces === 0) {
        alert('You lose!'); // игрок проиграл, если у него нет фигур
        location.reload();
        return;
    }
    if (botPieces === 0) {
        alert('You win!'); // бот проиграл, если у него нет фигур
        location.reload();
        return;
    }

    // передача хода игроку
    turn = playerColor;
    moveCounter++;
    updateMoveCounter();
    drawBoard();
    updateStatus();

    if (moveCounter >= 60) {
        alert('Draw by 60 moves rule');
        location.reload();
    }
}



function evaluate(b){
let score=0
for(let r=0;r<10;r++){
for(let c=0;c<10;c++){
const p=b[r][c]
if(!p) continue
let val=p.king?8:3
if(p.color===botColor) score+=val
else score-=val
}
}
return score
}
</script></body>
</html>
