        return { move: x.move, coord: x.coord, w: x.weight * 10 + bonus };
    });

    let total = weighted.reduce((a, b) => a + b.w, 0);
    let rnd = Math.random() * total;

    for (const item of weighted) {
        rnd -= item.w;
        if (rnd <= 0) return item.move;
    }

    return weighted[0].move;
}




function uiYield() {
    return new Promise(resolve => setTimeout(resolve, 0));
}


async function botMove() {
    if (turn !== botColor || gameOver) return;

    const engineInfoEl = document.getElementById('engineInfo');
    if (!engineInfoEl) return;

    consumeActiveClock();
    activeClock = 'bot';
    lastClockTs = performance.now();
    updateTimers();

    searchDeadline = performance.now() + BOT_THINK_MS;
    searchAborted = false;
    nodeCount = 0;
    tt.clear();

    const root = cloneState(getState());

    const bookMove = tryBookMove(root, botColor);
    if (bookMove) {
        engineInfoEl.innerText = 'Book';
        makeRealMove(bookMove, false);
        return;
    }

    engineInfoEl.innerText = 'Thinking...';

    const maxDepth = parseInt(document.getElementById('difficulty').value, 10) + 6;

    let bestMove = null;
    let bestScore = -INF;
    let previousScore = 0;
    let lastCompletedBestMove = null;
    let lastCompletedBestScore = -INF;

    let rootMoves = getLegalMoves(root, botColor);
    if (!rootMoves.length) {
        engineInfoEl.innerText = 'Your move';
        return;
    }

    rootMoves = filterRootMovesBySafety(root, rootMoves, botColor);

    if (!rootMoves.length) {
        rootMoves = getLegalMoves(root, botColor)
            .map(m => ({
                move: m,
                cost: rootMoveSafetyPenalty(root, m, botColor)
            }))
            .sort((a, b) => a.cost - b.cost)
            .slice(0, 8)
            .map(x => x.move);

        if (!rootMoves.length) {
            engineInfoEl.innerText = 'Your move';
            return;
        }
    }

    rootMoves = orderMoves(root, botColor, rootMoves, 0, ttBestMove(root));

    let lastYieldTs = performance.now();

    for (let depth = 1; depth <= maxDepth; depth++) {
        if (performance.now() >= searchDeadline) break;

        let window = depth >= 4 ? 24 : (depth >= 2 ? 40 : INF);
        let alpha = window === INF ? -INF : previousScore - window;
        let beta = window === INF ? INF : previousScore + window;

        let completedThisDepth = false;
        let scored = [];

        while (true) {
            if (performance.now() >= searchDeadline) {
                searchAborted = true;
                break;
            }

            const ttMove = ttBestMove(root);
            let moves = rootMoves.slice();
            if (ttMove) moves = orderMoves(root, botColor, moves, 0, ttMove);

            scored = [];
            let localAlpha = alpha;
            let moveIndex = 0;

            for (const m of moves) {
                const now = performance.now();

                if (now >= searchDeadline) {
                    searchAborted = true;
                    break;
                }

                if (now - lastYieldTs >= 25) {
                    updateTimers();
                    await uiYield();
                    lastYieldTs = performance.now();

                    if (gameOver) return;
                    if (turn !== botColor) return;
                    if (performance.now() >= searchDeadline) {
                        searchAborted = true;
                        break;
                    }
                }

                const gate = rootSafetyGate(root, m, botColor) || { safe: true, selfLoose: 0, see: 0, penalty: 0 };
                const safetyPenalty = rootMoveSafetyPenalty(root, m, botColor) || 0;

                const isQuietPawn = m.piece === 'p' && !m.captured && !m.promotion;
                const isWingPawn = isQuietPawn && (m.from.c === 0 || m.from.c === 1 || m.from.c === 6 || m.from.c === 7);
                const isEarly = currentPly(root) <= 14;

                const badMaterialGiveaway =
                    !m.captured &&
                    gate.selfLoose >= 320 &&
                    (!Number.isFinite(gate.see) || gate.see < 80);

                const terribleMaterialGiveaway =
                    gate.selfLoose >= 500 &&
                    (!Number.isFinite(gate.see) || gate.see < 120);

                const junkWingPawn =
                    isEarly &&
                    isWingPawn &&
                    gate.selfLoose >= 0 &&
                    safetyPenalty >= 80;

                if (terribleMaterialGiveaway) {
                    scored.push({ move: m, score: -INF / 4, safetyPenalty });
                    moveIndex++;
                    continue;
                }

                if (badMaterialGiveaway && !m.captured) {
                    scored.push({ move: m, score: -INF / 5, safetyPenalty });
                    moveIndex++;
                    continue;
                }

                if (junkWingPawn && !gate.safe) {
                    scored.push({ move: m, score: -INF / 6, safetyPenalty });
                    moveIndex++;
                    continue;
                }

                const c = cloneState(root);
                applyMove(c, m);

                let score;
                if (moveIndex === 0) {
                    score = -negamax(c, depth - 1, -beta, -localAlpha, 1);
                } else {
                    score = -negamax(c, depth - 1, -localAlpha - 1, -localAlpha, 1);
                    if (searchAborted) break;
                    if (score > localAlpha && score < beta) {
                        score = -negamax(c, depth - 1, -beta, -localAlpha, 1);
                    }
                }

                if (searchAborted) break;

                if (!Number.isFinite(score)) score = -INF / 2;

                let rootAdjust = 0;

                if (!gate.safe) {
                    if (gate.selfLoose >= 900) rootAdjust -= 2600;
                    else if (gate.selfLoose >= 500) rootAdjust -= 1200;
                    else if (gate.selfLoose >= 320) rootAdjust -= 500;
                    else rootAdjust -= 120;
                }

                rootAdjust -= Math.min(220, Math.floor(safetyPenalty * 0.03));

                if (m.captured) {
                    const victim = VAL[m.captured] || 0;
                    const attacker = VAL[m.piece] || 0;
                    const see = typeof gate.see === 'number' ? gate.see : 0;

                    rootAdjust += Math.max(-30, Math.min(60, Math.floor(see / 5)));
                    rootAdjust += Math.max(0, victim - attacker) * 0.25;

                    if (m.captured === 'q') rootAdjust += 140;
                    else if (m.captured === 'r') rootAdjust += 70;
                    else if (m.captured === 'b' || m.captured === 'n') rootAdjust += 28;
                }

                if (m.piece === 'k' && !(m.flags && m.flags.castle)) {
                    rootAdjust -= isEarlyPhase(root) ? 2200 : 700;
                }

                if (isQuietPawn) {
                    if (isWingPawn) rootAdjust -= isEarly ? 90 : 40;
                    else if (m.to.c !== 3 && m.to.c !== 4) rootAdjust -= isEarly ? 30 : 10;
                }

                score += Math.round(rootAdjust);

                scored.push({ move: m, score, safetyPenalty });
                if (score > localAlpha) localAlpha = score;
                moveIndex++;
            }

            if (searchAborted || !scored.length) break;

            scored.sort((a, b) => b.score - a.score);
            const top = scored[0].score;

            if (window !== INF && top <= alpha) {
                alpha -= window * 2;
                window *= 2;
                continue;
            }

            if (window !== INF && top >= beta) {
                beta += window * 2;
                window *= 2;
                continue;
            }

            bestScore = top;
            bestMove = chooseAmongNearBest(scored, root) || scored[0].move;
            previousScore = top;

            lastCompletedBestMove = bestMove;
            lastCompletedBestScore = bestScore;
            completedThisDepth = true;

            rootMoves = scored.map(x => x.move);

            const chosen = scored.find(x => sameMove(x.move, bestMove));
            const bestPenalty = chosen ? chosen.safetyPenalty : 0;

            engineInfoEl.innerText =
                `D${depth} | Score ${(bestScore / 100).toFixed(2)} | Risk ${bestPenalty} | N ${nodeCount}`;

            break;
        }

        updateTimers();
        await uiYield();
        lastYieldTs = performance.now();

        if (searchAborted || !completedThisDepth) break;
    }

    if (!bestMove && lastCompletedBestMove) {
        bestMove = lastCompletedBestMove;
        bestScore = lastCompletedBestScore;
    }

    if (!bestMove) {
        let fallback = getLegalMoves(root, botColor);
        fallback = fallback
            .map(m => ({
                move: m,
                cost: rootMoveSafetyPenalty(root, m, botColor)
            }))
            .sort((a, b) => a.cost - b.cost);

        if (!fallback.length) {
            engineInfoEl.innerText = 'Your move';
            return;
        }
        bestMove = fallback[0].move;
    }

    consumeActiveClock();
    engineInfoEl.innerText = 'Your move';
    makeRealMove(bestMove, false);
}
