    if(m.flags && m.flags.castle){
        ownGain += 1200;
    }

    if(selfLoose >= 900) punish += 5000;
    else if(selfLoose >= 500) punish += 2200;
    else if(selfLoose >= 320) punish += 900;

    if(m.piece === 'k' && !(m.flags && m.flags.castle)){
        punish += 7000;
        if(moveCount <= 16) punish += 5000;
        if(moveCount <= 10) punish += 4000;
        if(!inCheck(s,color)) punish += 2500;
    }

    const landed = c.board[m.to.r][m.to.c];
    if(landed && landed.color === color){
        const attacked = isSquareAttacked(c, m.to.r, m.to.c, enemy);
        const defended = isSquareAttacked(c, m.to.r, m.to.c, color);
        const landedVal = VAL[landed.type] || 0;

        if(attacked && !defended){
            if(landedVal >= 900) punish += 14000;
            else if(landedVal >= 500) punish += 8000;
            else if(landedVal >= 320) punish += 4000;
            else punish += 1200;
        } else if(attacked && defended){
            punish += Math.round(landedVal * 0.8);
        }
    }

    const net = ownGain - punish;

    let safe = true;

    if(m.piece === 'k' && !(m.flags && m.flags.castle) && moveCount <= 18 && !inCheck(s,color)){
        safe = false;
    }

    if(selfLoose >= 900 && !m.captured){
        safe = false;
    }

    if(m.captured){
        const victim = VAL[m.captured] || 0;
        const attacker = VAL[m.piece] || 0;
        const targetDefended = isSquareAttacked(s, m.to.r, m.to.c, enemy);
        const materialGap = attacker - victim;

        if(see < -120){
            safe = false;
        }

        if(targetDefended && materialGap >= 300 && see < 0){
            safe = false;
        }

        if(targetDefended && attacker > victim && see <= -60){
            safe = false;
        }

        if(targetDefended && attacker >= 900 && victim <= 330){
            safe = false;
        }

        if(targetDefended && attacker >= 500 && victim <= 100 && see < 0){
            safe = false;
        }
    }

    return {
        safe,
        net,
        punish,
        nextThreat:0,
        chasedPenalty:0,
        openingPenalty:0,
        badOpening:0,
        badExchange:0,
        tradePenalty:Math.max(0,-see),
        sacPenalty:see < 0 ? Math.abs(see) : 0,
        selfLoose,
        see
    };
}




function classifyMovePriority(s,m,color){
    const enemy = opponent(color);
    const c = cloneState(s);
    applyMove(c,m);

    let category = 4;
    let score = 0;

    const movingValue = VAL[m.piece] || 0;
    const capturedValue = m.captured ? (VAL[m.captured] || 0) : 0;
    const see = simpleSEEAfterMove(s,m,color);
    const moveCount = (s.fullmoveNumber - 1) * 2 + (s.turn === 'black' ? 1 : 0);

    function isStartingSquare(piece, side, r, col){
        if(piece === 'n'){
            return side === 'white'
                ? (r === 7 && (col === 1 || col === 6))
                : (r === 0 && (col === 1 || col === 6));
        }
        if(piece === 'b'){
            return side === 'white'
                ? (r === 7 && (col === 2 || col === 5))
                : (r === 0 && (col === 2 || col === 5));
        }
        if(piece === 'r'){
            return side === 'white'
                ? (r === 7 && (col === 0 || col === 7))
                : (r === 0 && (col === 0 || col === 7));
        }
        if(piece === 'q'){
            return side === 'white' ? (r === 7 && col === 3) : (r === 0 && col === 3);
        }
        if(piece === 'k'){
            return side === 'white' ? (r === 7 && col === 4) : (r === 0 && col === 4);
        }
        return false;
    }

    function isMinorDevelopingMove(mv, side){
        if(mv.piece === 'n'){
            if(side === 'white'){
                if(mv.from.r === 7 && (mv.from.c === 1 || mv.from.c === 6) && mv.to.r <= 5) return true;
            } else {
                if(mv.from.r === 0 && (mv.from.c === 1 || mv.from.c === 6) && mv.to.r >= 2) return true;
            }
        }

        if(mv.piece === 'b'){
            if(side === 'white'){
                if(mv.from.r === 7 && (mv.from.c === 2 || mv.from.c === 5) && mv.to.r <= 6) return true;
            } else {
                if(mv.from.r === 0 && (mv.from.c === 2 || mv.from.c === 5) && mv.to.r >= 1) return true;
            }
        }

        return false;
    }

    function hangingOrBadTradeValue(pos, side){
        const foe = opponent(side);
        let worst = 0;

        for(let r=0;r<8;r++){
            for(let c=0;c<8;c++){
                const p = pos.board[r][c];
                if(!p || p.color !== side || p.type === 'k') continue;

                const attacked = isSquareAttacked(pos, r, c, foe);
                if(!attacked) continue;

                const defended = isSquareAttacked(pos, r, c, side);
                let local = 0;

                if(!defended){
                    local += (VAL[p.type] || 0);
                } else {
                    local += Math.round((VAL[p.type] || 0) * 0.35);
                }

                worst = Math.max(worst, local);
            }
        }

        return worst;
    }

    const beforeThreat = hangingOrBadTradeValue(s, color);
    const afterThreat = hangingOrBadTradeValue(c, color);

    if(m.captured){
        if(capturedValue >= movingValue){
            category = 1;
            score += 3000000 + capturedValue*800 - movingValue*120;
        } else {
            category = 2;
            score += 900000 + capturedValue*400 - movingValue*80;
        }

        if(m.captured === 'q') score += 2000000;
        else if(m.captured === 'r') score += 1200000;
        else if(m.captured === 'b' || m.captured === 'n') score += 700000;
        else score += 200000;

        score += Math.max(-5000, see) * 120;
    }

    if(m.flags && m.flags.castle){
        category = Math.min(category, 3);
        score += 300000;
    }

    if(m.promotion){
        category = 1;
        score += 3500000;
    }

    if(isMinorDevelopingMove(m, color)){
        category = Math.min(category, 3);
        score += 260000;
        if(moveCount <= 10) score += 120000;
    }

    if(moveCount <= 14){
        const returnsToStart =
            isStartingSquare(m.piece, color, m.to.r, m.to.c) &&
            !isStartingSquare(m.piece, color, m.from.r, m.from.c);

        if(returnsToStart){
            score -= 2600000;
            if(m.piece === 'n' || m.piece === 'b') score -= 900000;
            if(!m.captured) score -= 700000;
            if(!inCheck(s,color)) score -= 700000;
        }

        const repeatedPieceMove =
            !m.captured &&
            !m.promotion &&
            !isMinorDevelopingMove(m,color) &&
            (m.piece === 'n' || m.piece === 'b' || m.piece === 'q' || m.piece === 'r') &&
            !isStartingSquare(m.piece, color, m.from.r, m.from.c);

        if(repeatedPieceMove){
            score -= 420000;
            if(moveCount <= 10) score -= 180000;
        }

        if(m.piece === 'q' && !m.captured && moveCount <= 10){
            score -= 1200000;
        }

        if(m.piece === 'p'){
            const isWingPawn = (m.from.c === 0 || m.from.c === 1 || m.from.c === 6 || m.from.c === 7);
            const toCenter = (m.to.c === 3 || m.to.c === 4);
            const fromCenterPawn =
                (color === 'white' && m.from.r === 6 && (m.from.c === 3 || m.from.c === 4)) ||
                (color === 'black' && m.from.r === 1 && (m.from.c === 3 || m.from.c === 4));

            if(isWingPawn && !m.captured){
                score -= 260000;
                if(moveCount <= 8) score -= 140000;
            }

            if(toCenter) score += 140000;
            if(fromCenterPawn) score += 100000;
        }
    }

    const gate = rootSafetyGate(s,m,color);

    score += gate.net * 180;
    score -= (gate.nextThreat || 0) * 130;
    score -= (gate.chasedPenalty || 0) * 90;
    score -= (gate.tradePenalty || 0) * 160;
    score -= (gate.sacPenalty || 0) * 140;
    score -= (gate.selfLoose || 0) * 20;

    if(beforeThreat >= 300){
        if(afterThreat + 120 < beforeThreat){
            score += 700000;
            category = Math.min(category, 3);
        } else if(afterThreat > beforeThreat - 60){
            score -= 520000;
        }
    }

    score += antiScholarThreatBonus(s,m,color) * 100;

    const landed = c.board[m.to.r][m.to.c];
    if(landed){
        const attacked = isSquareAttacked(c,m.to.r,m.to.c,enemy);
        const defended = isSquareAttacked(c,m.to.r,m.to.c,color);

        if(attacked && !defended){
            if(landed.type === 'q') score -= 2500000;
            else if(landed.type === 'r') score -= 1500000;
            else if(landed.type === 'b' || landed.type === 'n') score -= 1200000;
            else score -= 180000;
        } else if(attacked && defended){
            score -= (VAL[landed.type] || 0) * 70;
        } else if(!attacked && defended){
            score += (VAL[landed.type] || 0) * 20;
        }
    }

    score += (evaluateFor(c,color) - evaluateFor(s,color)) * 2;

    if(m.piece === 'k' && !(m.flags && m.flags.castle)){
        score -= 4000000;
        if(isEarlyPhase(s)) score -= 3000000;
        if(!inCheck(s,color)) score -= 2000000;
    }

    return { category, score, gate };
}




function ttLookup(s,depth,alpha,beta){
    const entry=tt.get(stateKey(s));
    if(!entry||entry.depth<depth) return null;
    if(entry.flag==='EXACT') return entry.score;
    if(entry.flag==='LOWER'&&entry.score>=beta) return entry.score;
    if(entry.flag==='UPPER'&&entry.score<=alpha) return entry.score;
    return null;
}

function ttBestMove(s){
    const entry=tt.get(stateKey(s));
    return entry&&entry.bestMove?entry.bestMove:null;
}

function storeTT(s,depth,score,flag,bestMove){
    tt.set(stateKey(s),{depth,score,flag,bestMove});
}




function orderMoves(s,color,moves,ply,ttMove=null){
    const killers=killerMoves[ply]||[null,null];
    const hist=historyHeuristic[color];

    return moves
        .map(m=>{
            const info=classifyMovePriority(s,m,color);
            let ord=0;

            ord += (5-info.category)*10000000;
            ord += info.score;

            if(info.gate && !info.gate.safe) ord -= 900000000;

            if(ttMove&&sameMove(m,ttMove)) ord+=900000000;

            if(m.captured){
                const victim=VAL[m.captured]||0;
                const attacker=VAL[m.piece]||0;
                ord += victim*5000 - attacker*1200;
                ord += seeLikeScore(m)*200;
                if(victim>=900) ord += 500000;
                if(victim>=500 && attacker<900) ord += 180000;
            }

            if(m.promotion) ord+=1800000;
            if(killers[0]&&sameMove(m,killers[0])) ord+=900000;
            else if(killers[1]&&sameMove(m,killers[1])) ord+=700000;

            if(!m.captured){
                ord+=(hist.get(moveKey(m))||0);
            }

            ord += Math.random()*0.1;
            return {m,ord};
        })
        .sort((a,b)=>b.ord-a.ord)
        .map(x=>x.m);
}



function quiescence(s, alpha, beta, ply){
    const inChk = inCheck(s, s.turn);

    if(ply >= 10){
        return evaluate(s);
    }

    let stand = -INF;

    if(!inChk){
        stand = evaluate(s);

        if(stand >= beta) return beta;
        if(alpha < stand) alpha = stand;

        const deltaMargin = 975;
        if(stand < alpha - deltaMargin){
            return alpha;
        }
    }

    const legal = getLegalMoves(s, s.turn);

    function hangingValue(pos, color){
        let worst = 0;
        const enemy = opponent(color);

        for(let r=0;r<8;r++){
            for(let c=0;c<8;c++){
                const p = pos.board[r][c];
                if(!p || p.color !== color || p.type === 'k') continue;

                const attacked = isSquareAttacked(pos, r, c, enemy);
                const defended = isSquareAttacked(pos, r, c, color);

                if(attacked && !defended){
                    worst = Math.max(worst, VAL[p.type] || 0);
                }
            }
        }

        return worst;
    }

    const ownHanging = hangingValue(s, s.turn);

    let tactical = legal.filter(m=>{
        if(m.promotion) return true;

        const after = cloneState(s);
        applyMove(after, m);
        const givesCheck = inCheck(after, opponent(s.turn));

        if(inChk) return true;

        if(m.captured){
            const see = simpleSEEAfterMove(s, m, s.turn);

            if(see >= 0) return true;

            const victim = VAL[m.captured] || 0;
            const attacker = VAL[m.piece] || 0;

            if(givesCheck && see >= -140) return true;
            if(victim >= attacker && see >= -180) return true;

            return false;
        }

        if(givesCheck && ply <= 2){
            return true;
        }

        if(ownHanging >= 320){
            const beforeRisk = hangingValue(s, s.turn);
            const afterRisk = hangingValue(after, s.turn);

            const landed = after.board[m.to.r][m.to.c];
            const movedSafe = landed
                ? !isSquareAttacked(after, m.to.r, m.to.c, opponent(s.turn)) ||
                  isSquareAttacked(after, m.to.r, m.to.c, s.turn)
                : false;

            if(afterRisk + 100 < beforeRisk) return true;
            if((m.piece === 'q' || m.piece === 'r' || m.piece === 'b' || m.piece === 'n') && movedSafe){
                if(beforeRisk >= (VAL[m.piece] || 0)) return true;
            }
        }

        return false;
    });

    tactical = orderMoves(s, s.turn, tactical, ply, ttBestMove(s));

    for(const m of tactical){
        if(performance.now() >= searchDeadline){
            searchAborted = true;
            break;
        }

        const c = cloneState(s);
        applyMove(c, m);

        let score = -quiescence(c, -beta, -alpha, ply + 1);

        if(score >= beta) return beta;
        if(score > alpha) alpha = score;
    }

    if(inChk && tactical.length === 0){
        return -MATE + ply;
    }

    return alpha;
}



function addKiller(ply,m){
    if(m.captured) return;
    const arr=killerMoves[ply];
    if(arr[0]&&sameMove(arr[0],m)) return;
    arr[1]=arr[0];
    arr[0]=m;
}

function addHistory(color,m,depth){
    if(m.captured) return;
    const key=moveKey(m);
    const hist=historyHeuristic[color];
    hist.set(key,(hist.get(key)||0)+depth*depth*18);
}

function nullMoveAllowed(s,depth){
    if(depth<3) return false;
    if(inCheck(s,s.turn)) return false;
    let nonPawn=0;
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
        const p=s.board[r][c];
        if(p&&p.color===s.turn&&p.type!=='p'&&p.type!=='k') nonPawn++;
    }
    return nonPawn>0;
}

function makeNullMove(s){
    const c=cloneState(s);
    c.turn=opponent(c.turn);
    c.enPassant=null;
    c.halfmoveClock++;
    if(s.turn==='black') c.fullmoveNumber++;
    return c;
}



function negamax(s,depth,alpha,beta,ply){
    nodeCount++;

    if((nodeCount&1023)===0 && performance.now()>=searchDeadline){
        searchAborted=true;
        return 0;
    }

    const originalAlpha=alpha;

    const ttScore=ttLookup(s,depth,alpha,beta);
    if(ttScore!==null) return ttScore;

    if(depth<=0) return quiescence(s,alpha,beta,ply);

    const side=s.turn;
    const legalRaw=getLegalMoves(s,side);

    if(legalRaw.length===0){
        if(inCheck(s,side)) return -MATE+ply;
        return 0;
    }

    if(nullMoveAllowed(s,depth)){
        const ns=makeNullMove(s);
        const R=depth>=6 ? 3 : 2;
        const score=-negamax(ns,depth-1-R,-beta,-beta+1,ply+1);

        if(searchAborted) return 0;
        if(score>=beta) return beta;
    }

    const ttMove=ttBestMove(s);
    let legal=orderMoves(s,side,legalRaw,ply,ttMove);

    const inChk=inCheck(s,side);
    if(inChk){
        legal=legal.sort((a,b)=>{
            const ai = (a.captured?1:0) + (a.promotion?1:0);
            const bi = (b.captured?1:0) + (b.promotion?1:0);
            return bi-ai;
        });
    }

    let best=-INF;
    let bestMove=null;
    let moveIndex=0;

    for(const m of legal){
        if(performance.now()>=searchDeadline){
            searchAborted=true;
            return 0;
        }

        const c=cloneState(s);
        applyMove(c,m);

        const givesCheck=inCheck(c,c.turn);
        const info=classifyMovePriority(s,m,side);
        const forcingMove=info.category<=3 || m.captured || m.promotion || givesCheck || inCheck(c,c.turn);

        let score;

        if(moveIndex===0 || inChk || forcingMove || depth<=3){
            score=-negamax(c,depth-1,-beta,-alpha,ply+1);
        } else {
            const reduced=depth>=5 ? 2 : 1;
            score=-negamax(c,depth-1-reduced,-alpha-1,-alpha,ply+1);

            if(searchAborted) return 0;

            if(score>alpha && score<beta){
                score=-negamax(c,depth-1,-beta,-alpha,ply+1);
            }
        }

        if(searchAborted) return 0;

        if(score>best){
            best=score;
            bestMove=m;
        }

        if(score>alpha) alpha=score;

        if(alpha>=beta){
            addKiller(ply,m);
            addHistory(side,m,depth);
            storeTT(s,depth,beta,'LOWER',m);
            return beta;
        }

        moveIndex++;
    }

    let flag='EXACT';
    if(best<=originalAlpha) flag='UPPER';
    else if(best>=beta) flag='LOWER';

    storeTT(s,depth,best,flag,bestMove);
    return best;
}



function chooseAmongNearBest(scored, rootState){
    if(!scored || !scored.length) return null;

    const moveCount = (rootState.fullmoveNumber - 1) * 2 + (rootState.turn === 'black' ? 1 : 0);

    scored.sort((a,b)=>b.score-a.score);

    const enriched = scored.map(x=>{
        const info = classifyMovePriority(rootState, x.move, botColor);
        const safetyPenalty =
            typeof x.safetyPenalty === 'number'
                ? x.safetyPenalty
                : rootMoveSafetyPenalty(rootState, x.move, botColor);

        const gateUnsafe = !!(info.gate && !info.gate.safe);

        let utility = x.score;

        utility -= safetyPenalty * 0.10;

        if(gateUnsafe) utility -= 150;

        if(info.gate){
            utility += (info.gate.net || 0) * 4;
            utility -= (info.gate.nextThreat || 0) * 2;
            utility -= (info.gate.tradePenalty || 0) * 2;
            utility -= (info.gate.sacPenalty || 0) * 2;
            utility -= (info.gate.selfLoose || 0) * 0.15;
        }

        return {
            move: x.move,
            score: x.score,
            safetyPenalty,
            gateUnsafe,
            utility
        };
    });

    enriched.sort((a,b)=>{
        if(b.utility !== a.utility) return b.utility - a.utility;
        if(a.safetyPenalty !== b.safetyPenalty) return a.safetyPenalty - b.safetyPenalty;
        return b.score - a.score;
    });

    const leader = enriched[0];
    const second = enriched[1] || null;

    if(!second){
        return leader.move;
    }

    const utilityGap = leader.utility - second.utility;
    const scoreGap = leader.score - second.score;

    if(moveCount <= 10){
        return leader.move;
    }

    if(moveCount <= 20){
        if(utilityGap >= 10 || scoreGap >= 10){
            return leader.move;
        }

        const pool = enriched.filter(x =>
            !x.gateUnsafe &&
            x.utility >= leader.utility - 5 &&
            x.score >= leader.score - 5 &&
            x.safetyPenalty <= leader.safetyPenalty + 120
        );

        if(pool.length <= 1){
            return leader.move;
        }

        const weighted = pool.map((x,i)=>{
            const uGap = Math.max(0, leader.utility - x.utility);
            const sGap = Math.max(0, leader.score - x.score);

            let weight = 100;
            weight -= uGap * 10;
            weight -= sGap * 9;
            weight -= i * 10;

            weight = Math.max(1, Math.round(weight));
            return { move:x.move, weight };
        });

        weighted.sort((a,b)=>b.weight-a.weight);

        if(weighted.length >= 2 && (weighted[0].weight - weighted[1].weight >= 20)){
            return weighted[0].move;
        }

        let total = weighted.reduce((a,b)=>a+b.weight,0);
        let rnd = Math.random() * total;

        for(const item of weighted){
            rnd -= item.weight;
            if(rnd <= 0) return item.move;
        }

        return weighted[0].move;
    }

    if(utilityGap >= 22 || scoreGap >= 18){
        return leader.move;
    }

    const pool = enriched.filter(x =>
        x.utility >= leader.utility - 12 &&
        x.score >= leader.score - 10
    );

    if(pool.length <= 1){
        return leader.move;
    }

    const weighted = pool.map((x,i)=>{
        const uGap = Math.max(0, leader.utility - x.utility);
        const sGap = Math.max(0, leader.score - x.score);
        const pGap = Math.max(0, x.safetyPenalty - leader.safetyPenalty);

        let weight = 100;
        weight -= uGap * 5;
        weight -= sGap * 4;
        weight -= pGap * 0.03;
        weight -= i * 8;

        if(x.gateUnsafe) weight = Math.min(weight, 20);
        if(x.safetyPenalty >= 1400) weight = Math.min(weight, 25);

        weight = Math.max(1, Math.round(weight));
        return { move:x.move, weight };
    });

    weighted.sort((a,b)=>b.weight-a.weight);

    if(weighted.length >= 2 && (weighted[0].weight - weighted[1].weight >= 30)){
        return weighted[0].move;
    }

    let total = weighted.reduce((a,b)=>a+b.weight,0);
    let rnd = Math.random() * total;

    for(const item of weighted){
        rnd -= item.weight;
        if(rnd <= 0) return item.move;
    }

    return weighted[0].move;
}




function filterRootMovesBySafety(root, moves, color){
    if(!moves || !moves.length) return [];

    const enemy = opponent(color);
    const moveCount = (root.fullmoveNumber - 1) * 2 + (root.turn === 'black' ? 1 : 0);

    function isStartingSquare(piece, side, r, c){
        if(piece === 'n'){
            return side === 'white'
                ? (r === 7 && (c === 1 || c === 6))
                : (r === 0 && (c === 1 || c === 6));
        }
        if(piece === 'b'){
            return side === 'white'
                ? (r === 7 && (c === 2 || c === 5))
                : (r === 0 && (c === 2 || c === 5));
        }
        if(piece === 'r'){
            return side === 'white'
                ? (r === 7 && (c === 0 || c === 7))
                : (r === 0 && (c === 0 || c === 7));
        }
        if(piece === 'q'){
            return side === 'white'
                ? (r === 7 && c === 3)
                : (r === 0 && c === 3);
        }
        if(piece === 'k'){
            return side === 'white'
                ? (r === 7 && c === 4)
                : (r === 0 && c === 4);
        }
        return false;
    }

    function isMinorDevelopingMove(m, side){
        if(m.piece === 'n'){
            if(side === 'white'){
                if(m.from.r === 7 && (m.from.c === 1 || m.from.c === 6) && m.to.r <= 5) return true;
            } else {
                if(m.from.r === 0 && (m.from.c === 1 || m.from.c === 6) && m.to.r >= 2) return true;
            }
        }

        if(m.piece === 'b'){
            if(side === 'white'){
                if(m.from.r === 7 && (m.from.c === 2 || m.from.c === 5) && m.to.r <= 6) return true;
            } else {
                if(m.from.r === 0 && (m.from.c === 2 || m.from.c === 5) && m.to.r >= 1) return true;
            }
        }

        return false;
    }

    const scored = moves.map(m=>{
        const gate = rootSafetyGate(root, m, color);
        const penalty = rootMoveSafetyPenalty(root, m, color);

        const c = cloneState(root);
        applyMove(c, m);

        const evalDelta = evaluateFor(c, color) - evaluateFor(root, color);

        let priority = 0;

        priority += evalDelta * 9;
        priority += (gate.net || 0) * 9;
        priority -= Math.floor((penalty || 0) * 0.16);

        if(gate.safe) priority += 600;
        else priority -= 600;

        if(m.captured){
            const victim = VAL[m.captured] || 0;
            const attacker = VAL[m.piece] || 0;
            const see = typeof gate.see === 'number' ? gate.see : 0;

            priority += victim * 18 - attacker * 4;
            priority += Math.max(-250, see) * 4;

            if(m.captured === 'q') priority += 9000;
            else if(m.captured === 'r') priority += 4200;
            else if(m.captured === 'b' || m.captured === 'n') priority += 2200;
            else priority += 600;
        }

        if(m.promotion){
            priority += 14000;
        }

        if(m.flags && m.flags.castle){
            priority += 2600;
        }

        if(m.piece === 'k' && !(m.flags && m.flags.castle)){
            priority -= 18000;
            if(!inCheck(root, color)) priority -= 8000;
            if(moveCount <= 16) priority -= 4000;
        }

        if(m.piece === 'q' && !m.captured && moveCount <= 10){
            priority -= 2600;
        }

        if(m.piece === 'p'){
            const isWingPawn = (m.from.c === 0 || m.from.c === 1 || m.from.c === 6 || m.from.c === 7);
            const isCenterPawn = (m.from.c === 3 || m.from.c === 4);
            const toCenter = (m.to.c === 3 || m.to.c === 4);

            if(isWingPawn && !m.captured && !m.promotion){
                priority -= 260;
                if(moveCount <= 8) priority -= 220;
                if(m.to.c === 0 || m.to.c === 7) priority -= 160;
                if(m.to.c === 1 || m.to.c === 6) priority -= 120;
                if(m.to.c === 5 || m.to.c === 2) priority -= 80;
            }

            if(isCenterPawn && toCenter) priority += 240;
            if(toCenter) priority += 90;

            if((color === 'white' && m.from.r === 6 && (m.from.c === 3 || m.from.c === 4)) ||
               (color === 'black' && m.from.r === 1 && (m.from.c === 3 || m.from.c === 4))){
                priority += 180;
            }
        }

        if(isMinorDevelopingMove(m, color)){
            priority += 380;
            if(moveCount <= 10) priority += 120;
        }

        if(m.piece === 'n'){
            const goodDev =
                (color === 'white' && m.to.r <= 5) ||
                (color === 'black' && m.to.r >= 2);
            if(goodDev) priority += 120;

            if(moveCount <= 8 && (m.to.c === 0 || m.to.c === 7)){
                priority -= 260;
            }
        }

        if(m.piece === 'b'){
            priority += 100;
        }

        if(moveCount <= 14){
            const returnsToStart = isStartingSquare(m.piece, color, m.to.r, m.to.c) &&
                                   !isStartingSquare(m.piece, color, m.from.r, m.from.c);

            if(returnsToStart){
                priority -= 2200;

                if(m.piece === 'n' || m.piece === 'b') priority -= 900;
                if(!m.captured) priority -= 900;
                if(!inCheck(root, color)) priority -= 700;
            }

            const samePieceMovedAgain =
                !m.captured &&
                !m.promotion &&
                !isMinorDevelopingMove(m, color) &&
                ((m.piece === 'n' || m.piece === 'b' || m.piece === 'q' || m.piece === 'r'));

            if(samePieceMovedAgain){
                if(!isStartingSquare(m.piece, color, m.from.r, m.from.c)){
                    priority -= 420;
                    if(moveCount <= 10) priority -= 220;
                }
            }
        }

        const landed = c.board[m.to.r][m.to.c];
        if(landed && landed.color === color){
            const attacked = isSquareAttacked(c, m.to.r, m.to.c, enemy);
            const defended = isSquareAttacked(c, m.to.r, m.to.c, color);
            const v = VAL[landed.type] || 0;

            if(attacked && !defended){
                priority -= v * 14;
            } else if(attacked && defended){
                priority -= v * 4;
            } else if(!attacked && defended){
                priority += v * 2;
            }
        }

        if(gate.selfLoose >= 900) priority -= 9000;
        else if(gate.selfLoose >= 500) priority -= 3200;
        else if(gate.selfLoose >= 320) priority -= 1000;

        if(gate.tradePenalty) priority -= gate.tradePenalty * 4;
        if(gate.sacPenalty) priority -= gate.sacPenalty * 3;

        if(moveCount <= 12){
            const ownKing = findKing(c, color);
            const enemyKing = findKing(c, enemy);

            if(ownKing && isSquareAttacked(c, ownKing.r, ownKing.c, enemy)){
                priority -= 1400;
            }

            if(enemyKing && isSquareAttacked(c, enemyKing.r, enemyKing.c, color)){
                priority += 250;
            }
        }

        return {
            move: m,
            gate,
            penalty,
            priority,
            safe: !!gate.safe
        };
    });

    const safe = scored
        .filter(x => x.safe)
        .sort((a,b)=>{
            if(b.priority !== a.priority) return b.priority - a.priority;
            if((a.penalty || 0) !== (b.penalty || 0)) return (a.penalty || 0) - (b.penalty || 0);
            return 0;
        })
        .map(x => x.move);

    if(safe.length){
        return safe;
    }

    return scored
        .sort((a,b)=>{
            if(b.priority !== a.priority) return b.priority - a.priority;
            if((a.penalty || 0) !== (b.penalty || 0)) return (a.penalty || 0) - (b.penalty || 0);
            return 0;
        })
        .map(x => x.move);
}



function cleanSAN(s){
    return (s||'').replace(/[+#?!]/g,'').trim();
}





function weightedBookChoice(entries){
    const filtered=entries.filter(x=>x.w>0);
    if(!filtered.length) return null;
    const total=filtered.reduce((a,b)=>a+b.w,0);
    let rnd=Math.random()*total;
    for(const e of filtered){
        rnd-=e.w;
        if(rnd<=0) return e.move;
    }
    return filtered[0].move;
}

function tryBookMove(state,color){
    const ply=(state.fullmoveNumber-1)*2+(state.turn==='black'?1:0);

    const key=currentBookKey();
    const entries=OPENING_BOOK[key];

    console.log('=== TRY BOOK MOVE ===');
    console.log('PLY =', ply);
    console.log('TURN =', state.turn, '| COLOR =', color);
    console.log('BOOK HISTORY =', JSON.stringify(bookHistory));
    console.log('BOOK KEY =', JSON.stringify(key));
    console.log('BOOK ENTRIES =', entries);

    if(ply>20){
        console.log('BOOK EXIT: ply > 20');
        return null;
    }

    if(!entries || !entries.length){
        console.log('BOOK EXIT: no entries for key');
        return null;
    }

    const legal=getLegalMoves(state,color);
    const legalCoords=legal.map(coordMoveText);

    console.log('LEGAL MOVES COUNT =', legal.length);
    console.log('LEGAL MOVES =', legalCoords);

    if(!legal.length){
        console.log('BOOK EXIT: no legal moves');
        return null;
    }

    const enemy=opponent(color);
    const candidates=[];

    for(const entry of entries){
        const target=(entry.move||'').trim().toLowerCase();
        if(!target){
            console.log('SKIP ENTRY: empty move', entry);
            continue;
        }

        console.log('CHECK ENTRY =', entry, '| TARGET =', target);

        let matchedAny=false;

        for(const m of legal){
            const coord=coordMoveText(m);

            if(coord!==target) continue;

            matchedAny=true;
            console.log('MATCHED LEGAL MOVE =', coord, m);

            const after=cloneState(state);
            applyMove(after,m);

            let score=0;
            score += (entry.w||1) * 1000;

            const evalGain=evaluateFor(after,color)-evaluateFor(state,color);
            score += evalGain * 8;

            if(m.flags.castle) score += 9000;
            if(m.promotion) score += 12000;

            if(m.piece==='k' && !m.flags.castle) score -= 20000;
            if(m.piece==='q' && !m.captured && ply<=12) score -= 5000;

            if(m.piece==='p'){
                const centralPawn =
                    (color==='white' && m.from.r===6 && (m.from.c===3||m.from.c===4)) ||
                    (color==='black' && m.from.r===1 && (m.from.c===3||m.from.c===4));
                if(centralPawn) score += 2200;

                const wingPawn = (m.from.c===0 || m.from.c===7 || m.from.c===5 || m.from.c===6);
                if(wingPawn && !m.captured && ply<=10) score -= 2600;
            }

            if(m.piece==='n'){
                if(color==='white'){
                    if(m.to.r===5 && (m.to.c===2 || m.to.c===5)) score += 3200;
                    if(m.to.r===5 && (m.to.c===0 || m.to.c===7)) score -= 4200;
                } else {
                    if(m.to.r===2 && (m.to.c===2 || m.to.c===5)) score += 3200;
                    if(m.to.r===2 && (m.to.c===0 || m.to.c===7)) score -= 4200;
                }
            }

            if(m.piece==='b'){
                if(color==='white' && m.to.r<7) score += 1200;
                if(color==='black' && m.to.r>0) score += 1200;
            }

            const landed=after.board[m.to.r][m.to.c];
            const attacked=landed ? isSquareAttacked(after,m.to.r,m.to.c,enemy) : false;
            const defended=landed ? isSquareAttacked(after,m.to.r,m.to.c,color) : false;

            if(attacked && !defended){
                if(landed && landed.type==='q') score -= 20000;
                else if(landed && landed.type==='r') score -= 12000;
                else if(landed && (landed.type==='b'||landed.type==='n')) score -= 9000;
                else score -= 1500;
            } else if(attacked && defended){
                score -= landed ? VAL[landed.type]*12 : 0;
            } else if(!attacked && defended){
                score += landed ? VAL[landed.type]*6 : 0;
            }

            if(inCheck(after,enemy)) score += 900;

            const moveCount=(after.fullmoveNumber-1)*2+(after.turn==='black'?1:0);
            if(moveCount<=14){
                score += openingPrincipleBonus(after,color) * 10;
                score -= openingPrincipleBonus(after,enemy) * 8;
                score += kingSafety(after,color) * 8;
                score -= kingSafety(after,enemy) * 6;
            }

            candidates.push({
                move:m,
                coord,
                score,
                weight:Math.max(1,entry.w||1)
            });

            console.log('CANDIDATE ADDED =', {
                coord,
                score,
                weight:Math.max(1,entry.w||1)
            });
        }

        if(!matchedAny){
            console.log('NO LEGAL MATCH FOR ENTRY TARGET =', target);
        }
    }

    console.log('CANDIDATES =', candidates.map(x=>({
        coord:x.coord,
        score:x.score,
        weight:x.weight
    })));

    if(!candidates.length){
        console.log('BOOK EXIT: no candidates matched');
        return null;
    }

    candidates.sort((a,b)=>b.score-a.score);

    const bestScore=candidates[0].score;
    const topPool=candidates.filter(x=>x.score>=bestScore-1800);

    console.log('BEST SCORE =', bestScore);
    console.log('TOP POOL =', topPool.map(x=>({
        coord:x.coord,
        score:x.score,
        weight:x.weight
    })));

    const weighted=topPool.map(x=>{
        const closeness=Math.max(1,Math.round((bestScore-x.score)/60));
        const bonus=Math.max(1,30-closeness);
        return {
            move:x.move,
            coord:x.coord,
            w:x.weight*10 + bonus
        };
    });

    console.log('WEIGHTED =', weighted.map(x=>({
        coord:x.coord,
        w:x.w
    })));

    let total=weighted.reduce((a,b)=>a+b.w,0);
    let rnd=Math.random()*total;

    for(const item of weighted){
        rnd-=item.w;
        if(rnd<=0){
            console.log('BOOK CHOICE =', item.coord);
            console.log('=== END TRY BOOK MOVE ===');
            return item.move;
        }
    }

    console.log('BOOK CHOICE FALLBACK =', weighted[0].coord);
    console.log('=== END TRY BOOK MOVE ===');
    return weighted[0].move;
}




function botMove(){
    if(turn!==botColor) return;

    searchDeadline = performance.now() + BOT_THINK_MS;
    searchAborted = false;
    nodeCount = 0;
    tt.clear();

    const root = cloneState(getState());

    const bookMove = tryBookMove(root, botColor);
    const dbgKey = currentBookKey();

    if(bookMove){
        document.getElementById('engineInfo').innerText =
            `Book ${dbgKey || '(start)'} -> ${coordMoveText(bookMove)}`;
        makeRealMove(bookMove, false);
        return;
    } else {
        document.getElementById('engineInfo').innerText =
            `No book ${dbgKey || '(start)'}`;
    }

    const maxDepth = parseInt(document.getElementById('difficulty').value, 10) + 6;

    let bestMove = null;
    let bestScore = -INF;
    let previousScore = 0;
    let lastCompletedBestMove = null;
    let lastCompletedBestScore = -INF;

    let rootMoves = getLegalMoves(root, botColor);
    if(!rootMoves.length) return;

    rootMoves = filterRootMovesBySafety(root, rootMoves, botColor);
    rootMoves = orderMoves(root, botColor, rootMoves, 0, ttBestMove(root));

    if(!rootMoves.length) return;

    for(let depth=1; depth<=maxDepth; depth++){
        if(performance.now() >= searchDeadline) break;

        let window = depth>=4 ? 30 : (depth>=2 ? 50 : INF);
        let alpha = window===INF ? -INF : previousScore - window;
        let beta  = window===INF ?  INF : previousScore + window;

        let completedThisDepth = false;
        let scored = [];

        while(true){
            if(performance.now() >= searchDeadline){
                searchAborted = true;
                break;
            }

            const ttMove = ttBestMove(root);
            let moves = rootMoves.slice();

            if(ttMove){
                moves = orderMoves(root, botColor, moves, 0, ttMove);
            }

            scored = [];
            let localAlpha = alpha;
            let moveIndex = 0;

            for(const m of moves){
                if(performance.now() >= searchDeadline){
                    searchAborted = true;
                    break;
                }

                const gate = rootSafetyGate(root, m, botColor);
                const safetyPenalty = rootMoveSafetyPenalty(root, m, botColor);

                const c = cloneState(root);
                applyMove(c, m);

                let score;

                if(moveIndex===0){
                    score = -negamax(c, depth-1, -beta, -localAlpha, 1);
                } else {
                    score = -negamax(c, depth-1, -localAlpha-1, -localAlpha, 1);

                    if(searchAborted) break;

                    if(score > localAlpha && score < beta){
                        score = -negamax(c, depth-1, -beta, -localAlpha, 1);
                    }
                }

                if(searchAborted) break;

                score -= Math.floor(safetyPenalty * 0.12);

                if(gate && !gate.safe){
                    score -= 120;
                }

                if(m.captured){
                    const victim = VAL[m.captured] || 0;
                    const attacker = VAL[m.piece] || 0;
                    score += victim * 6 - attacker * 2;

                    if(m.captured === 'q') score += 1800;
                    else if(m.captured === 'r') score += 900;
                    else if(m.captured === 'b' || m.captured === 'n') score += 450;
                }

                if(m.piece === 'k' && !(m.flags && m.flags.castle)){
                    score -= 3500;
                    if(isEarlyPhase(root)) score -= 2500;
                }

                scored.push({
                    move: m,
                    score,
                    safetyPenalty
                });

                if(score > localAlpha) localAlpha = score;
                moveIndex++;
            }

            if(searchAborted) break;
            if(!scored.length) break;

            scored.sort((a,b)=>b.score-a.score);
            const top = scored[0].score;

            if(window!==INF && top<=alpha){
                alpha -= window * 2;
                window *= 2;
                continue;
            }

            if(window!==INF && top>=beta){
                beta += window * 2;
                window *= 2;
                continue;
            }

            bestScore = top;
            bestMove = chooseAmongNearBest(scored, root);
            previousScore = top;

            if(!bestMove && scored.length){
                bestMove = scored[0].move;
            }

            lastCompletedBestMove = bestMove;
            lastCompletedBestScore = bestScore;
            completedThisDepth = true;

            rootMoves = scored.map(x=>x.move);

            const chosen = scored.find(x=>sameMove(x.move,bestMove));
            const bestPenalty = chosen ? chosen.safetyPenalty : 0;

            document.getElementById('engineInfo').innerText =
                `No book ${dbgKey || '(start)'} | Depth ${depth} | Eval ${(bestScore/100).toFixed(2)} | Safe ${bestPenalty} | Nodes ${nodeCount}`;

            break;
        }

        if(searchAborted) break;
        if(!completedThisDepth) break;
    }

    if(!bestMove && lastCompletedBestMove){
        bestMove = lastCompletedBestMove;
        bestScore = lastCompletedBestScore;
    }

    if(!bestMove){
        let fallback = getLegalMoves(root, botColor);
        fallback = orderMoves(root, botColor, fallback, 0, ttBestMove(root));
        if(!fallback.length) return;

        fallback = fallback.map(m=>({
            move: m,
            cost: rootMoveSafetyPenalty(root, m, botColor)
        })).sort((a,b)=>a.cost-b.cost);

        bestMove = fallback[0].move;
    }

    makeRealMove(bestMove, false);
}
