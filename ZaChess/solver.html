<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZaChess Puzzle Studio</title>
<style>
body{margin:0;background:radial-gradient(circle at top,#1a1f24 0,#111417 55%,#0c0f12 100%);font-family:Inter,Arial,sans-serif;color:#f2f2f2;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px 0}
#game{width:100%;display:flex;flex-direction:column;align-items:center}
#topbar{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;justify-content:center;align-items:center}

#whiteTray .trayPiece {
  background: #8f7150;
  border: 1px solid rgba(0,0,0,0.2);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
}

#blackTray .trayPiece {
  background: #e9ddb8;
  border: 1px solid rgba(0,0,0,0.2);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.15);
}

#fenControls {
  margin-top: 10px;
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

#fenOutput{
  width:min(92vw,92vh);
  max-width:920px;
  margin-top:10px;
  padding:10px 12px;
  box-sizing:border-box;
  background:rgba(15,18,22,.88);
  border:1px solid rgba(255,255,255,.14);
  border-radius:10px;
  font-size:14px;
  line-height:1.45;
  white-space:pre-wrap;
  word-break:break-word;
  color:#dfe9f5;
  box-shadow:0 10px 24px rgba(0,0,0,.22)
}

button,select{padding:10px 18px;font-size:16px;cursor:pointer;border:1px solid rgba(255,255,255,0.14);border-radius:10px;background:linear-gradient(180deg,#2f7fc2 0,#2268a6 100%);color:white;box-shadow:0 8px 18px rgba(0,0,0,0.22);transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}
button:hover,select:hover{filter:brightness(1.05);box-shadow:0 10px 22px rgba(0,0,0,0.28)} button:active{transform:translateY(1px)}
#boardWrap{position:relative;width:min(92vw,92vh);height:min(92vw,92vh);max-width:920px;max-height:920px;margin-bottom:10px;flex:0 0 auto}
#board{display:grid;width:100%;height:100%;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:5px solid rgba(255,255,255,0.88);box-sizing:border-box;border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,0.35),0 2px 6px rgba(0,0,0,0.25)}
.cell{display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-width:0;min-height:0}
.whiteCell{background:#e9ddb8}.blackCell{background:#8f7150}.dropTarget{outline:3px solid #7CFF6B;outline-offset:-3px}.selected{outline:4px solid #ffd54d;outline-offset:-4px;box-shadow:inset 0 0 0 2px rgba(0,0,0,0.12)}
.coord-file,.coord-rank{position:absolute;color:rgba(255,255,255,0.96);font-size:clamp(10px,1.8vw,14px);font-weight:700;pointer-events:none;z-index:4;text-shadow:0 1px 2px rgba(0,0,0,0.9);letter-spacing:0.02em}
.coord-file{bottom:4px;right:5px}.coord-rank{top:4px;left:5px}
.piece{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,4.8vw,56px);position:relative;transition:transform .15s ease,filter .15s ease;user-select:none;z-index:2;transform:translateY(-1px);cursor:grab}
.piece:active{cursor:grabbing}.piece:hover{transform:translateY(-1px) scale(1.03)}
.whitePiece{color:#fffdf8;text-shadow:0 1px 0 rgba(96,68,30,.88),0 2px 0 rgba(70,48,22,.82),0 3px 0 rgba(42,28,14,.68),0 4px 6px rgba(0,0,0,.46),0 1px 2px rgba(0,0,0,.55),1px 0 1px rgba(0,0,0,.34),-1px 0 1px rgba(0,0,0,.34),0 0 2px rgba(0,0,0,.5),0 0 8px rgba(255,255,255,.14);filter:brightness(1.08) contrast(1.08) drop-shadow(0 2px 2px rgba(0,0,0,.30)) drop-shadow(0 4px 7px rgba(0,0,0,.22)) drop-shadow(0 0 2px rgba(255,255,255,.10))}
.blackPiece{color:#181818;text-shadow:0 1px 0 rgba(255,255,255,.22),0 0 1px rgba(255,255,255,.28),0 0 3px rgba(255,255,255,.18),0 2px 4px rgba(0,0,0,.42),0 4px 6px rgba(0,0,0,.22);filter:brightness(1.02) contrast(1.08) drop-shadow(0 0 2px rgba(255,255,255,.20)) drop-shadow(0 0 5px rgba(255,255,255,.10)) drop-shadow(0 2px 2px rgba(0,0,0,.18))}
#status{margin-top:8px;font-size:18px;text-align:center;color:#f4f4f4}
#engineInfo{font-size:18px;padding:6px;color:#f0f0f0;min-height:1.6em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#moveLog{margin-top:8px;width:min(92vw,92vh);max-width:920px;min-height:120px;max-height:220px;overflow-y:auto;background:rgba(15,18,22,.88);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 12px;box-sizing:border-box;font-size:16px;line-height:1.5;white-space:pre-wrap;box-shadow:0 10px 24px rgba(0,0,0,.22)}
#trayArea{width:min(92vw,92vh);max-width:920px;margin-top:6px;display:grid;gap:10px}
.trayBlock{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 10px 8px}
.trayTitle{font-size:14px;font-weight:700;color:#dce7f3;margin-bottom:8px;text-align:center}
.trayRow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.trayPiece{width:44px;height:44px;border-radius:10px;border:1px dashed rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.03);cursor:grab;user-select:none}
.trayPiece .piece{width:auto;height:auto;font-size:28px;cursor:grab}
.smallNote{font-size:12px;color:rgba(255,255,255,.72);text-align:center;margin-top:2px}
@media (max-width:640px){button,select{padding:9px 12px;font-size:14px}#status,#engineInfo{font-size:16px}#moveLog{font-size:14px}}
</style>
</head>
<body>
<div id="game">
  <div id="topbar">
    <button id="clearBtn" type="button">Clear Board</button>
    <button id="solveBtn" type="button">Solve Puzzle</button>
    <select id="orientationSel">
      <option value="white">White at bottom</option>
      <option value="black">Black at bottom</option>
    </select>
  </div>

  <div id="boardWrap"><div id="board"></div></div>

  <div class="smallNote">Drag pieces onto the board. Click a piece on the board to remove it.</div>

  <div id="trayArea">
    <div class="trayBlock"><div class="trayRow" id="whiteTray"></div></div>
    <div class="trayBlock"><div class="trayRow" id="blackTray"></div></div>
  </div>

  <div id="fenControls">
    <button id="copyFenBtn" type="button">Copy FEN position</button>
    <button id="pasteFenBtn" type="button">Paste FEN position</button>
  </div>

  <div id="fenOutput">FEN: </div>
  <div id="engineInfo">Engine idle</div>
  <div id="status">Ready.</div>
  <div id="moveLog">Build the position and press Solve Puzzle.</div>
</div>


<script>
const PIECES = {
  wp: '♙', wn: '♘', wb: '♗', wr: '♖', wq: '♕', wk: '♔',
  bp: '♟', bn: '♞', bb: '♝', br: '♜', bq: '♛', bk: '♚'
};


const VAL = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 0 };

const PST = {
  p: [
     0, 0, 0, 0, 0, 0, 0, 0,
    50,50,50,50,50,50,50,50,
    10,10,20,30,30,20,10,10,
     5, 5,10,25,25,10, 5, 5,
     0, 0, 0,20,20, 0, 0, 0,
     5,-5,-10,0,0,-10,-5,5,
     5,10,10,-20,-20,10,10,5,
     0, 0, 0, 0, 0, 0, 0, 0
  ],
  n: [
    -50,-40,-30,-30,-30,-30,-40,-50,
    -40,-20,  0,  0,  0,  0,-20,-40,
    -30,  0, 10, 15, 15, 10,  0,-30,
    -30,  5, 15, 20, 20, 15,  5,-30,
    -30,  0, 15, 20, 20, 15,  0,-30,
    -30,  5, 10, 15, 15, 10,  5,-30,
    -40,-20,  0,  5,  5,  0,-20,-40,
    -50,-40,-30,-30,-30,-30,-40,-50
  ],
  b: [
    -20,-10,-10,-10,-10,-10,-10,-20,
    -10,  5,  0,  0,  0,  0,  5,-10,
    -10, 10, 10, 10, 10, 10, 10,-10,
    -10,  0, 10, 10, 10, 10,  0,-10,
    -10,  5,  5, 10, 10,  5,  5,-10,
    -10,  0,  5, 10, 10,  5,  0,-10,
    -10,  0,  0,  0,  0,  0,  0,-10,
    -20,-10,-10,-10,-10,-10,-10,-20
  ],
  r: [
     0, 0, 0, 5, 5, 0, 0, 0,
    -5, 0, 0, 0, 0, 0, 0,-5,
    -5, 0, 0, 0, 0, 0, 0,-5,
    -5, 0, 0, 0, 0, 0, 0,-5,
    -5, 0, 0, 0, 0, 0, 0,-5,
    -5, 0, 0, 0, 0, 0, 0,-5,
     5,10,10,10,10,10,10, 5,
     0, 0, 0, 0, 0, 0, 0, 0
  ],
  q: [
    -20,-10,-10,-5,-5,-10,-10,-20,
    -10,  0,  0, 0, 0, 0,  0,-10,
    -10,  0,  5, 5, 5, 5,  0,-10,
     -5,  0,  5, 5, 5, 5,  0, -5,
      0,  0,  5, 5, 5, 5,  0, -5,
    -10,  5,  5, 5, 5, 5,  0,-10,
    -10,  0,  5, 0, 0, 0,  0,-10,
    -20,-10,-10,-5,-5,-10,-10,-20
  ],
  km: [
    -30,-40,-40,-50,-50,-40,-40,-30,
    -30,-40,-40,-50,-50,-40,-40,-30,
    -30,-40,-40,-50,-50,-40,-40,-30,
    -30,-40,-40,-50,-50,-40,-40,-30,
    -20,-30,-30,-40,-40,-30,-30,-20,
    -10,-20,-20,-20,-20,-20,-20,-10,
     20, 20,  0,  0,  0,  0, 20, 20,
     20, 30, 10,  0,  0, 10, 30, 20
  ],
  ke: [
    -50,-40,-30,-20,-20,-30,-40,-50,
    -30,-20,-10,  0,  0,-10,-20,-30,
    -30,-10, 20, 30, 30, 20,-10,-30,
    -30,-10, 30, 40, 40, 30,-10,-30,
    -30,-10, 30, 40, 40, 30,-10,-30,
    -30,-10, 20, 30, 30, 20,-10,-30,
    -30,-30,  0,  0,  0,  0,-30,-30,
    -50,-30,-30,-30,-30,-30,-30,-50
  ]
};

const INF = 1000000000;
const MATE = 10000000;
const BOT_THINK_MS = 30000;

const OPENING_BOOK = {};


const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('moveLog');
const engineInfoEl = document.getElementById('engineInfo');
const orientationSel = document.getElementById('orientationSel');
const whiteTray = document.getElementById('whiteTray');
const blackTray = document.getElementById('blackTray');
const copyFenBtn = document.getElementById('copyFenBtn');
const pasteFenBtn = document.getElementById('pasteFenBtn');
const fenOutput = document.getElementById('fenOutput');


const solveBtn = document.getElementById('solveBtn');
const clearBtn = document.getElementById('clearBtn');





let board = Array.from({length:8},()=>Array(8).fill(null));

let currentTurn = 'w';  // 'w' или 'b'

let selected = null;
let dragPiece = null;
let dragSource = null;
let moveList = [];

function setStatus(t){ statusEl.textContent = t; }
function alg(r,c){ return 'abcdefgh'[c] + (8-r); }



function boardToFen() {
  let rows = [];
  for (let r = 0; r < 8; r++) {
    let s = '', e = 0;
    for (let c = 0; c < 8; c++) {
      const p = board[r][c];
      if (!p) e++;
      else {
        if (e) { s += e; e = 0; }
        s += p.color === 'w' ? p.type.toUpperCase() : p.type;
      }
    }
    if (e) s += e;
    rows.push(s);
  }
  return rows.join('/') + ' ' + currentTurn + ' - - 0 1';
}



function updateFenDisplay(){
  fenOutput.textContent = 'FEN: ' + boardToFen();
}

function showToast(text){
  let el = document.getElementById('copyToast');
  if(!el){
    el = document.createElement('div');
    el.id = 'copyToast';
    el.style.position = 'fixed';
    el.style.left = '50%';
    el.style.bottom = '18px';
    el.style.transform = 'translateX(-50%)';
    el.style.padding = '10px 14px';
    el.style.borderRadius = '10px';
    el.style.background = 'rgba(20,24,30,0.96)';
    el.style.color = '#fff';
    el.style.border = '1px solid rgba(255,255,255,0.16)';
    el.style.boxShadow = '0 10px 30px rgba(0,0,0,0.35)';
    el.style.zIndex = '99999';
    el.style.fontSize = '14px';
    el.style.pointerEvents = 'none';
    el.style.transition = 'opacity .18s ease';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.style.opacity = '1';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { el.style.opacity = '0'; }, 1200);
}

function fallbackCopyTextToClipboard(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  ta.style.top = '0';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  let ok = false;
  try{
    ok = document.execCommand('copy');
  }catch(e){
    ok = false;
  }
  document.body.removeChild(ta);
  return ok;
}

async function copyFenToClipboard(ev){
  if(ev) ev.preventDefault();
  const fen = boardToFen();

  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(fen);
      setStatus('FEN copied to clipboard.');
      showToast('FEN copied');
      return;
    }
  }catch(e){}

  try{
    const ok = fallbackCopyTextToClipboard(fen);
    if(ok){
      setStatus('FEN copied to clipboard.');
      showToast('FEN copied');
    }else{
      throw new Error('execCommand returned false');
    }
  }catch(err){
    console.error('Copy FEN failed:', err);
    setStatus('Copy failed.');
    showToast('Copy failed');
  }
}

function createPasteModal(){
  let overlay = document.getElementById('fenPasteOverlay');
  if(overlay) return overlay;
  overlay = document.createElement('div');
  overlay.id = 'fenPasteOverlay';
  overlay.style.position = 'fixed';
  overlay.style.inset = '0';
  overlay.style.background = 'rgba(0,0,0,.55)';
  overlay.style.display = 'none';
  overlay.style.alignItems = 'center';
  overlay.style.justifyContent = 'center';
  overlay.style.zIndex = '100000';

  const panel = document.createElement('div');
  panel.style.width = 'min(92vw, 720px)';
  panel.style.background = '#14181e';
  panel.style.color = '#fff';
  panel.style.border = '1px solid rgba(255,255,255,.14)';
  panel.style.borderRadius = '14px';
  panel.style.boxShadow = '0 18px 48px rgba(0,0,0,.45)';
  panel.style.padding = '16px';
  panel.style.boxSizing = 'border-box';

  const title = document.createElement('div');
  title.textContent = 'Paste FEN';
  title.style.fontSize = '18px';
  title.style.fontWeight = '700';
  title.style.marginBottom = '10px';

  const info = document.createElement('div');
  info.textContent = 'Paste a FEN string below:';
  info.style.fontSize = '14px';
  info.style.opacity = '0.9';
  info.style.marginBottom = '10px';

  const input = document.createElement('textarea');
  input.id = 'fenPasteInput';
  input.style.width = '100%';
  input.style.height = '110px';
  input.style.resize = 'vertical';
  input.style.boxSizing = 'border-box';
  input.style.borderRadius = '10px';
  input.style.border = '1px solid rgba(255,255,255,.18)';
  input.style.background = '#0f1318';
  input.style.color = '#fff';
  input.style.padding = '10px';
  input.style.fontSize = '14px';
  input.style.outline = 'none';

  const row = document.createElement('div');
  row.style.display = 'flex';
  row.style.gap = '10px';
  row.style.justifyContent = 'flex-end';
  row.style.marginTop = '12px';
  row.style.flexWrap = 'wrap';

  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button';
  cancelBtn.textContent = 'Cancel';

  const applyBtn = document.createElement('button');
  applyBtn.type = 'button';
  applyBtn.textContent = 'Apply';

  row.appendChild(cancelBtn);
  row.appendChild(applyBtn);
  panel.appendChild(title);
  panel.appendChild(info);
  panel.appendChild(input);
  panel.appendChild(row);
  overlay.appendChild(panel);
  document.body.appendChild(overlay);

  function close(){ overlay.style.display = 'none'; }
  cancelBtn.onclick = close;
  overlay.addEventListener('click', e => { if(e.target === overlay) close(); });
  applyBtn.onclick = () => { const text = input.value.trim(); if(text) loadFen(text); close(); };
  input.addEventListener('keydown', e => {
    if(e.key === 'Escape') close();
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      const text = input.value.trim();
      if(text) loadFen(text);
      close();
    }
  });

  overlay._open = () => { input.value = ''; overlay.style.display = 'flex'; setTimeout(() => input.focus(), 0); };
  return overlay;
}

function openPasteModal(){ createPasteModal()._open(); }

function placePiece(r,c,p){ board[r][c] = p; }
function removePiece(r,c){ board[r][c] = null; }

function clearBoard(){
  board = Array.from({length:8},()=>Array(8).fill(null));
  selected = null;
  moveList = [];
  render();
  updateFenDisplay();
  setStatus('Board cleared.');
  logEl.textContent = 'Build the position and press Solve Puzzle.';
}

function render(){
  boardEl.innerHTML = '';
  const ori = orientationSel.value;
  for(let vr=0; vr<8; vr++){
    for(let vc=0; vc<8; vc++){
      const r = ori === 'white' ? vr : 7 - vr;
      const c = ori === 'white' ? vc : 7 - vc;
      const cell = document.createElement('div');
      cell.className = 'cell ' + (((r + c) % 2 === 0) ? 'whiteCell' : 'blackCell');
      if(selected && selected.r === r && selected.c === c) cell.classList.add('selected');
      const f = document.createElement('div');
      f.className = 'coord-file';
      f.textContent = (ori === 'white' ? r === 7 : r === 0) ? 'abcdefgh'[c] : '';
      const rk = document.createElement('div');
      rk.className = 'coord-rank';
      rk.textContent = (ori === 'white' ? c === 0 : c === 7) ? String(8 - r) : '';
      cell.appendChild(f);
      cell.appendChild(rk);
      cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('dropTarget'); });
      cell.addEventListener('dragleave', () => cell.classList.remove('dropTarget'));
      cell.addEventListener('drop', e => {
        e.preventDefault();
        cell.classList.remove('dropTarget');
        if(!dragPiece) return;
        if(dragSource && dragSource.kind === 'board') removePiece(dragSource.r, dragSource.c);
        placePiece(r, c, {color: dragPiece.color, type: dragPiece.type});
        dragPiece = null;
        dragSource = null;
        selected = null;
        render();
        updateFenDisplay();
      });
      cell.addEventListener('click', () => {
        if(board[r][c]){
          removePiece(r, c);
          selected = null;
          render();
          updateFenDisplay();
        }
      });
      const p = board[r][c];
      if(p){
        const d = document.createElement('div');
        d.className = 'piece ' + (p.color === 'w' ? 'whitePiece' : 'blackPiece');
        d.draggable = true;
        d.textContent = PIECES[p.color + p.type];
        d.title = alg(r,c);
        d.addEventListener('dragstart', () => { dragPiece = p; dragSource = {kind:'board', r, c}; });
        d.addEventListener('dragend', () => { dragPiece = null; dragSource = null; });
        cell.appendChild(d);
      }
      boardEl.appendChild(cell);
    }
  }
}

function makeTray(container, color){
  container.innerHTML = '';
  ['k','q','r','b','n','p'].forEach(type => {
    const slot = document.createElement('div');
    slot.className = 'trayPiece';
    const d = document.createElement('div');
    d.className = 'piece ' + (color === 'w' ? 'whitePiece' : 'blackPiece');
    d.draggable = true;
    d.textContent = PIECES[color + type];
    d.addEventListener('dragstart', () => { dragPiece = {color, type}; dragSource = {kind:'tray'}; });
    d.addEventListener('dragend', () => { dragPiece = null; dragSource = null; });
    slot.appendChild(d);
    container.appendChild(slot);
  });
}



function sanitizeFen(input) {
  if (!input || typeof input !== 'string') {
    throw new Error('Empty FEN');
  }

  let parts = input.trim().replace(/\s+/g, ' ').split(' ');

  // 1. Позиция фигур (обязательная часть)
  const placement = parts[0];
  if (!placement || placement.split('/').length !== 8) {
    throw new Error('Invalid board part in FEN');
  }

  // 2. Попытка найти сторону хода
  let turn = null;

  for (const p of parts.slice(1)) {
    if (p === 'w' || p === 'b') {
      turn = p;
      break;
    }
  }

  if (!turn) {
    turn = 'w'; // дефолт
  }

  // 3. Рокировка (если есть нормальная, иначе дефолт)
  let castling = parts.find(p =>
    /^[KQkq\-]+$/.test(p) && p !== 'w' && p !== 'b'
  );

  if (!castling) castling = '-';

  // 4. en passant
  let enPassant = parts.find(p =>
    /^[a-h][36]$/.test(p)
  );

  if (!enPassant) enPassant = '-';

  // 5. halfmove clock
  let halfmove = parseInt(parts.find(p => /^\d+$/.test(p))) || 0;

  // 6. fullmove number
  let fullmove = parseInt(parts.filter(p => /^\d+$/.test(p)).pop()) || 1;

  // 7. Собираем чистый FEN
  const cleanFen = [
    placement,
    turn,
    castling,
    enPassant,
    halfmove,
    fullmove
  ].join(' ');

  return {
    fen: cleanFen,
    placement,

function loadFen(fen) {

    const rows = parts[0].split('/');

    board = Array.from({length: 8}, () => Array(8).fill(null));

    for (let r = 0; r < 8; r++) {
      let c = 0;
      for (const ch of rows[r]) {
        if (/[1-8]/.test(ch)) c += parseInt(ch);
        else {
          board[r][c] = {
            color: (ch === ch.toUpperCase()) ? 'w' : 'b',
            type: ch.toLowerCase()
          };
          c++;
        }
      }
    }

    currentTurn = clean.turn;

    render();
    updateFenDisplay();
    setStatus(`FEN loaded (${currentTurn.toUpperCase()} to move)`);

      const inChk = inCheck(s, s.turn);
      if (depth <= 0) return { score: quiescence(s, alpha, beta, QUIESCENCE_DEPTH), move: null, aborted: false };

      if (!inChk && allowNull && depth >= 3) {
        const hasBigPiece = materialWithoutPawnsAndKings(s) > 0;
        if (hasBigPiece) {
          const c = cloneState(s);
          c.enPassant = null;
          c.turn = opponent(c.turn);
          recordRep(c);
          const R = 2 + (depth >= 6 ? 1 : 0);
          const nullRes = search(c, depth - 1 - R, -beta, -beta + 1, ply + 1, false);
          if (nullRes.aborted) return nullRes;
          const score = -nullRes.score;
          if (score >= beta) return { score: beta, move: null, aborted: false };
        }
      }

      let legal = getLegalMoves(s, s.turn);



if (!legal.length) {
  if (inChk) return { score: -MATE + ply * 1000, move: null, aborted: false };
  return { score: 0, move: null, aborted: false };
}


      let bestMove = null;
      let bestScore = -INF;
      let moves = orderMoves(s, legal, ply, ttMove);
      let searched = 0;
      for (const m of moves) {
        const c = cloneState(s);
        applyMove(c, m);
        let score;
        if (searched === 0) {
          const res = search(c, depth - 1, -beta, -alpha, ply + 1, true);
          if (res.aborted) return res;
          score = -res.score;
        } else {
          let res = search(c, depth - 1, -alpha - 1, -alpha, ply + 1, true);
          if (res.aborted) return res;
          score = -res.score;
          if (score > alpha && score < beta) {
            res = search(c, depth - 1, -beta, -alpha, ply + 1, true);
            if (res.aborted) return res;
            score = -res.score;
          }
        }
        searched++;
        if (score > bestScore) {
          bestScore = score;
          bestMove = m;
          if (ply === 0) rootBestMove = m;
        }
        if (score > alpha) alpha = score;
        if (alpha >= beta) {
          if (!m.captured && !m.promotion) {
            addKiller(ply, m);
            addHistory(m, depth);
          }
          break;
        }
      }
      let flag = TT_EXACT;
      if (bestScore <= alphaOrig) flag = TT_ALPHA;
      else if (bestScore >= beta) flag = TT_BETA;
      storeTT(key, depth, bestScore, flag, bestMove ? moveKey(bestMove) : null);
      return { score: bestScore, move: bestMove, aborted: false };
    }
    function resolveMoveByKey(s, key) {
      if (!key) return null;
      const legal = getLegalMoves(s, s.turn);
      return legal.find(m => moveKey(m) === key) || null;
    }


    function searchRoot(state, maxDepth, thinkMs) {
  searchDeadline = now() + thinkMs;
  nodes = 0;
  tt = new Map();
  historyTable = Object.create(null);
  killerMoves = [];
  rootBestMove = null;

  let bestMove = null;
  let bestScore = -INF;
  let lastBestKey = null;
  let stableCount = 0;
  let previousScore = null;
  let alpha = -INF;
  let beta = INF;

  for (let depth = 1; depth <= maxDepth; depth++) {
    if (timeUp()) break;

    const window = depth >= 3 ? 35 : 100000;
    let low = alpha;
    let high = beta;

    if (depth >= 3 && bestMove) {
      low = bestScore - window;
      high = bestScore + window;
    }

    let res = search(cloneState(state), depth, low, high, 0, true);
    if (res.aborted) break;

    let score = res.score;

    if (depth >= 3 && score <= low && !timeUp()) {
      res = search(cloneState(state), depth, -INF, high, 0, true);
      if (res.aborted) break;
      score = res.score;
    } else if (depth >= 3 && score >= high && !timeUp()) {
      res = search(cloneState(state), depth, low, INF, 0, true);
      if (res.aborted) break;
      score = res.score;
    }

    const resolved = res.move || resolveMoveByKey(state, rootBestMove ? moveKey(rootBestMove) : null);
    if (resolved) {
      const currentKey = moveKey(resolved);

      if (bestMove && currentKey === lastBestKey) {
        stableCount++;
      } else {
        stableCount = 0;
      }

      bestMove = resolved;
      bestScore = score;
      lastBestKey = currentKey;

      self.postMessage({
        type: 'info',
        depth,
        score: bestScore,
        nodes,
        pv: coordMoveText(bestMove),
        text: 'Depth ' + depth + '  Score ' + (bestScore / 100).toFixed(2) + '  Nodes ' + nodes
      });

      alpha = bestScore - 60;
      beta = bestScore + 60;

if (stableCount >= 3 && previousScore !== null && Math.abs(bestScore - previousScore) <= 5) break;

if (depth >= 6 && stableCount >= 2) break;



      previousScore = bestScore;
    } else {
      break;
    }

    if (timeUp()) break;
  }

  return { move: bestMove, score: bestScore, nodes };
}


self.onmessage = function(e) {
  const msg = e.data || {};

  if (msg.type === 'stop') {
    stopRequested = true;
    return;
  }

  if (msg.type !== 'think') return;

  stopRequested = false;

  const post = (type, data) =>
    self.postMessage(Object.assign({ type, requestId: msg.requestId }, data));

  post('info', { text: 'Thinking...' });

  const fen = (msg.fen || '').split(' ');
  const placement = fen[0] || '';
  const turn = fen[1] || 'w';

  const state = fenToState(placement, turn);

  const result = searchRoot(
    state,
    msg.maxDepth || 12,
    msg.thinkMs || 15000
  );

  if (stopRequested) return;

  if (!result || !result.move) {
    post('done', { status: 'No move found' });
    return;
  }

  post('bestmove', {
    move: coordMoveText(result.move),
    score: result.score,
    nodes: result.nodes
  });

  post('done', { status: 'Search complete' });
};




`;}




let engineWorker = null;
let engineActiveRequestId = 0;
let engineRequestId = 0;

function initEngineWorker(){
  if(engineWorker) return engineWorker;
  const blob = new Blob([createEngineWorkerSource()], {type: 'text/javascript'});
  const url = URL.createObjectURL(blob);
  engineWorker = new Worker(url);
  URL.revokeObjectURL(url);
  engineWorker.onmessage = e => {
    const m = e.data || {};
    if(m.requestId !== engineActiveRequestId) return;
    if(m.type === 'info') { engineInfoEl.textContent = m.text; return }
    if(m.type === 'bestmove') {
  engineInfoEl.textContent = 'Best move found';
  applyEngineMove(m.move);
  engineActiveRequestId = 0;
  return;
}

    if(m.type === 'done') {
      engineInfoEl.textContent = m.status || 'Engine idle';
      engineActiveRequestId = 0;
    }
  };
  return engineWorker;
}

function applyEngineMove(move){
  if(!move) return;
  const s = parseMove(move);
  const p = board[s.from.r][s.from.c];
  if(!p) return;
  board[s.from.r][s.from.c] = null;
  board[s.to.r][s.to.c] = {color: p.color, type: move.piece || p.type};
  moveList.push(`${alg(s.from.r, s.from.c)}-${alg(s.to.r, s.to.c)}`);
  logEl.textContent += `
Engine: ${alg(s.from.r, s.from.c)}-${alg(s.to.r, s.to.c)}`;
  render();
  setStatus('✅ Solved!');
}


function parseMove(str){
  return {
    from: { c: str.charCodeAt(0)-97, r: 8 - parseInt(str[1]) },
    to:   { c: str.charCodeAt(2)-97, r: 8 - parseInt(str[3]) }
  };
}

function solvePuzzle(){
  const fen = boardToFen();
  engineInfoEl.textContent = 'Engine thinking...';
  logEl.textContent = `FEN: ${fen}

Searching...`;
  if(engineActiveRequestId) {
    engineWorker.postMessage({type: 'stop'});
    engineActiveRequestId = 0;
  }
  const w = initEngineWorker();
  engineActiveRequestId = ++engineRequestId;
  w.postMessage({
    type: 'think',
    requestId: engineActiveRequestId,
    fen: fen,
    maxDepth: 16,
    thinkMs: 30000
  });
  setStatus('🔄 Solving for mate...');
}



clearBtn.onclick = clearBoard;
solveBtn.onclick = solvePuzzle;

orientationSel.onchange = () => {
  render();
  updateFenDisplay();
};

makeTray(whiteTray, 'w');
makeTray(blackTray, 'b');
render();
