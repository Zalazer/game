<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FIFA 2026 Live</title>
  <style>
    :root{
      --bg:#07111f;
      --bg2:#0b1628;
      --card:rgba(255,255,255,.04);
      --card2:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.08);
      --text:#e7eef8;
      --muted:#93a4ba;
      --accent:#22d3ee;
      --accent2:#7c3aed;
      --good:#22c55e;
      --bad:#ef4444;
      --warn:#f59e0b;
      --shadow:0 14px 40px rgba(0,0,0,.28);
      --radius:18px;
      --radius2:14px;
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% 0%, rgba(34,211,238,.12), transparent 55%),
        radial-gradient(1000px 700px at 100% 20%, rgba(124,58,237,.12), transparent 50%),
        linear-gradient(180deg, #06101d 0%, #081120 55%, #050b15 100%);
    }
    .wrap{
      max-width:1320px;
      margin:0 auto;
      padding:24px;
    }
    .hero{
      display:flex;
      flex-direction:column;
      gap:18px;
      padding:22px;
      border:1px solid var(--line);
      border-radius:24px;
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
    }
    .hero-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
    }
    .hero-title{
      margin:0;
      font-size:clamp(28px, 4vw, 44px);
      line-height:1.05;
      letter-spacing:-.03em;
    }
    .hero-sub{
      margin-top:8px;
      color:var(--muted);
      font-size:14px;
    }
    .controls{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }
    .search{
      flex:1;
      min-width:280px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:12px 14px;
      border:1px solid var(--line);
      border-radius:16px;
      background:rgba(0,0,0,.16);
    }
    .search input{
      width:100%;
      border:none;
      outline:none;
      color:var(--text);
      background:transparent;
      font-size:14px;
    }
    .seg{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .btn{
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--text);
      padding:11px 15px;
      border-radius:14px;
      cursor:pointer;
      transition:.18s ease;
      font-weight:600;
    }
    .btn:hover{transform:translateY(-1px); background:rgba(255,255,255,.06)}
    .btn.primary{
      border-color:rgba(34,211,238,.35);
      background:linear-gradient(135deg, rgba(34,211,238,.18), rgba(124,58,237,.16));
    }
    .grid{
      display:grid;
      grid-template-columns:1.55fr .92fr;
      gap:18px;
      margin-top:18px;
      align-items:start;
    }
    .card{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02));
      box-shadow:var(--shadow);
      overflow:hidden;
      min-width:0;
    }
    .card-head{
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .card-title{
      font-weight:800;
      letter-spacing:-.02em;
    }
    .card-body{
      padding:16px 18px 18px;
    }
    .muted{color:var(--muted)}
    .seg button{
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--text);
      padding:9px 12px;
      border-radius:999px;
      cursor:pointer;
      transition:.18s ease;
    }
    .seg button.active{
      background:linear-gradient(135deg, rgba(34,211,238,.18), rgba(124,58,237,.18));
      border-color:rgba(34,211,238,.28);
    }
    .matches{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:14px;
    }
    .match{
      border:1px solid var(--line);
      background:rgba(0,0,0,.12);
      border-radius:16px;
      padding:14px 14px 12px;
      cursor:pointer;
      transition:.18s ease;
    }
    .match:hover{
      transform:translateY(-1px);
      background:rgba(255,255,255,.05);
      border-color:rgba(34,211,238,.18);
    }
    .match-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }
    .match-teams{
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
      line-height:1.2;
    }
    .match-meta{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .pill{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      padding:5px 9px;
      border-radius:999px;
    }
    .match-score{
      font-size:22px;
      font-weight:900;
      letter-spacing:-.03em;
      white-space:nowrap;
    }
    .empty{
      padding:24px 14px;
      color:var(--muted);
      text-align:center;
      border:1px dashed rgba(255,255,255,.12);
      border-radius:16px;
      background:rgba(255,255,255,.02);
    }
    .footer{
      margin:18px 2px 0;
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }
    .overlay{
      position:fixed;
      inset:0;
      background:rgba(5,10,20,.72);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:50;
    }
    .overlay.open{display:flex}
    .modal-content{
      width:min(920px, 100%);
      max-height:min(86vh, 980px);
      overflow:auto;
      border-radius:22px;
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(10,18,32,.98), rgba(7,12,22,.98));
      box-shadow:var(--shadow);
    }
    .modal-head{
      position:sticky;
      top:0;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      padding:18px 20px;
      border-bottom:1px solid var(--line);
      background:rgba(8,14,25,.96);
      backdrop-filter: blur(10px);
    }
    .modal-body{padding:18px 20px 22px}
    .modal-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

       .btn-ai {
            background: linear-gradient(135deg, #2481cc, #673ab7);
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
        }

    .box{
      border:1px solid var(--line);
      border-radius:16px;
      background:rgba(255,255,255,.03);
      padding:14px;
      min-width:0;
    }
    pre{
      margin:0;
      white-space:pre-wrap;
      word-break:break-word;
      color:#d9e6f2;
      font-size:13px;
      line-height:1.45;
    }
    .k{
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.12em;
      margin-bottom:8px;
    }
    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .value{
      font-weight:700;
    }
    .status-good{color:var(--good)}
    .status-bad{color:var(--bad)}
    .status-warn{color:var(--warn)}
    .tiny{font-size:12px}
    @media (max-width: 980px){
      .grid{grid-template-columns:1fr}
      .modal-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="hero-top">
        <div>
          <h1 class="hero-title">FIFA 2026 Live</h1>
          <div class="hero-sub">All matches • Live • Upcoming • Favorites</div>
        </div>
      </div>

      <div class="controls">
        <div class="search">
          <span>🔎</span>
          <input id="searchInput" placeholder="Search teams, competition, fixture id..." />
        </div>
        <div class="seg">
          <button class="btn primary" id="refreshBtn">Refresh</button>
          <button class="btn" id="checkTokenBtn">Check token</button>
        </div>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <div class="card-head">
          <div class="card-title">Match Dashboard</div>
          <div class="muted" id="dashboardHint">Loading oracle data…</div>
        </div>
        <div class="card-body">
          <div class="seg" id="groupButtons">
            <button class="active" data-group="all">All (0)</button>
            <button data-group="live">Live (0)</button>
            <button data-group="upcoming">Upcoming (0)</button>
            <button data-group="finished">Finished (0)</button>
            <button data-group="stopped">Stopped (0)</button>
            <button data-group="favorites">Favorites (0)</button>
          </div>
          <div style="display:none" id="featuredBox"></div>
          <div style="margin-top:14px" class="muted" id="feedStatus">Loading oracle feed…</div>
          <div style="margin-top:14px" class="matches" id="matchesList">
            <div class="empty">Loading matches…</div>
          </div>
        </div>
      </section>

      <aside class="card">
        <div class="card-head">
          <div class="card-title">Featured match</div>
          <div class="muted" id="featuredState">—</div>
        </div>
        <div class="card-body" id="featuredWrap">
          <div class="empty">Loading…</div>
        </div>
      </aside>
    </div>

    <div class="footer">TxLINE frontend rebuilt from worker contract</div>
  </div>

  <div class="overlay" id="detailOverlay" aria-hidden="true">
    <div class="modal-content" id="detailModal"></div>
  </div>

<script>
const state = {
  matches: [],
  featured: null,
  group: "all",
  query: "",
  currentFixtureId: null,
  autoRefresh: null,
  favorites: new Set(
    JSON.parse(
      localStorage.getItem("favorites") || "[]"
    )
  )
};


const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}

async function getTicket(){
  const r = await fetch("/__ticket",{method:"POST"});
  if(!r.ok) throw new Error(`ticket failed: ${r.status}`);
  const j = await r.json();
  return j.k;
}

async function emit(type,data={}){
  const k = await getTicket();
  const r = await fetch("/__emit",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({k,d:{type,...data}})
  });
  if(!r.ok) throw new Error(`emit failed: ${r.status}`);
  return await r.json();
}

function phaseName(v){
  return String(v ?? "").trim();
}

function getMatchId(m){
  return String(
    m?.fixtureId ??
    m?.matchId ??
    m?.id ??
    ""
  );
}


function formatPhase(value){

  switch(String(value || "").toLowerCase()){

    case "live":
      return "Live";

    case "upcoming":
      return "Upcoming";

    case "finished":
      return "Finished";

    case "stopped":
      return "Stopped";

    default:
      return String(value || "Unknown");
  }

}

function formatScore(home, away){

  if(home == null && away == null){
    return "—";
  }

  return `${home ?? 0} - ${away ?? 0}`;

}

function formatKickoff(value){

  const n = Number(value);

  if(!Number.isFinite(n) || n <= 0){
    return "—";
  }

  try{

    return new Date(n).toLocaleString(
      undefined,
      {
        day: "2-digit",
        month: "short",
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  }catch{

    return new Date(n).toLocaleString();

  }

}

function formatTimelineEntry(entry){

  if(!entry){
    return "";
  }

  const minute =
    formatMinuteFromSeconds(
      entry.seconds ??
      entry.elapsed ??
      entry.time ??
      null
    );

  const type =
    entry.type ||
    entry.eventType ||
    "event";

  const team =
    entry.team ||
    "";

  const player =
    entry.player ||
    "";

  return [
    minute,
    type,
    team,
    player
  ]
  .filter(Boolean)
  .join(" • ");

}



function formatEventEntry(entry){

  if(!entry){
    return "";
  }

  const minute =
    formatMinuteFromSeconds(
      entry.seconds ??
      entry.elapsed ??
      entry.time ??
      null
    );

  const type =
    entry.type ||
    entry.eventType ||
    "event";

  const player =
    entry.player ||
    "";

  const team =
    entry.team ||
    "";

  const detail =
    entry.detail ||
    "";

  return [
    minute,
    type,
    player,
    team,
    detail
  ]
  .filter(Boolean)
  .join(" • ");

}


function formatOddsEntry(entry){

  if(!entry){
    return "";
  }

  const market =
    entry.marketName ||
    entry.market ||
    entry.name ||
    "";

  const selection =
    entry.selectionName ||
    entry.selection ||
    entry.outcome ||
    "";

  const price =
    entry.price ??
    entry.odds ??
    entry.value ??
    "";

  return [
    market,
    selection,
    price
  ]
  .filter(Boolean)
  .join(" • ");

}


function formatHistoricalEntry(entry){

  if(!entry){
    return "";
  }

  const minute =
    formatMinuteFromSeconds(
      entry.seconds ??
      entry.elapsed ??
      entry.time ??
      null
    );

  const type =
    entry.type ||
    entry.eventType ||
    "historical";

  const team =
    entry.team ||
    "";

  const player =
    entry.player ||
    "";

  const detail =
    entry.detail ||
    "";

  return [
    minute,
    type,
    player,
    team,
    detail
  ]
  .filter(Boolean)
  .join(" • ");

}


function getMatchPhasePriority(phase){

  switch(String(phase || "").toLowerCase()){

    case "live":
      return 0;

    case "upcoming":
      return 1;

    case "finished":
      return 2;

    case "stopped":
      return 3;

    default:
      return 4;

  }

}


function sortByTimestamp(arr){

  return [...arr].sort((a, b) => {

    const ta = Number(
      a?.timestamp ??
      a?.time ??
      a?.seconds ??
      0
    );

    const tb = Number(
      b?.timestamp ??
      b?.time ??
      b?.seconds ??
      0
    );

    return ta - tb;

  });

}



function renderDetailBlock(title, items, formatter){

  if(!Array.isArray(items) || !items.length){
    return "";
  }

  return `
<div class="box">

<div class="k">
${esc(title)} (${items.length})
</div>

<div class="tiny">

${items.map(item => `
<div style="
padding:8px 0;
border-bottom:1px solid rgba(255,255,255,.08);
">
${esc(
formatter(item) || "Data"
)}
</div>
`).join("")}

</div>

</div>
`;

}



function normalizeTimelineSeconds(value){
  const n = Number(value);
  if (!Number.isFinite(n) || n < 0) return null;
  if (n > 1000000) return null;
  return n;
}

function formatMinuteFromSeconds(seconds){
  const n = normalizeTimelineSeconds(seconds);

  if(n == null){
    return "";
  }

  const minute = Math.floor(n / 60);
  const extra = minute > 90 ? minute - 90 : 0;

  return extra > 0
    ? `90+${extra}'`
    : `${minute}'`;
}



function getFilteredMatches(){

  let arr = [...state.matches];

  if(state.group !== "all"){

    if(state.group === "favorites"){

      arr = arr.filter(
        x => state.favorites.has(
          getMatchId(x)
        )
      );

    }else{

      arr = arr.filter(
        x =>
          String(x.phase || "")
            .toLowerCase() === state.group
      );

    }

  }

  const q =
    state.query
      .trim()
      .toLowerCase();

  if(q){

    arr = arr.filter(m => {

      const text = [
        m.home,
        m.away,
        m.competition,
        m.fixtureId,
        m.matchId,
        m.id
      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

      return text.includes(q);

    });

  }

  return arr.sort((a, b) => {

  const pa =
    getMatchPhasePriority(a.phase);

  const pb =
    getMatchPhasePriority(b.phase);

  if(pa !== pb){
    return pa - pb;
  }

  const ta =
    Number(
      a.kickoffMs ||
      a.time ||
      a.timestamp ||
      0
    );

  const tb =
    Number(
      b.kickoffMs ||
      b.time ||
      b.timestamp ||
      0
    );

  return ta - tb;

});



}


function renderGroupButtons(){

  const counts = {
    all: state.matches.length,

    live: state.matches.filter(
      x => String(x.phase || "").toLowerCase() === "live"
    ).length,

    upcoming: state.matches.filter(
      x => String(x.phase || "").toLowerCase() === "upcoming"
    ).length,

    finished: state.matches.filter(
      x => String(x.phase || "").toLowerCase() === "finished"
    ).length,

    stopped: state.matches.filter(
      x => String(x.phase || "").toLowerCase() === "stopped"
    ).length,

    favorites: state.matches.filter(
      x => state.favorites.has(getMatchId(x))
    ).length
  };

  document.querySelectorAll("#groupButtons button").forEach(btn => {

    const g = btn.dataset.group;

    btn.textContent =
      `${g[0].toUpperCase()}${g.slice(1)} (${counts[g] || 0})`;

    btn.classList.toggle(
      "active",
      state.group === g
    );

  });

  $("featuredState").textContent =
    state.featured
      ? formatPhase(state.featured.phase || "—")
      : "—";

}



function renderFeatured(){
  const box = $("featuredWrap");

  if(!state.featured){
    box.innerHTML = `<div class="empty">No featured match</div>`;
    return;
  }

  const m = state.featured;
  const id = esc(getMatchId(m));

  const score =
    m.score ||
    (
      m.homeScore != null ||
      m.awayScore != null
        ? formatScore(m.homeScore, m.awayScore)
        : "—"
    );

  box.innerHTML = `
    <div class="match" onclick="openDetails('${id}')">
      <div class="match-top">

        <div>
          <div class="match-teams">
            ${esc(m.home || "Unknown")}
            vs
            ${esc(m.away || "Unknown")}
          </div>

          <div class="match-meta">


${m.kickoffMs || m.kickoff ? `
<span class="pill">
  ${esc(
    formatKickoff(
      m.kickoffMs ||
      m.kickoff
    )
  )}
</span>
` : ``}

            <span class="pill">
              ${esc(formatPhase(m.phase))}
            </span>

            ${m.competition ? `
            <span class="pill">
              ${esc(m.competition)}
            </span>
            ` : ``}

          </div>
        </div>

        <div class="match-score">
          ${esc(score)}
        </div>

      </div>
    </div>
  `;
}


function renderMatches(){

  const list = $("matchesList");
  const matches = getFilteredMatches();

  if(!matches.length){
    list.innerHTML =
      `<div class="empty">No matches found</div>`;
    return;
  }

  list.innerHTML = matches.map(m => {

    const id = esc(getMatchId(m));
    const fav =
      state.favorites.has(getMatchId(m));

    const score =
    m.score ||
    (
      m.homeScore != null ||
      m.awayScore != null
        ? formatScore(m.homeScore, m.awayScore)
        : "—"
    );

    return `
      <div class="match">

  <div
    style="cursor:pointer"
    onclick="openDetails('${id}')"
  >

        <div class="match-top">

          <div>

            <div class="match-teams">
              ${esc(m.home || "Unknown")}
              vs
              ${esc(m.away || "Unknown")}
            </div>


            <div class="match-meta">

              <span class="pill">
                ${esc(formatPhase(m.phase))}
              </span>

              ${m.competition ? `
              <span class="pill">
                ${esc(m.competition)}
              </span>
              ` : ``}


${m.kickoffMs || m.kickoff ? `
<span class="pill">
  ${esc(
    formatKickoff(
      m.kickoffMs ||
      m.kickoff
    )
  )}
</span>
` : ``}

              <span class="pill">
                #${esc(m.fixtureId || m.matchId || m.id || "")}
              </span>

              ${fav ? `
              <span class="pill">
                ★ Favorite
              </span>
              ` : ``}

            </div>

          </div>

          <div class="match-score">
            ${esc(score)}
          </div>

        </div>

          </div>




    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">

  <button
    class="btn"
    onclick="event.stopPropagation();toggleFavorite('${id}')"
  >
    ${
      fav
        ? "★ Remove Favorite"
        : "☆ Add Favorite"
    }
  </button>

  <button
    class="btn"
    onclick="event.stopPropagation();getAIPrediction('${id}')"
  >
    AI Analysis
  </button>

</div>

<div
  id="ai-box-${id}"
  style="
    margin-top:10px;
    display:none;
    padding:10px;
    border-radius:8px;
    background:#1e1e1e;
    font-size:13px;
    line-height:1.5;
    white-space:pre-wrap;
  "
>
Loading AI analysis...
</div>



  </div>
`;

  }).join("");

}



function renderApp(){
  renderGroupButtons();
  renderFeatured();
  renderMatches();
}



async function loadData(){

  $("dashboardHint").textContent =
    "Loading oracle data...";

  try{

    const res = await emit(
      "txline_probe_feed",
      {
        serviceLevelId: 12
      }
    );

    const data = res.data || res;

    state.matches =
      Array.isArray(data.matches)
        ? data.matches
        : [];

    state.featured =
  data.featured ||
  state.matches.find(
    x => String(x.phase).toLowerCase() === "live"
  ) ||
  state.matches[0] ||
  null;

    renderApp();

    $("dashboardHint").textContent =
      "Oracle feed ready";

    $("feedStatus").textContent =
      `Loaded ${state.matches.length} matches`;

  }catch(e){

    $("dashboardHint").textContent =
      "Load failed";

    $("feedStatus").textContent =
      e.message;

    console.error(e);

  }

}

function toggleFavorite(fixtureId){

  saveFavorites();
  renderApp();

}

async function getAIPrediction(fixtureId) {
  const safeFixtureId = normalizeId(fixtureId);

  if (!safeFixtureId) return;

  let aiBox = document.getElementById(`ai-box-${safeFixtureId}`);

  if (!aiBox) {
    aiBox = document.getElementById("ai-text");
  }

  if (!aiBox) return;

  aiBox.style.display = "block";
  aiBox.innerText = text.loadingAi;

  const controller = createAbortController("aiController");

  try {
    const base = getWorkerBase();

    if (!base) {
      throw new Error("Worker URL is empty");
    }

    const ticketRes = await fetch(`${base}/__ticket`, {
      method: "POST",
      signal: controller.signal
    });

    if (!ticketRes.ok) {
      throw new Error(`__ticket failed: ${ticketRes.status}`);
    }

    const ticket = await ticketRes.json();

    const aiRes = await fetch(`${base}/__ai`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      signal: controller.signal,
      body: JSON.stringify({
        k: ticket.k,
        messages: [
          {
            role: "user",
            content: text.aiPrompt(safeFixtureId)
          }
        ]
      })
    });

    const raw = await aiRes.text();

    let body = null;

    try {
      body = JSON.parse(raw);
    } catch {
      body = { raw };
    }

    if (state.requests.aiController === controller) {
      state.requests.aiController = null;
    }

    if (!aiRes.ok || !body?.ok) {
      console.error("AI response error:", body);
      aiBox.innerText = text.aiUnavailable;
      return;
    }

    const content =
      body?.content ||
      body?.raw?.choices?.[0]?.message?.content ||
      "";

    aiBox.innerText =
      typeof content === "string" && content.trim()
        ? content.trim()
        : text.aiUnavailable;

  } catch (error) {
    if (error.name === "AbortError") {
      return;
    }

    console.error("AI module request failed:", error);

    if (state.requests.aiController === controller) {
      state.requests.aiController = null;
    }

    aiBox.innerText = text.aiError;
  }
}


window.getAIPrediction = getAIPrediction;

async function checkToken() {
  try {
    const res = await emit("txline_check_token", {
      serviceLevelId: 12
    });

    if (!res?.ok) {
      alert(
        `TxLINE token check failed.\n\n${
          res?.error || "Unknown error."
        }`
      );
      return;
    }

    const lines = [
  "TxLINE Token Status",
  "",
  "Status: OK"
];


    if (res.serviceLevelId != null) {
      lines.push(`Service Level: ${res.serviceLevelId}`);
    }

    if (res.tokenLooksPresent != null) {
      lines.push(
        `API Token: ${res.tokenLooksPresent ? "present" : "missing"}`
      );
    }

    if (res.jwtLooksPresent != null) {
      lines.push(
        `JWT: ${res.jwtLooksPresent ? "present" : "missing"}`
      );
    }

    if (res.auth?.exp != null) {

  const exp =
    res.auth.exp > 1e12
      ? res.auth.exp
      : res.auth.exp * 1000;

  lines.push(
    `Expires: ${new Date(exp).toLocaleString()}`
  );

}


    if (Array.isArray(res.results)) {

  const okCount =
    res.results.filter(
      r => r?.ok
    ).length;

  lines.push(
    `Checks: ${okCount}/${res.results.length}`
  );

  res.results.forEach(r => {

    if(!r){
      return;
    }

    const name =
      r.name ||
      r.route ||
      r.endpoint ||
      "check";

    lines.push(
      `• ${name}: ${r.ok ? "OK" : "FAIL"}`
    );

  });

}



    alert(lines.join("\n"));
  } catch (e) {
    alert(
      `Token check failed.\n\n${
        e?.message || String(e)
      }`
    );
  }
}
