<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>FIFA 2026 Live</title>
  <style>
    :root{
      --bg:#07101d;
      --bg2:#0a1730;
      --card:#101a33;
      --card2:#0e1730;
      --line:rgba(255,255,255,.08);
      --text:#eef3ff;
      --muted:#9cabd8;
      --accent:#79a8ff;
      --accent2:#67f0c8;
      --danger:#ff6b82;
      --warn:#ffd36b;
      --shadow:0 16px 50px rgba(0,0,0,.35);
      --radius:20px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;padding:0;background:
        radial-gradient(1200px 700px at 20% 0%, rgba(121,168,255,.15), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(103,240,200,.12), transparent 50%),
        linear-gradient(180deg, var(--bg), #050911 100%);
      color:var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    a{color:inherit}
    button,input{font:inherit}
    .wrap{max-width:1400px;margin:0 auto;padding:18px}
    .hero{
      padding:16px 16px 14px;margin-bottom:16px;
      background:linear-gradient(180deg, rgba(16,26,51,.9), rgba(14,23,48,.88));
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:var(--shadow);
    }
    .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
    .hero-title{font-size:26px;font-weight:900;margin:0}
    .hero-sub{color:var(--muted);margin-top:6px;line-height:1.45}
    .hero-stats{display:flex;gap:10px;flex-wrap:wrap}
    .stat{
      padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.03);
      border:1px solid var(--line); min-width:110px
    }
    .stat .k{font-size:12px;color:var(--muted)}
    .stat .v{font-size:16px;font-weight:800;margin-top:4px}
    .controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
    .search{
      flex:1; min-width:220px;
      display:flex;align-items:center;gap:10px;
      padding:12px 14px;
      background:rgba(255,255,255,.03);
      border:1px solid var(--line);
      border-radius:16px;
    }
    .search input{
      width:100%;border:none;outline:none;background:transparent;color:var(--text)
    }
    .search input::placeholder{color:#7687b7}
    .seg{display:flex;gap:8px;flex-wrap:wrap}
    .seg button,.btn{
      padding:10px 14px;border-radius:14px;border:1px solid var(--line);
      background:rgba(255,255,255,.03);color:var(--text);cursor:pointer
    }
    .seg button.active,.btn.primary{background:linear-gradient(180deg, rgba(121,168,255,.24), rgba(121,168,255,.12));border-color:rgba(121,168,255,.35)}
    .grid{display:grid;grid-template-columns: 1.1fr .9fr;gap:16px;}
    @media (max-width: 1100px){.grid{grid-template-columns:1fr}}
    .card{
      background:linear-gradient(180deg, rgba(16,26,51,.9), rgba(14,23,48,.88));
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .card-head{
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      padding:16px 16px 12px;border-bottom:1px solid var(--line)
    }
    .card-title{font-weight:900;font-size:18px}
    .card-body{padding:16px}
    .matches{display:grid;grid-template-columns:1fr;gap:12px}
    .match{
      padding:14px 14px 12px;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(255,255,255,.03);
      cursor:pointer;
      transition:.15s transform,.15s border-color,.15s background;
    }
    .match:hover{transform:translateY(-1px);border-color:rgba(121,168,255,.35);background:rgba(121,168,255,.05)}
    .match-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .match-teams{font-weight:800;font-size:15px;line-height:1.3}
    .match-score{font-size:22px;font-weight:900}
    .match-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:12px}
    .pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 10px;border-radius:999px;border:1px solid var(--line);
      background:rgba(255,255,255,.03);
    }
    .pill.live{border-color:rgba(103,240,200,.45);color:#9bffe9}
    .pill.finished{border-color:rgba(255,255,255,.14);color:#dfe7ff}
    .pill.upcoming{border-color:rgba(121,168,255,.35);color:#bcd3ff}
    .pill.stopped{border-color:rgba(255,107,130,.45);color:#ffc1cb}
    .empty,.loader-centered{
      min-height:180px;display:flex;align-items:center;justify-content:center;
      color:var(--muted);text-align:center
    }
    .footer{
      margin-top:18px;color:var(--muted);font-size:12px;text-align:center;opacity:.9
    }

    .overlay{
      position:fixed;inset:0;background:rgba(2,5,12,.76);
      backdrop-filter:blur(10px);
      display:none;align-items:flex-start;justify-content:center;
      padding:18px;z-index:9999;overflow:auto;
    }
    .overlay.active{display:flex}
    .modal-content{
      width:min(1200px, 100%);
      margin:24px 0;
      background:linear-gradient(180deg, rgba(16,26,51,.98), rgba(14,23,48,.96));
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .modal-head{
      display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
      padding:16px 16px 14px;border-bottom:1px solid var(--line)
    }
    .modal-title{font-size:20px;font-weight:900}
    .close-btn{
      width:40px;height:40px;border-radius:12px;
      border:1px solid var(--line);background:rgba(255,255,255,.04);
      color:var(--text);cursor:pointer;font-size:18px
    }
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width: 820px){.detail-grid{grid-template-columns:1fr}}
    .detail-block{
      padding:14px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.03)
    }
    .bigscore{font-size:42px;font-weight:900;line-height:1}
    .muted{color:var(--muted)}
    .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .kv div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
    .kv b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
    .timeline{display:flex;flex-direction:column;gap:10px}
    .tl-item{
      padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03)
    }
    .tl-item .a{font-size:12px;color:var(--muted);margin-bottom:4px}
    .tl-item .b{font-size:14px}
    .odds-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    @media (max-width: 780px){.odds-grid{grid-template-columns:1fr}}
    .odd{
      padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03)
    }
    .odd .m{font-size:12px;color:var(--muted)}
    .odd .p{font-size:16px;font-weight:800;margin-top:5px}
    .source-list{display:flex;flex-direction:column;gap:8px}
    .source-item{
      display:flex;justify-content:space-between;gap:10px;align-items:center;
      padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)
    }
    .source-item small{color:var(--muted)}
    .nowrap{white-space:nowrap}

    .detail-tab-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:14px 0 10px;
      padding:0 16px;
    }
    .detail-tab-btn{
      padding:10px 14px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--text);
      cursor:pointer;
      font-weight:700;
      font-size:13px;
    }
    .detail-tab-btn.active{
      background:#00C896;
      color:#08130f;
      border-color:#00C896;
    }
    .detail-panel.hidden{display:none}
    .detail-panel{
      padding:0 16px 16px;
      margin-top:0;
    }
    #match-intelligence-card{
      margin:16px 16px 0;
      padding:15px;
      border-radius:12px;
      background:#161616;
      border:1px solid #333;
    }
    .intelligence-item{
      padding:8px 0;
      border-bottom:1px solid #333;
    }
    .timeline-event{
      padding:12px;
      margin-bottom:10px;
      border-left:4px solid #00C896;
      background:#1B1B1B;
      border-radius:10px;
    }
    .snapshot-item{
      padding:12px;
      margin-bottom:10px;
      background:#1B1B1B;
      border-radius:10px;
    }
    .analysis-item{
      padding:12px;
      margin-bottom:10px;
      background:#1B1B1B;
      border-radius:10px;
    }
    .spinner{
      width:28px;height:28px;border:3px solid rgba(255,255,255,.15);
      border-top-color:var(--accent2);border-radius:50%;
      animation:spin 1s linear infinite;margin:0 auto 8px
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty-box{
      padding:16px;
      border:1px dashed var(--line);
      border-radius:16px;
      background:rgba(255,255,255,.02);
      color:var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="hero-top">
        <div>
          <h1 class="hero-title">FIFA 2026 Live</h1>
          <div class="hero-sub">All matches • Live • Upcoming • Favorites</div>
        </div>
        
      </div>
      <div class="controls">
        <div class="search">
          <span>🔎</span>
          <input id="searchInput" placeholder="Search teams, competition, fixture id..." />
        </div>
        <div class="seg">
          <button class="btn primary" id="refreshBtn">Refresh</button>
          <button class="btn" id="checkTokenBtn">Check token</button>
        </div>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <div class="card-head">
          <div class="card-title">Match Dashboard</div>
          <div class="muted" id="dashboardHint">Loading oracle data…</div>
        </div>
        <div class="card-body">
          <div class="seg" id="groupButtons">
            <button class="active" data-group="all">All (0)</button>
            <button data-group="live">Live (0)</button>
            <button data-group="upcoming">Upcoming (0)</button>
            <button data-group="finished">Finished (0)</button>
            <button data-group="stopped">Stopped (0)</button>
            <button data-group="favorites">Favorites (0)</button>
          </div>
          <div style="margin-top:14px" id="featuredBox">
            <div class="empty">Loading…</div>
          </div>
          <div style="margin-top:14px" class="muted" id="feedStatus">Loading oracle feed…</div>
          <div style="margin-top:14px" class="matches" id="matchesList">
            <div class="empty">Loading matches…</div>
          </div>
        </div>
      </section>

      <aside class="card">
        <div class="card-head">
          <div class="card-title">Featured match</div>
          <div class="muted" id="featuredState">—</div>
        </div>
        <div class="card-body" id="featuredWrap">
          <div class="empty">Loading…</div>
        </div>
      </aside>
    </div>

    <div class="footer">TxLINE frontend rebuilt from worker contract</div>
  </div>

  <div class="overlay" id="detailOverlay" aria-hidden="true">
    <div class="modal-content" id="detailModal"></div>
  </div>

<script>
const state = {
  matches: [],
  featured: null,
  group: "all",
  query: "",
  currentFixtureId: null,
  favorites: new Set(
    JSON.parse(localStorage.getItem("favorites") || "[]")
  )
};

const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}

async function getTicket(){
  const r = await fetch("/__ticket",{method:"POST"});
  if(!r.ok) throw new Error(`ticket failed: ${r.status}`);
  const j = await r.json();
  return j.k;
}

async function emit(type,data={}){
  const k = await getTicket();

  const r = await fetch("/__emit",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      k,
      d:{
        type,
        ...data
      }
    })
  });

  if(!r.ok){
    throw new Error(`emit failed: ${r.status}`);
  }

  return await r.json();
}

function getFilteredMatches(){

  let arr = [...state.matches];

  if(state.group !== "all"){
    if(state.group === "favorites"){
      arr = arr.filter(x =>
        state.favorites.has(String(x.fixtureId))
      );
    }else{
      arr = arr.filter(x =>
        x.phase === state.group
      );
    }
  }

  const q = state.query.trim().toLowerCase();

  if(q){
    arr = arr.filter(m =>
      String(m.home || "").toLowerCase().includes(q) ||
      String(m.away || "").toLowerCase().includes(q) ||
      String(m.competition || "").toLowerCase().includes(q) ||
      String(m.fixtureId || "").includes(q)
    );
  }

  return arr;
}

function renderGroupButtons(){

  const counts = {
    all: state.matches.length,
    live: state.matches.filter(x=>x.phase==="live").length,
    upcoming: state.matches.filter(x=>x.phase==="upcoming").length,
    finished: state.matches.filter(x=>x.phase==="finished").length,
    stopped: state.matches.filter(x=>x.phase==="stopped").length,
    favorites: state.favorites.size
  };

  document
    .querySelectorAll("#groupButtons button")
    .forEach(btn=>{

      const g = btn.dataset.group;

      btn.textContent =
        `${g[0].toUpperCase()}${g.slice(1)} (${counts[g] || 0})`;

      btn.classList.toggle(
        "active",
        state.group === g
      );
    });
}

function renderFeatured(){

  const box = $("featuredWrap");

  if(!state.featured){
    box.innerHTML =
      `<div class="empty">No featured match</div>`;
    return;
  }

  const m = state.featured;

  box.innerHTML = `
    <div class="match"
      onclick="openDetails('${esc(m.fixtureId)}')">

      <div class="match-top">

        <div>
          <div class="match-teams">
            ${esc(m.home)}
            vs
            ${esc(m.away)}
          </div>

          <div class="match-meta">
            <span class="pill">
              ${esc(m.phase)}
            </span>

            <span class="pill">
              ${esc(m.competition)}
            </span>
          </div>
        </div>

        <div class="match-score">
          ${esc(m.score || "—")}
        </div>

      </div>
    </div>
  `;
}

function renderMatches(){

  const list = $("matchesList");

  const matches = getFilteredMatches();

  if(!matches.length){
    list.innerHTML =
      `<div class="empty">No matches</div>`;
    return;
  }

  list.innerHTML = matches.map(m => `

    <div class="match"
      onclick="openDetails('${esc(m.fixtureId)}')">

      <div class="match-top">

        <div>

          <div class="match-teams">
            ${esc(m.home)}
            vs
            ${esc(m.away)}
          </div>

          <div class="match-meta">

            <span class="pill">
              ${esc(m.phase)}
            </span>

            <span class="pill">
              ${esc(m.competition)}
            </span>

            <span class="pill">
              #${esc(m.fixtureId)}
            </span>

          </div>

        </div>

        <div class="match-score">
          ${esc(m.score || "—")}
        </div>

      </div>

    </div>

  `).join("");
}

function renderApp(){
  renderGroupButtons();
  renderFeatured();
  renderMatches();
}

async function loadData(){

  $("dashboardHint").textContent =
    "Loading oracle data...";

  try{

    const res = await emit(
      "txline_probe_feed",
      {
        serviceLevelId:12
      }
    );

    state.matches =
      Array.isArray(res.matches)
      ? res.matches
      : [];

    state.featured =
      res.featured || null;

    renderApp();

    $("dashboardHint").textContent =
      "Oracle feed ready";

    $("feedStatus").textContent =
      `Loaded ${state.matches.length} matches`;

  }catch(e){

    $("dashboardHint").textContent =
      "Load failed";

    $("feedStatus").textContent =
      e.message;

    console.error(e);
  }
}

async function openDetails(fixtureId){

  try{

    const d = await emit(
      "txline_fixture_details",
      {
        serviceLevelId:12,
        fixtureId,
        eventLimit:999,
        oddsLimit:999
      }
    );

    console.log(
      "fixture_details",
      d
    );

    alert(
      `${d.current?.home || ""} vs ${d.current?.away || ""}\n\n` +
      `Score: ${d.current?.score || "—"}\n` +
      `Status: ${d.current?.status || ""}`
    );

  }catch(e){

    alert(
      `Details failed\n\n${e.message}`
    );
  }
}



async function checkToken() {
  try {
    const res = await emit("txline_check_token", {
      serviceLevelId: 12
    });

    if (!res?.ok) {
      alert(
        `TxLINE token check failed.\n\n${
          res?.error || "Unknown error."
        }`
      );
      return;
    }

    const lines = ["Status: OK"];

    if (res.serviceLevelId != null) {
      lines.push(`Service Level: ${res.serviceLevelId}`);
    }

    if (res.tokenLooksPresent != null) {
      lines.push(
        `API Token: ${res.tokenLooksPresent ? "present" : "missing"}`
      );
    }

    if (res.jwtLooksPresent != null) {
      lines.push(
        `JWT: ${res.jwtLooksPresent ? "present" : "missing"}`
      );
    }

    if (res.auth?.exp != null) {
      lines.push(
        `Expires: ${new Date(res.auth.exp).toLocaleString()}`
      );
    }

    if (Array.isArray(res.results)) {
      const okCount = res.results.filter(r => r?.ok).length;
      lines.push(`Checks: ${okCount}/${res.results.length}`);
    }

    alert(lines.join("\n"));
  } catch (e) {
    alert(
      `Token check failed.\n\n${
        e?.message || String(e)
      }`
    );
  }
}



$("refreshBtn")
  .addEventListener(
    "click",
    loadData
  );

$("checkTokenBtn")
  .addEventListener(
    "click",
    checkToken
  );

$("searchInput")
  .addEventListener(
    "input",
    e=>{
      state.query = e.target.value;
      renderMatches();
    }
  );

document
.querySelectorAll("#groupButtons button")
.forEach(btn=>{
  btn.addEventListener("click",()=>{
    state.group =
      btn.dataset.group;

    renderApp();
  });
});

window.openDetails =
  openDetails;

loadData();
</script>
</body>
</html>
