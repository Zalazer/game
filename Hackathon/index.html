<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FIFA 2026 Live</title>
  <style>
    :root{color-scheme:dark}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0b0f14;color:#e8eef5}
    .app{max-width:1200px;margin:0 auto;padding:18px}
    .topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    h1{margin:0;font-size:24px}
    .muted{color:#8da0b3}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    button{background:#1f2a37;color:#fff;border:1px solid #314355;border-radius:10px;padding:10px 14px;cursor:pointer}
    button:hover{background:#273445}
    .status{margin:16px 0;padding:12px 14px;border:1px solid #253243;border-radius:12px;background:#101722}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
    .tab{padding:8px 12px;border:1px solid #2a3a4c;border-radius:999px;background:#111924;color:#d9e2ec;display:inline-flex;align-items:center;gap:8px}
    .tab strong{font-size:14px;min-width:20px;text-align:right;color:#fff;background:#1f2a37;border:1px solid #314355;border-radius:999px;padding:2px 8px}
    .tab.active{background:#214060;border-color:#3d6b9b}
    .grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}
    @media (max-width: 900px){.grid{grid-template-columns:1fr}}
    .card{border:1px solid #263244;border-radius:16px;background:#0f1620;overflow:hidden}
    .card h2{margin:0;padding:14px 16px;border-bottom:1px solid #263244;font-size:18px}
    .card .body{padding:14px 16px}
    .featured{display:grid;gap:10px;padding:14px 16px}
    .match{padding:12px 14px;border-top:1px solid #1f2b3a}
    .match:first-child{border-top:0}
    .match-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .teams{font-weight:700}
    .score{font-size:18px;font-weight:800}
    .meta{margin-top:6px;font-size:13px;color:#97a9bb;display:flex;gap:10px;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#162131;border:1px solid #243447}
    .list-empty{padding:18px;color:#8da0b3}
    .small{font-size:12px}
    .loading{opacity:.9}
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div>
        <h1>FIFA 2026 Live</h1>
        <div class="muted">TxLINE frontend rebuilt from worker contract</div>
      </div>
      <div class="actions">
        <button id="refreshBtn">Refresh</button>
        <button id="checkTokenBtn">Check token</button>
      </div>
    </div>

    <div id="oracleStatus" class="status loading">Loading oracle data…</div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="all"><span>All</span><strong id="cntAll">0</strong></button>
      <button class="tab" data-tab="live"><span>Live</span><strong id="cntLive">0</strong></button>
      <button class="tab" data-tab="upcoming"><span>Upcoming</span><strong id="cntUpcoming">0</strong></button>
      <button class="tab" data-tab="finished"><span>Finished</span><strong id="cntFinished">0</strong></button>
      <button class="tab" data-tab="stopped"><span>Stopped</span><strong id="cntStopped">0</strong></button>
      <button class="tab" data-tab="favorites"><span>Favorites</span><strong id="cntFavorites">0</strong></button>
    </div>

    <div class="grid">
      <section class="card">
        <h2>Match Dashboard</h2>
        <div class="body">
          <div id="matchesList" class="loading">Loading matches…</div>
        </div>
      </section>

      <aside class="card">
        <h2>Featured</h2>
        <div id="featuredBox" class="featured loading">Loading oracle feed…</div>
      </aside>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://game.shooleeyack.workers.dev';
    let appState = { ok:false, matches:[], grouped:{}, featured:null, enrichment:null, debug:null, activeTab:'all' };

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const num = v => Number.isFinite(Number(v)) ? Number(v) : 0;

    function groupedFor(tab){
      const g = appState.grouped || {};
      if (tab === 'all') return appState.matches || [];
      return g[tab] || [];
    }

    function renderCounts(){
      const g = appState.grouped || {};
      $('cntAll').textContent = (appState.matches || []).length;
      $('cntLive').textContent = (g.live || []).length;
      $('cntUpcoming').textContent = (g.upcoming || []).length;
      $('cntFinished').textContent = (g.finished || []).length;
      $('cntStopped').textContent = (g.stopped || []).length;
      $('cntFavorites').textContent = (g.favorites || []).length;
    }

    function renderFeatured(){
      const f = appState.featured;
      const box = $('featuredBox');
      if (!f) { box.classList.remove('loading'); box.innerHTML = '<div class="list-empty">No featured match</div>'; return; }
      const home = esc(f.home || f.homeTeam || f.Participant1 || f.participant1 || 'Home');
      const away = esc(f.away || f.awayTeam || f.Participant2 || f.participant2 || 'Away');
      const score = esc(f.score || `${f.homeScore ?? '—'}-${f.awayScore ?? '—'}`);
      const status = esc(f.status || f.phase || f.gameState || 'Unknown');
      const time = esc(f.kickoff || f.startTime || '');
      box.classList.remove('loading');
      box.innerHTML = `
        <div class="match-top"><div class="teams">${home} vs ${away}</div><div class="score">${score}</div></div>
        <div class="meta"><span class="pill">${status}</span>${time ? `<span class="pill">${time}</span>` : ''}${f.competition ? `<span class="pill">${esc(f.competition)}</span>` : ''}</div>
        <div class="small muted">${esc(f.currentSource || 'fixture')} · events ${num(f.eventsCount)} · snapshot ${num(f.snapshotCount)} · historical ${num(f.historicalCount)}</div>
      `;
    }

    function renderMatches(){
      const tab = appState.activeTab;
      const list = groupedFor(tab);
      const host = $('matchesList');
      if (!list.length) { host.classList.remove('loading'); host.innerHTML = '<div class="list-empty">No matches in this category.</div>'; return; }
      host.classList.remove('loading');
      host.innerHTML = list.map(m => {
        const home = esc(m.home || m.homeTeam || m.Participant1 || m.participant1 || 'Home');
        const away = esc(m.away || m.awayTeam || m.Participant2 || m.participant2 || 'Away');
        const score = esc(m.score || `${m.homeScore ?? '—'}-${m.awayScore ?? '—'}`);
        const status = esc(m.status || m.phase || m.gameState || 'Unknown');
        const competition = esc(m.competition || m.Competition || '');
        const kickoff = esc(m.kickoff || m.startTime || m.StartTime || '');
        return `
          <div class="match">
            <div class="match-top">
              <div class="teams">${home} <span class="muted">vs</span> ${away}</div>
              <div class="score">${score}</div>
            </div>
            <div class="meta">
              <span class="pill">${status}</span>
              ${kickoff ? `<span class="pill">${kickoff}</span>` : ''}
              ${competition ? `<span class="pill">${competition}</span>` : ''}
              ${m.favorite ? '<span class="pill">Favorite</span>' : ''}
            </div>
          </div>`;
      }).join('');
    }

    function render(){ renderCounts(); renderFeatured(); renderMatches(); }

    function setTab(tab){
      appState.activeTab = tab;
      document.querySelectorAll('.tab').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
      renderMatches();
    }

    async function loadData(force=false){
      $('oracleStatus').textContent = 'Loading oracle data…';
      $('oracleStatus').classList.add('loading');
      const url = `${WORKER_URL}/txline_probe_feed${force ? '?force=1' : ''}`;
      try {
        const resp = await fetch(url, { credentials:'omit' });
        const data = await resp.json();
        appState.ok = !!data.ok;
        appState.matches = data.matches || [];
        appState.grouped = data.grouped || {};
        appState.featured = data.featured || null;
        appState.enrichment = data.enrichment || null;
        appState.debug = data.debug || null;
        $('oracleStatus').classList.remove('loading');
        $('oracleStatus').textContent = data.ok ? `Loaded ${appState.matches.length} matches` : `Load failed: ${data.error || data.status || 'unknown'}`;
        render();
      } catch (e) {
        appState.ok = false;
        $('oracleStatus').classList.remove('loading');
        $('oracleStatus').textContent = `Load failed: ${e.message || e}`;
        renderCounts();
        $('matchesList').innerHTML = '<div class="list-empty">Loading matches…</div>';
        $('featuredBox').innerHTML = '<div class="list-empty">Loading oracle feed…</div>';
      }
    }

    async function checkToken(){
      const url = `${WORKER_URL}/txline_check_token`;
      try {
        const resp = await fetch(url, { credentials:'omit' });
        const data = await resp.json();
        $('oracleStatus').textContent = data.ok ? 'Token OK' : `Token failed: ${data.error || 'unknown'}`;
      } catch (e) {
        $('oracleStatus').textContent = `Token failed: ${e.message || e}`;
      }
    }

    $('refreshBtn').addEventListener('click', () => loadData(true));
    $('checkTokenBtn').addEventListener('click', checkToken);
    document.getElementById('tabs').addEventListener('click', e => {
      const b = e.target.closest('.tab');
      if (!b) return;
      setTab(b.dataset.tab);
    });

    loadData();
  </script>
</body>
</html>
