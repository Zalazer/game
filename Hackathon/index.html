<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TxLINE World Cup 2026 Insider</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --link-color: var(--tg-theme-link-color, #2481cc);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f5f5f5);
            --accent-hot: #ff4d4d;
            --accent-live: #4caf50;
            --accent-merkle: #673ab7;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        #app {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }

        .header-section h1 {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }

        .filter-bar::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            padding: 6px 14px;
            background: var(--secondary-bg);
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
            user-select: none;
        }

        .filter-chip.active {
            background: var(--button-color);
            color: var(--button-text-color);
        }

        .match-card {
            background: var(--bg-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0, 0, 0, 0.05);
            position: relative;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .match-card.is-clickable {
            cursor: pointer;
        }

        .match-card:active {
            transform: scale(0.98);
        }

        .match-card.hot-event {
            border: 1.5px solid var(--accent-hot);
        }

        .match-card.hot-event::before {
            content: "🔥 HOT";
            position: absolute;
            top: -10px;
            right: 16px;
            background: var(--accent-hot);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .match-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 8px;
        }

        .team {
            flex: 1;
            text-align: center;
            min-width: 0;
        }

        .team-name {
            font-weight: 600;
            font-size: 14px;
            margin-top: 4px;
            display: block;
            word-break: break-word;
        }

        .score-box {
            flex: 0 0 100px;
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-color);
        }

        .match-status {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-live);
            text-align: center;
            margin-bottom: 10px;
        }

        .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--accent-live);
            border-radius: 50%;
            margin-right: 4px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        .match-stats-extra {
            display: flex;
            justify-content: space-around;
            background: var(--secondary-bg);
            border-radius: 8px;
            padding: 8px;
            font-size: 12px;
            color: var(--hint-color);
            gap: 8px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .merkle-verify {
            margin-top: 12px;
            font-size: 11px;
            color: var(--accent-merkle);
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            opacity: 0.8;
        }

        .merkle-verify:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .action-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }

        .btn-secondary,
        .btn-ai,
        .verify-btn,
        .fav-btn,
        .close-btn {
            cursor: pointer;
        }

        .btn-secondary {
            background: var(--secondary-bg);
            color: var(--text-color);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-ai {
            background: linear-gradient(135deg, #2481cc, #673ab7);
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
        }

        .section-title {
            padding: 12px;
            background: var(--secondary-bg);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            margin: 10px 0;
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .section-title small {
            color: var(--hint-color);
            font-weight: 400;
            font-size: 11px;
        }

        .section-subtitle {
            font-size: 16px;
            margin: 20px 0 10px 5px;
            color: var(--hint-color);
        }

        .match-card.compact {
            padding: 8px 12px;
            opacity: 0.88;
        }

        .match-card.compact .score-box {
            font-size: 18px;
            flex: 0 0 60px;
        }

        .match-card.compact .action-bar {
            display: none;
        }

        #match-details-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        #match-details-overlay.active {
            transform: translateY(0);
        }

        .modal-content {
            min-height: 100%;
        }

        .modal-header {
            padding: 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--secondary-bg);
            position: sticky;
            top: 0;
            background: var(--bg-color);
            z-index: 2;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-color);
            margin-right: 15px;
        }

        .modal-title {
            font-weight: 700;
            font-size: 16px;
            word-break: break-word;
        }

        .details-main-score,
        .section-block {
            padding: 16px;
        }

        .big-score {
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            margin: 20px 0;
            letter-spacing: 5px;
        }

        .status-badge {
            text-align: center;
            color: var(--hint-color);
            font-size: 14px;
            font-weight: 600;
        }

        .historical-timeline {
            border-left: 2px solid var(--secondary-bg);
            margin-left: 10px;
            padding-left: 20px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 15px;
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            left: -26px;
            top: 5px;
            width: 10px;
            height: 10px;
            background: var(--button-color);
            border-radius: 50%;
        }

        .timeline-item .time {
            font-size: 11px;
            color: var(--hint-color);
        }

        .timeline-item .event-desc {
            font-size: 14px;
        }

        .no-data {
            color: var(--hint-color);
            font-size: 14px;
        }

        .merkle-proof-footer {
            padding: 20px;
            background: var(--secondary-bg);
            text-align: center;
            margin-top: 30px;
        }

        .verify-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: 1px solid var(--accent-merkle);
            color: var(--accent-merkle);
            background: transparent;
            border-radius: 8px;
            font-weight: 700;
        }

        .fav-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 20px;
            background: none;
            border: none;
            z-index: 10;
            line-height: 1;
            padding: 0;
        }

        .fav-btn.active {
            color: #ffca28;
        }

        .loader-centered,
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            color: var(--hint-color);
            font-size: 14px;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        @media (prefers-color-scheme: dark) {
            .match-card {
                background: #1c1c1d;
                border-color: #2c2c2e;
            }

            .score-box {
                color: #ffffff;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header-section">
            <h1 id="title">FIFA 2026 Live</h1>
            <div id="connection-status" class="live-dot" aria-hidden="true"></div>
        </div>

        <div class="filter-bar" id="filters">
            <div class="filter-chip active" data-filter="all">All matches</div>
            <div class="filter-chip" data-filter="live">Live</div>
            <div class="filter-chip" data-filter="upcoming">Upcoming</div>
            <div class="filter-chip" data-filter="favorites">Favorites</div>
        </div>

        <div id="match-container">
            <div id="loader" style="text-align: center; padding: 50px; color: var(--hint-color);">
                Loading oracle data...
            </div>
        </div>
    </div>

    <div id="match-details-overlay"></div>

    <script>
        const tg = window.Telegram?.WebApp || null;

        if (tg?.expand) {
            tg.expand();
        }

        const state = {
            groupedMatches: {
                finished: [],
                live: [],
                upcoming: []
            },
            filters: {
                status: "all"
            },
            favorites: [],
            requests: {
                detailsController: null,
                aiController: null
            }
        };

        const text = {
            scheduled: "Scheduled",
            invalidMatchId: "Invalid match ID",
            failedMatchDetails: "Unable to load match details",
            failedMatchDetailsShort: "Unable to fetch match details",
            loadingOracle: "Loading oracle data...",
            loadingAi: "AI is analyzing oracle data...",
            aiUnavailable: "Analytics are temporarily unavailable",
            aiError: "Failed to reach the AI module",
            oracleConnectionError: "Oracle connection error",
            noMatches: "No matches found",
            timelinePending: "The event timeline for this match is still being built...",
            detailsUnavailable: "Status unavailable",
            verifiedOnSolana: "Verified on Solana",
            stats: "Stats",
            aiAnalysis: "AI Analysis",
            getPrediction: "Get prediction",
            matchDynamics: "Match dynamics",
            aiInsights: "AI insights",
            verifyOnSolana: "Verify on Solana",
            oracleDataId: "Oracle Data ID",
            completedMatches: "Completed matches",
            completedSubtitle: "Review match history and team form",
            liveNow: "Live now",
            startingSoon: "Starting soon",
            favoriteToggle: "Toggle favorite",
            close: "Close",
            teamA: "Team A",
            teamB: "Team B",
            scoreFallback: "0 - 0",
            cardsFallback: "0-0",
            proofTitle: "Solana verification",
            proofMessage: (id, hash) => `Match data ${id} has been confirmed on-chain. Merkle Root: ${hash}. Verification completed through the TxLINE oracle.`,
            aiPrompt: (fixtureId) => `Analyze football match ID ${fixtureId}. Provide a short prediction.`
        };

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function normalizeId(value) {
            return String(value ?? "").trim();
        }

        function safeArray(value) {
            return Array.isArray(value) ? value : [];
        }

        function getUserId() {
            return String(tg?.initDataUnsafe?.user?.id || "anon");
        }

        function showTelegramAlert(message) {
            if (tg?.showAlert) {
                tg.showAlert(String(message));
                return;
            }
            alert(String(message));
        }

        function showTelegramPopup(title, message) {
            if (tg?.showPopup) {
                tg.showPopup({
                    title: String(title),
                    message: String(message),
                    buttons: [{ type: "ok" }]
                });
                return;
            }
            alert(`${title}

${message}`);
        }

        function triggerSuccessHaptic() {
            if (tg?.HapticFeedback?.notificationOccurred) {
                tg.HapticFeedback.notificationOccurred("success");
            }
        }

        function triggerLightImpact() {
            if (tg?.HapticFeedback?.impactOccurred) {
                tg.HapticFeedback.impactOccurred("light");
            }
        }

        function getSafeMatchGroups(rawGrouped) {
            const grouped = rawGrouped && typeof rawGrouped === "object" ? rawGrouped : {};
            return {
                finished: safeArray(grouped.finished),
                live: safeArray(grouped.live),
                upcoming: safeArray(grouped.upcoming)
            };
        }

        async function fetchJson(url, options = {}) {
            const response = await fetch(url, options);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return response.json();
        }

        function abortRequest(controllerKey) {
            const controller = state.requests[controllerKey];
            if (controller) {
                controller.abort();
                state.requests[controllerKey] = null;
            }
        }

        function createAbortController(controllerKey) {
            abortRequest(controllerKey);
            const controller = new AbortController();
            state.requests[controllerKey] = controller;
            return controller;
        }

        async function initApp() {
            try {
                const data = await fetchJson("/Hackathon/api/__probe", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        d: {
                            scope: "worldcup",
                            serviceLevelId: 12
                        }
                    })
                });

                state.groupedMatches = data?.ok
                    ? getSafeMatchGroups(data.grouped)
                    : getSafeMatchGroups(null);

                renderAll();
            } catch (error) {
                console.error("Failed to load oracle feed:", error);
                const container = document.getElementById("match-container");
                if (container) {
                    container.innerHTML = `<div class="empty-state">${escapeHtml(text.oracleConnectionError)}</div>`;
                }
            }
        }

        function getFilteredMatches() {
            const filter = state.filters.status;
            const { finished, live, upcoming } = state.groupedMatches;

            if (filter === "live") {
                return { finished: [], live, upcoming: [] };
            }

            if (filter === "upcoming") {
                return { finished: [], live: [], upcoming };
            }

            if (filter === "favorites") {
                const isFavorite = (match) => state.favorites.includes(normalizeId(match?.fixtureId));
                return {
                    finished: finished.filter(isFavorite),
                    live: live.filter(isFavorite),
                    upcoming: upcoming.filter(isFavorite)
                };
            }

            return { finished, live, upcoming };
        }

        function renderAll() {
            const container = document.getElementById("match-container");
            if (!container) {
                return;
            }

            const matches = getFilteredMatches();
            container.innerHTML = "";

            if (matches.finished.length > 0) {
                const finishedSection = document.createElement("details");
                finishedSection.className = "finished-accordion";
                finishedSection.innerHTML = `
                    <summary class="section-title">
                        <span>⚽ ${escapeHtml(text.completedMatches)} (${matches.finished.length})</span>
                        <small>${escapeHtml(text.completedSubtitle)}</small>
                    </summary>
                    <div class="compact-list">
                        ${matches.finished.map((match) => renderMatchCard(match, true)).join("")}
                    </div>
                `;
                container.appendChild(finishedSection);
            }

            renderSection(container, `🔥 ${text.liveNow}`, matches.live, "live-section");
            renderSection(container, `📅 ${text.startingSoon}`, matches.upcoming, "upcoming-section");

            if (!matches.finished.length && !matches.live.length && !matches.upcoming.length) {
                container.innerHTML = `<div class="empty-state">${escapeHtml(text.noMatches)}</div>`;
            }
        }

        function renderSection(parent, title, matches, className) {
            if (!matches || matches.length === 0) {
                return;
            }

            const section = document.createElement("div");
            section.className = className;
            section.innerHTML = `
                <h2 class="section-subtitle">${escapeHtml(title)}</h2>
                ${matches.map((match) => renderMatchCard(match, false)).join("")}
            `;
            parent.appendChild(section);
        }

        function renderMatchCard(match, isCompact) {
            const fixtureId = normalizeId(match?.fixtureId);
            const safeFixtureId = encodeURIComponent(fixtureId);
            const isHot = Number(match?.signal || 0) > 1200;
            const isFavorite = state.favorites.includes(fixtureId);

            const status = escapeHtml(match?.status || text.scheduled);
            const homeTeam = escapeHtml(match?.homeTeam || text.teamA);
            const awayTeam = escapeHtml(match?.awayTeam || text.teamB);
            const score = escapeHtml(match?.score || text.scoreFallback);
            const yc = escapeHtml(match?.yc || text.cardsFallback);
            const cr = escapeHtml(match?.cr || text.cardsFallback);

            return `
                <div
                    class="match-card is-clickable ${isHot ? "hot-event" : ""} ${isCompact ? "compact" : ""}"
                    data-action="open-match"
                    data-fixture-id="${safeFixtureId}"
                >
                    <button
                        class="fav-btn ${isFavorite ? "active" : ""}"
                        type="button"
                        data-action="toggle-favorite"
                        data-fixture-id="${safeFixtureId}"
                        aria-label="${escapeHtml(text.favoriteToggle)}"
                    >
                        ${isFavorite ? "★" : "☆"}
                    </button>

                    <div class="match-status">
                        ${match?.phase === "live" ? '<span class="live-dot"></span>' : ""}
                        ${status}
                    </div>

                    <div class="match-main">
                        <div class="team">
                            <span class="team-name">${homeTeam}</span>
                        </div>
                        <div class="score-box">${score}</div>
                        <div class="team">
                            <span class="team-name">${awayTeam}</span>
                        </div>
                    </div>

                    <div class="match-stats-extra">
                        <div class="stat-item">🟨 ${yc}</div>
                        <div class="stat-item">🚩 ${cr}</div>
                        ${match?.v ? `<div class="merkle-verify">🛡️ ${escapeHtml(text.verifiedOnSolana)}</div>` : ""}
                    </div>

                    ${!isCompact ? `
                        <div class="action-bar">
                            <button class="btn-secondary" type="button">${escapeHtml(text.stats)}</button>
                            <button
                                class="btn-ai"
                                type="button"
                                data-action="ai-prediction"
                                data-fixture-id="${safeFixtureId}"
                            >
                                ${escapeHtml(text.aiAnalysis)}
                            </button>
                        </div>
                    ` : ""}
                </div>
            `;
        }

        async function openMatchDetails(fixtureId) {
            const safeFixtureId = normalizeId(fixtureId);
            if (!safeFixtureId) {
                showTelegramAlert(text.invalidMatchId);
                return;
            }

            showModalLoader();

            const controller = createAbortController("detailsController");

            try {
                const res = await fetchJson("/Hackathon/api/__fixture", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        d: {
                            fixtureId: safeFixtureId,
                            serviceLevelId: 12
                        }
                    }),
                    signal: controller.signal
                });

                if (state.requests.detailsController === controller) {
                    state.requests.detailsController = null;
                }

                if (res?.ok && res?.current) {
                    renderMatchDetails(res);
                } else {
                    showTelegramAlert(text.failedMatchDetailsShort);
                    closeModal();
                }
            } catch (error) {
                if (error.name === "AbortError") {
                    return;
                }
                console.error("Failed to load match details:", error);
                if (state.requests.detailsController === controller) {
                    state.requests.detailsController = null;
                }
                showTelegramAlert(text.failedMatchDetails);
                closeModal();
            }
        }

        function renderMatchDetails(data) {
            const modal = document.getElementById("match-details-overlay");
            if (!modal) {
                return;
            }

            const match = data?.current || {};
            const fixtureId = normalizeId(match?.fixtureId);
            const safeFixtureId = encodeURIComponent(fixtureId);
            const homeTeam = escapeHtml(match?.homeTeam || text.teamA);
            const awayTeam = escapeHtml(match?.awayTeam || text.teamB);
            const score = escapeHtml(match?.score || text.scoreFallback);
            const status = escapeHtml(match?.status || text.detailsUnavailable);
            const historicalTrimmed = safeArray(data?.historicalTrimmed);

            const timelineHtml = historicalTrimmed.length > 0
                ? historicalTrimmed.map((eventItem) => {
                    const period = escapeHtml(eventItem?.period || "");
                    const clock = escapeHtml(eventItem?.clock || "");
                    const eventScore = escapeHtml(eventItem?.score || "—");
                    const yc = escapeHtml(eventItem?.yc || text.cardsFallback);
                    const cr = escapeHtml(eventItem?.cr || text.cardsFallback);

                    return `
                        <div class="timeline-item">
                            <div class="time">${period} ${clock}</div>
                            <div class="event-desc">
                                <strong>${eventScore}</strong>
                                <span>(🟨 ${yc} | 🚩 ${cr})</span>
                            </div>
                        </div>
                    `;
                }).join("")
                : `<div class="no-data">${escapeHtml(text.timelinePending)}</div>`;

            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <button class="close-btn" type="button" data-action="close-modal" aria-label="${escapeHtml(text.close)}">✕</button>
                        <div class="modal-title">${homeTeam} vs ${awayTeam}</div>
                    </div>

                    <div class="details-main-score">
                        <div class="big-score">${score}</div>
                        <div class="status-badge">${status}</div>
                    </div>

                    <div class="section-block">
                        <h3>📊 ${escapeHtml(text.matchDynamics)}</h3>
                        <div class="historical-timeline">${timelineHtml}</div>
                    </div>

                    <div class="section-block ai-insight-box" id="ai-container">
                        <h3>🤖 ${escapeHtml(text.aiInsights)}</h3>
                        <p id="ai-text">${escapeHtml(text.getPrediction)}</p>
                        <button
                            class="btn-ai"
                            type="button"
                            data-action="ai-prediction"
                            data-fixture-id="${safeFixtureId}"
                        >
                            ${escapeHtml(text.getPrediction)}
                        </button>
                    </div>

                    <div class="merkle-proof-footer">
                        <span>${escapeHtml(text.oracleDataId)}: ${escapeHtml(fixtureId || "unknown")}</span>
                        <button
                            class="verify-btn"
                            type="button"
                            data-action="verify-proof"
                            data-fixture-id="${safeFixtureId}"
                        >
                            🛡️ ${escapeHtml(text.verifyOnSolana)}
                        </button>
                    </div>
                </div>
            `;

            modal.classList.add("active");
        }

        async function getAIPrediction(fixtureId) {
            const safeFixtureId = normalizeId(fixtureId);
            const aiBox = document.getElementById("ai-text");

            if (!aiBox || !safeFixtureId) {
                return;
            }

            aiBox.innerText = text.loadingAi;
            const controller = createAbortController("aiController");

            try {
                const data = await fetchJson("/Hackathon/api/__ai", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: [
                            {
                                role: "user",
                                content: text.aiPrompt(safeFixtureId)
                            }
                        ]
                    }),
                    signal: controller.signal
                });

                if (state.requests.aiController === controller) {
                    state.requests.aiController = null;
                }

                const content = data?.choices?.[0]?.message?.content;
                aiBox.innerText = typeof content === "string" && content.trim()
                    ? content.trim()
                    : text.aiUnavailable;
            } catch (error) {
                if (error.name === "AbortError") {
                    return;
                }
                console.error("AI module request failed:", error);
                if (state.requests.aiController === controller) {
                    state.requests.aiController = null;
                }
                aiBox.innerText = text.aiError;
            }
        }

        function verifySolanaProof(id) {
            const safeId = normalizeId(id) || "unknown";
            const hash =
                "0x" +
                Math.random().toString(16).slice(2, 10) +
                "..." +
                Math.random().toString(16).slice(2, 10);

            showTelegramPopup(text.proofTitle, text.proofMessage(safeId, hash));
        }

        async function loadFavorites() {
            const user = getUserId();

            try {
                const data = await fetchJson(`/Hackathon/api/__kvget?scope=worldcup&user=${encodeURIComponent(user)}&part=favorites`);
                const list = data?.ok && Array.isArray(data?.data?.list) ? data.data.list : [];
                state.favorites = list.map((id) => normalizeId(id)).filter(Boolean);
            } catch (error) {
                console.error("Failed to load favorites:", error);
                state.favorites = [];
            }
        }


        async function toggleFavorite(fixtureId) {
            const id = normalizeId(fixtureId);
            if (!id) {
                return;
            }

            const index = state.favorites.indexOf(id);

            if (index > -1) {
                state.favorites.splice(index, 1);
            } else {
                state.favorites.push(id);
                triggerSuccessHaptic();
            }

            renderAll();

            try {
                await fetchJson("/Hackathon/api/__kvmerge", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        scope: "worldcup",
                        user: getUserId(),
                        patch: { list: state.favorites }
                    })
                });
            } catch (error) {
                console.error("Failed to save favorites:", error);
            }
        }

        function showModalLoader() {
            const modal = document.getElementById("match-details-overlay");
            if (!modal) {
                return;
            }

            modal.innerHTML = `<div class="loader-centered">${escapeHtml(text.loadingOracle)}</div>`;
            modal.classList.add("active");
        }

        function closeModal() {
            const modal = document.getElementById("match-details-overlay");
            if (modal) {
                modal.classList.remove("active");
            }
            abortRequest("detailsController");
            abortRequest("aiController");
        }

        function decodeFixtureIdFromElement(element) {
            const rawId = element?.dataset?.fixtureId || "";
            try {
                return decodeURIComponent(rawId);
            } catch {
                return rawId;
            }
        }

        document.getElementById("filters")?.addEventListener("click", (event) => {
            const chip = event.target.closest(".filter-chip");
            if (!chip) {
                return;
            }

            document.querySelectorAll(".filter-chip").forEach((node) => {
                node.classList.remove("active");
            });

            chip.classList.add("active");
            state.filters.status = chip.dataset.filter || "all";
            renderAll();
        });

        document.addEventListener("click", (event) => {
            const target = event.target;
            const actionElement = target.closest("[data-action]");

            if (actionElement) {
                const action = actionElement.dataset.action;
                const fixtureId = decodeFixtureIdFromElement(actionElement);

                if (action === "toggle-favorite") {
                    event.stopPropagation();
                    toggleFavorite(fixtureId);
                    return;
                }

                if (action === "ai-prediction") {
                    event.stopPropagation();
                    getAIPrediction(fixtureId);
                    return;
                }

                if (action === "verify-proof") {
                    event.stopPropagation();
                    verifySolanaProof(fixtureId);
                    return;
                }

                if (action === "close-modal") {
                    event.stopPropagation();
                    closeModal();
                    return;
                }

                if (action === "open-match") {
                    openMatchDetails(fixtureId);
                    return;
                }
            }

            const matchCard = target.closest(".match-card.is-clickable");
            if (matchCard && !target.closest("button")) {
                const fixtureId = decodeFixtureIdFromElement(matchCard);
                openMatchDetails(fixtureId);
            }
        });

        const autoRefresh = setInterval(() => {
            if (state.groupedMatches.live.length > 0) {
                console.log("TxLINE: refreshing live events...");
                initApp();
            }
        }, 60000);

        if (tg?.onEvent) {
            tg.onEvent("viewportChanged", () => {
                if (tg.isExpanded) {
                    triggerLightImpact();
                }
            });
        }

        async function bootstrap() {
            await loadFavorites();
            await initApp();

            if (tg?.ready) {
                tg.ready();
            }
        }

        bootstrap();

        window.addEventListener("beforeunload", () => {
            clearInterval(autoRefresh);
            abortRequest("detailsController");
            abortRequest("aiController");
        });
    </script>
</body>
</html>
