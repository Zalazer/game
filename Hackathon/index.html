<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TxLINE World Cup 2026 Insider</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --link-color: var(--tg-theme-link-color, #2481cc);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f5f5f5);
            --accent-hot: #ff4d4d;
            --accent-live: #4caf50;
            --accent-merkle: #673ab7;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
        }
        button, input, textarea, select { font: inherit; }
        #app { padding: 16px; max-width: 600px; margin: 0 auto; }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }
        .header-section h1 {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 6px 14px;
            background: var(--secondary-bg);
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
            user-select: none;
        }
        .filter-chip.active {
            background: var(--button-color);
            color: var(--button-text-color);
        }
        .match-card {
            background: var(--bg-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0, 0, 0, 0.05);
            position: relative;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .match-card.is-clickable { cursor: pointer; }
        .match-card:active { transform: scale(0.98); }
        .match-card.hot-event {
            border: 1.5px solid var(--accent-hot);
        }
        .match-card.hot-event::before {
            content: "🔥 HOT";
            position: absolute;
            top: -10px;
            right: 16px;
            background: var(--accent-hot);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .match-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 8px;
        }
        .team { flex: 1; text-align: center; min-width: 0; }
        .team-name {
            font-weight: 600;
            font-size: 14px;
            margin-top: 4px;
            display: block;
            word-break: break-word;
        }
        .score-box {
            flex: 0 0 100px;
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-color);
        }
        .match-status {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-live);
            text-align: center;
            margin-bottom: 10px;
        }
        .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--accent-live);
            border-radius: 50%;
            margin-right: 4px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        .match-stats-extra {
            display: flex;
            justify-content: space-around;
            background: var(--secondary-bg);
            border-radius: 8px;
            padding: 8px;
            font-size: 12px;
            color: var(--hint-color);
            gap: 8px;
            flex-wrap: wrap;
        }
        .stat-item { display: flex; align-items: center; gap: 4px; }
        .merkle-verify {
            margin-top: 12px;
            font-size: 11px;
            color: var(--accent-merkle);
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            opacity: 0.8;
        }
        .merkle-verify:hover { opacity: 1; text-decoration: underline; }
        .action-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }
        .btn-secondary,
        .btn-ai,
        .verify-btn,
        .fav-btn,
        .close-btn { cursor: pointer; }
        .btn-secondary {
            background: var(--secondary-bg);
            color: var(--text-color);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
        }
        .btn-ai {
            background: linear-gradient(135deg, #2481cc, #673ab7);
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
        }
        .section-title {
            padding: 12px;
            background: var(--secondary-bg);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            margin: 10px 0;
            list-style: none;
            display: flex;
            flex-direction: column;
        }
        .section-title small {
            color: var(--hint-color);
            font-weight: 400;
            font-size: 11px;
        }
        .section-subtitle {
            font-size: 16px;
            margin: 20px 0 10px 5px;
            color: var(--hint-color);
        }
        .match-card.compact {
            padding: 8px 12px;
            opacity: 0.88;
        }
        .match-card.compact .score-box {
            font-size: 18px;
            flex: 0 0 60px;
        }
        .match-card.compact .action-bar { display: none; }
        #match-details-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        #match-details-overlay.active { transform: translateY(0); }
        .modal-content { min-height: 100%; }
        .modal-header {
            padding: 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--secondary-bg);
            position: sticky;
            top: 0;
            background: var(--bg-color);
            z-index: 2;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-color);
            margin-right: 15px;
        }
        .modal-title {
            font-weight: 700;
            font-size: 16px;
            word-break: break-word;
        }
        .details-main-score,
        .section-block { padding: 16px; }
        .big-score {
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            margin: 20px 0;
            letter-spacing: 5px;
        }
        .status-badge {
            text-align: center;
            color: var(--hint-color);
            font-size: 14px;
            font-weight: 600;
        }
        .historical-timeline {
            border-left: 2px solid var(--secondary-bg);
            margin-left: 10px;
            padding-left: 20px;
        }
        .timeline-item {
            position: relative;
            margin-bottom: 15px;
        }
        .timeline-item::before {
            content: "";
            position: absolute;
            left: -26px;
            top: 5px;
            width: 10px;
            height: 10px;
            background: var(--button-color);
            border-radius: 50%;
        }
        .timeline-item .time {
            font-size: 11px;
            color: var(--hint-color);
        }
        .timeline-item .event-desc { font-size: 14px; }
        .no-data {
            color: var(--hint-color);
            font-size: 14px;
        }
        .merkle-proof-footer {
            padding: 20px;
            background: var(--secondary-bg);
            text-align: center;
            margin-top: 30px;
        }
        .verify-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: 1px solid var(--accent-merkle);
            color: var(--accent-merkle);
            background: transparent;
            border-radius: 8px;
            font-weight: 700;
        }
        .fav-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 20px;
            background: none;
            border: none;
            z-index: 10;
            line-height: 1;
            padding: 0;
        }
        .fav-btn.active { color: #ffca28; }
        .loader-centered,
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            color: var(--hint-color);
            font-size: 14px;
            text-align: center;
        }
        .hidden { display: none; }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        @media (prefers-color-scheme: dark) {
            .match-card {
                background: #1c1c1d;
                border-color: #2c2c2e;
            }
            .score-box { color: #ffffff; }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="header-section">
        <h1 id="title">FIFA 2026 Live</h1>
        <div id="connection-status" class="live-dot" aria-hidden="true"></div>
    </div>

    <div class="filter-bar" id="filters">
        <div class="filter-chip active" data-filter="all">All matches</div>
        <div class="filter-chip" data-filter="live">Live</div>
        <div class="filter-chip" data-filter="upcoming">Upcoming</div>
        <div class="filter-chip" data-filter="favorites">Favorites</div>
    </div>

    <div id="match-container">
        <div id="loader" style="text-align: center; padding: 50px; color: var(--hint-color);">
            Loading oracle data...
        </div>
    </div>
</div>

<div id="match-details-overlay"></div>
<input id="workerBase" type="hidden" value="https://game.shooleeyack.workers.dev">

<script>
const tg = window.Telegram?.WebApp || null;
tg?.expand?.();

const state = {
    groupedMatches: {
        live: [],
        upcoming: [],
        finished: [],
        stopped: [],
        unknown: []
    },
    filters: {
        status: "all"
    },
    favorites: [],
    requests: {
        detailsController: null,
        aiController: null
    },
    probe: null
};

const text = {
    scheduled: "Scheduled",
    invalidMatchId: "Invalid match ID",
    failedMatchDetails: "Unable to load match details",
    failedMatchDetailsShort: "Unable to fetch match details",
    loadingOracle: "Loading oracle data...",
    loadingAi: "AI is analyzing oracle data...",
    aiUnavailable: "Analytics are temporarily unavailable",
    aiError: "Failed to reach the AI module",
    oracleConnectionError: "Oracle connection error",
    noMatches: "No matches found",
    timelinePending: "The event timeline for this match is still being built...",
    detailsUnavailable: "Status unavailable",
    verifiedOnSolana: "Verified on Solana",
    stats: "Stats",
    aiAnalysis: "AI Analysis",
    getPrediction: "Get prediction",
    matchDynamics: "Match dynamics",
    aiInsights: "AI insights",
    verifyOnSolana: "Verify on Solana",
    oracleDataId: "Oracle Data ID",
    completedMatches: "Completed matches",
    completedSubtitle: "Review match history and team form",
    liveNow: "Live now",
    startingSoon: "Starting soon",
    favoriteToggle: "Toggle favorite",
    close: "Close",
    teamA: "Team A",
    teamB: "Team B",
    scoreFallback: "—",
    cardsFallback: "0-0",
    proofTitle: "Solana verification",
    proofMessage: (id, hash) =>
        `Match data ${id} has been confirmed on-chain. Merkle Root: ${hash}. Verification completed through the TxLINE oracle.`,
    aiPrompt: (fixtureId) =>
        `Analyze football match ID ${fixtureId}. Provide a short prediction.`
};

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
}

function normalizeId(value) {
    return String(value ?? "").trim();
}

function safeArray(value) {
    return Array.isArray(value) ? value : [];
}

function getUserId() {
    return String(tg?.initDataUnsafe?.user?.id ?? "anon");
}

function showTelegramAlert(message) {
    return tg?.showAlert
        ? tg.showAlert(String(message))
        : alert(String(message));
}

function showTelegramPopup(title, message) {
    if (tg?.showPopup) {
        tg.showPopup({
            title: String(title),
            message: String(message),
            buttons: [{ type: "ok" }]
        });
        return;
    }

    alert(`${title}\n\n${message}`);
}

const triggerSuccessHaptic = () =>
    tg?.HapticFeedback?.notificationOccurred?.("success");

const triggerLightImpact = () =>
    tg?.HapticFeedback?.impactOccurred?.("light");

function getWorkerBase() {
    return (
        document
            .getElementById("workerBase")
            ?.value?.trim()
            ?.replace(/\/$/, "") || ""
    );
}

async function fetchJson(url, options = {}) {
    const response = await fetch(url, options);

    if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
    }

    return response.json();
}

async function emit(payload, signal) {
    const base = getWorkerBase();

    if (!base) {
        throw new Error("Worker URL is empty");
    }

    const ticketResponse = await fetch(`${base}/__ticket`, {
        method: "POST",
        signal
    });

    if (!ticketResponse.ok) {
        throw new Error(`__ticket failed: ${ticketResponse.status}`);
    }

    const { k } = await ticketResponse.json();

    const response = await fetch(`${base}/__emit`, {
        method: "POST",
        signal,
        headers: {
            "content-type": "application/json"
        },
        body: JSON.stringify({
            k,
            d: payload
        })
    });

    const raw = await response.text();

    let body;

    try {
        body = JSON.parse(raw);
    } catch {
        body = raw;
    }

    return {
        ok: response.ok,
        status: response.status,
        body,
        raw
    };
}

function abortRequest(key) {
    state.requests[key]?.abort();
    state.requests[key] = null;
}

function createAbortController(key) {
    abortRequest(key);

    const controller = new AbortController();
    state.requests[key] = controller;

    return controller;
}

async function abortableEmit(controller, payload) {
    return emit(payload, controller.signal);
}









function collectMatchesFromProbe(probe) {
    const grouped = probe?.grouped || {};

    return [
        ...safeArray(grouped.live),
        ...safeArray(grouped.upcoming),
        ...safeArray(grouped.finished),
        ...safeArray(grouped.stopped),
        ...safeArray(grouped.unknown)
    ];
}

function regroupMatches(matches) {
    const grouped = {
        live: [],
        upcoming: [],
        finished: [],
        stopped: [],
        unknown: []
    };

    for (const match of safeArray(matches)) {
        const phase = String(match?.phase || "unknown").toLowerCase();

        switch (phase) {
            case "live":
                grouped.live.push(match);
                break;

            case "finished":
                grouped.finished.push(match);
                break;

            case "stopped":
                grouped.stopped.push(match);
                break;

            case "unknown":
                grouped.unknown.push(match);
                break;

            default:
                grouped.upcoming.push(match);
                break;
        }
    }

    return grouped;
}

function getFilteredMatches() {
    const grouped = state.groupedMatches || {};

    const result = {
        live: safeArray(grouped.live),
        upcoming: safeArray(grouped.upcoming),
        finished: safeArray(grouped.finished),
        stopped: safeArray(grouped.stopped),
        unknown: safeArray(grouped.unknown)
    };

    const filter = String(state.filters.status || "all").toLowerCase();

    if (filter === "favorites") {
        const fav = (m) => state.favorites.includes(normalizeId(m?.fixtureId));

        return {
            live: result.live.filter(fav),
            upcoming: result.upcoming.filter(fav),
            finished: result.finished.filter(fav),
            stopped: result.stopped.filter(fav),
            unknown: result.unknown.filter(fav)
        };
    }

    if (filter !== "all") {
        return {
            live: filter === "live" ? result.live : [],
            upcoming: filter === "upcoming" ? result.upcoming : [],
            finished: filter === "finished" ? result.finished : [],
            stopped: filter === "stopped" ? result.stopped : [],
            unknown: filter === "unknown" ? result.unknown : []
        };
    }

    return result;
}

function renderAll() {
    const container = document.getElementById("match-container");
    if (!container) return;

    container.innerHTML = "";

    const matches = getFilteredMatches();

    if (matches.finished.length) {
        const section = document.createElement("details");
        section.className = "finished-accordion";

        section.innerHTML = `
            <summary class="section-title">
                <span>⚽ ${escapeHtml(text.completedMatches)} (${matches.finished.length})</span>
                <small>${escapeHtml(text.completedSubtitle)}</small>
            </summary>
            <div class="compact-list">
                ${matches.finished.map(x => renderMatchCard(x, true)).join("")}
            </div>
        `;

        container.appendChild(section);
    }

    renderSection(container, `🔥 ${text.liveNow}`, matches.live, "live-section");
    renderSection(container, `▶️ ${text.startingSoon}`, matches.upcoming, "upcoming-section");

    if (matches.stopped.length) {
        renderSection(container, "⛔ Stopped", matches.stopped, "stopped-section");
    }

    if (matches.unknown.length) {
        renderSection(container, "❔ Unknown", matches.unknown, "unknown-section");
    }

    if (
        !matches.live.length &&
        !matches.upcoming.length &&
        !matches.finished.length &&
        !matches.stopped.length &&
        !matches.unknown.length
    ) {
        container.innerHTML = `<div class="empty-state">${escapeHtml(text.noMatches)}</div>`;
    }
}

function renderSection(parent, title, matches, className) {
    if (!matches.length) return;

    const section = document.createElement("div");
    section.className = className;

    section.innerHTML = `
        <h2 class="section-subtitle">${escapeHtml(title)}</h2>
        ${matches.map(match => renderMatchCard(match, false)).join("")}
    `;

    parent.appendChild(section);
}

function normalizeTimelineSeconds(value) {
    const n = Number(value);
    return Number.isFinite(n) && n >= 0 && n <= 1000000 ? n : null;
}

function formatMinuteFromSeconds(seconds) {
    const s = normalizeTimelineSeconds(seconds);
    if (s == null) return "";

    const minute = Math.floor(s / 60);

    return minute > 90
        ? `90+${minute - 90}'`
        : `${minute}'`;
}

function readTotalStat(node, key) {
    const n = Number(node?.[key] ?? node?.Total?.[key] ?? node?.total?.[key]);
    return Number.isFinite(n) ? n : 0;
}

function summarizeStatBlob(raw) {
    const home = raw?.Participant1 || raw?.participant1;
    const away = raw?.Participant2 || raw?.participant2;

    if (!home || !away) return null;

    const out = [];

    const g1 = readTotalStat(home, "Goals");
    const g2 = readTotalStat(away, "Goals");

    const y1 = readTotalStat(home, "YellowCards");
    const y2 = readTotalStat(away, "YellowCards");

    const c1 = readTotalStat(home, "Corners");
    const c2 = readTotalStat(away, "Corners");

    if (g1 || g2) out.push(`Goals ${g1}-${g2}`);
    if (y1 || y2) out.push(`🟨 ${y1}-${y2}`);
    if (c1 || c2) out.push(`🚩 ${c1}-${c2}`);

    return out.length ? out.join(" • ") : null;
}

function cleanEventType(value) {
    return ({
        game_finalised: "Full time",
        finalised: "Full time",
        final: "Full time",
        halftime: "Halftime",
        ht: "Halftime",
        ft: "Full time",
        live: "Live",
        penalties: "Penalties",
        pen: "Penalties",
        comment: "",
        disconnected: "Disconnected",
        action_discarded: ""
    }[String(value || "").trim().toLowerCase()] ?? String(value || "").replace(/_/g, " "));
}

function getMatchTeams(data) {
    const current = data?.current || data || {};

    return {
        home: current.home || current.homeTeam || text.teamA,
        away: current.away || current.awayTeam || text.teamB
    };
}

function getMatchScore(data) {
    const current = data?.current || data || {};

    if (current.score) return String(current.score);

    if (
        current.homeScore != null &&
        current.awayScore != null
    ) {
        return `${current.homeScore}-${current.awayScore}`;
    }

    return "—";
}

function getMatchStatus(data) {
    return String(
        data?.current?.status ??
        data?.status ??
        text.detailsUnavailable
    );
}











function formatKickoff(value) {
    if (value == null || value === "") return "";

    const date = new Date(Number(value) || value);
    if (Number.isNaN(date.getTime())) return String(value);

    return date.toLocaleString(undefined, {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

function buildTimelineItems(data) {
    const events =
        data?.timeline ||
        data?.historical ||
        data?.events ||
        data?.current?.timeline ||
        [];

    if (!Array.isArray(events)) return [];

    return events
        .map((event, index) => {
            const raw = event?.raw || event;

            const seconds = normalizeTimelineSeconds(
                raw?.Seconds ??
                raw?.seconds ??
                event?.seconds
            );

            const minute = seconds != null
                ? formatMinuteFromSeconds(seconds)
                : "";

            const stats = summarizeStatBlob(raw);

            const title =
                cleanEventType(
                    event?.type ||
                    raw?.Type ||
                    raw?.type ||
                    event?.detail ||
                    raw?.Detail
                ) ||
                stats ||
                minute ||
                "Event";

            return {
                key: `${index}-${seconds ?? 0}`,
                title: minute && title !== minute ? `${minute} — ${title}` : title,
                score:
                    event?.score ??
                    raw?.score ??
                    (
                        raw?.homeScore != null &&
                        raw?.awayScore != null
                    )
                        ? `${raw.homeScore}-${raw.awayScore}`
                        : "—",
                yc: event?.yc ?? raw?.yc ?? "",
                cr: event?.cr ?? raw?.cr ?? "",
                seconds
            };
        })
        .filter(x => x.title)
        .sort((a, b) => (a.seconds ?? 999999) - (b.seconds ?? 999999));
}

function renderMatchCard(match, isCompact) {
    const fixtureId = normalizeId(match?.fixtureId);
    const safeFixtureId = encodeURIComponent(fixtureId);

    const teams = getMatchTeams(match);
    const score = getMatchScore(match);
    const status = getMatchStatus(match);

    const kickoff = formatKickoff(match?.kickoff);
    const favorite = state.favorites.includes(fixtureId);
    const hot = Number(match?.signal || 0) > 1200;

    return `
<div class="match-card is-clickable ${hot ? "hot-event" : ""} ${isCompact ? "compact" : ""}" data-action="open-match" data-fixture-id="${safeFixtureId}">

<button class="fav-btn ${favorite ? "active" : ""}" data-action="toggle-favorite" data-fixture-id="${safeFixtureId}">
${favorite ? "★" : "☆"}
</button>

<div class="match-status">
${match.phase === "live" ? '<span class="live-dot"></span>' : ""}
${escapeHtml(status)}
</div>

${kickoff ? `<div class="card-kickoff">${escapeHtml(kickoff)}</div>` : ""}

<div class="match-main">
<div class="team">
<span class="team-name">${escapeHtml(teams.home)}</span>
</div>

<div class="score-box">
${escapeHtml(score)}
</div>

<div class="team">
<span class="team-name">${escapeHtml(teams.away)}</span>
</div>
</div>

<div class="match-stats-extra">
<div class="stat-item">🟨 ${escapeHtml(match?.yc ?? "0-0")}</div>
<div class="stat-item">🚩 ${escapeHtml(match?.cr ?? "0-0")}</div>
${match?.v ? `<div class="merkle-verify">🛡️ ${escapeHtml(text.verifiedOnSolana)}</div>` : ""}
</div>

${
!isCompact
? `
<div class="action-bar">
<button class="btn-secondary">${escapeHtml(text.stats)}</button>
<button class="btn-ai" data-action="ai-prediction" data-fixture-id="${safeFixtureId}">
${escapeHtml(text.aiAnalysis)}
</button>
</div>
`
: ""
}

</div>`;
}














function renderMatchDetails(data) {
    const modal = document.getElementById("match-details-overlay");
    if (!modal) return;

    const match = data?.current || data?.match || data || {};

    const fixtureId = normalizeId(match.fixtureId || match.id || data.fixtureId);
    const safeFixtureId = encodeURIComponent(fixtureId);

    const teams = getMatchTeams(match);
    const score = getMatchScore(match);
    const status = getMatchStatus(match);

    const kickoff = formatKickoff(
        match.kickoff ||
        match.startTime ||
        match.startsAt ||
        match.date
    );

    const timeline = buildTimelineItems(data);

    const timelineHtml = timeline.length
        ? timeline.map(item => `
            <div class="timeline-item">
                <div class="time">${escapeHtml(item.title)}</div>
                <div class="event-desc">
                    <strong>${escapeHtml(item.score || "—")}</strong>
                    ${
                        item.yc || item.cr
                            ? `<span>(🟨 ${escapeHtml(item.yc || "0-0")} | 🚩 ${escapeHtml(item.cr || "0-0")})</span>`
                            : ""
                    }
                </div>
            </div>
        `).join("")
        : `<div class="no-data">${escapeHtml(text.timelinePending)}</div>`;

    modal.innerHTML = `
<div class="modal-content">

<div class="modal-header">
<button class="close-btn" data-action="close-modal">✕</button>
<div class="modal-title">${escapeHtml(teams.home)} vs ${escapeHtml(teams.away)}</div>
</div>

<div class="details-main-score">
<div class="big-score">${escapeHtml(score)}</div>
<div class="status-badge">
${escapeHtml(status)}
${kickoff ? " • " + escapeHtml(kickoff) : ""}
</div>
</div>

<div class="section-block">

<h3>📊 ${escapeHtml(text.matchDynamics)}</h3>

<div class="match-stats-extra">
<div class="stat-item">🏠 ${escapeHtml(teams.home)}</div>
<div class="stat-item">✈️ ${escapeHtml(teams.away)}</div>
${kickoff ? `<div class="stat-item">⏱️ ${escapeHtml(kickoff)}</div>` : ""}
</div>

<div class="historical-timeline">
${timelineHtml}
</div>

</div>

<div class="section-block ai-insight-box">
<h3>🤖 ${escapeHtml(text.aiInsights)}</h3>
<p id="ai-text">${escapeHtml(text.getPrediction)}</p>

<button
class="btn-ai"
data-action="ai-prediction"
data-fixture-id="${safeFixtureId}">
${escapeHtml(text.getPrediction)}
</button>

</div>

<div class="merkle-proof-footer">
<span>${escapeHtml(text.oracleDataId)}: ${escapeHtml(fixtureId)}</span>

<button
class="verify-btn"
data-action="verify-proof"
data-fixture-id="${safeFixtureId}">
🛡️ ${escapeHtml(text.verifyOnSolana)}
</button>

</div>

</div>`;

    modal.classList.add("active");
}

async function openMatchDetails(fixtureId) {
    fixtureId = normalizeId(fixtureId);

    if (!fixtureId) {
        showTelegramAlert(text.invalidMatchId);
        return;
    }

    showModalLoader();

    const controller = createAbortController("detailsController");

    try {
        const res = await abortableEmit(controller, {
            type: "txline_fixture_details",
            fixtureId,
            serviceLevelId: 12
        });

        if (state.requests.detailsController === controller)
            state.requests.detailsController = null;

        if (res.ok && res.body?.ok !== false) {
            renderMatchDetails(res.body);
            return;
        }

        renderMatchDetails({
            ok: false,
            fixtureId,
            error: res.body?.error || text.failedMatchDetails
        });

    } catch (e) {

        if (e.name === "AbortError") return;

        if (state.requests.detailsController === controller)
            state.requests.detailsController = null;

        renderMatchDetails({
            ok: false,
            fixtureId,
            error: e.message || text.failedMatchDetails
        });
    }
}










async function getAIPrediction(fixtureId) {
    const id = normalizeId(fixtureId);
    const aiBox = document.getElementById("ai-text");
    if (!id || !aiBox) return;

    aiBox.textContent = text.loadingAi;

    const controller = createAbortController("aiController");

    try {
        const res = await abortableEmit(controller, {
            type: "txline_ai_prediction",
            fixtureId: id
        });

        if (state.requests.aiController === controller) {
            state.requests.aiController = null;
        }

        const body = res.body || {};

        if (!res.ok || body.ok === false) {
            aiBox.textContent = body.error || text.aiUnavailable;
            return;
        }

        aiBox.textContent =
            body.prediction ||
            body.analysis ||
            body.content ||
            text.aiUnavailable;

    } catch (err) {
        if (err.name === "AbortError") return;

        if (state.requests.aiController === controller) {
            state.requests.aiController = null;
        }

        console.error(err);
        aiBox.textContent = text.aiError;
    }
}

function verifySolanaProof(fixtureId) {
    const id = normalizeId(fixtureId);
    if (!id) return;

    openMatchDetails(id);
}

async function loadFavorites() {
    try {
        const base = getWorkerBase();

        const res = await fetchJson(
            `${base}/__kvget?scope=worldcup&user=${encodeURIComponent(getUserId())}&part=favorites`
        );

        state.favorites = Array.isArray(res?.data?.list)
            ? res.data.list.map(normalizeId).filter(Boolean)
            : [];

    } catch {
        state.favorites = [];
    }
}

async function toggleFavorite(fixtureId) {
    const id = normalizeId(fixtureId);
    if (!id) return;

    const exists = state.favorites.includes(id);

    state.favorites = exists
        ? state.favorites.filter(v => v !== id)
        : [...state.favorites, id];

    if (!exists) triggerSuccessHaptic();

    renderAll();

    try {
        await fetchJson(`${getWorkerBase()}/__kvmerge`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                scope: "worldcup",
                user: getUserId(),
                patch: {
                    list: state.favorites
                }
            })
        });
    } catch {}
}

function showModalLoader() {
    const modal = document.getElementById("match-details-overlay");
    if (!modal) return;

    modal.classList.add("active");
    modal.innerHTML =
        `<div class="loader-centered">${escapeHtml(text.loadingOracle)}</div>`;
}

function closeModal() {
    document.getElementById("match-details-overlay")?.classList.remove("active");

    abortRequest("detailsController");
    abortRequest("aiController");
}

function decodeFixtureIdFromElement(el) {
    try {
        return decodeURIComponent(el?.dataset?.fixtureId || "");
    } catch {
        return el?.dataset?.fixtureId || "";
    }
}

document.getElementById("filters")?.addEventListener("click", e => {

    const chip = e.target.closest(".filter-chip");
    if (!chip) return;

    document.querySelectorAll(".filter-chip")
        .forEach(n => n.classList.remove("active"));

    chip.classList.add("active");

    state.filters.status = chip.dataset.filter || "all";

    renderAll();
});

document.addEventListener("click", e => {

    const target = e.target.closest("[data-action], .match-card.is-clickable");
    if (!target) return;

    const action =
        target.dataset.action ||
        "open-match";

    const fixtureId = decodeFixtureIdFromElement(target);

    e.stopPropagation();

    switch (action) {

        case "toggle-favorite":
            return toggleFavorite(fixtureId);

        case "ai-prediction":
            return getAIPrediction(fixtureId);

        case "verify-proof":
            return verifySolanaProof(fixtureId);

        case "close-modal":
            return closeModal();

        default:
            return openMatchDetails(fixtureId);
    }
});

const autoRefresh = setInterval(() => {

    if (state.groupedMatches.live.length) {
        initApp();
    }

}, 60000);

tg?.onEvent?.("viewportChanged", () => {

    if (tg.isExpanded) {
        triggerLightImpact();
    }

});

async function initApp() {

    try {

        const res = await emit({
            type: "txline_probe_feed",
            scope: "worldcup",
            serviceLevelId: Number(
                document.getElementById("serviceLevelId")?.value || 12
            )
        });

        if (!res.ok) {
            throw new Error(res.body?.error || "Probe failed");
        }

        state.probe = res.body || {};
        state.groupedMatches = regroupMatches(
            collectMatchesFromProbe(state.probe)
        );

        renderAll();

        const total =
            state.groupedMatches.live.length +
            state.groupedMatches.upcoming.length +
            state.groupedMatches.finished.length;

        const status = document.getElementById("status");

        if (status) {
            status.className = total ? "status ok" : "status warn";
            status.textContent = total
                ? `Loaded ${total} fixtures`
                : "Connected. No fixtures available.";
        }

    } catch (err) {

        console.error(err);

        document.getElementById("match-container").innerHTML =
            `<div class="empty-state">${escapeHtml(text.oracleConnectionError)}</div>`;
    }
}

async function bootstrap() {

    await loadFavorites();
    await initApp();

    tg?.ready?.();
}

bootstrap();

window.addEventListener("beforeunload", () => {

    clearInterval(autoRefresh);

    abortRequest("detailsController");
    abortRequest("aiController");

});


</script>
</body>
</html>
