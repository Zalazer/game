<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TxLINE World Cup 2026 Insider</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --link-color: var(--tg-theme-link-color, #2481cc);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f5f5f5);
            --accent-hot: #ff4d4d;
            --accent-live: #4caf50;
            --accent-merkle: #673ab7;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
        }
        button, input, textarea, select { font: inherit; }
        #app { padding: 16px; max-width: 600px; margin: 0 auto; }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }
        .header-section h1 {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 6px 14px;
            background: var(--secondary-bg);
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
            user-select: none;
        }
        .filter-chip.active {
            background: var(--button-color);
            color: var(--button-text-color);
        }
        .match-card {
            background: var(--bg-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0, 0, 0, 0.05);
            position: relative;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .match-card.is-clickable { cursor: pointer; }
        .match-card:active { transform: scale(0.98); }
        .match-card.hot-event {
            border: 1.5px solid var(--accent-hot);
        }
        .match-card.hot-event::before {
            content: "🔥 HOT";
            position: absolute;
            top: -10px;
            right: 16px;
            background: var(--accent-hot);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .match-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 8px;
        }
        .team { flex: 1; text-align: center; min-width: 0; }
        .team-name {
            font-weight: 600;
            font-size: 14px;
            margin-top: 4px;
            display: block;
            word-break: break-word;
        }
        .score-box {
            flex: 0 0 100px;
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-color);
        }
        .match-status {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-live);
            text-align: center;
            margin-bottom: 10px;
        }
        .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--accent-live);
            border-radius: 50%;
            margin-right: 4px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        .match-stats-extra {
            display: flex;
            justify-content: space-around;
            background: var(--secondary-bg);
            border-radius: 8px;
            padding: 8px;
            font-size: 12px;
            color: var(--hint-color);
            gap: 8px;
            flex-wrap: wrap;
        }
        .stat-item { display: flex; align-items: center; gap: 4px; }
        .merkle-verify {
            margin-top: 12px;
            font-size: 11px;
            color: var(--accent-merkle);
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            opacity: 0.8;
        }
        .merkle-verify:hover { opacity: 1; text-decoration: underline; }
        .action-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }
        .btn-secondary,
        .btn-ai,
        .verify-btn,
        .fav-btn,
        .close-btn { cursor: pointer; }
        .btn-secondary {
            background: var(--secondary-bg);
            color: var(--text-color);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
        }
        .btn-ai {
            background: linear-gradient(135deg, #2481cc, #673ab7);
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
        }
        .section-title {
            padding: 12px;
            background: var(--secondary-bg);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            margin: 10px 0;
            list-style: none;
            display: flex;
            flex-direction: column;
        }
        .section-title small {
            color: var(--hint-color);
            font-weight: 400;
            font-size: 11px;
        }
        .section-subtitle {
            font-size: 16px;
            margin: 20px 0 10px 5px;
            color: var(--hint-color);
        }
        .match-card.compact {
            padding: 8px 12px;
            opacity: 0.88;
        }
        .match-card.compact .score-box {
            font-size: 18px;
            flex: 0 0 60px;
        }
        .match-card.compact .action-bar { display: none; }
        #match-details-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        #match-details-overlay.active { transform: translateY(0); }
        .modal-content { min-height: 100%; }
        .modal-header {
            padding: 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--secondary-bg);
            position: sticky;
            top: 0;
            background: var(--bg-color);
            z-index: 2;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-color);
            margin-right: 15px;
        }
        .modal-title {
            font-weight: 700;
            font-size: 16px;
            word-break: break-word;
        }
        .details-main-score,
        .section-block { padding: 16px; }
        .big-score {
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            margin: 20px 0;
            letter-spacing: 5px;
        }
        .status-badge {
            text-align: center;
            color: var(--hint-color);
            font-size: 14px;
            font-weight: 600;
        }
        .historical-timeline {
            border-left: 2px solid var(--secondary-bg);
            margin-left: 10px;
            padding-left: 20px;
        }
        .timeline-item {
            position: relative;
            margin-bottom: 15px;
        }
        .timeline-item::before {
            content: "";
            position: absolute;
            left: -26px;
            top: 5px;
            width: 10px;
            height: 10px;
            background: var(--button-color);
            border-radius: 50%;
        }
        .timeline-item .time {
            font-size: 11px;
            color: var(--hint-color);
        }
        .timeline-item .event-desc { font-size: 14px; }
        .no-data {
            color: var(--hint-color);
            font-size: 14px;
        }
        .merkle-proof-footer {
            padding: 20px;
            background: var(--secondary-bg);
            text-align: center;
            margin-top: 30px;
        }
        .verify-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: 1px solid var(--accent-merkle);
            color: var(--accent-merkle);
            background: transparent;
            border-radius: 8px;
            font-weight: 700;
        }
        .fav-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 20px;
            background: none;
            border: none;
            z-index: 10;
            line-height: 1;
            padding: 0;
        }
        .fav-btn.active { color: #ffca28; }
        .loader-centered,
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            color: var(--hint-color);
            font-size: 14px;
            text-align: center;
        }
        .hidden { display: none; }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        @media (prefers-color-scheme: dark) {
            .match-card {
                background: #1c1c1d;
                border-color: #2c2c2e;
            }
            .score-box { color: #ffffff; }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="header-section">
        <h1 id="title">FIFA 2026 Live</h1>
        <div id="connection-status" class="live-dot" aria-hidden="true"></div>
    </div>

    <div class="filter-bar" id="filters">
        <div class="filter-chip active" data-filter="all">All matches</div>
        <div class="filter-chip" data-filter="live">Live</div>
        <div class="filter-chip" data-filter="upcoming">Upcoming</div>
        <div class="filter-chip" data-filter="favorites">Favorites</div>
    </div>

    <div id="match-container">
        <div id="loader" style="text-align: center; padding: 50px; color: var(--hint-color);">
            Loading oracle data...
        </div>
    </div>
</div>

<div id="match-details-overlay"></div>
<input id="workerBase" type="hidden" value="https://game.shooleeyack.workers.dev">

<script>
const tg = window.Telegram?.WebApp || null;
if (tg?.expand) tg.expand();

const state = {
    groupedMatches: { finished: [], live: [], upcoming: [] },
    filters: { status: "all" },
    favorites: [],
    requests: { detailsController: null, aiController: null },
    probe: null
};

const text = {
    scheduled: "Scheduled",
    invalidMatchId: "Invalid match ID",
    failedMatchDetails: "Unable to load match details",
    failedMatchDetailsShort: "Unable to fetch match details",
    loadingOracle: "Loading oracle data...",
    loadingAi: "AI is analyzing oracle data...",
    aiUnavailable: "Analytics are temporarily unavailable",
    aiError: "Failed to reach the AI module",
    oracleConnectionError: "Oracle connection error",
    noMatches: "No matches found",
    timelinePending: "The event timeline for this match is still being built...",
    detailsUnavailable: "Status unavailable",
    verifiedOnSolana: "Verified on Solana",
    stats: "Stats",
    aiAnalysis: "AI Analysis",
    getPrediction: "Get prediction",
    matchDynamics: "Match dynamics",
    aiInsights: "AI insights",
    verifyOnSolana: "Verify on Solana",
    oracleDataId: "Oracle Data ID",
    completedMatches: "Completed matches",
    completedSubtitle: "Review match history and team form",
    liveNow: "Live now",
    startingSoon: "Starting soon",
    favoriteToggle: "Toggle favorite",
    close: "Close",
    teamA: "Team A",
    teamB: "Team B",
    scoreFallback: "0 - 0",
    cardsFallback: "0-0",
    proofTitle: "Solana verification",
    proofMessage: (id, hash) => `Match data ${id} has been confirmed on-chain. Merkle Root: ${hash}. Verification completed through the TxLINE oracle.`,
    aiPrompt: (fixtureId) => `Analyze football match ID ${fixtureId}. Provide a short prediction.`
};

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function normalizeId(value) {
    return String(value ?? "").trim();
}

function safeArray(value) {
    return Array.isArray(value) ? value : [];
}

function getUserId() {
    return String(tg?.initDataUnsafe?.user?.id || "anon");
}

function showTelegramAlert(message) {
    if (tg?.showAlert) return tg.showAlert(String(message));
    alert(String(message));
}

function showTelegramPopup(title, message) {
    if (tg?.showPopup) {
        tg.showPopup({ title: String(title), message: String(message), buttons: [{ type: "ok" }] });
        return;
    }
    alert(`${title}

${message}`);
}

function triggerSuccessHaptic() {
    tg?.HapticFeedback?.notificationOccurred?.("success");
}

function triggerLightImpact() {
    tg?.HapticFeedback?.impactOccurred?.("light");
}

function getWorkerBase() {
    const node = document.getElementById("workerBase");
    const base = node?.value?.trim();
    return base ? base.replace(/\/$/, "") : "";
}

async function fetchJson(url, options = {}) {
    const response = await fetch(url, options);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.json();
}

async function emit(payload) {
    const base = getWorkerBase();
    if (!base) throw new Error("Worker URL is empty");
    const ticketRes = await fetch(`${base}/__ticket`, { method: "POST" });
    if (!ticketRes.ok) throw new Error(`__ticket failed: ${ticketRes.status}`);
    const ticket = await ticketRes.json();
    const emitRes = await fetch(`${base}/__emit`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ k: ticket.k, d: payload })
    });
    const raw = await emitRes.text();
    let body;
    try { body = JSON.parse(raw); } catch { body = raw; }
    return { ok: emitRes.ok, status: emitRes.status, body, raw };
}

async function abortableEmit(controller, payload) {
    const base = getWorkerBase();
    if (!base) throw new Error("Worker URL is empty");
    const ticketRes = await fetch(`${base}/__ticket`, { method: "POST", signal: controller.signal });
    if (!ticketRes.ok) throw new Error(`__ticket failed: ${ticketRes.status}`);
    const ticket = await ticketRes.json();
    const emitRes = await fetch(`${base}/__emit`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ k: ticket.k, d: payload }),
        signal: controller.signal
    });
    const raw = await emitRes.text();
    let body;
    try { body = JSON.parse(raw); } catch { body = raw; }
    return { ok: emitRes.ok, status: emitRes.status, body, raw };
}

function abortRequest(controllerKey) {
    const controller = state.requests[controllerKey];
    if (controller) {
        controller.abort();
        state.requests[controllerKey] = null;
    }
}

function createAbortController(controllerKey) {
    abortRequest(controllerKey);
    const controller = new AbortController();
    state.requests[controllerKey] = controller;
    return controller;
}

function collectMatchesFromProbe(probe) {
    const rows = [];
    const seen = new Set();

    const pushRow = (row, phaseHint) => {
        const fixtureId = normalizeId(row?.fixtureId ?? row?.FixtureId ?? row?.id ?? row?.fixture_id);
        if (!fixtureId || seen.has(fixtureId)) return;
        seen.add(fixtureId);

        const p1 = row?.Participant1 ?? row?.participant1 ?? row?.home ?? row?.homeTeam ?? "";
        const p2 = row?.Participant2 ?? row?.participant2 ?? row?.away ?? row?.awayTeam ?? "";

        const participant1IsHome = row?.Participant1IsHome ?? row?.participant1IsHome ?? row?.homeIsParticipant1 ?? null;

        const homeTeam = participant1IsHome === false
            ? (p2 || text.teamA)
            : (p1 || text.teamA);

        const awayTeam = participant1IsHome === false
            ? (p1 || text.teamB)
            : (p2 || text.teamB);

        const homeScore = row?.homeScore != null ? Number(row.homeScore) : null;
        const awayScore = row?.awayScore != null ? Number(row.awayScore) : null;

        const score =
            row?.score ??
            row?.result ??
            ((homeScore != null && awayScore != null) ? `${homeScore}-${awayScore}` : text.scoreFallback);

        const phase = String(row?.phase || phaseHint || "upcoming").toLowerCase();
        const status =
            row?.status ||
            row?.gameState ||
            row?.state ||
            (phase === "finished" ? "Finished" : phase === "live" ? "Live" : phase === "upcoming" ? "Not started" : text.scheduled);

        const kickoff =
            row?.kickoff ??
            row?.startTime ??
            row?.StartTime ??
            row?.date ??
            row?.datetime ??
            row?.startsAt ??
            null;

        rows.push({
            ...row,
            fixtureId,
            id: row?.id ?? fixtureId,
            phase,
            status,
            homeTeam,
            awayTeam,
            home: homeTeam,
            away: awayTeam,
            Participant1: row?.Participant1 ?? p1,
            Participant2: row?.Participant2 ?? p2,
            Participant1IsHome: participant1IsHome,
            homeScore,
            awayScore,
            score,
            kickoff,
            yc: row?.yc ?? text.cardsFallback,
            cr: row?.cr ?? text.cardsFallback,
            signal: Number(row?.signal ?? 0),
            v: !!row?.v,
            oddsPreview: row?.oddsPreview ?? null,
            eventPreview: row?.eventPreview ?? null
        });
    };

    const grouped = probe?.grouped || {};
    const groups = [
        ["live", grouped.live],
        ["upcoming", grouped.upcoming],
        ["finished", grouped.finished],
        ["stopped", grouped.stopped],
        ["unknown", grouped.unknown],
        ["past", grouped.past]
    ];

    for (const [phase, arr] of groups) {
        for (const row of safeArray(arr)) pushRow(row, phase);
    }

    if (!rows.length && Array.isArray(probe?.matches)) {
        for (const row of probe.matches) pushRow(row, row?.phase || "upcoming");
    }

    if (!rows.length && probe?.featured) {
        pushRow(probe.featured, probe.featured?.phase || "upcoming");
    }

    rows.sort((a, b) => {
        const phaseOrder = { live: 0, upcoming: 1, finished: 2, stopped: 3, unknown: 4 };
        const pa = phaseOrder[a.phase] ?? 4;
        const pb = phaseOrder[b.phase] ?? 4;
        if (pa !== pb) return pa - pb;

        const ka = a.kickoff ? new Date(a.kickoff).getTime() : 0;
        const kb = b.kickoff ? new Date(b.kickoff).getTime() : 0;
        return ka - kb;
    });

    return rows;
}




function regroupMatches(matches) {
    const grouped = { finished: [], live: [], upcoming: [] };

    for (const match of safeArray(matches)) {
        const phase = String(match?.phase || "").toLowerCase();
        if (phase === "live" || phase === "current") grouped.live.push(match);
        else if (phase === "finished" || phase === "past") grouped.finished.push(match);
        else grouped.upcoming.push(match);
    }

    return grouped;
}


function getFilteredMatches() {
    const filter = String(state.filters.status || "all").toLowerCase();
    const grouped = state.groupedMatches || {};
    const finished = safeArray(grouped.finished);
    const live = safeArray(grouped.live);
    const upcoming = safeArray(grouped.upcoming);
    const stopped = safeArray(grouped.stopped);
    const unknown = safeArray(grouped.unknown);
    const all = [...live, ...upcoming, ...finished, ...stopped, ...unknown];

    const isFavorite = (match) => {
        const id = normalizeId(match?.fixtureId ?? match?.id ?? match?.fixture_id);
        return id && state.favorites.includes(id);
    };

    if (filter === "live") {
        return {
            finished: [],
            live: live.filter((match) => normalizeId(match?.fixtureId ?? match?.id ?? match?.fixture_id)),
            upcoming: [],
            stopped: [],
            unknown: []
        };
    }

    if (filter === "upcoming") {
        return {
            finished: [],
            live: [],
            upcoming: upcoming.filter((match) => normalizeId(match?.fixtureId ?? match?.id ?? match?.fixture_id)),
            stopped: [],
            unknown: []
        };
    }

    if (filter === "favorites") {
        return {
            finished: finished.filter(isFavorite),
            live: live.filter(isFavorite),
            upcoming: upcoming.filter(isFavorite),
            stopped: stopped.filter(isFavorite),
            unknown: unknown.filter(isFavorite)
        };
    }

    return {
        finished,
        live,
        upcoming,
        stopped,
        unknown
    };
}




function renderAll() {
    const container = document.getElementById("match-container");
    if (!container) return;

    const matches = getFilteredMatches();
    container.innerHTML = "";

    const hasFinished = Array.isArray(matches.finished) && matches.finished.length > 0;
    const hasLive = Array.isArray(matches.live) && matches.live.length > 0;
    const hasUpcoming = Array.isArray(matches.upcoming) && matches.upcoming.length > 0;

    const renderCount = (label, list) => `${label} (${Array.isArray(list) ? list.length : 0})`;

    if (hasFinished) {
        const finishedSection = document.createElement("details");
        finishedSection.className = "finished-accordion";
        finishedSection.open = false;

        finishedSection.innerHTML = `
            <summary class="section-title">
                <span>⚽ ${escapeHtml(renderCount(text.completedMatches, matches.finished))}</span>
                <small>${escapeHtml(text.completedSubtitle)}</small>
            </summary>
            <div class="compact-list">
                ${matches.finished.map((match) => renderMatchCard(match, true)).join("")}
            </div>
        `;
        container.appendChild(finishedSection);
    }

    if (hasLive) {
        renderSection(container, `🔥 ${text.liveNow}`, matches.live, "live-section");
    }

    if (hasUpcoming) {
        renderSection(container, `▶️ ${text.startingSoon}`, matches.upcoming, "upcoming-section");
    }

    if (!hasFinished && !hasLive && !hasUpcoming) {
        container.innerHTML = `<div class="empty-state">${escapeHtml(text.noMatches)}</div>`;
        return;
    }

    const visibleTotal = (hasFinished ? matches.finished.length : 0) + (hasLive ? matches.live.length : 0) + (hasUpcoming ? matches.upcoming.length : 0);
    const statusBar = document.getElementById("status");
    if (statusBar) {
        statusBar.textContent = `Loaded ${visibleTotal} fixtures`;
    }
}




function renderSection(parent, title, matches, className) {
    if (!parent || !Array.isArray(matches) || matches.length === 0) return;

    const visibleMatches = matches.filter((match) => {
        const fixtureId = normalizeId(match?.fixtureId ?? match?.id ?? match?.fixture_id);
        return !!fixtureId;
    });

    if (!visibleMatches.length) return;

    const section = document.createElement("div");
    section.className = className;

    section.innerHTML = `
        <h2 class="section-subtitle">${escapeHtml(title)}</h2>
        ${visibleMatches.map((match) => renderMatchCard(match, false)).join("")}
    `;

    parent.appendChild(section);
}



function normalizeTimelineSeconds(value) {
    const n = Number(value);
    if (!Number.isFinite(n) || n < 0) return null;
    if (n > 1000000) return null;
    return n;
}


function formatMinuteFromSeconds(seconds) {
    const n = normalizeTimelineSeconds(seconds);
    if (n == null) return "";
    const minute = Math.floor(n / 60);
    const extra = minute > 90 ? minute - 90 : 0;
    return extra > 0 ? `90+${extra}'` : `${minute}'`;
}



function readTotalStat(node, key) {
    const total = node?.Total || node?.total || {};
    const direct = node?.[key];
    const val = direct != null ? direct : total?.[key];
    const n = Number(val);
    return Number.isFinite(n) ? n : 0;
}


function summarizeStatBlob(raw) {
    const p1 = raw?.Participant1 || raw?.participant1 || null;
    const p2 = raw?.Participant2 || raw?.participant2 || null;
    if (!p1 && !p2) return null;

    const goals1 = readTotalStat(p1, "Goals");
    const goals2 = readTotalStat(p2, "Goals");
    const yc1 = readTotalStat(p1, "YellowCards");
    const yc2 = readTotalStat(p2, "YellowCards");
    const cr1 = readTotalStat(p1, "Corners");
    const cr2 = readTotalStat(p2, "Corners");

    const parts = [];
    if (goals1 || goals2) parts.push(`Goals ${goals1}-${goals2}`);
    if (yc1 || yc2) parts.push(`🟨 ${yc1}-${yc2}`);
    if (cr1 || cr2) parts.push(`🚩 ${cr1}-${cr2}`);

    return parts.length ? parts.join(" • ") : null;
}



function cleanEventType(value) {
    const s = String(value || "").trim().toLowerCase();
    if (!s) return "";

    const map = {
        game_finalised: "Full time",
        finalised: "Full time",
        final: "Full time",
        comment: "Comment",
        disconnected: "Disconnected",
        live: "Live",
        halftime: "Halftime",
        ht: "Halftime",
        ft: "Full time",
        pen: "Penalties",
        penalties: "Penalties",
        action_discarded: ""
    };

    return map[s] ?? s.replace(/_/g, " ");
}


function getMatchTeams(data) {
    const current = data?.current || {};
    const compact = data?.currentCompact || {};
    const snapshot = data?.snapshot || {};
    const meta = data?.meta || {};
    const source = data?.match || data || {};

    const p1 =
        current?.Participant1 ||
        current?.participant1 ||
        current?.homeTeam ||
        current?.home ||
        compact?.Participant1 ||
        compact?.participant1 ||
        compact?.homeTeam ||
        compact?.home ||
        snapshot?.Participant1 ||
        snapshot?.participant1 ||
        snapshot?.homeTeam ||
        snapshot?.home ||
        source?.Participant1 ||
        source?.participant1 ||
        source?.homeTeam ||
        source?.home ||
        meta?.Participant1 ||
        meta?.participant1 ||
        meta?.homeTeam ||
        meta?.home ||
        text.teamA;

    const p2 =
        current?.Participant2 ||
        current?.participant2 ||
        current?.awayTeam ||
        current?.away ||
        compact?.Participant2 ||
        compact?.participant2 ||
        compact?.awayTeam ||
        compact?.away ||
        snapshot?.Participant2 ||
        snapshot?.participant2 ||
        snapshot?.awayTeam ||
        snapshot?.away ||
        source?.Participant2 ||
        source?.participant2 ||
        source?.awayTeam ||
        source?.away ||
        meta?.Participant2 ||
        meta?.participant2 ||
        meta?.awayTeam ||
        meta?.away ||
        text.teamB;

    const participant1IsHome =
        current?.Participant1IsHome ??
        current?.participant1IsHome ??
        compact?.Participant1IsHome ??
        compact?.participant1IsHome ??
        snapshot?.Participant1IsHome ??
        snapshot?.participant1IsHome ??
        source?.Participant1IsHome ??
        source?.participant1IsHome ??
        meta?.Participant1IsHome ??
        meta?.participant1IsHome ??
        null;

    if (participant1IsHome === false) {
        return { home: p2, away: p1 };
    }

    return { home: p1, away: p2 };
}



function getMatchScore(data) {
    const current = data?.current || {};
    const snapshot = data?.snapshot || {};

    if (current?.score) return String(current.score);
    if (data?.score) return String(data.score);
    if (current?.homeScore != null && current?.awayScore != null) return `${current.homeScore}-${current.awayScore}`;
    if (snapshot?.homeScore != null && snapshot?.awayScore != null) return `${snapshot.homeScore}-${snapshot.awayScore}`;
    return text.scoreFallback;
}


function getMatchStatus(data) {
    const current = data?.current || {};
    return String(current?.status || current?.gameState || data?.status || text.detailsUnavailable);
}


function formatKickoff(value) {
    if (value == null || value === "") return "";

    const n = Number(value);
    const date = Number.isFinite(n) ? new Date(n) : new Date(String(value));
    if (Number.isNaN(date.getTime())) return String(value);

    const datePart = date.toLocaleDateString(undefined, {
        day: "numeric",
        month: "short"
    });

    const timePart = date.toLocaleTimeString(undefined, {
        hour: "2-digit",
        minute: "2-digit"
    });

    return `${datePart}, ${timePart}`;
}


function buildTimelineItems(data) {
    const source =
        data?.historical ||
        data?.timeline ||
        data?.events ||
        data?.matchEvents ||
        data?.snapshot ||
        data?.current?.timeline ||
        data?.current?.events ||
        data?.current?.matchEvents ||
        [];

    if (!Array.isArray(source)) return [];

    const items = source
        .map((item, index) => {
            if (!item || typeof item !== "object") return null;

            const raw = item?.raw || item;
            const type = String(item?.type || raw?.Type || raw?.type || item?.event || raw?.event || "").trim();
            const detail = String(item?.detail || raw?.Detail || raw?.detail || "").trim();
            const running = raw?.Running ?? raw?.running;
            const seconds = normalizeTimelineSeconds(raw?.Seconds ?? raw?.seconds ?? item?.Seconds ?? item?.seconds);

            const statSummary = summarizeStatBlob(raw);
            const cleanType = cleanEventType(type || detail);

            if (cleanType.toLowerCase() === "comment") return null;
            if (cleanType.toLowerCase() === "disconnected") return { key: `${index}-disc`, title: "Disconnected", score: "—", yc: "", cr: "", seconds, raw };
            if (!cleanType && !statSummary && seconds == null) return null;

            const liveMinute = running === true && seconds != null ? formatMinuteFromSeconds(seconds) : "";
            const eventMinute = seconds != null ? formatMinuteFromSeconds(seconds) : "";

            let title = cleanType || detail || statSummary || "Event";
            if (cleanType.toLowerCase() === "full time" || running === false) title = "Full time";
            else if (cleanType.toLowerCase() === "halftime") title = "Halftime";
            else if (statSummary) title = statSummary;
            else if (liveMinute) title = liveMinute;
            else if (eventMinute) title = eventMinute;

            if (cleanType.toLowerCase() === "soccer") {
                title = statSummary || eventMinute || "";
            }

            const score =
                item?.score ||
                raw?.score ||
                item?.result ||
                raw?.result ||
                (item?.homeScore != null && item?.awayScore != null
                    ? `${item.homeScore}-${item.awayScore}`
                    : (raw?.homeScore != null && raw?.awayScore != null ? `${raw.homeScore}-${raw.awayScore}` : "—"));

            const yc =
                item?.yc ??
                raw?.yc ??
                item?.yellowCards ??
                raw?.yellowCards ??
                item?.homeYc ??
                raw?.homeYc ??
                "";

            const cr =
                item?.cr ??
                raw?.cr ??
                item?.corners ??
                raw?.corners ??
                item?.homeCorners ??
                raw?.homeCorners ??
                "";

            const minuteTag = eventMinute || liveMinute;
            const label = minuteTag && title !== minuteTag ? `${minuteTag} — ${title}` : title;

            return {
                key: `${item?.timestamp ?? item?.time ?? seconds ?? index}-${index}`,
                title: label,
                score,
                yc,
                cr,
                seconds,
                raw
            };
        })
        .filter(Boolean);

    const out = [];
    const seen = new Set();

    for (const item of items) {
        const signature = [
            String(item.title || ""),
            String(item.score || ""),
            String(item.seconds ?? ""),
            String(item.yc || ""),
            String(item.cr || "")
        ].join("|");

        if (seen.has(signature)) continue;
        seen.add(signature);
        out.push(item);
    }

    out.sort((a, b) => {
        const at = a.seconds != null ? a.seconds : Number.MAX_SAFE_INTEGER;
        const bt = b.seconds != null ? b.seconds : Number.MAX_SAFE_INTEGER;
        return at - bt;
    });

    return out;
}

    const awayTeam = escapeHtml(teams.away || text.teamB);

        match?.score ||

function renderMatchDetails(data) {
    const modal = document.getElementById("match-details-overlay");
    if (!modal) return;

    const current = data?.current || data?.currentCompact || data?.match || data || {};
    const teams = getMatchTeams(data);

    const fixtureId = normalizeId(
        data?.fixtureId ||
        current?.fixtureId ||
        current?.id ||
        data?.id ||
        data?.fixture_id
    );

    const safeFixtureId = encodeURIComponent(fixtureId);

    const homeRaw = teams.home || current?.home || current?.homeTeam || current?.Participant1 || text.teamA;
    const awayRaw = teams.away || current?.away || current?.awayTeam || current?.Participant2 || text.teamB;

    const scoreRaw =
        current?.score ||
        data?.score ||
        current?.result ||
        data?.result ||
        ((current?.homeScore != null && current?.awayScore != null)
            ? `${current.homeScore}-${current.awayScore}`
            : text.scoreFallback);

    const phaseValue = String(current?.phase || data?.phase || "").toLowerCase();
    const statusRaw =
        current?.status ||
        current?.gameState ||
        data?.status ||
        data?.gameState ||
        (phaseValue ? phaseValue.charAt(0).toUpperCase() + phaseValue.slice(1) : "") ||
        text.detailsUnavailable;

    const kickoffRaw =
        current?.startTime ??
        current?.kickoff ??
        current?.date ??
        current?.datetime ??
        current?.startsAt ??
        data?.startTime ??
        data?.kickoff ??
        data?.date ??
        data?.datetime ??
        data?.startsAt ??
        current?.raw?.StartTime ??
        "";

    const kickoffText = kickoffRaw ? formatKickoff(kickoffRaw) : "";

    const timelineSource =
        data?.historical ||
        data?.events ||
        data?.snapshot ||
        current?.historical ||
        current?.events ||
        current?.snapshot ||
        current?.eventPreview ||
        data?.eventPreview ||
        current?.timeline ||
        data?.timeline ||
        current?.matchEvents ||
        data?.matchEvents ||
        [];

    const timelineItems = buildTimelineItems({
        historical: Array.isArray(timelineSource) ? timelineSource : [],
        timeline: Array.isArray(timelineSource) ? timelineSource : [],
        events: Array.isArray(timelineSource) ? timelineSource : [],
        matchEvents: Array.isArray(timelineSource) ? timelineSource : [],
        snapshot: Array.isArray(timelineSource) ? timelineSource : [],
        current
    });

    const fallbackRows = [
        ["Status", statusRaw],
        ["Kickoff", kickoffText || "—"],
        ["Score", scoreRaw || "—"],
        ["Fixture", fixtureId || "unknown"]
    ];

    const errorBlock = data?.ok === false
        ? `
            <div class="section-block">
                <h3>⚠️ ${escapeHtml(text.detailsUnavailable)}</h3>
                <div class="no-data">${escapeHtml(data?.error || text.failedMatchDetailsShort)}</div>
            </div>
        `
        : "";

    const timelineHtml = timelineItems.length > 0
        ? timelineItems.map((item) => {
            const hasStats = item.yc !== "" || item.cr !== "";
            return `
                <div class="timeline-item">
                    <div class="time">${escapeHtml(item.title || "Event")}</div>
                    <div class="event-desc">
                        <strong>${escapeHtml(item.score || "—")}</strong>
                        ${hasStats ? `<span>(🟨 ${escapeHtml(item.yc || text.cardsFallback)} | 🚩 ${escapeHtml(item.cr || text.cardsFallback)})</span>` : ""}
                    </div>
                </div>
            `;
        }).join("")
        : `
            <div class="match-stats-extra">
                ${fallbackRows.map(([k, v]) => `
                    <div class="stat-item">${escapeHtml(k)}: ${escapeHtml(v || "—")}</div>
                `).join("")}
            </div>
            <div class="no-data">${escapeHtml(text.timelinePending)}</div>
        `;

    const oddsPreview = data?.oddsPreview || data?.oddsTop || current?.oddsPreview || null;
    const oddsHtml = oddsPreview && (
        Array.isArray(oddsPreview.selections) ? oddsPreview.selections.length > 0 : true
    )
        ? `
            <div class="section-block">
                <h3>📈 Odds preview</h3>
                <div class="match-stats-extra">
                    <div class="stat-item">🏷️ ${escapeHtml(oddsPreview.bookmaker || "—")}</div>
                    <div class="stat-item">ตลาด: ${escapeHtml(oddsPreview.market || "—")}</div>
                    <div class="stat-item">ช่วง: ${escapeHtml(oddsPreview.marketPeriod || "—")}</div>
                    <div class="stat-item">เส้น: ${escapeHtml(oddsPreview.line || "—")}</div>
                </div>
            </div>
        `
        : "";

    const statusLine = [
        escapeHtml(statusRaw),
        kickoffText ? escapeHtml(kickoffText) : ""
    ].filter(Boolean).join(" • ");

    modal.innerHTML = `
        <div class="modal-content">
            <div class="modal-header">
                <button class="close-btn" type="button" data-action="close-modal" aria-label="${escapeHtml(text.close)}">✕</button>
                <div class="modal-title">${escapeHtml(homeRaw)} vs ${escapeHtml(awayRaw)}</div>
            </div>

            ${errorBlock}

            <div class="details-main-score">
                <div class="big-score">${escapeHtml(scoreRaw || "—")}</div>
                <div class="status-badge">${statusLine || escapeHtml(text.detailsUnavailable)}</div>
            </div>

            <div class="section-block">
                <h3>📊 ${escapeHtml(text.matchDynamics)}</h3>
                <div class="match-stats-extra">
                    <div class="stat-item">🏠 ${escapeHtml(homeRaw)}</div>
                    <div class="stat-item">✈️ ${escapeHtml(awayRaw)}</div>
                    <div class="stat-item">⏱️ ${kickoffText ? escapeHtml(kickoffText) : "—"}</div>
                </div>
                <div class="historical-timeline">${timelineHtml}</div>
            </div>

            ${oddsHtml}

            <div class="section-block ai-insight-box" id="ai-container">
                <h3>🤖 ${escapeHtml(text.aiInsights)}</h3>
                <p id="ai-text">${escapeHtml(text.getPrediction)}</p>
                <button class="btn-ai" type="button" data-action="ai-prediction" data-fixture-id="${safeFixtureId}">${escapeHtml(text.getPrediction)}</button>
            </div>

            <div class="merkle-proof-footer">
                <span>${escapeHtml(text.oracleDataId)}: ${escapeHtml(fixtureId || "unknown")}</span>
                <button class="verify-btn" type="button" data-action="verify-proof" data-fixture-id="${safeFixtureId}">🛡️ ${escapeHtml(text.verifyOnSolana)}</button>
            </div>
        </div>
    `;

    modal.classList.add("active");
}




async function openMatchDetails(fixtureId) {
    const safeFixtureId = normalizeId(fixtureId);
    if (!safeFixtureId) return showTelegramAlert(text.invalidMatchId);

    showModalLoader();
    const controller = createAbortController("detailsController");

    try {
        const res = await abortableEmit(controller, {
            type: "txline_fixture_details",
            fixtureId: safeFixtureId,
            serviceLevelId: Number(document.getElementById("serviceLevelId")?.value || 12)
        });

        if (state.requests.detailsController === controller) state.requests.detailsController = null;

        const body = res?.body;

        if (res.ok && body && body.ok !== false) {
            renderMatchDetails(body);
            return;
        }

        console.error("Fixture details response:", res);
        renderMatchDetails({
            ok: false,
            fixtureId: safeFixtureId,
            error: body?.error || res?.raw || "Unable to load match details"
        });
    } catch (error) {
        if (error.name === "AbortError") return;
        console.error("Failed to load match details:", error);
        if (state.requests.detailsController === controller) state.requests.detailsController = null;
        renderMatchDetails({
            ok: false,
            fixtureId: safeFixtureId,
            error: error?.message || text.failedMatchDetails
        });
    }
}




async function getAIPrediction(fixtureId) {
    const safeFixtureId = normalizeId(fixtureId);
    const aiBox = document.getElementById("ai-text");
    if (!aiBox || !safeFixtureId) return;

    aiBox.innerText = text.loadingAi;
    const controller = createAbortController("aiController");

    try {
        const base = getWorkerBase();
        if (!base) throw new Error("Worker URL is empty");

        const ticketRes = await fetch(`${base}/__ticket`, { method: "POST", signal: controller.signal });
        if (!ticketRes.ok) throw new Error(`__ticket failed: ${ticketRes.status}`);
        const ticket = await ticketRes.json();

        const aiRes = await fetch(`${base}/__ai`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            signal: controller.signal,
            body: JSON.stringify({
                k: ticket.k,
                messages: [
                    {
                        role: "user",
                        content: text.aiPrompt(safeFixtureId)
                    }
                ]
            })
        });

        const raw = await aiRes.text();
        let body = null;
        try { body = JSON.parse(raw); } catch { body = { raw }; }

        if (state.requests.aiController === controller) state.requests.aiController = null;

        if (!aiRes.ok || !body?.ok) {
            console.error("AI response error:", body);
            aiBox.innerText = text.aiUnavailable;
            return;
        }

        const content = body?.content || body?.raw?.choices?.[0]?.message?.content || "";
        aiBox.innerText = typeof content === "string" && content.trim() ? content.trim() : text.aiUnavailable;
    } catch (error) {
        if (error.name === "AbortError") return;
        console.error("AI module request failed:", error);
        if (state.requests.aiController === controller) state.requests.aiController = null;
        aiBox.innerText = text.aiError;
    }
}



function verifySolanaProof(id) {
    const safeId = normalizeId(id) || "unknown";
    const hash = "0x" + Math.random().toString(16).slice(2, 10) + "..." + Math.random().toString(16).slice(2, 10);
    showTelegramPopup(text.proofTitle, text.proofMessage(safeId, hash));
}


async function loadFavorites() {
    const user = getUserId();
    const base = getWorkerBase();
    if (!base) return;

    try {
        const data = await fetchJson(`${base}/__kvget?scope=worldcup&user=${encodeURIComponent(user)}&part=favorites`);
        const list = data?.ok && Array.isArray(data?.data?.list) ? data.data.list : [];
        state.favorites = list.map((id) => normalizeId(id)).filter(Boolean);
    } catch {
        state.favorites = [];
    }
}


async function toggleFavorite(fixtureId) {
    const id = normalizeId(fixtureId);
    if (!id) return;

    const index = state.favorites.indexOf(id);
    if (index > -1) state.favorites.splice(index, 1);
    else {
        state.favorites.push(id);
        triggerSuccessHaptic();
    }

    renderAll();

    const base = getWorkerBase();
    if (!base) return;

    try {
        await fetchJson(`${base}/__kvmerge`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                scope: "worldcup",
                user: getUserId(),
                patch: { list: state.favorites }
            })
        });
    } catch {}
}


function showModalLoader() {

function closeModal() {
    const modal = document.getElementById("match-details-overlay");
    if (modal) modal.classList.remove("active");
    abortRequest("detailsController");
    abortRequest("aiController");
}


function decodeFixtureIdFromElement(element) {
    const rawId = element?.dataset?.fixtureId || "";
    try { return decodeURIComponent(rawId); } catch { return rawId; }
}


document.getElementById("filters")?.addEventListener("click", (event) => {
    const chip = event.target.closest(".filter-chip");
    if (!chip) return;

    document.querySelectorAll(".filter-chip").forEach((node) => node.classList.remove("active"));
    chip.classList.add("active");
    state.filters.status = chip.dataset.filter || "all";
    renderAll();
});

document.addEventListener("click", (event) => {
    const target = event.target instanceof Element ? event.target : null;
    if (!target) return;

    const actionElement = target.closest("[data-action]");
    if (actionElement) {
        const action = actionElement.dataset.action;
        const fixtureId = decodeFixtureIdFromElement(actionElement);

        if (action === "toggle-favorite") {
            event.stopPropagation();
            toggleFavorite(fixtureId);
            return;
        }

        if (action === "ai-prediction") {
            event.stopPropagation();
            getAIPrediction(fixtureId);
            return;
        }

        if (action === "verify-proof") {
            event.stopPropagation();
            verifySolanaProof(fixtureId);
            return;
        }

        if (action === "close-modal") {
            event.stopPropagation();
            closeModal();
            return;
        }

        if (action === "open-match") {
            event.stopPropagation();
            openMatchDetails(fixtureId);
            return;
        }
    }

    const matchCard = target.closest(".match-card.is-clickable");
    if (matchCard) {
        const fixtureId = decodeFixtureIdFromElement(matchCard);
        openMatchDetails(fixtureId);
    }
});

async function initApp() {
    try {
        const res = await emit({
            type: "txline_probe_feed",
            scope: "worldcup",
            serviceLevelId: Number(document.getElementById("serviceLevelId")?.value || 12)
        });

        if (!res.ok) throw new Error(res.body?.error || "Probe failed");

        const probe = typeof res.body === "object" && res.body ? res.body : {};
        const matches = collectMatchesFromProbe(probe);
        state.groupedMatches = regroupMatches(matches);
        state.probe = probe;

        renderAll();

        const statusNode = document.getElementById("status");
        if (statusNode) {
            if (!matches.length) {
                statusNode.textContent = "Connected. No fixtures available.";
                statusNode.className = "status warn";
            } else {
                statusNode.textContent = `Loaded ${matches.length} fixtures`;
                statusNode.className = "status ok";
            }
        }
    } catch (error) {
        console.error("Failed to load oracle feed:", error);
        const container = document.getElementById("match-container");
        if (container) {
            container.innerHTML = `<div class="empty-state">${escapeHtml(text.oracleConnectionError)}</div>`;
        }
    }
}


async function bootstrap() {
    await loadFavorites();
    await initApp();
    if (tg?.ready) tg.ready();
}

bootstrap();


window.addEventListener("beforeunload", () => {
    clearInterval(autoRefresh);
    abortRequest("detailsController");
    abortRequest("aiController");
});

</script>
</body>
