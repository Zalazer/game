 <!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>FIFA 2026 Live</title>
  <style>
    :root{
      --bg:#07101d;
      --bg2:#0a1730;
      --card:#101a33;
      --card2:#0e1730;
      --line:rgba(255,255,255,.08);
      --text:#eef3ff;
      --muted:#9cabd8;
      --accent:#79a8ff;
      --accent2:#67f0c8;
      --danger:#ff6b82;
      --warn:#ffd36b;
      --shadow:0 16px 50px rgba(0,0,0,.35);
      --radius:20px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;padding:0;background:
        radial-gradient(1200px 700px at 20% 0%, rgba(121,168,255,.15), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(103,240,200,.12), transparent 50%),
        linear-gradient(180deg, var(--bg), #050911 100%);
      color:var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    a{color:inherit}
    button,input{font:inherit}
    .wrap{max-width:1400px;margin:0 auto;padding:18px}
    .hero{
      padding:16px 16px 14px;margin-bottom:16px;
      background:linear-gradient(180deg, rgba(16,26,51,.9), rgba(14,23,48,.88));
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:var(--shadow);
    }
    .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
    .hero-title{font-size:26px;font-weight:900;margin:0}
    .hero-sub{color:var(--muted);margin-top:6px;line-height:1.45}
    .hero-stats{display:flex;gap:10px;flex-wrap:wrap}
    .stat{
      padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.03);
      border:1px solid var(--line); min-width:110px
    }
    .stat .k{font-size:12px;color:var(--muted)}
    .stat .v{font-size:16px;font-weight:800;margin-top:4px}
    .controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
    .search{
      flex:1; min-width:220px;
      display:flex;align-items:center;gap:10px;
      padding:12px 14px;
      background:rgba(255,255,255,.03);
      border:1px solid var(--line);
      border-radius:16px;
    }
    .search input{
      width:100%;border:none;outline:none;background:transparent;color:var(--text)
    }
    .search input::placeholder{color:#7687b7}
    .seg{display:flex;gap:8px;flex-wrap:wrap}
    .seg button,.btn{
      padding:10px 14px;border-radius:14px;border:1px solid var(--line);
      background:rgba(255,255,255,.03);color:var(--text);cursor:pointer
    }
    .seg button.active,.btn.primary{background:linear-gradient(180deg, rgba(121,168,255,.24), rgba(121,168,255,.12));border-color:rgba(121,168,255,.35)}
    .grid{display:grid;grid-template-columns: 1.1fr .9fr;gap:16px;}
    @media (max-width: 1100px){.grid{grid-template-columns:1fr}}
    .card{
      background:linear-gradient(180deg, rgba(16,26,51,.9), rgba(14,23,48,.88));
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .card-head{
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      padding:16px 16px 12px;border-bottom:1px solid var(--line)
    }
    .card-title{font-weight:900;font-size:18px}
    .card-body{padding:16px}
    .matches{display:grid;grid-template-columns:1fr;gap:12px}
    .match{
      padding:14px 14px 12px;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(255,255,255,.03);
      cursor:pointer;
      transition:.15s transform,.15s border-color,.15s background;
    }
    .match:hover{transform:translateY(-1px);border-color:rgba(121,168,255,.35);background:rgba(121,168,255,.05)}
    .match-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .match-teams{font-weight:800;font-size:15px;line-height:1.3}
    .match-score{font-size:22px;font-weight:900}
    .match-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:12px}
    .pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 10px;border-radius:999px;border:1px solid var(--line);
      background:rgba(255,255,255,.03);
    }
    .pill.live{border-color:rgba(103,240,200,.45);color:#9bffe9}
    .pill.finished{border-color:rgba(255,255,255,.14);color:#dfe7ff}
    .pill.upcoming{border-color:rgba(121,168,255,.35);color:#bcd3ff}
    .pill.stopped{border-color:rgba(255,107,130,.45);color:#ffc1cb}
    .empty,.loader-centered{
      min-height:180px;display:flex;align-items:center;justify-content:center;
      color:var(--muted);text-align:center
    }
    .mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    @media (max-width: 780px){.mini-grid{grid-template-columns:repeat(2,1fr)}}
    .mini-item{
      padding:12px;border-radius:14px;border:1px solid var(--line);
      background:rgba(255,255,255,.03)
    }
    .mini-item strong{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
    .footer{
      margin-top:18px;color:var(--muted);font-size:12px;text-align:center;opacity:.9
    }

    .overlay{
      position:fixed;inset:0;background:rgba(2,5,12,.76);
      backdrop-filter:blur(10px);
      display:none;align-items:flex-start;justify-content:center;
      padding:18px;z-index:9999;overflow:auto;
    }
    .overlay.active{display:flex}
    .modal-content{
      width:min(1200px, 100%);
      margin:24px 0;
      background:linear-gradient(180deg, rgba(16,26,51,.98), rgba(14,23,48,.96));
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .modal-head{
      display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
      padding:16px 16px 14px;border-bottom:1px solid var(--line)
    }
    .modal-title{font-size:20px;font-weight:900}
    .close-btn{
      width:40px;height:40px;border-radius:12px;
      border:1px solid var(--line);background:rgba(255,255,255,.04);
      color:var(--text);cursor:pointer;font-size:18px
    }
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width: 820px){.detail-grid{grid-template-columns:1fr}}
    .detail-block{
      padding:14px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.03)
    }
    .bigscore{font-size:42px;font-weight:900;line-height:1}
    .muted{color:var(--muted)}
    .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .kv div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
    .kv b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
    .timeline{display:flex;flex-direction:column;gap:10px}
    .tl-item{
      padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03)
    }
    .tl-item .a{font-size:12px;color:var(--muted);margin-bottom:4px}
    .tl-item .b{font-size:14px}
    .odds-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    @media (max-width: 780px){.odds-grid{grid-template-columns:1fr}}
    .odd{
      padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03)
    }
    .odd .m{font-size:12px;color:var(--muted)}
    .odd .p{font-size:16px;font-weight:800;margin-top:5px}
    .source-list{display:flex;flex-direction:column;gap:8px}
    .source-item{
      display:flex;justify-content:space-between;gap:10px;align-items:center;
      padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)
    }
    .source-item small{color:var(--muted)}
    .nowrap{white-space:nowrap}

    .detail-tab-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:14px 0 10px;
      padding:0 16px;
    }
    .detail-tab-btn{
      padding:10px 14px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--text);
      cursor:pointer;
      font-weight:700;
      font-size:13px;
    }
    .detail-tab-btn.active{
      background:#00C896;
      color:#08130f;
      border-color:#00C896;
    }
    .detail-panel.hidden{display:none}
    .detail-panel{
      padding:0 16px 16px;
      margin-top:0;
    }
    #match-intelligence-card{
      margin:16px 16px 0;
      padding:15px;
      border-radius:12px;
      background:#161616;
      border:1px solid #333;
    }
    .intelligence-item{
      padding:8px 0;
      border-bottom:1px solid #333;
    }
    .timeline-event{
      padding:12px;
      margin-bottom:10px;
      border-left:4px solid #00C896;
      background:#1B1B1B;
      border-radius:10px;
    }
    .snapshot-item{
      padding:12px;
      margin-bottom:10px;
      background:#1B1B1B;
      border-radius:10px;
    }
    .analysis-item{
      padding:12px;
      margin-bottom:10px;
      background:#1B1B1B;
      border-radius:10px;
    }
    .spinner{
      width:28px;height:28px;border:3px solid rgba(255,255,255,.15);
      border-top-color:var(--accent2);border-radius:50%;
      animation:spin 1s linear infinite;margin:0 auto 8px
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty-box{
      padding:16px;
      border:1px dashed var(--line);
      border-radius:16px;
      background:rgba(255,255,255,.02);
      color:var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="hero-top">
        <div>
          <h1 class="hero-title">FIFA 2026 Live</h1>
          <div class="hero-sub">All matches • Live • Upcoming • Favorites</div>
        </div>
        
      </div>
      <div class="controls">
        <div class="search">
          <span>🔎</span>
          <input id="searchInput" placeholder="Search teams, competition, fixture id..." />
        </div>
        <div class="seg">
          <button class="btn primary" id="refreshBtn">Refresh</button>
          <button class="btn" id="checkTokenBtn">Check token</button>
        </div>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <div class="card-head">
          <div class="card-title">Match Dashboard</div>
          <div class="muted" id="dashboardHint">Loading oracle data…</div>
        </div>
        <div class="card-body">
          <div class="seg" id="groupButtons">
            <button class="active" data-group="all">All (0)</button>
            <button data-group="live">Live (0)</button>
            <button data-group="upcoming">Upcoming (0)</button>
            <button data-group="finished">Finished (0)</button>
            <button data-group="stopped">Stopped (0)</button>
            <button data-group="favorites">Favorites (0)</button>
          </div>
          <div style="margin-top:14px" id="featuredBox">
            <div class="empty">Loading…</div>
          </div>
          <div style="margin-top:14px" class="muted" id="feedStatus">Loading oracle feed…</div>
          <div style="margin-top:14px" class="matches" id="matchesList">
            <div class="empty">Loading matches…</div>
          </div>
        </div>
      </section>

      <aside class="card">
        <div class="card-head">
          <div class="card-title">Featured match</div>
          <div class="muted" id="featuredState">—</div>
        </div>
        <div class="card-body" id="featuredWrap">
          <div class="empty">Loading…</div>
        </div>
      </aside>
    </div>

    <div class="footer">TxLINE frontend rebuilt from worker contract</div>
  </div>

  <div class="overlay" id="detailOverlay" aria-hidden="true">
    <div class="modal-content" id="detailModal"></div>
  </div>

<script>
const API_BASE = '';
const WORKER_BASE = '';
const state = {
  feed: null,
  matches: [],
  grouped: {},
  featured: null,
  workerFeatured: null,
  enrichment: null,
  favorites: new Set(JSON.parse(localStorage.getItem('favorites') || '[]')),
  group: 'all',
  query: '',
  loading: false,
  currentFixtureId: null
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '')
  .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
  .replaceAll('"','&quot;').replaceAll("'","&#39;");

function txScalar(v){
  if (v == null) return '';
  if (typeof v === 'string') return v;
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  if (Array.isArray(v)) return v.map(txScalar).filter(Boolean).join(', ');
  if (typeof v === 'object') {
    return String(v.name ?? v.Name ?? v.label ?? v.Label ?? v.title ?? v.Title ?? v.text ?? v.Text ?? v.value ?? v.Value ?? v.code ?? v.Code ?? '');
  }
  return '';
}
function txNum(v){ const n = Number(v); return Number.isFinite(n) ? n : null; }
function txPhaseLabel(p){
  if (p === 'live') return 'Live';
  if (p === 'finished') return 'Finished';
  if (p === 'upcoming') return 'Not started';
  if (p === 'stopped') return 'Stopped';
  return 'Unknown';
}
function txStatusClass(p){
  if (p === 'live') return 'live';
  if (p === 'finished') return 'finished';
  if (p === 'upcoming') return 'upcoming';
  return '';
}
function derivePhase(m) {
  if (!m || typeof m !== 'object') return 'unknown';
  const phase = txScalar(m.phase ?? m.currentPhase);
  if (phase === 'live' || phase === 'upcoming' || phase === 'finished' || phase === 'stopped') return phase;
  const status = String(m.status ?? m.gameState ?? m.rawStatus ?? '').trim().toUpperCase();
  const statusId = txNum(m.statusId ?? m.gameState ?? m.rawStatus);
  if (['F','FINAL','FINISHED','FULL TIME','FULL-TIME'].includes(status) || [5,10,13,100].includes(statusId)) return 'finished';
  if (['H1','HT','H2','ET1','ET2','PE','WET','WPE'].includes(status) || [2,3,4,6,7,8,9,11,12].includes(statusId)) return 'live';
  if (['I','A','C','P','TXCC','TXCS'].includes(status) || [14,15,16,17,18,19].includes(statusId)) return 'stopped';
  if (['NS','UPCOMING','NOT STARTED','SCHEDULED'].includes(status) || [1].includes(statusId)) return 'upcoming';
  if (m.homeScore != null || m.awayScore != null) return 'unknown';
  return 'unknown';
}
function normalizeMatch(x) {
  if (!x || typeof x !== 'object') return {};
  const current = x.currentCompact ?? x.current ?? {};
  const fixtureId = String(x.fixtureId ?? x.FixtureId ?? x.id ?? current.fixtureId ?? '');
  const home = txScalar(x.home ?? x.homeTeam ?? x.participant1 ?? x.Participant1 ?? current.home ?? current.homeTeam);
  const away = txScalar(x.away ?? x.awayTeam ?? x.participant2 ?? x.Participant2 ?? current.away ?? current.awayTeam);
  const competition = txScalar(x.competition ?? x.Competition ?? current.competition);
  const kickoff = x.kickoff ?? x.startTime ?? x.StartTime ?? current.kickoff ?? current.startTime ?? null;
  const homeScore = txNum(x.homeScore ?? current.homeScore);
  const awayScore = txNum(x.awayScore ?? current.awayScore);
  const score = txScalar(x.score ?? current.score) || (homeScore != null && awayScore != null ? `${homeScore}-${awayScore}` : '');
  const phase = txScalar(x.phase ?? current.phase) || derivePhase({
    status: x.status ?? current.status,
    gameState: x.gameState ?? current.gameState,
    rawStatus: x.rawStatus ?? current.rawStatus,
    statusId: x.statusId ?? current.statusId,
    homeScore,
    awayScore
  });
  return { ...x, fixtureId, home, away, competition, kickoff, homeScore, awayScore, score: score || '—', phase, currentCompact: current };
}
function byFixtureId(arr){
  const seen = new Set();
  return (arr || []).map(normalizeMatch).filter(m => {
    if (!m.fixtureId) return false;
    if (seen.has(m.fixtureId)) return false;
    seen.add(m.fixtureId);
    return true;
  });
}
function setTabActive(tab) {
  document.querySelectorAll('.detail-tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  document.querySelectorAll('.detail-panel').forEach(panel => {
    panel.classList.add('hidden');
  });
  const target = document.getElementById(`${tab}-panel`);
  if (target) target.classList.remove('hidden');
}
function prettyOddsText(text) {
  if (!text) return '';
  return String(text)
    .replaceAll('part1:', 'Home: ')
    .replaceAll('part2:', 'Away: ')
    .replaceAll('draw:', 'Draw: ')
    .replaceAll('over:', 'Over: ')
    .replaceAll('under:', 'Under: ')
    .replaceAll('|', ' • ');
}
function saveFavorites(){
  localStorage.setItem('favorites', JSON.stringify([...state.favorites]));
}
function favoriteCount(){
  return state.favorites.size;
}
function filteredMatches(){
  let arr = [...(state.matches || [])];
  if (state.group !== 'all') arr = arr.filter(m => (m.phase || derivePhase(m)) === state.group);
  if (state.group === 'favorites') arr = arr.filter(m => state.favorites.has(String(m.fixtureId)));
  const q = state.query.trim().toLowerCase();
  if (q) {
    arr = arr.filter(m => (
      String(m.fixtureId || '').toLowerCase().includes(q) ||
      String(m.home || '').toLowerCase().includes(q) ||
      String(m.away || '').toLowerCase().includes(q) ||
      String(m.competition || '').toLowerCase().includes(q)
    ));
  }
  return arr;
}
function renderStats(){
  const g = state.grouped || {};
  const allCount = (state.matches || []).length;
  $('statMatches').textContent = String(allCount);
  $('statLive').textContent = String((g.live || []).length);
  $('statFinished').textContent = String((g.finished || []).length);
  $('statFavs').textContent = String(favoriteCount());
  const buttons = [...document.querySelectorAll('#groupButtons button')];
  const counts = {
    all: allCount,
    live: (g.live || []).length,
    upcoming: (g.upcoming || []).length,
    finished: (g.finished || []).length,
    stopped: (g.stopped || []).length,
    favorites: favoriteCount()
  };
  buttons.forEach(btn => {
    const k = btn.dataset.group;
    btn.textContent = `${k[0].toUpperCase()}${k.slice(1)} (${counts[k] ?? 0})`;
    btn.classList.toggle('active', state.group === k);
  });
}
function renderFeatured(){
  const featured = state.workerFeatured || state.featured || null;
  const el = $('featuredWrap');
  $('featuredState').textContent = featured ? txPhaseLabel(featured.phase || derivePhase(featured)) : '—';
  if (!featured) {
    el.innerHTML = `<div class="empty">No featured match.</div>`;
    return;
  }
  const phase = featured.phase || derivePhase(featured);
  if (!featured.fixtureId) {
    el.innerHTML = `<div class="empty">Featured match has no fixture ID.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="match" onclick="openDetails('${esc(featured.fixtureId)}')">
      <div class="match-top">
        <div>
          <div class="match-teams">${esc(featured.home || '—')} vs ${esc(featured.away || '—')}</div>
          <div class="match-meta">
            <span class="pill ${txStatusClass(phase)}">${esc(txPhaseLabel(phase))}</span>
            <span class="pill">${esc(featured.competition || 'World Cup')}</span>
            <span class="pill">#${esc(featured.fixtureId || '')}</span>
          </div>
        </div>
        <div class="match-score">${esc(featured.score || '—')}</div>
      </div>
      <div class="match-meta">
        <span class="pill">Kickoff: ${esc(featured.kickoff || '—')}</span>
        <span class="pill">Home ${esc(featured.homeScore ?? '—')}</span>
        <span class="pill">Away ${esc(featured.awayScore ?? '—')}</span>
      </div>
    </div>
  `;
}
function renderMatches(){
  const list = $('matchesList');
  const arr = filteredMatches();
  if (!arr.length) {
    list.innerHTML = `<div class="empty">No matches.</div>`;
    return;
  }
  list.innerHTML = arr.map(m => {
    const phase = m.phase || derivePhase(m);
    const fav = state.favorites.has(String(m.fixtureId));
    return `
      <div class="match" onclick="openDetails('${esc(m.fixtureId)}')">
        <div class="match-top">
          <div>
            <div class="match-teams">${fav ? '★ ' : ''}${esc(m.home || '—')} vs ${esc(m.away || '—')}</div>
            <div class="match-meta">
              <span class="pill ${txStatusClass(phase)}">${esc(txPhaseLabel(phase))}</span>
              <span class="pill">${esc(m.competition || '—')}</span>
              <span class="pill">#${esc(m.fixtureId || '')}</span>
            </div>
          </div>
          <div class="match-score">${esc(m.score || '—')}</div>
        </div>
      </div>
    `;
  }).join('');
}
function renderApp(){
  renderStats();
  renderFeatured();
  renderMatches();
}
function availabilityHtml(avail) {
  return `
    <div class="kv">
      <div><b>Live statistics</b>${avail.hasSnapshot ? ' ✓ Available' : ' ✗ Missing'}</div>
      <div><b>Match events</b>${avail.hasLiveEvents ? ' ✓ Available' : ' ✗ Missing'}</div>
      <div><b>Historical data</b>${avail.hasHistorical ? ' ✓ Available' : ' ✗ Missing'}</div>
      <div><b>Betting odds</b>${avail.hasOdds ? ' ✓ Available' : ' ✗ Missing'}</div>
    </div>
  `;
}
function renderTimeline(items) {
  const panel = document.getElementById('timeline-panel');
  if (!panel) return;
  if (!items?.length) {
    panel.innerHTML = `<div class="empty-box">No timeline.</div>`;
    return;
  }
  panel.innerHTML = items.map(item => `
    <div class="timeline-event">
      <h4 style="margin:0 0 6px 0">${esc(item.time ?? '')}</h4>
      <p style="margin:0 0 4px 0">${esc(item.event ?? '')}</p>
      <p style="margin:0;color:var(--muted)">${esc(item.score ?? '')}</p>
    </div>
  `).join('');
}
function renderHistory(items) {
  const panel = document.getElementById('history-panel');
  if (!panel) return;
  if (!items?.length) {
    panel.innerHTML = `<div class="empty-box">No history.</div>`;
    return;
  }
  panel.innerHTML = items.map(item => `
    <div class="snapshot-item">
      <p>Timestamp: ${esc(item.timestamp ?? '')}</p>
      <p>Status: ${esc(item.status ?? '')}</p>

}

async function loadMatchHistory(matchId){
  const base = WORKER_BASE || location.origin;
  const response = await fetch(`${base}/match/${matchId}/history`);
  if (!response.ok) throw new Error(`History request failed: ${response.status}`);
  const data = await response.json();
  renderTimeline(data.timeline || []);
  renderHistory(data.snapshots || []);
  renderAnalysis(data.analysis || {});
  renderOddsHistory(data.oddsHistory || []);
  renderAISummary(data.aiSummary || '');
  renderMatchIntelligence(data.intelligence || {});
}
async function closeDetails(){
  $('detailOverlay').classList.remove('active');
  $('detailOverlay').setAttribute('aria-hidden','true');
}
async function openDetails(fixtureId) {
  fixtureId = String(fixtureId ?? "").trim();
  if (!fixtureId) return;
  state.currentFixtureId = fixtureId;
  $('detailOverlay').classList.add('active');
  $('detailOverlay').setAttribute('aria-hidden','false');
  $('detailModal').innerHTML = `
    <div class="loader-centered">
      <div>
        <div class="spinner"></div>
        <div>Loading details…</div>
      </div>
    </div>
  `;
  try {
    const res = await emit('txline_fixture_details', {
      serviceLevelId: 12,
      fixtureId,
      oddsLimit: 999,
      eventLimit: 999
    });
    renderDetails(res);
  } catch (e) {
    $('detailModal').innerHTML = `
      <div class="empty-box">
        Details failed: ${esc(e?.message || String(e))}
      </div>
    `;
  }
}
function compactEventRow(it) {
  return `
    <div class="tl-item">
      <div class="a">${esc(it.period || it.clock || it.timestamp || it.type || 'Event')}</div>
      <div class="b">${esc(it.detail || it.description || it.text || it.name || it.title || 'Match event')}</div>
    </div>
  `;
}
function renderDetails(d) {
  const current = d?.current || {};
  const compact = d?.currentCompact || {};
  const fixtureId = String(d?.fixtureId ?? compact?.fixtureId ?? current?.fixtureId ?? state.currentFixtureId ?? "");
  const home = txScalar(compact.home ?? current.home ?? "");
  const away = txScalar(compact.away ?? current.away ?? "");
  const phase = txScalar(d?.phase ?? compact?.phase ?? current?.phase) || derivePhase(current);
  const homeScore = txNum(compact.homeScore ?? current.homeScore);
  const awayScore = txNum(compact.awayScore ?? current.awayScore);
  let score = txScalar(compact.score ?? current.score ?? d.score);
  if ((!score || score === "—") && homeScore != null && awayScore != null) score = `${homeScore}-${awayScore}`;
  if (!score) score = "—";
  const status = txScalar(d?.status ?? compact?.status ?? current?.status ?? txPhaseLabel(phase));
  const competition = txScalar(current.competition ?? compact.competition ?? d.competition ?? "");
  const events = [].concat(d.events || []);
  const snapshot = [].concat(d.snapshot || []);
  const historical = [].concat(d.historical || []);
  const oddsTop = [].concat(d.oddsTop || d.oddsPreview || d.odds || []);
  const counts = d.counts || {};
  const avail = d.availability || {};
  const source = [].concat(d.source || []);
  const teamTitle = `${esc(home || "—")} vs ${esc(away || "—")}`;
  const oddsHtml = oddsTop.length
    ? oddsTop.map(o => `
      <div class="odd">
        <div class="m">${esc(o.bookmaker || o.market || "Market")}</div>
        <div class="p" style="line-height:1.6;font-size:15px;word-break:break-word;">
          ${esc(prettyOddsText(o.pricesText || o.price || o.selection || JSON.stringify(o)))}
        </div>
      </div>
    `).join("")
    : '<div class="empty-box">No odds data.</div>';
  const eventHtml = [...historical, ...snapshot, ...events].map(it => compactEventRow(it)).join("") || '<div class="empty-box">No events.</div>';
  const sourceHtml = source.length
    ? source.map(s => `
      <div class="source-item">
        <div>
          <strong>${esc(s.rawType || s.url || "source")}</strong>
          <div><small>${esc(s.url || "")}</small></div>
        </div>
        <span class="nowrap">
          ${s.ok === true ? "OK" : s.ok === false ? "ERR" : esc(s.status || "—")}
        </span>
      </div>
    `).join("")
    : '<div class="empty-box">No source diagnostics.</div>';
  const matchClock = txScalar(compact.clock ?? current.clock);
  const summaryHtml = `
    <div class="detail-block">
      <div style="font-size:26px;font-weight:900;margin-bottom:8px;">MATCH SUMMARY</div>
      <div style="font-size:22px;font-weight:800;">${teamTitle}</div>
      <div class="muted" style="margin-top:8px">${esc(txPhaseLabel(phase))}</div>
      <div style="font-size:48px;font-weight:900;margin-top:18px;margin-bottom:12px;">${esc(score)}</div>
      ${competition ? `<div class="muted">Competition: ${esc(competition)}</div>` : ""}
      ${fixtureId ? `<div class="muted">Fixture ID: ${esc(fixtureId)}</div>` : ""}
      ${current.startTime || compact.startTime ? `<div class="muted">Kick-off: ${esc(current.startTime ?? compact.startTime)}</div>` : ""}
      ${matchClock ? `<div class="muted">Match clock: ${esc(matchClock)}</div>` : ""}
    </div>
    <div class="detail-block" style="margin-top:12px">
      <h3>AVAILABLE DATA</h3>
      ${availabilityHtml(avail)}
    </div>
  `;
  const intelligenceHtml = `
    <div id="match-intelligence-card">
      <h3>MATCH INTELLIGENCE</h3>
      <div id="intelligence-content">Loading...</div>
    </div>
  `;
  const tabsHtml = `
    <div class="detail-tab-row">
      <button class="detail-tab-btn active" data-tab="overview" onclick="setTabActive('overview')">Overview</button>
      <button class="detail-tab-btn" data-tab="stats" onclick="setTabActive('stats')">Stats</button>
      <button class="detail-tab-btn" data-tab="events" onclick="setTabActive('events')">Events</button>
      <button class="detail-tab-btn" data-tab="odds" onclick="setTabActive('odds')">Odds</button>
      <button class="detail-tab-btn" data-tab="timeline" onclick="setTabActive('timeline')">Timeline</button>
      <button class="detail-tab-btn" data-tab="history" onclick="setTabActive('history')">History</button>
      <button class="detail-tab-btn" data-tab="analysis" onclick="setTabActive('analysis')">Analysis</button>
      <button class="detail-tab-btn" data-tab="odds-history" onclick="setTabActive('odds-history')">Odds History</button>
      <button class="detail-tab-btn" data-tab="ai-summary" onclick="setTabActive('ai-summary')">AI Summary</button>
    </div>
  `;
  const panelsHtml = `
    <div id="overview-panel" class="detail-panel">
      <div class="detail-grid">
        <div class="detail-block">
          <div class="muted">Score</div>
          <div class="bigscore">${esc(score)}</div>
          <div class="muted" style="margin-top:10px">${esc(status)}</div>
        </div>
        <div class="detail-block">
          <div class="muted">Teams</div>
          <div style="font-weight:900;font-size:20px;margin-top:4px">${teamTitle}</div>
          <div class="kv" style="margin-top:12px">
            <div><b>Home</b>${esc(homeScore ?? '—')}</div>
            <div><b>Away</b>${esc(awayScore ?? '—')}</div>
          </div>
        </div>
      </div>

      <div class="detail-block" style="margin-top:12px">
        <h3>AVAILABLE DATA</h3>
        ${availabilityHtml(avail)}
      </div>

      <div class="detail-block" style="margin-top:12px">
        <h3>ODDS</h3>
        <div class="odds-grid">${oddsHtml}</div>
      </div>

      <div class="detail-block" style="margin-top:12px">
        <h3>EVENTS</h3>
        <div class="timeline">${eventHtml}</div>
      </div>

      <div class="detail-block" style="margin-top:12px">
        <h3>SOURCE DIAGNOSTICS</h3>
        <div class="source-list">${sourceHtml}</div>
      </div>
    </div>

    <div id="stats-panel" class="detail-panel hidden">
      <div class="detail-block">
        <h3>STATS</h3>
        <div class="mini-grid">
          <div class="mini-item"><strong>Snapshot count</strong><span>${esc(counts.snapshot ?? 0)}</span></div>
          <div class="mini-item"><strong>Events count</strong><span>${esc(counts.events ?? 0)}</span></div>
          <div class="mini-item"><strong>Historical count</strong><span>${esc(counts.historical ?? 0)}</span></div>
          <div class="mini-item"><strong>Odds count</strong><span>${esc(counts.odds ?? 0)}</span></div>
        </div>
      </div>
    </div>

    <div id="events-panel" class="detail-panel hidden">
      <div class="detail-block">
        <h3>EVENTS</h3>
        <div class="timeline">${eventHtml}</div>
      </div>
    </div>

    <div id="odds-panel" class="detail-panel hidden">
      <div class="detail-block">
        <h3>ODDS</h3>
        <div class="odds-grid">${oddsHtml}</div>
      </div>
    </div>

    <div id="timeline-panel" class="detail-panel hidden"></div>
    <div id="history-panel" class="detail-panel hidden"></div>
    <div id="analysis-panel" class="detail-panel hidden"></div>
    <div id="odds-history-panel" class="detail-panel hidden"></div>
    <div id="ai-summary-panel" class="detail-panel hidden"></div>
  `;

  $('detailModal').innerHTML = `
    ${intelligenceHtml}
    ${tabsHtml}
    ${panelsHtml}
    <div class="modal-head" style="margin-top:8px">
      <div>
        <div class="modal-title">${teamTitle}</div>
        <div class="muted">${esc(fixtureId)} • ${esc(txPhaseLabel(phase))} • ${esc(status)}</div>
      </div>
      <button class="close-btn" onclick="closeDetails()">×</button>
    </div>
  `;

  setTabActive('overview');
  if (fixtureId) loadMatchHistory(fixtureId).catch(() => {});
}
async function emit(type, d){
  const k = Math.random().toString(36).slice(2);
  const body = { k, d: { ...d, type } };
  const res = await fetch('/emit', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`emit failed: ${res.status}`);
  return await res.json();
}
function updateGroupButtons(){
  const counts = {
    all: (state.matches || []).length,
    live: (state.grouped.live || []).length,
    upcoming: (state.grouped.upcoming || []).length,
    finished: (state.grouped.finished || []).length,
    stopped: (state.grouped.stopped || []).length,
    favorites: favoriteCount()
  };
  document.querySelectorAll('#groupButtons button').forEach(btn => {
    const g = btn.dataset.group;
    btn.textContent = `${g[0].toUpperCase()}${g.slice(1)} (${counts[g] ?? 0})`;
    btn.classList.toggle('active', state.group === g);
  });
}
async function loadData() {
  state.loading = true;
  $('dashboardHint').textContent = 'Loading oracle data…';
  $('feedStatus').textContent = 'Loading oracle feed…';
  try {
    const res = await fetch('/api/feed');
    if (!res.ok) throw new Error(`feed failed: ${res.status}`);
    const data = await res.json();
    state.feed = data;
    state.grouped = data.grouped || {};
    state.featured = normalizeMatch(data.featured || null);
    state.workerFeatured = normalizeMatch(data.workerFeatured || null);
    state.enrichment = data.enrichment || null;
    const matches = [
      ...(data.matches || []),
      ...(data.grouped?.live || []),
      ...(data.grouped?.upcoming || []),
      ...(data.grouped?.finished || []),
      ...(data.grouped?.stopped || []),
      ...(data.grouped?.unknown || [])
    ];
    state.matches = byFixtureId(matches);
    updateGroupButtons();
    renderApp();
    $('dashboardHint').textContent = 'Oracle feed ready';
    $('feedStatus').textContent = `Loaded ${state.matches.length} matches`;
  } catch (e) {
    $('dashboardHint').textContent = 'Load failed';
    $('feedStatus').textContent = `Load failed: ${e?.message || e}`;
    $('featuredWrap').innerHTML = `<div class="empty">Load failed: ${esc(e?.message || String(e))}</div>`;
  } finally {
    state.loading = false;
    renderApp();
  }
}
async function checkToken(){
  try{
    const res = await emit('txline_check_token', { serviceLevelId: 12 });
    alert(JSON.stringify(res, null, 2));
  }catch(e){
    alert('Token check failed: ' + (e?.message || e));
  }
}
$('refreshBtn').addEventListener('click', loadData);
$('checkTokenBtn').addEventListener('click', checkToken);
$('searchInput').addEventListener('input', e => {
  state.query = e.target.value || '';
  renderMatches();
});
document.querySelectorAll('#groupButtons button').forEach(btn => {
  btn.addEventListener('click', () => {
    state.group = btn.dataset.group;
    updateGroupButtons();
    renderMatches();
  });
});
window.closeDetails = closeDetails;
window.openDetails = openDetails;
window.setTabActive = setTabActive;
window.loadMatchHistory = loadMatchHistory;
window.emit = emit;
window.loadData = loadData;
loadData();
</script>
