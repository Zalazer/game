<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TON Wallet Recovery Tool</title>
<style>
:root{
  --bg:#0f172a;
  --panel:#111827;
  --panel2:#020617;
  --text:#e2e8f0;
  --muted:#94a3b8;
  --line:#334155;
  --green:#22c55e;
  --red:#ef4444;
  --blue:#38bdf8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--bg);
  color:var(--text);
  padding:20px
}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:22px;margin:0 0 16px}
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  margin-bottom:14px
}
button{
  padding:10px 14px;
  background:var(--green);
  color:#04130a;
  border:0;
  border-radius:10px;
  font-weight:700;
  cursor:pointer
}
button.secondary{
  background:#1e293b;
  color:var(--text);
  border:1px solid var(--line)
}
button:disabled{opacity:.55;cursor:not-allowed}
input,select{
  padding:10px 12px;
  background:#1e293b;
  color:#fff;
  border:1px solid var(--line);
  border-radius:10px
}
input[type="text"]{width:min(100%,720px)}
label{color:var(--muted);font-size:13px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
  margin-bottom:14px
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px
}
pre{
  background:var(--panel2);
  border:1px solid var(--line);
  padding:15px;
  height:68vh;
  overflow:auto;
  white-space:pre-wrap;
  word-break:break-word;
  border-radius:12px
}
.used{color:var(--green)}
.empty{color:#64748b}
.error{color:var(--red)}
.info{color:var(--blue)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>TON Wallet Recovery</h1>

  <div class="controls">
    <button id="gen">Generate Mnemonic</button>
    <input id="mnemonic" type="text" placeholder="paste mnemonic" autocomplete="off" spellcheck="false" />
    <button id="load" class="secondary">Load</button>
    <button id="scan" disabled>Scan</button>
    <button id="clear" class="secondary">Clear Log</button>
  </div>

  <div class="grid">
    <div class="card">
      <label for="network">Network</label><br />
      <select id="network">
        <option value="mainnet" selected>Mainnet</option>
        <option value="testnet">Testnet</option>
      </select>
    </div>
    <div class="card">
      <div class="small">Checks wallet versions:</div>
      <div class="small">V1R1, V1R2, V1R3</div>
      <div class="small">V2R1, V2R2</div>
      <div class="small">V3R1, V3R2</div>
      <div class="small">V4R1, V4R2, V5R1</div>
    </div>
  </div>

  <pre id="out">Ready...</pre>
</div>





<script type="module">

  import { generateMnemonic, validateMnemonic } from "https://esm.sh/@scure/bip39@1.3.0";
  import { wordlist } from "https://esm.sh/@scure/bip39@1.3.0/wordlists/english";
  import { mnemonicToPrivateKey } from "https://esm.sh/@ton/crypto@3.2.0";
  import {
  TonClient,
  WalletContractV1R1,
  WalletContractV1R2,
  WalletContractV1R3,
  WalletContractV2R1,
  WalletContractV2R2,
  WalletContractV3R1,
  WalletContractV3R2,
  WalletContractV4,
  WalletContractV5R1
} from "https://esm.sh/@ton/ton@15.0.0";

  // Сразу в начале добавим проверку, что мы живы
  console.log("Script initialized");




const out = document.getElementById("out");
const mnemonicInput = document.getElementById("mnemonic");
const networkSelect = document.getElementById("network");
const btnGen = document.getElementById("gen");
const btnLoad = document.getElementById("load");
const btnScan = document.getElementById("scan");
const btnClear = document.getElementById("clear");

let keyPair = null;
let busy = false;

const clients = {
  mainnet: new TonClient({ endpoint: "https://toncenter.com/api/v2/jsonRPC" }),
  testnet: new TonClient({ endpoint: "https://testnet.toncenter.com/api/v2/jsonRPC" })
};


const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

function isRateLimitError(e) {
  const msg = String(e?.message || e || "");
  return msg.includes("429") || msg.toLowerCase().includes("rate limit");
}



function log(text, cls = "") {
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.textContent = text;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}

function resetLog() {
  out.innerHTML = "";
}

function setBusy(state) {
  busy = state;
  btnGen.disabled = state;
  btnLoad.disabled = state;
  btnScan.disabled = state;
  networkSelect.disabled = state;
}

function normalizeMnemonic(text) {
  return String(text || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");
}

function uniqueByAddress(items) {
  const seen = new Set();
  return items.filter(x => {
    if (seen.has(x.address)) return false;
    seen.add(x.address);
    return true;
  });
}


function logAddressFormats(address, isTestnet) {
  const raw = address.toRawString();

  const bounceable = address.toString({
    urlSafe: true,
    bounceable: true,
    testOnly: isTestnet
  });

  const nonBounceable = address.toString({
    urlSafe: true,
    bounceable: false,
    testOnly: isTestnet
  });

  log(`Raw: ${raw}`, "info");
  log(`Bounceable: ${bounceable}`, "info");
  log(`Non-bounceable: ${nonBounceable}`, "info");
}


function bytesToBase64Url(bytes) {
  const arr = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  let binary = "";
  
  for (let i = 0; i < arr.length; i++) {
    binary += String.fromCharCode(arr[i]);
  }

  return btoa(binary)
    .replace(/\+/g, '-')   // экранируем +
    .replace(/\//g, '_')   // экранируем /
    .replace(/=+$/, '');   // убираем padding
}


async function fetchLastTxTimestamp(client, address, lastTx) {
  // Нам больше не нужны lt и hash для запроса
  try {
    const endpoint = networkSelect.value === "testnet"
      ? "https://testnet.toncenter.com/api/v2/getTransactions"
      : "https://toncenter.com/api/v2/getTransactions";

    const addr = address.toString({
      urlSafe: true,
      bounceable: true,
      testOnly: networkSelect.value === "testnet"
    });

    // Запрашиваем историю только для этого адреса с limit 1.
    // TON Center сам отдаст самую последнюю транзакцию без передачи хеша.
    const url = `${endpoint}?address=${encodeURIComponent(addr)}&limit=1`;

    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const json = await res.json();
    const tx = json?.result?.[0];

    if (!tx || typeof tx.utime !== "number") return null;

    const dt = new Date(tx.utime * 1000);
    return { iso: dt.toISOString(), local: dt.toLocaleString() };
  } catch (e) {
    return { error: String(e) };
  }
}





function buildCandidates() {
  if (!keyPair) throw new Error("No keyPair loaded");

  const pub = keyPair.publicKey;
  const isTestnet = networkSelect.value === "testnet";
  const v5NetworkGlobalId = isTestnet ? -3 : -239;

  const factories = [
    {
      name: "Wallet V1R1",
      create: () => WalletContractV1R1.create({ publicKey: pub, workchain: 0 })
    },
    {
      name: "Wallet V1R2",
      create: () => WalletContractV1R2.create({ publicKey: pub, workchain: 0 })
    },
    {
      name: "Wallet V1R3",
      create: () => WalletContractV1R3.create({ publicKey: pub, workchain: 0 })
    },
    {
      name: "Wallet V2R1",
      create: () => WalletContractV2R1.create({ publicKey: pub, workchain: 0 })
    },
    {
      name: "Wallet V2R2",
      create: () => WalletContractV2R2.create({ publicKey: pub, workchain: 0 })
    },
    {
      name: "Wallet V3R1",
      create: () => WalletContractV3R1.create({ publicKey: pub, workchain: 0 })
    },
    {
      name: "Wallet V3R2",
      create: () => WalletContractV3R2.create({ publicKey: pub, workchain: 0 })
    },
    {
      name: "Wallet V4R1",
      create: () => WalletContractV4.create({
        publicKey: pub,
        workchain: 0,
        walletId: 0
      })
    },
    {
      name: "Wallet V4R2",
      create: () => WalletContractV4.create({
        publicKey: pub,
        workchain: 0,
        walletId: 0x29a9a317
      })
    },
    {
      name: "Wallet V5R1",
      create: () => WalletContractV5R1.create({
        publicKey: pub,
        workchain: 0,
        walletId: {
          networkGlobalId: v5NetworkGlobalId
        }
      })
    }
  ];

  const built = [];

  for (const item of factories) {
    try {
      const wallet = item.create();
      built.push({
        ...item,
        wallet,
        address: wallet.address.toString({
          urlSafe: true,
          bounceable: true,
          testOnly: isTestnet
        })
      });
    } catch (e) {
      log(`[SKIP] ${item.name}: ${String(e)}`, "error");
    }
  }

  return uniqueByAddress(built);
}






async function checkWallet(client, candidate) {
  const maxRetries = 4;
  const isTestnet = networkSelect.value === "testnet";

  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    try {
      const state = await client.getContractState(candidate.wallet.address);
      const balance = BigInt(state.balance ?? 0);
      const ton = Number(balance) / 1e9;

      const accountState = state.state || "unknown";
      const lastTx = state.lastTransaction || null;

      const wasEverActive =
        accountState === "active" ||
        accountState === "frozen" ||
        !!lastTx;

      let lastTxTime = null;
      if (lastTx && lastTx.lt && lastTx.hash) {
        await sleep(700);
        lastTxTime = await fetchLastTxTimestamp(client, candidate.wallet.address, lastTx);
      }

      if (balance > 0n) {
        log(`[FOUND] ${candidate.name}`, "used");
        log(candidate.address);
        logAddressFormats(candidate.wallet.address, isTestnet);
        log(`Balance: ${ton} TON`, "used");
        log(`State: ${accountState}`, "info");

        if (lastTx) {
          log(`Last tx lt: ${lastTx.lt}`, "info");
        }

        if (lastTxTime?.iso) {
          log(`Last tx time (ISO): ${lastTxTime.iso}`, "info");
          log(`Last tx time (local): ${lastTxTime.local}`, "info");
        } else if (lastTxTime?.error) {
          log(`Last tx time error: ${lastTxTime.error}`, "error");
        }

        log("");
      } else if (wasEverActive) {
        log(`[USED ZERO] ${candidate.name}`, "info");
        log(candidate.address);
        logAddressFormats(candidate.wallet.address, isTestnet);
        log(`Balance: 0 TON`, "empty");
        log(`State: ${accountState}`, "info");

        if (lastTx) {
          log(`Last tx lt: ${lastTx.lt}`, "info");
        }

        if (lastTxTime?.iso) {
          log(`Last tx time (ISO): ${lastTxTime.iso}`, "info");
          log(`Last tx time (local): ${lastTxTime.local}`, "info");
        } else if (lastTxTime?.error) {
          log(`Last tx time error: ${lastTxTime.error}`, "error");
        }

        log("");
      } else {
        log(`[EMPTY] ${candidate.name}`, "empty");
        log(candidate.address);
        log(`Balance: 0 TON`, "empty");
        log(`State: ${accountState}`, "info");
        log("");
      }

      return;
    } catch (e) {
      if (isRateLimitError(e) && attempt < maxRetries) {
        const waitMs = 1500 + attempt * 1500;
        log(`[RATE LIMIT] ${candidate.name}, retry in ${waitMs} ms`, "info");
        await sleep(waitMs);
        continue;
      }

      log(`[ERROR] ${candidate.name}: ${String(e)}`, "error");
      return;
    }
  }
}







btnGen.addEventListener('click', async () => {
  try {
    const mnemonic = generateMnemonic(wordlist);
    mnemonicInput.value = mnemonic;
    resetLog();
    log('Mnemonic generated (12 words)', 'info');
    
    // Нормализация
    const words = mnemonic.trim().toLowerCase().split(/\s+/);
    keyPair = await mnemonicToPrivateKey(words);
    
    btnScan.disabled = false;
    log('KeyPair loaded successfully, ready to scan!', 'used');
  } catch (e) {
    resetLog();
    log('Generate/Load error: ' + String(e), 'error');
    console.error('Full error:', e);
  }
});



btnLoad.addEventListener("click", async () => {
  try {
    resetLog();
    const m = normalizeMnemonic(mnemonicInput.value);
    if (!validateMnemonic(m, wordlist)) {
      keyPair = null;
      btnScan.disabled = true;
      log("Invalid mnemonic", "error");
      return;
    }
    keyPair = await mnemonicToPrivateKey(m.split(" "));
    btnScan.disabled = false;
    log("Mnemonic loaded", "used");
  } catch (e) {
    keyPair = null;
    btnScan.disabled = true;
    log(`Load error: ${String(e)}`, "error");
  }
});





btnScan.addEventListener("click", async () => {
  if (busy) return;

  if (!keyPair) {
    resetLog();
    log("Load mnemonic first", "error");
    return;
  }

  setBusy(true);
  resetLog();
  log(`Network: ${networkSelect.value}`, "info");
  log("Scanning wallets...", "info");

  try {
    const client = clients[networkSelect.value];
    const candidates = buildCandidates();

    for (let i = 0; i < candidates.length; i++) {
      const c = candidates[i];
      log(`[CHECK] ${i + 1}/${candidates.length} ${c.name}`, "info");
      await checkWallet(client, c);

      if (i < candidates.length - 1) {
        await sleep(1200);
      }
    }

    log("Done", "info");
  } catch (e) {
    log(`Scan error: ${String(e)}`, "error");
  } finally {
    setBusy(false);
  }
});



btnClear.addEventListener("click", () => {
  resetLog();
  log("Cleared", "info");
});

</script>
</body>
</html>
