<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitcoin Legacy P2PKH Wallet</title>

<style>
body{
  font-family:monospace;
  background:#0f172a;
  color:#e2e8f0;
  padding:25px;
}

button{
  padding:12px 18px;
  background:#22c55e;
  border:0;
  border-radius:10px;
  cursor:pointer;
  color:#052e16;
  font-weight:bold;
}

button:disabled{
  opacity:.6;
  cursor:wait;
}

pre{
  background:#020617;
  padding:15px;
  border-radius:10px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
</style>
</head>
<body>

<button id="btn">Random Bitcoin Legacy Address</button>
<pre id="out">Ready.</pre>

<script type="module">
import { secp256k1 } from "https://cdn.jsdelivr.net/npm/@noble/curves@1.4.2/secp256k1/+esm";
import { sha256 } from "https://cdn.jsdelivr.net/npm/@noble/hashes@1.3.2/sha256/+esm";
import { ripemd160 } from "https://cdn.jsdelivr.net/npm/@noble/hashes@1.3.2/ripemd160/+esm";

function hex(u8){
  return [...u8].map(b => b.toString(16).padStart(2, "0")).join("");
}

function concatBytes(...arrays){
  const len = arrays.reduce((s, a) => s + a.length, 0);
  const out = new Uint8Array(len);
  let off = 0;
  for(const a of arrays){
    out.set(a, off);
    off += a.length;
  }
  return out;
}

function hash160(data){
  return ripemd160(sha256(data));
}

const ALPH = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";

function base58Encode(bytes){
  let zeros = 0;
  while(zeros < bytes.length && bytes[zeros] === 0) zeros++;

  let value = 0n;
  for(const b of bytes) value = (value << 8n) + BigInt(b);

  let out = "";
  while(value > 0n){
    const mod = value % 58n;
    value /= 58n;
    out = ALPH[Number(mod)] + out;
  }

  for(let i = 0; i < zeros; i++) out = "1" + out;
  return out || "1";
}

function doubleSHA256(data){
  return sha256(sha256(data));
}

function base58check(version, payload){
  if(!(payload instanceof Uint8Array)) throw new Error("payload must be Uint8Array");
  const body = concatBytes(new Uint8Array([version]), payload);
  const checksum = doubleSHA256(body).slice(0, 4);
  return base58Encode(concatBytes(body, checksum));
}

function base58Decode(str){
  let value = 0n;
  for(const ch of str){
    const idx = ALPH.indexOf(ch);
    if(idx === -1) throw new Error("Invalid Base58 character");
    value = value * 58n + BigInt(idx);
  }

  let bytes = [];
  while(value > 0n){
    bytes.push(Number(value & 0xffn));
    value >>= 8n;
  }
  bytes.reverse();

  let zeros = 0;
  while(zeros < str.length && str[zeros] === "1") zeros++;

  return new Uint8Array([...Array(zeros).fill(0), ...bytes]);
}

function verifyBase58Check(address){
  const raw = base58Decode(address);
  if(raw.length < 5) throw new Error("Base58Check payload too short");
  const body = raw.slice(0, -4);
  const checksum = raw.slice(-4);
  const expected = doubleSHA256(body).slice(0, 4);
  for(let i = 0; i < 4; i++){
    if(checksum[i] !== expected[i]) throw new Error("Invalid Base58Check checksum");
  }
  return body;
}

function generatePrivateKey(){
  const privKey = secp256k1.utils.randomPrivateKey();
  if(!secp256k1.utils.isValidPrivateKey(privKey)) throw new Error("Generated invalid private key");
  return privKey;
}

function privateKeyToLegacyAddress(privKey, compressed = false){
  if(!secp256k1.utils.isValidPrivateKey(privKey)) {
    throw new Error("Invalid private key");
  }
  const pubKey = secp256k1.getPublicKey(privKey, compressed);
  const pubHash = hash160(pubKey);
  const address = base58check(0x00, pubHash);
  verifyBase58Check(address);
  if(!address.startsWith("1")) throw new Error("Invalid legacy address prefix");
  return { pubKey, pubHash, address };
}

async function getBalance(address){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);

  try{
    const r = await fetch("https://mempool.space/api/address/" + address, {
      signal: controller.signal
    });

    if(!r.ok) throw new Error("API error: " + r.status);
    const j = await r.json();

    const confirmed = j.chain_stats.funded_txo_sum - j.chain_stats.spent_txo_sum;
    const mempool = j.mempool_stats.funded_txo_sum - j.mempool_stats.spent_txo_sum;

    return { confirmed, mempool };
  } finally {
    clearTimeout(timer);
  }
}

const btn = document.getElementById("btn");
const out = document.getElementById("out");

btn.onclick = async () => {
  btn.disabled = true;
  out.textContent = "Generating...";

  try{
    const privKey = generatePrivateKey();

    const legacy = privateKeyToLegacyAddress(privKey, false);

    const bal = await getBalance(legacy.address).catch(() => ({ confirmed: 0, mempool: 0, error: true }));

    out.textContent =
`=== BITCOIN LEGACY MODE (P2PKH / UNCOMPRESSED) ===

PRIVATE KEY (hex):
${hex(privKey)}

PUBLIC KEY (uncompressed hex):
${hex(legacy.pubKey)}

HASH160:
${hex(legacy.pubHash)}

ADDRESS (legacy P2PKH):
${legacy.address}

FORMAT:
mainnet legacy address, uncompressed public key style

BALANCE:
confirmed: ${bal.confirmed} sats
mempool:   ${bal.mempool} sats
total:     ${bal.confirmed + bal.mempool} sats


${bal.error ? "\nNOTE: balance API unavailable, address is still valid." : ""}`;
  } catch(e){
    out.textContent = "ERROR: " + e.message;
  }

  btn.disabled = false;
};
</script>
</body>
</html>
