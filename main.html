<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Game Console</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100vh;width:100vw;overflow:hidden;}
    body{font-family:Arial,sans-serif;background:#0b0b0b;color:#eaeaea;}
    
    #menu{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100vw;height:100vh;}
    #gameContainer{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;}
    
    h1{font-size:26px;margin-bottom:24px;}
    .btn{width:260px;padding:14px;margin:8px;font-size:18px;border:none;border-radius:10px;background:#1c1c1c;color:#fff;cursor:pointer;}
    .btn:hover{background:#2c2c2c;}
    
    #topBar{width:100%;background:rgba(17,17,17,0.99);padding:10px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;z-index:9999;}
    .topBtn{font-size:15px;padding:8px 14px;border-radius:8px;background:#222;border:none;color:#fff;cursor:pointer;}
    
    /* КЛЮЧЕВОЕ: iframe = ЭКРАН */
    iframe#gameFrame{
        display:block !important;
        width:100vw !important;
        height:100vh !important;
        position:absolute !important;
        top:0 !important;
        left:0 !important;
        border:none !important;
        margin:0 !important;
        padding:0 !important;
        background:#000;
    }
    
    #rulesOverlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.95);display:none;flex-direction:column;z-index:10000;}
    #rulesHeader{background:#111;padding:10px;display:flex;justify-content:flex-end;flex-shrink:0;}
    #rulesFrame{flex:1;width:100%;border:none;background:#000;}
</style>
</head>
<body>

<div id="menu">
    <h1>🎮 Game Console</h1>
    <button class="btn" onclick="loadGame('PokerLazer')">♠️ PokerLazer</button>
    <button class="btn" onclick="loadGame('StarDropper')">⭐ StarDropper</button>
    <button class="btn" onclick="loadGame('ChronoMonsters')">🧠 ChronoMonsters</button>
</div>

<div id="gameContainer">
    <div id="topBar">
        <button class="topBtn" onclick="backToMenu()">← Back</button>
        <button class="topBtn" onclick="openRules()">Rules</button>
    </div>
    <iframe id="gameFrame"></iframe>
</div>

<div id="rulesOverlay">
    <div id="rulesHeader">
        <button class="topBtn" onclick="closeRules()">← Back</button>
    </div>
    <iframe id="rulesFrame"></iframe>
</div>

<script>
let currentGame='';
function loadGame(gameFolder){
    currentGame=gameFolder;
    document.getElementById('menu').style.display='none';
    document.getElementById('gameContainer').style.display='block';
    
    const iframe=document.getElementById('gameFrame');
    iframe.src='about:blank';
    
    setTimeout(()=>{
        iframe.src=gameFolder+'/index.html';
    },50);
}

function backToMenu(){
    document.getElementById('gameFrame').src='';
    document.getElementById('menu').style.display='flex';
    document.getElementById('gameContainer').style.display='none';
}

function openRules(){
    if(!currentGame)return;
    document.getElementById('rulesOverlay').style.display='flex';
    document.getElementById('rulesFrame').src=currentGame+'/'+currentGame+'-rules.html';
}

function closeRules(){
    document.getElementById('rulesFrame').src='';
    document.getElementById('rulesOverlay').style.display='none';
}
</script>

</body>
</html>
