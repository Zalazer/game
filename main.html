<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Game Console</title>

<style>
    * {
        box-sizing: border-box;
    }
    
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
    }

    body {
        font-family: Arial, sans-serif;
        background: #0b0b0b;
        color: #eaeaea;
    }

    #menu, #gameContainer {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 24px;
    }

    .btn {
        width: 260px;
        padding: 14px;
        margin: 8px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        background: #1c1c1c;
        color: #fff;
        cursor: pointer;
    }

    .btn:hover {
        background: #2c2c2c;
    }

    #gameContainer {
        display: none;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
    }

    #topBar {
        width: 100%;
        background: rgba(17,17,17,0.95);
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 9999;
        backdrop-filter: blur(10px);
        flex-shrink: 0;
    }

    .topBtn {
        font-size: 15px;
        padding: 8px 14px;
        border-radius: 8px;
        background: #222;
        border: none;
        color: #fff;
        cursor: pointer;
    }

    /* ПРОЗРАЧНЫЙ iframe - НЕ МЕШАЕТ МАСШТАБУ */
    #gameFrameWrapper {
        flex: 1;
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background: #000;
    }

    iframe#gameFrame {
        position: absolute;
        inset: 0; /* top:0; right:0; bottom:0; left:0 */
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
        
        /* МИНИМУМ вмешательства - ПОЗВОЛЯЕМ ВСЕ трансформы */
        pointer-events: auto;
        touch-action: auto;
        user-select: none;
        
        /* НЕ трогаем transform/zoom/scale */
    }

    #rulesOverlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.95);
        display: none;
        flex-direction: column;
        z-index: 10000;
    }

    #rulesHeader {
        background: #111;
        padding: 10px;
        display: flex;
        justify-content: flex-end;
        flex-shrink: 0;
    }

    #rulesFrame {
        flex: 1;
        width: 100%;
        border: none;
        background: #000;
    }
</style>
</head>

<body>

<div id="menu">
    <h1>🎮 Game Console</h1>
    <button class="btn" onclick="loadGame('PokerLazer')">♠️ PokerLazer</button>
    <button class="btn" onclick="loadGame('StarDropper')">⭐ StarDropper</button>
    <button class="btn" onclick="loadGame('ChronoMonsters')">🧠 ChronoMonsters</button>
</div>

<div id="gameContainer">
    <div id="topBar">
        <button class="topBtn" onclick="backToMenu()">← Back to Menu</button>
        <button class="topBtn" onclick="openRules()">Game Rules</button>
    </div>
    <div id="gameFrameWrapper">
        <iframe id="gameFrame" allowfullscreen></iframe>
    </div>
</div>

<div id="rulesOverlay">
    <div id="rulesHeader">
        <button class="topBtn" onclick="closeRules()">← Back to Game</button>
    </div>
    <iframe id="rulesFrame" allowfullscreen></iframe>
</div>

<script>
let currentGame = '';

function loadGame(gameFolder) {
    currentGame = gameFolder;
    
    document.getElementById('menu').style.display = 'none';
    document.getElementById('gameContainer').style.display = 'flex';
    
    const iframe = document.getElementById('gameFrame');
    
    // ЧИСТАЯ загрузка БЕЗ вмешательства
    iframe.src = gameFolder + '/index.html';
    
    // Только передаем информацию о контейнере (опционально)
    iframe.onload = () => {
        try {
            iframe.contentWindow.postMessage({
                type: 'consoleContainer',
                width: window.innerWidth,
                height: window.innerHeight,
                available: true
            }, '*');
        } catch(e) {}
    };
}

function backToMenu() {
    document.getElementById('gameFrame').src = '';
    document.getElementById('menu').style.display = 'flex';
    document.getElementById('gameContainer').style.display = 'none';
}

function openRules() {
    if (!currentGame) return;
    document.getElementById('rulesOverlay').style.display = 'flex';
    document.getElementById('rulesFrame').src = currentGame + '/' + currentGame + '-rules.html';
}

function closeRules() {
    document.getElementById('rulesFrame').src = '';
    document.getElementById('rulesOverlay').style.display = 'none';
}

// Перехватываем жесты для игр
document.addEventListener('touchstart', (e) => {
    const iframe = document.getElementById('gameFrame');
    if (iframe.src && !document.getElementById('rulesOverlay').style.display) {
        // Все жесты идут в iframe
    }
}, { passive: true });
</script>

</body>
</html>
