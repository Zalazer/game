<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes">

<title>Game Console</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0b0b;
    color: #eaeaea;
    font-family: Arial, sans-serif;
}

/* ===== MENU ===== */
#menu {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

h1 {
    font-size: 26px;
    margin-bottom: 24px;
}

.btn {
    width: 260px;
    padding: 14px;
    margin: 8px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #1c1c1c;
    color: #fff;
    cursor: pointer;
}

.btn:hover {
    background: #2c2c2c;
}

/* ===== GAME CONTAINER ===== */
#gameContainer {
    display: none;
    width: 100vw;
    height: 100vh;
    flex-direction: column;
}

/* верхняя панель */
#topBar {
    width: 100%;
    background: rgba(17,17,17,0.98);
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    z-index: 10;
}

.topBtn {
    font-size: 15px;
    padding: 8px 14px;
    border-radius: 8px;
    background: #222;
    border: none;
    color: #fff;
    cursor: pointer;
}

/* ===== GAME FRAME ===== */
#gameFrameWrapper {
    flex: 1;
    background: #000;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

/* КЛЮЧЕВО: iframe НЕ масштабируется */
iframe#gameFrame {
    border: none;
    display: block;
    background: transparent;

    width: auto;
    height: auto;

    touch-action: auto;
    pointer-events: auto;
}

/* ===== RULES OVERLAY ===== */
#rulesOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: none;
    flex-direction: column;
    z-index: 9999;
}

#rulesHeader {
    background: #111;
    padding: 10px;
    display: flex;
    justify-content: flex-end;
}

#rulesFrame {
    flex: 1;
    width: 100%;
    border: none;
    background: #000;
}
</style>
</head>

<body>

<!-- ===== MENU ===== -->
<div id="menu">
    <h1>🎮 Game Console</h1>
    <button class="btn" onclick="loadGame('PokerLazer')">♠️ PokerLazer</button>
    <button class="btn" onclick="loadGame('StarDropper')">⭐ StarDropper</button>
    <button class="btn" onclick="loadGame('ChronoMonsters')">🧠 ChronoMonsters</button>
</div>

<!-- ===== GAME ===== -->
<div id="gameContainer">
    <div id="topBar">
        <button class="topBtn" onclick="backToMenu()">← Back</button>
        <button class="topBtn" onclick="openRules()">Game Rules</button>
    </div>

    <div id="gameFrameWrapper">
        <iframe id="gameFrame"></iframe>
    </div>
</div>

<!-- ===== RULES ===== -->
<div id="rulesOverlay">
    <div id="rulesHeader">
        <button class="topBtn" onclick="closeRules()">← Back to Game</button>
    </div>
    <iframe id="rulesFrame"></iframe>
</div>

<script>
const menu          = document.getElementById('menu');
const gameContainer = document.getElementById('gameContainer');
const gameFrame     = document.getElementById('gameFrame');
const rulesOverlay  = document.getElementById('rulesOverlay');
const rulesFrame    = document.getElementById('rulesFrame');

let currentGame = '';

function loadGame(gameFolder) {
    currentGame = gameFolder;

    menu.style.display = 'none';
    gameContainer.style.display = 'flex';

    // ФИЗИЧЕСКИЙ размер iframe = реальный экран
    const w = window.innerWidth;
    const h = window.innerHeight;

    gameFrame.style.width  = w + 'px';
    gameFrame.style.height = h + 'px';

    gameFrame.src = gameFolder + '/index.html';
}

function backToMenu() {
    gameFrame.src = '';
    menu.style.display = 'flex';
    gameContainer.style.display = 'none';
}

function openRules() {
    if (!currentGame) return;
    rulesOverlay.style.display = 'flex';
    rulesFrame.src = currentGame + '/' + currentGame + '-rules.html';
}

function closeRules() {
    rulesFrame.src = '';
    rulesOverlay.style.display = 'none';
}

/* на поворот экрана */
window.addEventListener('resize', () => {
    if (!gameFrame.src) return;
    gameFrame.style.width  = window.innerWidth + 'px';
    gameFrame.style.height = window.innerHeight + 'px';
});
</script>

</body>
</html>
