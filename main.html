<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes">

<title>Game Console</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0b0b;
    color: #eaeaea;
    font-family: Arial, sans-serif;
}

#menu {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

h1 { font-size: 26px; margin-bottom: 24px; }

.btn {
    width: 260px;
    padding: 14px;
    margin: 8px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #1c1c1c;
    color: #fff;
    cursor: pointer;
}
.btn:hover { background: #2c2c2c; }

#gameContainer {
    display: none;
    width: 100vw;
    height: 100vh;
    flex-direction: column;
}

#topBar {
    width: 100%;
    background: rgba(17,17,17,0.98);
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    z-index: 10;
}

.topBtn {
    font-size: 15px;
    padding: 8px 14px;
    border-radius: 8px;
    background: #222;
    border: none;
    color: #fff;
    cursor: pointer;
}

#gameFrameWrapper {
    flex: 1;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

iframe#gameFrame {
    border: none;
    display: block;
    background: transparent;
    width: auto;
    height: auto;
    touch-action: auto;
    pointer-events: auto;
}

#rulesOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: none;
    flex-direction: column;
    z-index: 9999;
}

#rulesHeader {
    background: #111;
    padding: 10px;
    display: flex;
    justify-content: flex-end;
}

#rulesFrame {
    flex: 1;
    width: 100%;
    border: none;
    background: #000;
}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu">
    <h1>🎮 Game Console</h1>
    <button class="btn" onclick="loadGame('PokerLazer')">♠️ PokerLazer</button>
    <button class="btn" onclick="loadGame('StarDropper')">⭐ StarDropper</button>
    <button class="btn" onclick="loadGame('ChronoMonsters')">🧠 ChronoMonsters</button>
    <button class="btn" onclick="loadGame('LazerRoulette')">🎡 LazerRoulette</button>
</div>

<!-- GAME -->
<div id="gameContainer">
    <div id="topBar">
        <button class="topBtn" onclick="backToMenu()">← Back</button>
        <button class="topBtn" onclick="openRules()">Game Rules</button>
        <button class="topBtn" id="muteBtn" onclick="toggleMute()">🔊</button>
    </div>
    <div id="gameFrameWrapper">
        <iframe id="gameFrame"></iframe>
    </div>
</div>

<!-- RULES -->
<div id="rulesOverlay">
    <div id="rulesHeader">
        <button class="topBtn" onclick="closeRules()">← Back to Game</button>
    </div>
    <iframe id="rulesFrame"></iframe>
</div>

<!-- AUDIO -->
<audio id="musicMenu" src="music-menu.mp3" loop></audio>
<audio id="music-PokerLazer" src="music-PokerLazer.mp3" loop></audio>
<audio id="music-StarDropper" src="music-StarDropper.mp3" loop></audio>
<audio id="music-ChronoMonsters" src="music-ChronoMonsters.mp3" loop></audio>
<audio id="music-LazerRoulette" src="music-LazerRoulette.mp3" loop></audio>

<script>
const menu          = document.getElementById('menu');
const gameContainer = document.getElementById('gameContainer');
const gameFrame     = document.getElementById('gameFrame');
const rulesOverlay  = document.getElementById('rulesOverlay');
const rulesFrame    = document.getElementById('rulesFrame');
const muteBtn       = document.getElementById('muteBtn');

const tracks = {
    menu: document.getElementById('musicMenu'),
    PokerLazer: document.getElementById('music-PokerLazer'),
    StarDropper: document.getElementById('music-StarDropper'),
    ChronoMonsters: document.getElementById('music-ChronoMonsters'),
    LazerRoulette: document.getElementById('music-LazerRoulette')
};

let currentGame = '';
let musicStarted = false;
let fadeInterval;

/* ===== AUDIO FADE ===== */
function fadeIn(track, targetVolume = 0.4) {
    track.muted = false;
    track.volume = 0;
    track.play().catch(()=>{});
    clearInterval(fadeInterval);
    let v=0;
    fadeInterval=setInterval(()=>{
        v+=0.05;
        if(v>=targetVolume){v=targetVolume; clearInterval(fadeInterval);}
        track.volume=v;
    },50);
}

function fadeOut(track, cb){
    clearInterval(fadeInterval);
    let v = track.volume;
    fadeInterval=setInterval(()=>{
        v-=0.05;
        if(v<=0){
            track.pause();
            clearInterval(fadeInterval);
            if(cb) cb();
        }
        track.volume=v;
    },50);
}

/* ===== MUTE ===== */
function toggleMute(){
    const active = Object.values(tracks).some(t=>!t.muted);
    if(active){
        Object.values(tracks).forEach(t=>{ fadeOut(t); t.muted=true; });
        muteBtn.textContent="🔇";
    }else{
        Object.values(tracks).forEach(t=>t.muted=false);
        muteBtn.textContent="🔊";
        if(menu.style.display!=='none') fadeIn(tracks.menu);
        else if(currentGame) fadeIn(tracks[currentGame]);
    }
}

function startMusic(track){
    if(musicStarted) return;
    musicStarted=true;
    fadeIn(track);
}

/* ===== GAME FLOW ===== */
function loadGame(game){
    startMusic(tracks.menu);
    currentGame = game;
    fadeOut(tracks.menu,()=>fadeIn(tracks[game]));
    menu.style.display='none';
    gameContainer.style.display='flex';
    gameFrame.style.width=innerWidth+'px';
    gameFrame.style.height=innerHeight+'px';
    gameFrame.src=game+'/index.html';
}

function backToMenu(){
    fadeOut(tracks[currentGame],()=>fadeIn(tracks.menu));
    gameFrame.src='';
    menu.style.display='flex';
    gameContainer.style.display='none';
    currentGame='';
}

function openRules(){
    if(!currentGame) return;
    rulesOverlay.style.display='flex';
    rulesFrame.src=currentGame+'/'+currentGame+'-rules.html';
}
function closeRules(){
    rulesFrame.src='';
    rulesOverlay.style.display='none';
}

addEventListener('resize',()=>{
    if(gameFrame.src){
        gameFrame.style.width=innerWidth+'px';
        gameFrame.style.height=innerHeight+'px';
    }
});
</script>

<!-- ===== WORKER BRIDGE (ANONYMOUS / ONE-TIME KEY) ===== -->
<script>
(async function(){
    let ticket=null;
    const tg=window.Telegram?.WebApp;

    async function getTicket(){
        try{
            const r=await fetch('/__ticket',{method:'POST'});
            const j=await r.json();
            ticket=j.k;
        }catch(e){}
    }
    await getTicket();

    window.emit=async function(data){
        if(!ticket) return;
        if(tg?.initDataUnsafe?.user?.id){
            data.user=tg.initDataUnsafe.user.id;
        }
        try{
            await fetch('/__emit',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({k:ticket,d:data})
            });
        }catch(e){}
        ticket=null;
        await getTicket();
    };

    window.getLeaderboard=async function(){
        const r=await fetch('/__leaders');
        const j=await r.json().catch(()=>null);
        return j?.top||[];
    };
})();
</script>

</body>
</html>
