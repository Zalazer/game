<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Game Console</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b;color:#eaeaea;font-family:Arial,sans-serif}
#menu{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-size:26px;margin-bottom:24px}
.btn{width:260px;padding:14px;margin:8px;font-size:18px;border:none;border-radius:10px;background:#1c1c1c;color:#fff;cursor:pointer}
.btn:hover{background:#2c2c2c}
#gameContainer{display:none;width:100vw;height:100vh;flex-direction:column}
#topBar{width:100%;background:rgba(17,17,17,0.98);padding:10px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;z-index:10}
.topBtn{font-size:15px;padding:8px 14px;border-radius:8px;background:#222;border:none;color:#fff;cursor:pointer}
#gameFrameWrapper{flex:1;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
iframe#gameFrame{border:none;display:block;background:transparent;width:auto;height:auto;touch-action:auto;pointer-events:auto}
#rulesOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;flex-direction:column;z-index:9999}
#rulesHeader{background:#111;padding:10px;display:flex;justify-content:flex-end}
#rulesFrame{flex:1;width:100%;border:none;background:#000}
</style>
</head>
<body>

<div id="menu">
    <h1>🎮 Game Console</h1>
    <button class="btn" onclick="loadGame('PokerLazer')">♠️ PokerLazer</button>
    <button class="btn" onclick="loadGame('StarDropper')">⭐ StarDropper</button>
    <button class="btn" onclick="loadGame('ChronoMonsters')">🧠 ChronoMonsters</button>
    <button class="btn" onclick="loadGame('LazerRoulette')">🎡 LazerRoulette</button>
</div>

<div id="gameContainer">
    <div id="topBar">
        <button class="topBtn" onclick="backToMenu()">← Back</button>
        <button class="topBtn" onclick="openRules()">Game Rules</button>
    </div>
    <div id="gameFrameWrapper">
        <iframe id="gameFrame"></iframe>
    </div>
</div>

<div id="rulesOverlay">
    <div id="rulesHeader">
        <button class="topBtn" onclick="closeRules()">← Back to Game</button>
    </div>
    <iframe id="rulesFrame"></iframe>
</div>

<script>
const menu = document.getElementById('menu'),
      gameContainer = document.getElementById('gameContainer'),
      gameFrame = document.getElementById('gameFrame'),
      rulesOverlay = document.getElementById('rulesOverlay'),
      rulesFrame = document.getElementById('rulesFrame');

let currentGame='';

function loadGame(game){
    currentGame=game;
    menu.style.display='none';
    gameContainer.style.display='flex';
    gameFrame.src=game+'/index.html';
}

function backToMenu(){
    gameFrame.src='';
    menu.style.display='flex';
    gameContainer.style.display='none';
    currentGame='';
}

function openRules(){ if(!currentGame) return; rulesOverlay.style.display='flex'; rulesFrame.src=currentGame+'/'+currentGame+'-rules.html'; }
function closeRules(){ rulesOverlay.style.display='none'; rulesFrame.src=''; }

// ======== SILENT EMIT WITH ONE-TIME KEY =====
(async function(){
    let ticket = null;
    const tg = window.Telegram?.WebApp;

    async function getTicket(){
        try{
            const r = await fetch('/__ticket',{ method:'POST' });
            const j = await r.json();
            ticket = j.k;
        }catch(e){ console.log("Failed to get ticket", e); }
    }

    await getTicket();

    window.emit = async function(data){
        if(!ticket) { console.log("No ticket"); return; }

        if(tg?.initDataUnsafe?.user?.id) data.user = tg.initDataUnsafe.user.id;

        try{
            const res = await fetch('/__emit', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ k: ticket, d: data })
            });
            const json = await res.json().catch(()=>null);
            if(json?.userCount) console.log("User total events:", json.userCount);
        }catch(e){ console.error(e); }

        ticket = null;
        await getTicket();
    };

    window.getLeaderboard = async function(){
        const res = await fetch('/__leaders');
        const j = await res.json().catch(()=>null);
        console.log("TOP USERS:", j?.top);
        return j?.top || [];
    };
})();
</script>
</body>
</html>
