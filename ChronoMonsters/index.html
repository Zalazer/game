<script>

/* =============================
   GAME CONSTANTS
============================= */
const GAME_ID = 'ChronoMonsters';
const LEADERBOARD_MAX = 10;

/* =============================
   TELEGRAM AUTH
============================= */
let tgUser = null;
let playerNick = 'Player';
let SERVER_OK = true;

async function authTelegram(){
    try{
        if(window.Telegram?.WebApp){
            const tg = window.Telegram.WebApp;

            tg.expand();
            tg.disableVerticalSwipes();

            if(tg.initData){
                await fetch('/__auth',{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({initData:tg.initData})
                });

                tgUser = tg.initDataUnsafe?.user || null;

                if(tgUser){
                    if(tgUser.username){
                        playerNick = tgUser.username.replace(/^@/, '').slice(0,12);
                    }else if(tgUser.first_name){
                        playerNick = tgUser.first_name.slice(0,12);
                    }else{
                        playerNick = String(tgUser.id);
                    }
                }
            }
        }
    }catch(e){
        console.log("TG auth failed",e);
        SERVER_OK = false;
    }
}

/* =============================
   TELEGRAM BACK BUTTON CONTROL
============================= */
function setupTelegramBackButton(){

    if(!window.Telegram?.WebApp) return;

    const tg = window.Telegram.WebApp;

    tg.BackButton.show();

    tg.BackButton.onClick(()=>{

        const modal = document.getElementById('leaderboardModal');

        // если открыт leaderboard → закрываем
        if(modal && modal.style.display === 'flex'){
            modal.style.display = 'none';
            return;
        }

        // если открыт overlay game over → закрываем
        if(typeof overlay !== 'undefined' && overlay?.style?.display === 'block'){
            overlay.style.display = 'none';
            return;
        }

        // подтверждение выхода
        if(confirm("Exit game? Progress will be lost.")){
            tg.close();
        }
    });
}




/* =============================
   LEADERBOARDS (KV + SERVER + LOCAL)
============================= */

let localScores = [];
let globalScores = [];
let lastGameScore = null;
let selectedLevel = 'all';

/* =============================
   LOAD LEADERBOARD (KV + SERVER + LOCAL)
============================= */
async function loadGlobalLeaderboard(levelFilter = null) {
    globalScores = [];
    localScores = [];

    const levelParam = (levelFilter === 'all' || levelFilter == null) ? null : String(levelFilter);

    try {
        if (tgUser?.id) {
            const url = new URL('/__leaders', window.location.origin);
            url.searchParams.set('game', GAME_ID);
            if (levelParam) url.searchParams.set('level', levelParam);
            url.searchParams.set('user', String(tgUser.id));

            const r = await fetch(url);
            const data = await r.json();

            globalScores = (data?.globalTop || []).slice(0, LEADERBOARD_MAX).map(e => ({
                nick: e.nick || 'Player',
                score: Number(e.score || 0),
                level: Number(e.level || 0)
            }));

            localScores = (data?.userTop || []).slice(0, LEADERBOARD_MAX).map(e => ({
                score: Number(e.score || 0),
                level: Number(e.level || 0)
            }));

        } else {
            if (!window.savedLevels) window.savedLevels = [];
            const sorted = [...window.savedLevels].sort((a, b) => b.score - a.score);
            localScores = sorted.slice(0, LEADERBOARD_MAX);
            while (localScores.length < LEADERBOARD_MAX) localScores.push({ score: 0, level: 0 });

            while (globalScores.length < LEADERBOARD_MAX) globalScores.push({ nick: '—', score: 0, level: 0 });
        }

        while (globalScores.length < LEADERBOARD_MAX) globalScores.push({ nick: '—', score: 0, level: 0 });
        while (localScores.length < LEADERBOARD_MAX) localScores.push({ score: 0, level: 0 });

    } catch (e) {
        console.log("leaders load fail", e);

        while (globalScores.length < LEADERBOARD_MAX) globalScores.push({ nick: '—', score: 0, level: 0 });
        while (localScores.length < LEADERBOARD_MAX) localScores.push({ score: 0, level: 0 });
    }
}

/* =============================
   GET NEW TICKET
============================= */
async function getTicket() {
    const r = await fetch('/__ticket', { method: 'POST' });
    const data = await r.json();
    return data.k;
}

/* =============================
   SAVE RESULT (KV + SERVER + LOCAL)
============================= */
async function saveToLeaderboard(score, level, isTotal = false) {
    lastGameScore = score;

    if (!window.savedLevels) window.savedLevels = [];
    if (!isTotal) window.savedLevels.push({ score, level });
    window.savedLevels.sort((a, b) => b.score - a.score);

    if (tgUser?.id) {
        try {

            const newTicket = await getTicket();

            await fetch('/__emit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    k: newTicket,
                    d: {
                        type: 'score',
                        game: GAME_ID,
                        score,
                        level,
                        total: isTotal,
                        nick: playerNick,
                        user: tgUser
                    }
                })
            });

        } catch (e) {
            console.log("score send fail", e);
        }
    }

    const filter = isTotal ? 'all' : level;
    await loadGlobalLeaderboard(filter);
}

/* =============================
   UPDATE / RENDER LEADERBOARD
============================= */
function updateLeaderboardTables() {
    const modal = document.getElementById('leaderboardModal');
    if (!modal) return;

    let html = `<div id="leaderFilterBox">
                    <select id="levelSelect">
                        <option value="all" ${selectedLevel === 'all' ? 'selected' : ''}>All Levels</option>`;
    for (let i = 1; i <= 10; i++) {
        const isSelected = selectedLevel !== 'all' && Number(selectedLevel) === i;
        html += `<option value="${i}" ${isSelected ? 'selected' : ''}>Level ${i}</option>`;
    }
    html += `</select></div>`;

    html += `<h2>Global Top</h2>`;
    for (let i = 0; i < LEADERBOARD_MAX; i++) {
        const e = globalScores[i] || { nick: '—', score: 0, level: 0 };
        const color = (e.score === lastGameScore && (selectedLevel === 'all' || e.level === selectedLevel)) ? '#00ff99' : '#ccc';
        html += `<div style="color:${color}">${i + 1}. ${e.nick} — ${e.score} (Lv ${e.level})</div>`;
    }

    html += `<h2 style="margin-top:15px;">Your Top</h2>`;
    for (let i = 0; i < LEADERBOARD_MAX; i++) {
        const e = localScores[i] || { score: 0, level: 0 };
        const color = (e.score === lastGameScore && (selectedLevel === 'all' || e.level === selectedLevel)) ? '#00ff99' : '#ccc';
        html += `<div style="color:${color}">${i + 1}. ${e.score} (Lv ${e.level})</div>`;
    }

    html += `<div style="margin-top:20px; display:flex; flex-direction:column; gap:10px; text-align:center;">
                <button id="leaderReturnBtn" style="padding:10px 20px; font-size:18px; border-radius:6px; cursor:pointer; background:linear-gradient(145deg,#555,#333); color:white; border:none;">Return</button>
                <button id="leaderRestartBtn" style="padding:10px 20px; font-size:18px; border-radius:6px; cursor:pointer; background:linear-gradient(145deg,#ff4444,#990000); color:white; border:none;">Restart Game</button>
             </div>`;

    document.getElementById('leaderContent').innerHTML = html;

    const levelSelect = document.getElementById('levelSelect');
    if (levelSelect) {
        levelSelect.onchange = async e => {
            selectedLevel = (e.target.value === 'all') ? 'all' : Number(e.target.value);
            await loadGlobalLeaderboard(selectedLevel);
            updateLeaderboardTables();
        };
    }

    document.getElementById('leaderReturnBtn').onclick = () => {
        modal.style.display = 'none';
    };

    document.getElementById('leaderRestartBtn').onclick = () => {
    modal.style.display = 'none';

    // ВМЕСТО ручного сброса — полный resetGame, который уже есть
    resetGame();  // внутри него: level = 1, totalScore = 0, ... и resetLevelEntities()

    // И только после resetGame — spawn и старт
    spawn();
    gameOver = false;
};

}

/* =============================
   INIT BUTTON
============================= */
document.addEventListener('DOMContentLoaded', async () => {

    await authTelegram();

    const leaderBtn = document.getElementById('leaderBtn');
    const modal = document.getElementById('leaderboardModal');

    leaderBtn.disabled = false;

    leaderBtn.onclick = async () => {
        await loadGlobalLeaderboard(selectedLevel);
        updateLeaderboardTables();
        if (modal) modal.style.display = 'flex';
    };

    if (modal) {
        modal.onclick = e => {
            if (e.target === modal) modal.style.display = 'none';
        };
    }
});




/* ==================== КОНСТАНТЫ ==================== */

const BASE_MAP = 15;     // стартовая карта 15x15
const TILE = 40;

const BASE_BOTS = 3;     // округлённо
const BASE_MONSTERS = 11;
const BASE_CHESTS = 11;

let level = 1;
let MAP = BASE_MAP;
let BOTS = BASE_BOTS;
let MONSTERS = BASE_MONSTERS;
let CHESTS = BASE_CHESTS;


/* ==================== ПОДСЧЁТ ОЧКОВ ==================== */

let totalScore = 0;          // сумма завершённых уровней
let levelScore = 0;          // текущий счёт уровня (live)

let botsKilledThisLevel = 0;
let monstersKilledThisLevel = 0;
let chestsCollectedThisLevel = 0;


/* ==================== ФОРМУЛА ОЧКОВ ==================== */
function calculateScore(){

    return (
        player.power * 10 +
        botsKilledThisLevel * 150 +
        monstersKilledThisLevel * 10 +
        deadZones.length * 5
    );

}


/* ==================== ОБНОВЛЕНИЕ SCORE (вызывать после шага игрока) ==================== */
function updateScore(){

    // считаем новый уровень
    let newLevelScore = calculateScore();

    // разница (сколько добавилось с прошлого шага)
    let delta = newLevelScore - levelScore;

    // обновляем level
    levelScore = newLevelScore;

    // сразу добавляем в total
    totalScore += delta;

}


/* ==================== ПЛАВНОЕ ОБНОВЛЕНИЕ UI ==================== */
function updateScoreFX() {

    statFX.levelScore += (levelScore - statFX.levelScore) * 0.2;
    statFX.totalScore += (totalScore - statFX.totalScore) * 0.2;

}



/* ==================== CANVAS ==================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

/* ==================== OFFSCREEN GRID ==================== */
let gridCanvas = null;
let gridCtx = null;

function rebuildGridCanvas() {

    gridCanvas = document.createElement("canvas");
    gridCanvas.width = MAP * TILE;
    gridCanvas.height = MAP * TILE;

    gridCtx = gridCanvas.getContext("2d");
    gridCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);

    gridCtx.strokeStyle = "#333";
    gridCtx.lineWidth = 1;

    for (let x = 0; x < MAP; x++) {
        for (let y = 0; y < MAP; y++) {
            gridCtx.strokeRect(
                x * TILE,
                y * TILE,
                TILE,
                TILE
            );
        }
    }
}

/* ==================== КАМЕРА, ЖЕСТЫ И PINCH-ZOOM ==================== */
let camX = 0, camY = 150, scale = 0.49;
let pointers = new Map();   // для multi-touch
let lastPinch = null;       // расстояние между пальцами при pinch

/* ==================== DOM ==================== */
const logBox = document.getElementById("log");
const overlay = document.getElementById("overlay");
const msgDiv = document.getElementById("msg");
const restartBtn = document.getElementById("restartBtn");

/* ==================== ИГРОК, БОТЫ, ОБЪЕКТЫ ==================== */
let moveNumber = 0, roundNumber = 0;
let gameOver = false;
let logCounter = 0;
let player = {x:0,y:0,power:1,speed:5,movesLeft:5,color:"cyan",id:"player"};
let bots = [];
let aliveBots = [];
let monsters = [];
let chests = [];
let flashes = [];
let deadZones = [];


/* ==================== ЛОГ С НУМЕРАЦИЕЙ ==================== */

function colorizeGameText(text){

    return text.replace(/(<[^>]+>|[^<]+)/g, (part) => {

        // если это HTML тег — не трогаем
        if(part.startsWith("<")) return part;

        // иначе красим слова
        return part.replace(/\b(\w+)\b/g, (match) => {

            let color = "#39ff14"; // базовый цвет
            const lower = match.toLowerCase();

            if(lower.includes("player")) color = "cyan";
            else if(lower.includes("chest")) color = "yellow";
            else if(lower.includes("monster")) color = "red";
            else if(lower.includes("bot")) color = "blue";

            return `<span style="color:${color}; font-weight:bold">${match}</span>`;
        });

    });
}


function log(t){

    logCounter++;

    const coloredText = colorizeGameText(t);

    logBox.innerHTML =
        `${logCounter}. ${coloredText}<br>` + logBox.innerHTML;

    // обрезаем лог до последних 50 строк
    const lines = logBox.innerHTML.split("<br>");
    if(lines.length > 50)
        logBox.innerHTML = lines.slice(0,50).join("<br>");

    logBox.scrollTop = 0; // последние события сверху
}




/* ==================== ПОМОЩЬ ==================== */
function posKey(x,y){ return `${x},${y}`; }

/* ==================== WebAudio ЗВУКИ ==================== */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, duration=0.15, type='sine', volume=1){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+duration);
}

// существующие
function playChestSound(){ playTone(440,0.15,'triangle'); setTimeout(()=>playTone(660,0.15,'triangle'),50); }
function playMonsterSound(){ playTone(220,0.2,'square'); setTimeout(()=>playTone(180,0.15,'square'),50); }
function playBotSound(){ playTone(330,0.1,'sawtooth'); setTimeout(()=>playTone(392,0.1,'sawtooth'),30); }

// новые
function playNewRoundSound(){
    playTone(300,0.12,'sine',0.6);
    setTimeout(()=>playTone(360,0.12,'sine',0.6),80);
    setTimeout(()=>playTone(420,0.12,'sine',0.6),160);
}
function playWinSound(){
    playTone(523.25,0.18,'triangle',0.9);   // C5
    setTimeout(()=>playTone(659.25,0.18,'triangle',0.9),120); // E5
    setTimeout(()=>playTone(783.99,0.25,'triangle',0.9),260); // G5
}
function playLoseSound(){
    playTone(196.00,0.25,'square',0.9);     // G3
    setTimeout(()=>playTone(174.61,0.25,'square',0.9),200);  // F3
    setTimeout(()=>playTone(164.81,0.35,'square',0.9),380);  // E3
}

/* ==================== КОНЕЦ ИГРЫ ==================== */
async function endGame(text) {
    if (gameOver) return;
    gameOver = true;

    const currentLevel = level || 1;

    log(
        `=== Level ${currentLevel} completed with Power ${player.power}, Speed ${player.speed}, Bots killed ${botsKilledThisLevel}, Monsters killed ${monstersKilledThisLevel}, Chests collected ${chestsCollectedThisLevel} ===
Level score: ${levelScore} | Total score: ${totalScore}`
    );

    // === Рисуем мигающий крест на месте игрока ===
    if (text.startsWith("Game Over")) {
        const crossDuration = 3000; // 3 секунды
        const startTime = Date.now();

        await new Promise(resolve => {
            function drawCross() {
                const elapsed = Date.now() - startTime;
                if (elapsed >= crossDuration) return resolve();

                const blink = Math.floor(elapsed / 300) % 2 === 0;

                // === Смещение как у drawCandy(player) + центрируем ===
                const offset = 5; // смещение внутрь клетки
                const size = 34;  // размер игрока
                const px = player.x * TILE + offset + size / 2; // центр игрока по X
                const py = player.y * TILE + offset + size / 2; // центр игрока по Y
                const half = (size / 1.5) / 2; // крестик в полтора раза меньше

                // Перерисовка канваса
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.setTransform(scale, 0, 0, scale, camX, camY);

                // Отрисовка карты, объектов, ботов и игрока
                draw();

                // Рисуем мигающий крест красно‑cyan поверх игрока
                ctx.strokeStyle = blink ? "red" : "cyan";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(px - half, py - half);
                ctx.lineTo(px + half, py + half);
                ctx.moveTo(px + half, py - half);
                ctx.lineTo(px - half, py + half);
                ctx.stroke();

                requestAnimationFrame(drawCross);
            }
            drawCross();
        });
    }

    // ==== Overlay и остальной код остаются без изменений ====
    overlay.style.display = "block";

    let title = '';
    if (text.startsWith("Game Over")) {
        title = "Game Over";
        msgDiv.style.color = "red";
        playLoseSound();
        restartBtn.innerText = "Restart Game";
    } else if (text.startsWith("You Win")) {
        title = "You Win";
        msgDiv.style.color = "yellow";
        playWinSound();
        restartBtn.innerText = "Next Level";
    } else {
        title = "Notice";
        msgDiv.style.color = "white";
        restartBtn.innerText = "Continue";
    }

    const btnContainer = document.createElement("div");
    btnContainer.style.marginTop = "20px";
    btnContainer.style.display = "flex";
    btnContainer.style.flexDirection = "column";
    btnContainer.style.gap = "10px";
    btnContainer.appendChild(restartBtn);

    msgDiv.innerHTML = `
        <div style="font-size:28px; font-weight:bold; margin-bottom:10px;">${title}</div>
        <div>Nick: ${playerNick || "—"}</div>
        <div>Level: ${currentLevel}</div>
        <div>Power: ${player.power}</div>
        <div>Speed: ${player.speed}</div>
        <div>Bots killed: ${botsKilledThisLevel}</div>
        <div>Monsters killed: ${monstersKilledThisLevel}</div>
        <div>Chests collected: ${chestsCollectedThisLevel}</div>
        <div style="margin-top:10px; font-weight:bold;">Level score: ${levelScore}</div>
        <div style="font-weight:bold;">Total score: ${totalScore}</div>
    `;
    msgDiv.appendChild(btnContainer);

    lastGameScore = levelScore;
    await saveToLeaderboard(levelScore, currentLevel);

    if (text.startsWith("Game Over")) {
        lastGameScore = totalScore;
        await saveToLeaderboard(totalScore, 0, true);
    }

    // ИСПРАВЛЕННЫЙ ОБРАБОТЧИК КНОПКИ
    restartBtn.onclick = () => {
        overlay.style.display = "none";
        gameOver = false;
        
        if (text.startsWith("Game Over")) {
            // ПОЛНЫЙ СБРОС
            resetGame();
            spawn();
        } else if (text.startsWith("You Win")) {
            totalScore += levelScore;
            level++;
            startNextLevel(false);
        } else {
            // Continue — просто возобновить текущий
            gameOver = false;
            draw();
        }
    };
}

/* ==================== ЛОВУШКИ ==================== */
function handleTrapAtRoundStart(character) {
    const dirs = [
        { dx: 0, dy: -1 },
        { dx: 0, dy: 1 },
        { dx: -1, dy: 0 },
        { dx: 1, dy: 0 }
    ];

    let blocked = 0;
    const breakableWhite = [];

    for (const d of dirs) {
        const nx = character.x + d.dx;
        const ny = character.y + d.dy;

        if (!inBounds(nx, ny)) {
            blocked++;
            continue;
        }

        const cell = map[ny][nx];

        if (cell.type === 'white') {
            blocked++;
            if (cell.power > 0) breakableWhite.push(cell);
            continue;
        }

        if (
            (cell.type === 'monster' || cell.type === 'player' || cell.type === 'bot') &&
            cell.power > character.power
        ) {
            blocked++;
            continue;
        }

        return; // есть выход — НЕ ловушка
    }

    if (blocked < 4) return;

    // === ЛОВУШКА ===
    if (breakableWhite.length > 0) {
        const target = breakableWhite.reduce((a, b) =>
            b.power > a.power ? b : a
        );

        const oldPower = character.power;
        character.power -= target.power;

        if (character.power <= 0) {
            map[character.y][character.x] = {
                type: 'white',
                power: oldPower
            };
            character.dead = true;
        } else {
            map[target.y][target.x] = { type: 'empty' };
        }
        return;
    }

    const oldPower = character.power;
    map[character.y][character.x] = {
        type: 'white',
        power: oldPower
    };
    character.dead = true;
}



/* ==================== NEXT LEVEL ==================== */
function startNextLevel(isNewGame = false) {

    // Сброс счетчиков уровня
    levelScore = 0;
    botsKilledThisLevel = 0;
    monstersKilledThisLevel = 0;
    chestsCollectedThisLevel = 0;

    // СБРОС TOTAL ПРИ НОВОЙ ИГРЕ
    if (isNewGame) {
        totalScore = 0;
    }

    // Размер карты: стартовая 15x15, +5 клеток по каждой оси на новом уровне
    const baseMapSize = 15;
    const mapGrowth = 5;
    MAP = baseMapSize + (level - 1) * mapGrowth;

    // ===== СБРОС КАНВАСА ДЛЯ TELEGRAM WEBAPP =====
    if(window.Telegram) {
        // удаляем старый canvas, если есть
        if(gridCanvas && gridCanvas.parentNode){
            const parent = gridCanvas.parentNode;
            parent.removeChild(gridCanvas);

            // создаём новый canvas
            gridCanvas = document.createElement("canvas");
            gridCanvas.id = "gridCanvas";
            gridCanvas.width = canvas.width;
            gridCanvas.height = canvas.height;
            parent.appendChild(gridCanvas);

            gridCtx = gridCanvas.getContext("2d");
        }
       
    }

    // Telegram WebApp haptic
    if(window.Telegram?.WebApp) {
        Telegram.WebApp.HapticFeedback.selectionChanged();
        Telegram.WebApp.MainButton.offClick();
    }

    // ===== ПЕРЕСТРОЙКА СЕТКИ С НОВЫМ РАЗМЕРОМ =====
    rebuildGridCanvas(); // теперь сетка соответствует MAP

    // Плотность объектов относительно карты 20x20
    const densityMapSize = 20;
    const baseBots = 5;
    const baseMonsters = 20;
    const baseChests = 20;

    const scaleFactor = (MAP * MAP) / (densityMapSize * densityMapSize);

    BOTS = Math.max(1, Math.round(baseBots * scaleFactor));
    MONSTERS = Math.max(1, Math.round(baseMonsters * scaleFactor));
    CHESTS = Math.max(1, Math.round(baseChests * scaleFactor));

    console.log(`Level ${level}: MAP=${MAP}x${MAP}, BOTS=${BOTS}, MONSTERS=${MONSTERS}, CHESTS=${CHESTS}`);

    // Сброс игрока и ботов
    player.movesLeft = player.speed;
    aliveBots = [...bots];

    // ===== ЗАПУСК СПАУНА С ОБНОВЛЕННЫМ РАЗМЕРОМ КАРТЫ =====
    spawn();
}



/* ==================== SPAWN ==================== */
function spawn() {
    const used = new Set();

    function placeUnique() {
        let x, y, key;
        do {
            x = Math.floor(Math.random() * MAP);
            y = Math.floor(Math.random() * MAP);
            key = posKey(x, y);
        } while (used.has(key));
        used.add(key);
        return { x, y };
    }

    // ===== СБРОС ПАРАМЕТРОВ УРОВНЯ =====
    moveNumber = 0;
    roundNumber = 0;
    logCounter = 0;
    gameOver = false;
    overlay.style.display = "none";

    // ===== СБРОС ИГРОКА =====
    player.x = 0;
    player.y = 0;
    player.power = 1;
    player.speed = 5;
    player.movesLeft = player.speed;

    // ===== ПОЛНАЯ ОЧИСТКА ОБЪЕКТОВ =====
    bots = [];
    aliveBots = [];
    monsters = [];
    chests = [];
    flashes = [];
    deadZones = [];
    reachCache.player = {};
    reachCache.bots = new Map();

    // ===== ИГРОК =====
    const p = placeUnique();
    player.x = p.x;
    player.y = p.y;

    // ===== БОТЫ =====
    for (let i = 0; i < BOTS; i++) {
        const pos = placeUnique();
        let bot = {
            id: `bot-${String(i + 1).padStart(3, "0")}`,
            x: pos.x,
            y: pos.y,
            power: 1,
            speed: 5,
            movesLeft: 5,
            alive: true,
            trace: [{ x: pos.x, y: pos.y }],
            color: "blue"
        };
        bots.push(bot);
        aliveBots.push(bot);
    }

    // ===== МОНСТРЫ =====
    for (let i = 0; i < MONSTERS; i++) {
        const pos = placeUnique();
        monsters.push({ x: pos.x, y: pos.y, power: 1 });
    }

    // ===== СУНДУКИ =====
    for (let i = 0; i < CHESTS; i++) {
        const pos = placeUnique();
        chests.push({ x: pos.x, y: pos.y, power: 1 });
    }

    // ===== ПРОВЕРКА ЛОВУШЕК НА СТАРТЕ =====
    resolveTrapAtRoundStart(player);
    aliveBots.forEach(b => resolveTrapAtRoundStart(b));

    // Если после ловушек не осталось живых ботов — сразу победа
    if(aliveBots.length === 0){
        endGame("You Win: all bots destroyed");
        return;
    }

    // ===== ПЛАВНАЯ АНИМАЦИЯ ЗУМА НА ИГРОКА =====
    animateMapToPlayer();

    // ===== ЗВУК НОВОГО РАУНДА =====
    playNewRoundSound();

    // ===== ПЕРЕРИСОВКА КАРТЫ =====
    draw();
}




/* ==================== АНИМАЦИЯ ЗУМА НА ИГРОКА ==================== */
function animateMapToPlayer() {

    // ГАРАНТИЯ, что сетка существует
    if (!gridCanvas) {
        rebuildGridCanvas();
    }

    const screenWidth = canvas.width;
    const screenHeight = canvas.height;

    const startScale = screenWidth / (MAP * TILE);
    const endScale = 2;

    const startCamX = 0;
    const startCamY = (screenHeight - MAP * TILE * startScale) / 2;

    let startTime = null;

    function animate(time) {

        if (!startTime) startTime = time;

        const elapsed = time - startTime;
        const duration = 2000;
        const t = Math.min(elapsed / duration, 1);

        scale = startScale + (endScale - startScale) * t;

        const targetCamX =
            screenWidth / 2 - (player.x * TILE + TILE / 2) * scale;

        const targetCamY =
            screenHeight / 2 - (player.y * TILE + TILE / 2) * scale;

        camX = startCamX + (targetCamX - startCamX) * t;
        camY = startCamY + (targetCamY - startCamY) * t;

        draw();

        if (t < 1) {
            requestAnimationFrame(animate);
        } else {
            playerCanMove = true;
        }
    }

    playerCanMove = false;
    requestAnimationFrame(animate);
}





/* ==================== ПРОХОДИМОСТЬ КЛЕТКИ ==================== */
function isBlockedFor(entity, x, y){
    if(x<0 || y<0 || x>=MAP || y>=MAP) return true;

    if(deadZones.some(dz => dz.x === x && dz.y === y)) return true;

    // Игрок как цель
    if(entity !== player && player.x === x && player.y === y){
        // бот может войти ТОЛЬКО если он сильнее или равен
        if(entity.power < player.power) return true;
    }

    for(let m of monsters){
        if(m.x === x && m.y === y){
            if(entity.power < m.power) return true;
        }
    }

    for(let b of aliveBots){
        if(b.x === x && b.y === y){
            if(entity === b) continue;
            if(b.power > entity.power) return true;
        }
    }

    return false;
}


/* ==================== ТУПИК В ТЕКУЩЕМ РАУНДЕ ==================== */
function isImmediateDeadEnd(entity){
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

    for(let d of dirs){
        const nx = entity.x + d[0];
        const ny = entity.y + d[1];

        if(nx >= 0 && ny >= 0 && nx < MAP && ny < MAP){
            if(!isBlockedFor(entity, nx, ny)){
                return false;
            }
        }
    }

    return true;
}


/* ==================== ЛОВУШКА В НАЧАЛЕ РАУНДА ==================== */
function getTrapWhiteCells(entity){
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    let whites = [];

    for(let d of dirs){
        const nx = entity.x + d[0];
        const ny = entity.y + d[1];

        if(nx < 0 || ny < 0 || nx >= MAP || ny >= MAP) continue;

        const dz = deadZones.find(z => z.x === nx && z.y === ny);
        if(dz){
            whites.push(dz);
            continue;
        }

        if(!isBlockedFor(entity, nx, ny)){
            return null;
        }
    }

    return whites;
}




function resolveTrapAtRoundStart(entity) {
    const whites = getTrapWhiteCells(entity);
    if (!whites || whites.length === 0) return;

    let maxWhite = whites.reduce((a, b) => b.number > a.number ? b : a);
    const damage = maxWhite.number;
    const prevPower = entity.power;

    entity.power -= damage;
    log(`${entity.id || 'entity'} trapped: -${damage} power (from ${prevPower} to ${entity.power})`);

    if (entity.power <= 0) {
        deadZones.push({
            x: entity.x,
            y: entity.y,
            number: prevPower
        });

        if (entity === player) {
            endGame(`Game Over: trapped with ${prevPower} power`);
        } else {
            entity.alive = false;
            const index = aliveBots.indexOf(entity);
            if (index !== -1) aliveBots.splice(index, 1);
            flash(entity.x, entity.y, "red");

            if (aliveBots.length === 0) {
                endGame("You Win: all bots destroyed");
            }
            entity.power = 0;
        }
        return;
    }

    const idx = deadZones.indexOf(maxWhite);
    if (idx !== -1) deadZones.splice(idx, 1);
    flash(maxWhite.x, maxWhite.y, "white");
}




/* ==================== BFS ДОСТУПНЫХ КЛЕТОК ==================== */
function bfsReachable(e){
    let visited = Array.from({length:MAP},()=>Array(MAP).fill(false));
    let q = [{x:e.x,y:e.y,dist:0}]; visited[e.x][e.y] = true;
    let reachable = [];
    while(q.length){
        let cur = q.shift();
        if(cur.dist>0 && cur.dist<=e.movesLeft) reachable.push({x:cur.x,y:cur.y,dist:cur.dist});
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
            let nx = cur.x+d[0], ny = cur.y+d[1];
            if(nx<0||ny<0||nx>=MAP||ny>=MAP) return;
            if(visited[nx][ny]) return;
            if(isBlockedFor(e, nx, ny)) return;
            visited[nx][ny]=true;
            if(cur.dist+1<=e.movesLeft) q.push({x:nx,y:ny,dist:cur.dist+1});
        });
    }
    return reachable;
}

/* ==================== BFS ПУТИ ==================== */
function bfsPath(entity, sx,sy,tx,ty){
    let visited = Array.from({length:MAP},()=>Array(MAP).fill(false));
    let prev = Array.from({length:MAP},()=>Array(MAP).fill(null));
    let q=[{x:sx,y:sy}]; visited[sx][sy]=true;
    while(q.length){
        let cur = q.shift();
        if(cur.x===tx && cur.y===ty) break;
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
            let nx = cur.x+d[0], ny = cur.y+d[1];
            if(nx<0||ny<0||nx>=MAP||ny>=MAP) return;
            if(visited[nx][ny]) return;
            if(isBlockedFor(entity, nx, ny)) return;
            visited[nx][ny]=true; prev[nx][ny]=cur; q.push({x:nx,y:ny});
        });
    }
    let path=[], cx=tx, cy=ty;
    if(!prev[cx][cy] && !(cx===sx&&cy===sy)) return null;
    while(cx!==sx||cy!==sy){ path.push({x:cx,y:cy}); let p=prev[cx][cy]; if(!p) break; cx=p.x; cy=p.y;}
    path.reverse(); return path;
}


/* ==================== FLASH ЭФФЕКТ ==================== */
function flash(x,y,color){flashes.push({x,y,color,alpha:1});}


/* ==================== ПРОВЕРКА ЛОВУШЕК И ТУПИКОВ ==================== */
function isTrappedOrStuck(x, y, entity) {
    let visited = Array.from({length:MAP},()=>Array(MAP).fill(false));
    let q = [{x, y}]; visited[x][y] = true;
    
    while(q.length) {
        let cur = q.shift();
        
        if(cur.x === 0 || cur.x === MAP-1 || cur.y === 0 || cur.y === MAP-1){
            return {isTrapped: false, isStuck: false};
        }
        
        let hasEmpty = false;
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
            let nx = cur.x+d[0], ny = cur.y+d[1];
            if(nx<0||ny<0||nx>=MAP||ny>=MAP) return;
            if(visited[nx][ny]) return;

            let isDeadZone = deadZones.some(dz => dz.x === nx && dz.y === ny);
            if(!isDeadZone && !isBlockedFor(entity, nx, ny)) hasEmpty = true;

            if(!isDeadZone && !visited[nx][ny] && !isBlockedFor(entity, nx, ny)){
                visited[nx][ny] = true;
                q.push({x:nx, y:ny});
            }
        });

        if(hasEmpty) return {isTrapped: false, isStuck: false};
    }
    
    return {isTrapped: true, isStuck: true};
}


/* ==================== ПРИМЕНЕНИЕ ШТРАФА ==================== */
function applyPenalty(entity, penaltyType) {
    if(entity.power <= 0){
        // если сила уже 0 — сразу смерть
        if(entity === player){
            endGame(`Game Over: ${entity.id} trapped with 0 power`);
        } else {
            entity.alive = false;
            const idx = aliveBots.indexOf(entity);
            if(idx !== -1) aliveBots.splice(idx,1);
            flash(entity.x, entity.y, "red");
        }
        return;
    }

    let surroundingWhite = [];
    let visited = Array.from({length:MAP},()=>Array(MAP).fill(false));
    let q = [{x:entity.x,y:entity.y}]; visited[entity.x][entity.y] = true;

    while(q.length){
        let cur = q.shift();
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
            let nx = cur.x+d[0], ny = cur.y+d[1];
            if(nx<0||ny<0||nx>=MAP||ny>=MAP) return;
            if(visited[nx][ny]) return;

            let dz = deadZones.find(dz => dz.x===nx && dz.y===ny);
            if(dz) { surroundingWhite.push(dz.number); return; }
            if(isBlockedFor(entity, nx, ny)) return;

            if(!visited[nx][ny]){
                visited[nx][ny]=true;
                q.push({x:nx,y:ny});
            }
        });
    }

    if(surroundingWhite.length === 0) return;
    let maxNumber = Math.max(...surroundingWhite);

    if(penaltyType==="trap" && entity.power < maxNumber){
        if(entity === player){
            endGame(`Game Over: ${entity.id} trapped with power ${entity.power} < ${maxNumber}`);
        } else {
            entity.alive = false;
            const idx = aliveBots.indexOf(entity);
            if(idx !== -1) aliveBots.splice(idx,1);
            flash(entity.x, entity.y, "red");
        }
        return;
    }

    entity.power -= maxNumber;
    entity.power = Math.max(0, entity.power);
    log(`${entity.id} penalty: -${maxNumber} power (now ${entity.power})`);
    flash(entity.x, entity.y, "white");

    let index = deadZones.findIndex(dz => dz.number===maxNumber);
    if(index !== -1) deadZones.splice(index,1);
}

/* ==================== BOT MOVE С ТРЕЙСИНГОМ и умными маршрутами ==================== */
aliveBots.forEach(b => {
    if (!b.trace) b.trace = []; // массив {x, y} для трека бота
});

function botStep(b) {
    if (!b.alive || gameOver) return;
    b.movesLeft = b.speed;

    while (b.movesLeft > 0 && !gameOver) {

        let bestTarget = null;
        let bestValue = -Infinity;

        const entities = [];
        chests.forEach(c => entities.push({ type: "chest", obj: c }));
        monsters.forEach(m => entities.push({ type: "monster", obj: m }));
        aliveBots.forEach(o => { if (o !== b) entities.push({ type: "bot", obj: o }); });
        entities.push({ type: "player", obj: player });

        const dangerCache = {};
        const trapCache = {};

        function dangerAt(x, y) {
            const key = `${x},${y}`;
            if (dangerCache[key] !== undefined) return dangerCache[key];
            let danger = 0;
            aliveBots.forEach(o => { if (o !== b) {
                const d = Math.abs(o.x - x) + Math.abs(o.y - y);
                if (d <= 2 && o.power > b.power) danger += (o.power - b.power) * 20;
            }});
            if (player !== b) {
                const d = Math.abs(player.x - x) + Math.abs(player.y - y);
                if (d <= 2 && player.power > b.power) danger += (player.power - b.power) * 25;
            }
            dangerCache[key] = danger;
            return danger;
        }

        function trapRisk(x, y) {
            const key = `${x},${y}`;
            if (trapCache[key] !== undefined) return trapCache[key];
            const risk = isImmediateDeadEnd({ x, y, power: b.power }) ? 200 : 0;
            trapCache[key] = risk;
            return risk;
        }

        // ===== Выбор цели с учётом стратегии =====
        entities.forEach(e => {
            const t = e.obj;

            // монстр/бот/игрок только если сила >=
            if (e.type === "monster" && t.power > b.power) return;
            if (e.type === "bot" && t.power > b.power) return;
            if (e.type === "player" && player.power > b.power) return; // теперь равная сила атакуется

            const dist = Math.abs(b.x - t.x) + Math.abs(b.y - t.y);
            if (dist === 0) return;

            let reward = 0;
            if (e.type === "chest") reward = 40 + t.power * 12;
            if (e.type === "monster") reward = 70 + t.power * 18;
            if (e.type === "bot") reward = 160 + t.power * 25;
            if (e.type === "player") reward = 300 + player.power * 35;

            // ищем путь с возможностью собрать объекты по пути
            const path = bfsPath(b, b.x, b.y, t.x, t.y, 4); // ограничение поиска 4 для производительности
            if (!path || path.length === 0) return;

            const next = path[0];
            let value = reward - dist * 15 - dangerAt(next.x, next.y) - trapRisk(next.x, next.y);

            // бонус при силе больше игрока
            if (b.power > player.power * 1.3 && e.type === "player") value += 200;

            const strongest = Math.max(player.power, ...aliveBots.map(o => o.power));
            if (t.power === strongest) value += 120;

            // учитывать промежуточные сундуки по пути
            let pathReward = 0;
            path.forEach(p => {
                const chestHere = chests.find(c => c.x === p.x && c.y === p.y);
                if (chestHere) pathReward += 40 + chestHere.power * 12;
            });
            value += pathReward * 0.5; // вес промежуточных бонусов

            if (value > bestValue) {
                bestValue = value;
                bestTarget = { target: t, step: next, path };
            }
        });

        let step = null;

        if (bestTarget) {
            // выбрать следующий шаг по оптимальному пути
            for (let p of bestTarget.path) {
                if (!isBlockedFor(b, p.x, p.y) || (p.x === bestTarget.target.x && p.y === bestTarget.target.y)) {
                    step = p;
                    break;
                }
            }
        }

        // fallback случайное движение
        if (!step) {
            const dirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }].sort(() => Math.random() - 0.5);
            for (let d of dirs) {
                const nx = b.x + d.x, ny = b.y + d.y;
                if (!isBlockedFor(b, nx, ny)) { step = { x: nx, y: ny }; break; }
            }
        }

        if (!step) break;

        b.trace.push({ x: b.x, y: b.y });

        b.x = step.x;
        b.y = step.y;
        b.movesLeft--;

        collect(b);

        // если бот уничтожен или в dead end — конец хода
        if (!b.alive) break;
        if (isImmediateDeadEnd(b)) { b.movesLeft = 0; break; }
    }

    if (b.alive) b.trace.push({ x: b.x, y: b.y });
}




/* ==================== ПРОВЕРКА ЗАМКНУТОЙ ОБЛАСТИ В НАЧАЛЕ ХОДА ==================== */
function resolveAreaTrap(entity){

    if(gameOver) return;
    if(entity.dead || entity.alive === false) return;

    const visited = Array.from({length:MAP},()=>Array(MAP).fill(false));
    const q = [{x:entity.x, y:entity.y}];
    visited[entity.x][entity.y] = true;

    let perimeterWhites = [];
    let foundDestroyableTarget = false;

    while(q.length){

        const cur = q.shift();

        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

        for(const d of dirs){

            const nx = cur.x + d[0];
            const ny = cur.y + d[1];

            // граница карты = белая клетка силы 0
            if(nx < 0 || ny < 0 || nx >= MAP || ny >= MAP){
                continue;
            }

            // белая клетка
            const dz = deadZones.find(z => z.x === nx && z.y === ny);
            if(dz){
                perimeterWhites.push(dz);
                continue;
            }

            // проверяем уничтожаемые цели
            const monster = monsters.find(m=>m.x===nx && m.y===ny);
            if(monster && monster.power <= entity.power){
                foundDestroyableTarget = true;
            }

            const chest = chests.find(c=>c.x===nx && c.y===ny);
            if(chest){
                foundDestroyableTarget = true;
            }

            const bot = aliveBots.find(b=>b.x===nx && b.y===ny);
            if(bot && bot !== entity && bot.power <= entity.power){
                foundDestroyableTarget = true;
            }

            if(player !== entity && player.x===nx && player.y===ny && player.power <= entity.power){
                foundDestroyableTarget = true;
            }

            // проходимая клетка — расширяем BFS
            if(!visited[nx][ny] && !isBlockedFor(entity, nx, ny)){
                visited[nx][ny] = true;
                q.push({x:nx, y:ny});
            }
        }
    }

    // если есть цель — НЕ ловушка
    if(foundDestroyableTarget) return;

    if(perimeterWhites.length === 0) return;

    // выбираем белую клетку максимальной силы
    let maxWhite = perimeterWhites.reduce((a,b)=> b.number > a.number ? b : a);

    const damage = maxWhite.number;
    const prevPower = entity.power;

    entity.power -= damage;

    log(`${entity.id || 'entity'} trapped in area: -${damage} power (${prevPower}→${entity.power})`);

    // смерть
    if(entity.power <= 0){

        deadZones.push({
            x: entity.x,
            y: entity.y,
            number: prevPower
        });

        if(entity === player){
            endGame(`Game Over: trapped with ${prevPower} power`);
        }else{
            entity.alive = false;
            flash(entity.x, entity.y, "red");
        }

        return;
    }

    // удаляем белую клетку
    const idx = deadZones.indexOf(maxWhite);
    if(idx !== -1) deadZones.splice(idx,1);

    flash(maxWhite.x, maxWhite.y, "white");
}


/* ==================== ПРОВЕРКА ЛОВУШЕК ПЕРЕД ХОДАМИ ==================== */
function checkTrapsAndStucks(){

    // сначала проверяем стояние на белой
    resolveStandingWhiteTrap(player);

    aliveBots.forEach(b=>{
    resolveStandingWhiteTrap(b);
});

    // затем обычные проверки
    resolveAreaTrap(player);

    aliveBots.forEach(b=>{
    resolveAreaTrap(b);
});
}



/* ==================== СТОЮ НА БЕЛОЙ КЛЕТКЕ В ЛОВУШКЕ ==================== */
function resolveStandingWhiteTrap(entity){

    if(gameOver) return;
    if(entity.dead || entity.alive === false) return;

    // Проверяем: стоит ли на белой клетке
    const currentWhite = deadZones.find(d =>
        d.x === entity.x && d.y === entity.y
    );

    if(!currentWhite) return;

    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    let blocked = 0;

    for(const d of dirs){
        const nx = entity.x + d[0];
        const ny = entity.y + d[1];

        if(nx < 0 || ny < 0 || nx >= MAP || ny >= MAP){
            blocked++;
            continue;
        }

        // если вокруг тоже белая клетка
        if(deadZones.some(z => z.x === nx && z.y === ny)){
            blocked++;
            continue;
        }

        // если клетка непроходима
        if(isBlockedFor(entity, nx, ny)){
            blocked++;
            continue;
        }

        // есть выход
        return;
    }

    if(blocked < 4) return;

    // === ТУПИК НА БЕЛОЙ КЛЕТКЕ ===

    const damage = currentWhite.number;
    const prevPower = entity.power;

    entity.power -= damage;

    log(`${entity.id || 'entity'} broke standing white: -${damage} (${prevPower}→${entity.power})`);

    // удаляем белую клетку ПОД персонажем
    const idx = deadZones.indexOf(currentWhite);
    if(idx !== -1){
        deadZones.splice(idx,1);
    }

    flash(entity.x, entity.y, "white");

    if(entity.power <= 0){

        deadZones.push({
            x: entity.x,
            y: entity.y,
            number: prevPower
        });

        if(entity === player){
            endGame(`Game Over: trapped on white with ${prevPower} power`);
        }else{
            entity.alive = false;

const index = aliveBots.indexOf(entity);
if(index !== -1){
    aliveBots.splice(index, 1);
}

flash(entity.x, entity.y, "red");
        }
    }

    // если это игрок — раунд завершается
    if(entity === player){
        player.movesLeft = 0;
    }
}



/* ==================== КОНЕЦ ХОДА ИГРОКА ==================== */
function endPlayerTurn(){
    // Проверка ловушек и тупиков после хода игрока
    checkTrapsAndStucks();

    // Убираем мертвых ботов (сила <=0) и помечаем их как неактивных
    aliveBots = aliveBots.filter(b => {
        if(b.power <= 0){ 
            b.alive = false; 
            return false; 
        }
        return true;
    });

    // Убираем мертвых ботов из кэша reachable клеток
    reachCache.bots.forEach((_, b) => {
        if(!aliveBots.includes(b)) reachCache.bots.delete(b);
    });

    // Сброс трейсов ботов для нового раунда
    aliveBots.forEach(b=>{
        b.trace = [{ x: b.x, y: b.y }]; // оставляем только текущую позицию
        if(reachCache.bots.has(b)) reachCache.bots.set(b, {}); // сброс кэша reachable клеток
    });

    // Ход ботов
    aliveBots.forEach(b=>botStep(b));

    if(gameOver) return;

    // Усиление существующих объектов
    monsters.forEach(m=>m.power++);
    chests.forEach(c=>c.power++);

    // Возрождение объектов, уничтоженных в прошлом раунде
    while(chests.length < CHESTS){
        let x=Math.floor(Math.random()*MAP), y=Math.floor(Math.random()*MAP);
        if(!deadZones.some(d=>d.x===x&&d.y===y) && !chests.some(c=>c.x===x&&c.y===y) &&
           !monsters.some(m=>m.x===x&&m.y===y) && !aliveBots.some(b=>b.x===x && b.y===y) &&
           !(player.x===x && player.y===y)){
            chests.push({x,y,power:1});
        }
    }
    while(monsters.length < MONSTERS){
        let x=Math.floor(Math.random()*MAP), y=Math.floor(Math.random()*MAP);
        if(!deadZones.some(d=>d.x===x&&d.y===y) && !monsters.some(m=>m.x===x&&m.y===y) &&
           !chests.some(c=>c.x===x&&c.y===y) && !aliveBots.some(b=>b.x===x && b.y===y) &&
           !(player.x===x && player.y===y)){
            monsters.push({x,y,power:1});
        }
    }

    // Новый раунд
    roundNumber++;
    player.movesLeft = player.speed;
    playNewRoundSound();

    // Перерисовка карты сразу после хода ботов
    draw();
}

/* ==================== TOUCH DRAG И PINCH ==================== */
canvas.addEventListener("pointerdown", e => {
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(pointers.size === 2){
        const [p1, p2] = Array.from(pointers.values());
        lastPinch = Math.hypot(p2.x-p1.x, p2.y-p1.y);

        // Центр между пальцами в экранных координатах
        pinchCenter = {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};

        // Центр в "мировых" координатах
        pinchWorld = {
            x: (pinchCenter.x - camX) / scale,
            y: (pinchCenter.y - camY) / scale
        };
    }
});

canvas.addEventListener("pointermove", e => {
    if(!pointers.has(e.pointerId)) return;

    const prev = pointers.get(e.pointerId);
    const dx = e.clientX - prev.x;
    const dy = e.clientY - prev.y;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(pointers.size === 1){
        // Обычное перемещение одним пальцем
        camX += dx;
        camY += dy;
    } else if(pointers.size === 2){
        const [p1, p2] = Array.from(pointers.values());
        const dist = Math.hypot(p2.x-p1.x, p2.y-p1.y);
        const newCenter = {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};

        if(lastPinch){
            const factor = dist / lastPinch;

            // Масштабируем
            scale *= factor;
            scale = Math.min(Math.max(scale,0.1),7);

            // Смещаем камеру так, чтобы центр pinch оставался на месте
            camX = newCenter.x - pinchWorld.x * scale;
            camY = newCenter.y - pinchWorld.y * scale;
        }

        lastPinch = dist;
    }
});

canvas.addEventListener("pointerup", e => { 
    pointers.delete(e.pointerId); 
    if(pointers.size < 2) lastPinch = null; 
});
canvas.addEventListener("pointercancel", e => { 
    pointers.delete(e.pointerId); 
    if(pointers.size < 2) lastPinch = null; 
});
canvas.addEventListener("wheel", e => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const factor = 1 - e.deltaY * 0.001;
    scale *= factor;
    scale = Math.min(Math.max(scale, 0.2), 2);

    // Смещаем камеру так, чтобы точка под мышью оставалась на месте
    camX = mouseX - (mouseX - camX) * factor;
    camY = mouseY - (mouseY - camY) * factor;
});





// ===== UI STATS GLOW SYSTEM =====
const statFX = {
    power: { glow: 0, delta: 0 },
    speed: { glow: 0, delta: 0 },
    movesLeft: { glow: 0, delta: 0 },
    chests: { glow: 0, delta: 0 },
    monsters: { glow: 0, delta: 0 },
    bots: { glow: 0, delta: 0 },
    roundNumber: { glow: 0, delta: 0 },
    blockedCells: { glow: 0, delta: 0 }
};

const statLast = {
    power: player.power,
    speed: player.speed,
    movesLeft: player.movesLeft,
    chests: chests.length,
    monsters: monsters.length,
    bots: aliveBots.length,
    roundNumber: roundNumber,
    blockedCells: deadZones.length
};

function updateStatFX() {
    const stats = [
        { key: "power", value: player.power },
        { key: "speed", value: player.speed },
        { key: "movesLeft", value: player.movesLeft },
        { key: "chests", value: chests.length },
        { key: "monsters", value: monsters.length },
        { key: "bots", value: aliveBots.length },
        { key: "roundNumber", value: roundNumber },
        { key: "blockedCells", value: deadZones.length }
    ];
    stats.forEach(s => {
        if (s.value !== statLast[s.key]) {
            statFX[s.key].glow = 18;
            statFX[s.key].delta = s.value > statLast[s.key] ? 1 : -1;
            statLast[s.key] = s.value;
        }
    });
}

function decrementGlow() {
    for (let k in statFX) {
        if (statFX[k].glow > 0) statFX[k].glow--;
    }
}

function glowStyleNumber(fx) {
    if (fx.glow <= 0) return "color:white; font-weight:bold;";
    const intensity = fx.glow / 18;
    const color = fx.delta > 0
        ? `rgba(0,255,0,${0.6 + 0.4*intensity})`
        : `rgba(255,0,0,${0.6 + 0.4*intensity})`;
    const shadow = fx.delta > 0
        ? `0 0 ${6 + 10*intensity}px rgba(0,255,0,${0.7 + 0.3*intensity})`
        : `0 0 ${6 + 10*intensity}px rgba(255,0,0,${0.7 + 0.3*intensity})`;
    return `font-weight:bold; color:${color}; text-shadow:${shadow};`;
}

function glowStyleLabel(cls) {
    switch(cls) {
        case "player": return "color:#00ced1;"; // бирюзовый
        case "chest": return "color:#f5c542;";   // жёлтый
        case "monster": return "color:#e53935;"; // красный
        case "bot": return "color:#1e90ff;";     // синий
        case "round": return "color:#0f0;";   // зелёный 
        case "blocked": return "color:#ffffff;"; // белый
        default: return "color:white;";
    }
}


/* ==================== DRAW с кэшированием и BOT TRACES за раунд ==================== */
const reachCache = { player: {}, bots: new Map() };
let lastPlayerPos = { x: player.x, y: player.y, moves: player.movesLeft };
let lastBotPos = new Map();

// ==== Цвета для ботов (разные оттенки синих) ====
const botTraceColors = new Map();
function getBotTraceColor(b, index) {
    if (botTraceColors.has(b)) return botTraceColors.get(b);
    const hue = 200 + (index * 30) % 100; // оттенки синего
    const color = `hsla(${hue},80%,55%,0.5)`;
    botTraceColors.set(b, color);
    return color;
}

function draw() {
    // ==== Сброс кэша для игрока ====
    if (lastPlayerPos.x !== player.x || lastPlayerPos.y !== player.y || lastPlayerPos.moves !== player.movesLeft) {
        reachCache.player = {};
        lastPlayerPos = { x: player.x, y: player.y, moves: player.movesLeft };
    }

    // ==== Сброс кэша для ботов и инициализация trace ====
    aliveBots.forEach((b, index) => {
        const last = lastBotPos.get(b) || { x: -1, y: -1, speed: -1 };
        if (b.x !== last.x || b.y !== last.y || b.speed !== last.speed) {
            reachCache.bots.set(b, {});
            lastBotPos.set(b, { x: b.x, y: b.y, speed: b.speed });
        }
        if (!b.trace) b.trace = [];
        if (b.movesLeft === b.speed) b.trace = [{ x: b.x, y: b.y }];
        getBotTraceColor(b, index);
    });

    // ==== Очистка и трансформация ====
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, camX, camY);

    updateStatFX();

    if (gridCanvas) ctx.drawImage(gridCanvas, 0, 0);

    // ==== Отрисовка reachable клеток игрока ====
    const playerKey = `${player.x},${player.y},${player.movesLeft}`;
    if (!reachCache.player[playerKey]) reachCache.player[playerKey] = bfsReachable(player);
    reachCache.player[playerKey].forEach(c => {
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        roundRect(c.x * TILE, c.y * TILE, TILE, TILE, 6, true);
    });

    // ==== Отрисовка reachable клеток ботов ====
    aliveBots.forEach(b => {
        const savedMoves = b.movesLeft;
        b.movesLeft = b.speed;
        const botKey = `${b.x},${b.y},${b.speed}`;
        if (!reachCache.bots.has(b)) reachCache.bots.set(b, {});
        if (!reachCache.bots.get(b)[botKey]) reachCache.bots.get(b)[botKey] = bfsReachable(b);
        reachCache.bots.get(b)[botKey].forEach(c => {
            ctx.fillStyle = "rgba(80,80,200,0.10)";
            roundRect(c.x * TILE, c.y * TILE, TILE, TILE, 6, true);
        });
        b.movesLeft = savedMoves;
    });

    // ==== Вспомогательные функции roundRect, lighten/darken color ====
    function roundRect(x, y, w, h, r, fill = true) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        if (fill) ctx.fill(); else ctx.stroke();
    }

    function lightenColor(color, percent) {
        const f = parseInt(color.slice(1), 16), t = 255;
        const R = f >> 16, G = (f >> 8) & 0x00FF, B = f & 0x0000FF;
        return "#" + (0x1000000 + ((Math.round((t - R) * percent) + R) * 0x10000
            + (Math.round((t - G) * percent) + G) * 0x100
            + (Math.round((t - B) * percent) + B))).toString(16).slice(1);
    }

    function darkenColor(color, percent) {
        const f = parseInt(color.slice(1), 16), t = 0;
        const R = f >> 16, G = (f >> 8) & 0x00FF, B = f & 0x0000FF;
        return "#" + (0x1000000 + ((Math.round((t - R) * percent) + R) * 0x10000
            + (Math.round((t - G) * percent) + G) * 0x100
            + (Math.round((t - B) * percent) + B))).toString(16).slice(1);
    }

    // ==== Визуализация траекторий ботов (только текущий раунд) ====
    aliveBots.forEach(b => {
        if (!b.trace || b.trace.length < 2) return;
        ctx.beginPath();
        ctx.strokeStyle = botTraceColors.get(b) || "rgba(30,144,255,0.5)";
        ctx.lineWidth = 2;
        ctx.moveTo(b.trace[0].x * TILE + TILE / 2, b.trace[0].y * TILE + TILE / 2);
        for (let i = 1; i < b.trace.length; i++) {
            ctx.lineTo(b.trace[i].x * TILE + TILE / 2, b.trace[i].y * TILE + TILE / 2); // исправлено
        }
        ctx.stroke();
    });

    // ==== Отрисовка объектов карты (сначала игрок, потом боты, чтобы они его могли перекрыть) ====
    function drawCandy(x, y, size, baseColor, softCenter = false, noGradient = false) {
        if (noGradient) ctx.fillStyle = baseColor;
        else {
            let grad = ctx.createLinearGradient(x, y, x, y + size);
            if (softCenter) {
                grad.addColorStop(0, lightenColor(baseColor, 0.15));
                grad.addColorStop(0.5, darkenColor(baseColor, 0.05));
                grad.addColorStop(1, lightenColor(baseColor, 0.15));
            } else {
                grad.addColorStop(0, lightenColor(baseColor, 0.4));
                grad.addColorStop(0.5, baseColor);
                grad.addColorStop(1, darkenColor(baseColor, 0.2));
            }
            ctx.fillStyle = grad;
        }
        roundRect(x, y, size, size, size / 4, true);
        const shine = ctx.createLinearGradient(x, y, x, y + size / 3);
        shine.addColorStop(0, "rgba(255,255,255,0.2)");
        shine.addColorStop(1, "rgba(255,255,255,0)");
        roundRect(x, y, size, size / 3, size / 4, true);

        const cellX = Math.floor(x / TILE);
        const cellY = Math.floor(y / TILE);
        if (deadZones.some(d => d.x === cellX && d.y === cellY)) {
            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;
            roundRect(x, y, size, size, size / 4, false);
        }
    }

    // ==== Отрисовка всех объектов ====
    deadZones.forEach(d => { 
        drawCandy(d.x * TILE + 4, d.y * TILE + 4, TILE - 8, "#ffffff"); 
        ctx.fillStyle = "#000"; 
        ctx.fillText(d.number, d.x * TILE + 12, d.y * TILE + 28); 
    });

    chests.forEach(c => { 
        drawCandy(c.x * TILE + 8, c.y * TILE + 8, 28, "#f5c542"); 
        ctx.fillStyle = "#000"; 
        ctx.fillText(c.power, c.x * TILE + 14, c.y * TILE + 30); 
    });

    monsters.forEach(m => { 
        drawCandy(m.x * TILE + 6, m.y * TILE + 6, 32, "#e53935"); 
        ctx.fillStyle = "white"; 
        ctx.fillText(m.power, m.x * TILE + 12, m.y * TILE + 30); 
    });

    // игрок
    drawCandy(player.x * TILE + 5, player.y * TILE + 5, 34, "#00ced1", false); 
    ctx.fillStyle = "white"; 
    ctx.fillText(player.power, player.x * TILE + 12, player.y * TILE + 30);

    // боты
    aliveBots.forEach(b => { 
        let soft = false, color = b.color; 
        if (color === "blue") { color = "#1e90ff"; soft = true; } 
        drawCandy(b.x * TILE + 6, b.y * TILE + 6, 32, color, soft); 
        ctx.fillStyle = "white"; 
        ctx.fillText(b.power, b.x * TILE + 12, b.y * TILE + 30); 
    });

    // ==== Flashes ====
    flashes.forEach(f => { 
        ctx.fillStyle = `rgba(255,255,255,${f.alpha})`; 
        roundRect(f.x * TILE + 4, f.y * TILE + 4, TILE - 8, TILE - 8, 6, true); 
        f.alpha -= 0.05; 
    });
    flashes = flashes.filter(f => f.alpha > 0);

    // ==== Статистика ====
    let currentLevelScore = typeof levelScore !== "undefined" ? levelScore : 0;
    let currentTotalScore = typeof totalScore !== "undefined" ? totalScore : 0;
    if (!statFX.levelScore) statFX.levelScore = 0;
    if (!statFX.totalScore) statFX.totalScore = 0;
    statFX.levelScore += (currentLevelScore - statFX.levelScore) * 0.1;
    statFX.totalScore += (currentTotalScore - statFX.totalScore) * 0.1;

    document.getElementById("info").innerHTML = `
<span class="lbl player" style="${glowStyleLabel('player')}">Powe1r</span><span class="val" style="${glowStyleNumber(statFX.power)}">${player.power}</span>
<span class="lbl player" style="${glowStyleLabel('player')}">Speed</span><span class="val" style="${glowStyleNumber(statFX.speed)}">${player.speed}</span>
<span class="lbl player" style="${glowStyleLabel('player')}">Steps left</span><span class="val" style="${glowStyleNumber(statFX.movesLeft)}">${player.movesLeft}</span><br>
<span class="lbl chest" style="${glowStyleLabel('chest')}">Chests</span><span class="val" style="${glowStyleNumber(statFX.chests)}">${chests.length}</span>
<span class="lbl monster" style="${glowStyleLabel('monster')}">Monsters</span><span class="val" style="${glowStyleNumber(statFX.monsters)}">${monsters.length}</span>
<span class="lbl bot" style="${glowStyleLabel('bot')}">Bots</span><span class="val" style="${glowStyleNumber(statFX.bots)}">${aliveBots.length}</span><br>
<span class="lbl round" style="${glowStyleLabel('round')}">Round</span><span class="val" style="${glowStyleNumber(statFX.roundNumber)}">${roundNumber}</span>
<span class="lbl blocked" style="${glowStyleLabel('blocked')}">Blocked cells</span><span class="val" style="${glowStyleNumber(statFX.blockedCells)}">${deadZones.length}</span><br>
<span class="lbl score" style="${glowStyleLabel('round')}">Level ${level} Score</span><span class="val" style="${glowStyleNumber(statFX.levelScore)}">${Math.round(statFX.levelScore)}</span>
<span class="lbl score" style="${glowStyleLabel('round')}">Total</span><span class="val" style="${glowStyleNumber(statFX.totalScore)}">${Math.round(statFX.totalScore)}</span>`;

    decrementGlow();
}



// ===== Вспомогательная функция затемнения цвета =====
function shadeColor(color, percent) {
    const f=parseInt(color.slice(1),16),t=percent<0?0:255,p=percent<0?percent*-1:percent;
    const R=f>>16,G=f>>8&0x00FF,B=f&0x0000FF;
    return "#" + (0x1000000 + (Math.round((t-R)*p/100)+R)*0x10000 + (Math.round((t-G)*p/100)+G)*0x100 + (Math.round((t-B)*p/100)+B)).toString(16).slice(1);
}





/* ==================== GAME LOOP ==================== */
(function loop(){ draw(); requestAnimationFrame(loop); })();
spawn();


</script>
