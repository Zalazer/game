<script>

/* =============================
   GAME CONSTANTS
============================= */
const GAME_ID = 'ChronoMonsters';
const LEADERBOARD_MAX = 10;

/* =============================
   TELEGRAM AUTH
============================= */
let tgUser = null;
let playerNick = 'Player';
let SERVER_OK = true;

async function authTelegram(){
    try{
        if(window.Telegram?.WebApp){
            const tg = window.Telegram.WebApp;

            tg.expand();
            tg.disableVerticalSwipes();

            if(tg.initData){
                await fetch('/__auth',{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({initData:tg.initData})
                });

                tgUser = tg.initDataUnsafe?.user || null;

                if(tgUser){
                    if(tgUser.username){
                        playerNick = tgUser.username.replace(/^@/, '').slice(0,12);
                    }else if(tgUser.first_name){
                        playerNick = tgUser.first_name.slice(0,12);
                    }else{
                        playerNick = String(tgUser.id);
                    }
                }
            }
        }
    }catch(e){
        console.log("TG auth failed",e);
        SERVER_OK = false;
    }
}

/* =============================
   TELEGRAM BACK BUTTON CONTROL
============================= */
function setupTelegramBackButton(){

    if(!window.Telegram?.WebApp) return;

    const tg = window.Telegram.WebApp;

    tg.BackButton.show();

    tg.BackButton.onClick(()=>{

        const modal = document.getElementById('leaderboardModal');

        // если открыт leaderboard → закрываем
        if(modal && modal.style.display === 'flex'){
            modal.style.display = 'none';
            return;
        }

        // если открыт overlay game over → закрываем
        if(typeof overlay !== 'undefined' && overlay?.style?.display === 'block'){
            overlay.style.display = 'none';
            return;
        }

        // подтверждение выхода
        if(confirm("Exit game? Progress will be lost.")){
            tg.close();
        }
    });
}



/* =============================
   LEADERBOARDS (LEVEL SUPPORT + OFFLINE MODE)
============================= */

let localScores = [];
let globalScores = [];
let lastGameScore = null;
let selectedLevel = 'all';

/* =============================
   LOAD LEADERBOARD
============================= */
async function loadGlobalLeaderboard(levelFilter = null) {

    globalScores = [];
    localScores = [];

    // Если нет Telegram или сервер недоступен — просто нули
    if (!tgUser?.id || !SERVER_OK) {
        for (let i = 0; i < LEADERBOARD_MAX; i++) {
            globalScores.push({ nick: '—', score: 0, level: 0 });
            localScores.push({ score: 0, level: 0 });
        }
        return;
    }

    try {
        const url = new URL('/__leaders', window.location.origin);
        url.searchParams.set('game', GAME_ID);

        if (levelFilter && levelFilter !== 'all') url.searchParams.set('level', levelFilter);
        url.searchParams.set('user', String(tgUser.id));

        const r = await fetch(url);
        const data = await r.json();

        globalScores = (data?.globalTop || []).slice(0, LEADERBOARD_MAX).map(e => ({
            nick: e.nick || 'Player',
            score: Number(e.score || 0),
            level: Number(e.level || 0)
        }));

        localScores = (data?.userTop || []).slice(0, LEADERBOARD_MAX).map(e => ({
            score: Number(e.score || 0),
            level: Number(e.level || 0)
        }));

        // Если сервер вернул меньше записей — дополняем нулями
        while (globalScores.length < LEADERBOARD_MAX) globalScores.push({ nick: '—', score: 0, level: 0 });
        while (localScores.length < LEADERBOARD_MAX) localScores.push({ score: 0, level: 0 });

    } catch (e) {
        console.log("leaders load fail", e);
        SERVER_OK = false;

        for (let i = 0; i < LEADERBOARD_MAX; i++) {
            globalScores.push({ nick: '—', score: 0, level: 0 });
            localScores.push({ score: 0, level: 0 });
        }
    }
}

/* =============================
   SEND SCORE
============================= */
async function sendScoreToServer(score, level) {
    if (!SERVER_OK || !tgUser?.id) return;

    try {
        const t = await fetch('/__ticket', { method: 'POST' });
        const ticket = await t.json();

        await fetch('/__emit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                k: ticket.k,
                d: {
                    type: 'score',
                    game: GAME_ID,
                    user: { id: String(tgUser.id) },
                    nick: playerNick,
                    score: Number(score || 0),
                    level: Number(level || 0)
                }
            })
        });

    } catch (e) {
        console.log("send score fail", e);
        SERVER_OK = false;
    }
}



async function sendTotalScore(total) {
    if (!SERVER_OK || !tgUser?.id) return;

    try {
        const t = await fetch('/__ticket', { method: 'POST' });
        const ticket = await t.json();

        await fetch('/__emit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                k: ticket.k,
                d: {
                    type: 'score',
                    game: GAME_ID,
                    total: Number(total || 0),
                    nick: playerNick,
                    user: { id: String(tgUser.id) }
                }
            })
        });

    } catch (e) {
        console.log("send total fail", e);
    }
}



/* =============================
   SAVE RESULT
============================= */
async function saveToLeaderboard(score, level) {
    lastGameScore = score;

    if (tgUser?.id && SERVER_OK) await sendScoreToServer(score, level);
    await loadGlobalLeaderboard(level);
}

/* =============================
   RENDER LEADERBOARD
============================= */
function renderLeaderboard() {

    let html = `<div id="leaderFilterBox">
                    <select id="levelSelect">
                        <option value="all" ${selectedLevel === 'all' ? 'selected' : ''}>All Levels</option>`;

    for (let i = 1; i <= 20; i++) {
        html += `<option value="${i}" ${i === selectedLevel ? 'selected' : ''}>Level ${i}</option>`;
    }

    html += `</select></div>`;

    html += `<h2>Global Top</h2>`;
    for (let i = 0; i < LEADERBOARD_MAX; i++) {
        let e = globalScores[i] || { nick: '—', score: 0, level: 0 };
        let color = (e.score === lastGameScore) ? '#00ff99' : '#ccc';
        html += `<div style="color:${color}">${i + 1}. ${e.nick} — ${e.score} (Lv ${e.level})</div>`;
    }

    html += `<h2 style="margin-top:15px;">Your Top</h2>`;
    for (let i = 0; i < LEADERBOARD_MAX; i++) {
        let e = localScores[i] || { score: 0, level: 0 };
        let color = (e.score === lastGameScore) ? '#00ff99' : '#ccc';
        html += `<div style="color:${color}">${i + 1}. ${e.score} (Lv ${e.level})</div>`;
    }

    html += `<div style="margin-top:20px; display:flex; flex-direction:column; gap:10px; text-align:center;">
                <button id="leaderReturnBtn" style="padding:10px 20px; font-size:18px; border-radius:6px; cursor:pointer; background:linear-gradient(145deg,#555,#333); color:white; border:none;">Return</button>
                <button id="leaderRestartBtn" style="padding:10px 20px; font-size:18px; border-radius:6px; cursor:pointer; background:linear-gradient(145deg,#ff4444,#990000); color:white; border:none;">Restart Game</button>
             </div>`;

    document.getElementById('leaderContent').innerHTML = html;

    document.getElementById('levelSelect').onchange = async e => {
        const v = e.target.value;
        selectedLevel = (v === 'all') ? 'all' : Number(v);
        await loadGlobalLeaderboard(selectedLevel);
        renderLeaderboard();
    };

    document.getElementById('leaderReturnBtn').onclick = () => {
        document.getElementById('leaderboardModal').style.display = 'none';
    };

    document.getElementById('leaderRestartBtn').onclick = () => {
        document.getElementById('leaderboardModal').style.display = 'none';

        totalScore = 0;
        level = 1;
        botsKilledThisLevel = 0;
        monstersKilledThisLevel = 0;
        chestsCollectedThisLevel = 0;

        player.power = 1;
        player.speed = 5;
        player.movesLeft = player.speed;
        player.x = 0;
        player.y = 0;

        bots.forEach(b => b.alive = true);

        startNextLevel();
        gameOver = false;
    };
}

/* =============================
   INIT BUTTONS
============================= */
document.addEventListener('DOMContentLoaded', async () => {

    await authTelegram();
    setupTelegramBackButton();

    const leaderBtn = document.getElementById('leaderBtn');
    const modal = document.getElementById('leaderboardModal');

/* ==================== КОНСТАНТЫ ==================== */

const BASE_MAP = 15;     // стартовая карта 15x15
const TILE = 40;

const BASE_BOTS = 3;     // округлённо
const BASE_MONSTERS = 11;
const BASE_CHESTS = 11;

let level = 1;
let MAP = BASE_MAP;
let BOTS = BASE_BOTS;
let MONSTERS = BASE_MONSTERS;
let CHESTS = BASE_CHESTS;


/* ==================== ПОДСЧЁТ ОЧКОВ ==================== */

let totalScore = 0;          // сумма завершённых уровней
let levelScore = 0;          // текущий счёт уровня (live)

let botsKilledThisLevel = 0;
let monstersKilledThisLevel = 0;
let chestsCollectedThisLevel = 0;


/* ==================== ФОРМУЛА ОЧКОВ ==================== */
function calculateScore(){

    return (
        player.power * 10 +
        botsKilledThisLevel * 150 +
        monstersKilledThisLevel * 10 +
        deadZones.length * 5
    );

}


/* ==================== ОБНОВЛЕНИЕ SCORE (вызывать после шага игрока) ==================== */
function updateScore(){

    // считаем новый уровень
    let newLevelScore = calculateScore();

    // разница (сколько добавилось с прошлого шага)
    let delta = newLevelScore - levelScore;

    // обновляем level
    levelScore = newLevelScore;

    // сразу добавляем в total
    totalScore += delta;

}


/* ==================== ПЛАВНОЕ ОБНОВЛЕНИЕ UI ==================== */
function updateScoreFX() {

    statFX.levelScore += (levelScore - statFX.levelScore) * 0.2;
    statFX.totalScore += (totalScore - statFX.totalScore) * 0.2;

}

let logCounter = 0;

/* ==================== ЛОГ С НУМЕРАЦИЕЙ ==================== */

function colorizeGameText(text){

    return text.replace(/(<[^>]+>|[^<]+)/g, (part) => {

        // если это HTML тег — не трогаем
        if(part.startsWith("<")) return part;

        // иначе красим слова
        return part.replace(/\b(\w+)\b/g, (match) => {

            let color = "#39ff14"; // базовый цвет
            const lower = match.toLowerCase();

            if(lower.includes("player")) color = "cyan";
            else if(lower.includes("chest")) color = "yellow";
            else if(lower.includes("monster")) color = "red";
            else if(lower.includes("bot")) color = "blue";

            return `<span style="color:${color}; font-weight:bold">${match}</span>`;
        });

    });
}


function log(t){

    logCounter++;

    const coloredText = colorizeGameText(t);

    logBox.innerHTML =
        `${logCounter}. ${coloredText}<br>` + logBox.innerHTML;

    // обрезаем лог до последних 50 строк
    const lines = logBox.innerHTML.split("<br>");
    if(lines.length > 50)
        logBox.innerHTML = lines.slice(0,50).join("<br>");

    logBox.scrollTop = 0; // последние события сверху
}




/* ==================== ПОМОЩЬ ==================== */
function posKey(x,y){ return `${x},${y}`; }

/* ==================== WebAudio ЗВУКИ ==================== */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, duration=0.15, type='sine', volume=1){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+duration);
}

Level score: ${levelScore} | Total score: ${totalScore}`

// отправляем TOTAL SCORE только при смерти
if (text.startsWith("Game Over")) {

}

    restartBtn.onclick = () => {

function handleTrapAtRoundStart(character) {
    const dirs = [
        { dx: 0, dy: -1 },
        { dx: 0, dy: 1 },
        { dx: -1, dy: 0 },
        { dx: 1, dy: 0 }
    ];

    let blocked = 0;
    const breakableWhite = [];

    for (const d of dirs) {
        const nx = character.x + d.dx;
        const ny = character.y + d.dy;

        if (!inBounds(nx, ny)) {
            blocked++;
            continue;
        }

        const cell = map[ny][nx];

        if (cell.type === 'white') {
            blocked++;
            if (cell.power > 0) breakableWhite.push(cell);
            continue;
        }

        if (
            (cell.type === 'monster' || cell.type === 'player' || cell.type === 'bot') &&
            cell.power > character.power
        ) {
            blocked++;
            continue;
        }

        return; // есть выход — НЕ ловушка
    }

    if (blocked < 4) return;

    // === ЛОВУШКА ===
    if (breakableWhite.length > 0) {
        const target = breakableWhite.reduce((a, b) =>
            b.power > a.power ? b : a
        );

        const oldPower = character.power;
        character.power -= target.power;

        if (character.power <= 0) {
            map[character.y][character.x] = {
                type: 'white',
                power: oldPower
            };
            character.dead = true;
        } else {
            map[target.y][target.x] = { type: 'empty' };
        }
        return;
    }

    const oldPower = character.power;
    map[character.y][character.x] = {
        type: 'white',
        power: oldPower
    };
    character.dead = true;
}


/* ==================== NEXT LEVEL ==================== */
function startNextLevel(){

    /* ===== SCORE RESET FOR NEW LEVEL ===== */
    levelScore = 0;

    botsKilledThisLevel = 0;
    monstersKilledThisLevel = 0;
    chestsCollectedThisLevel = 0;


    // Размер карты: стартовая 15x15, +5 клеток по каждой оси на каждом новом уровне
    const baseMapSize = 15;
    const mapGrowth = 5;
    MAP = baseMapSize + (level - 1) * mapGrowth; // уровень должен быть установлен заранее

    // Плотность объектов фиксируем относительно карты 20x20
    const densityMapSize = 20; 
    const baseBots = 5;
    const baseMonsters = 20;
    const baseChests = 20;

    const scaleFactor = (MAP * MAP) / (densityMapSize * densityMapSize);

    BOTS = Math.max(1, Math.round(baseBots * scaleFactor));
    MONSTERS = Math.max(1, Math.round(baseMonsters * scaleFactor));
    CHESTS = Math.max(1, Math.round(baseChests * scaleFactor));

    console.log(`Level ${level}: MAP=${MAP}x${MAP}, BOTS=${BOTS}, MONSTERS=${MONSTERS}, CHESTS=${CHESTS}`);

    // Сброс игрока и ботов
    player.movesLeft = player.speed;
    bots.forEach(b => b.alive = true);

    spawn(); // старый проверенный метод размещения объектов
}



/* ==================== SPAWN ==================== */
function spawn(){
    const used = new Set();
    function placeUnique(){
        let x,y,key;
        do { x=Math.floor(Math.random()*MAP); y=Math.floor(Math.random()*MAP); key=posKey(x,y);} 
        while(used.has(key));
        used.add(key);
        return {x,y};
    }

    // Сброс всех параметров
    moveNumber = 0; roundNumber = 0; logCounter = 0;
    player.x = 0; player.y = 0; player.power = 1; player.speed = 5; player.movesLeft = player.speed;
    bots = []; monsters = []; chests = []; flashes = []; deadZones = []; gameOver = false; overlay.style.display="none";

    // Игрок
    let p = placeUnique();
    player.x = p.x; player.y = p.y;

    // Боты
    for(let i=0;i<BOTS;i++){
        let pos = placeUnique();
        bots.push({
            id:`bot-${String(i+1).padStart(3,"0")}`,
            x:pos.x,y:pos.y,
            power:1,speed:5,movesLeft:5,
            alive:true,px:null,py:null,color:"blue"
        });
    }

    // Монстры
    for(let i=0;i<MONSTERS;i++){
        let pos = placeUnique();
        monsters.push({x:pos.x,y:pos.y,power:1});
    }

    // Сундуки
    for(let i=0;i<CHESTS;i++){
        let pos = placeUnique();
        chests.push({x:pos.x,y:pos.y,power:1});
    }

    // Проверяем ловушки сразу после расстановки
    resolveTrapAtRoundStart(player);
    bots.forEach(b=>{
        if(!b.alive) return;
        resolveTrapAtRoundStart(b);
    });

    playNewRoundSound();
}


/* ==================== ПРОХОДИМОСТЬ КЛЕТКИ ==================== */
function isBlockedFor(entity, x, y){
    if(x<0 || y<0 || x>=MAP || y>=MAP) return true;

    if(deadZones.some(dz => dz.x === x && dz.y === y)) return true;


// Игрок как цель
if(entity !== player && player.x === x && player.y === y){
    // бот может войти ТОЛЬКО если он сильнее или равен
    if(entity.power < player.power) return true;
}


    for(let m of monsters){
        if(m.x === x && m.y === y){
            if(entity.power < m.power) return true;
        }
    }

    for(let b of bots){
        if(!b.alive) continue;
        if(b.x === x && b.y === y){
            if(entity === b) continue;
            if(b.power > entity.power) return true;
        }
    }

    return false;
}




/* ==================== ТУПИК В ТЕКУЩЕМ РАУНДЕ ==================== */
function isImmediateDeadEnd(entity){
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

    for(let d of dirs){
        const nx = entity.x + d[0];
        const ny = entity.y + d[1];

        // если хотя бы одно направление проходимо — НЕ тупик
        if(nx >= 0 && ny >= 0 && nx < MAP && ny < MAP){
            if(!isBlockedFor(entity, nx, ny)){
                return false;
            }
        }
    }

    // все 4 направления заблокированы
    return true;
}




/* ==================== ЛОВУШКА В НАЧАЛЕ РАУНДА ==================== */
function getTrapWhiteCells(entity){
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    let whites = [];

    for(let d of dirs){
        const nx = entity.x + d[0];
        const ny = entity.y + d[1];

        // граница карты — считается непроходимой
        if(nx < 0 || ny < 0 || nx >= MAP || ny >= MAP){
            continue;
        }

        // ищем белую клетку
        const dz = deadZones.find(z => z.x === nx && z.y === ny);
        if(dz){
            whites.push(dz);
            continue;
        }

        // если есть хотя бы одна проходимая клетка — НЕ ловушка
        if(!isBlockedFor(entity, nx, ny)){
            return null;
        }
    }

    return whites;
}




function resolveTrapAtRoundStart(entity){
    const whites = getTrapWhiteCells(entity);
    if(!whites) return; // не в ловушке

    if(whites.length === 0) return; // нет белых — нечего ломать

    // выбираем белую клетку с максимальной силой
    let maxWhite = whites.reduce((a,b)=> b.number > a.number ? b : a);

    const damage = maxWhite.number;
    const prevPower = entity.power;

    entity.power -= damage;

    log(`${entity.id || 'entity'} trapped: -${damage} power (from ${prevPower} to ${entity.power})`);

    // смерть
    if(entity.power <= 0){
        deadZones.push({
            x: entity.x,
            y: entity.y,
            number: prevPower
        });

        if(entity === player){
            endGame(`Game Over: trapped with ${prevPower} power`);
        } else {
            entity.alive = false;
            flash(entity.x, entity.y, "red");
        }
        return;
    }

    // выжил — убираем белую клетку
    const idx = deadZones.indexOf(maxWhite);
    if(idx !== -1){
        deadZones.splice(idx, 1);
    }

    flash(maxWhite.x, maxWhite.y, "white");
}











/* ==================== BFS ДОСТУПНЫХ КЛЕТОК ==================== */
function bfsReachable(e){
    let visited = Array.from({length:MAP},()=>Array(MAP).fill(false));
    let q = [{x:e.x,y:e.y,dist:0}]; visited[e.x][e.y] = true;
    let reachable = [];
    while(q.length){
        let cur = q.shift();
        if(cur.dist>0 && cur.dist<=e.movesLeft) reachable.push({x:cur.x,y:cur.y,dist:cur.dist});
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
            let nx = cur.x+d[0], ny = cur.y+d[1];
            if(nx<0||ny<0||nx>=MAP||ny>=MAP) return;
            if(visited[nx][ny]) return;
            if(isBlockedFor(e, nx, ny)) return;
            visited[nx][ny]=true;
            if(cur.dist+1<=e.movesLeft) q.push({x:nx,y:ny,dist:cur.dist+1});
        });
    }
    return reachable;
}

/* ==================== BFS ПУТИ ==================== */
function bfsPath(entity, sx,sy,tx,ty){
    let visited = Array.from({length:MAP},()=>Array(MAP).fill(false));
    let prev = Array.from({length:MAP},()=>Array(MAP).fill(null));
    let q=[{x:sx,y:sy}]; visited[sx][sy]=true;
    while(q.length){
        let cur = q.shift();
        if(cur.x===tx && cur.y===ty) break;
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
            let nx = cur.x+d[0], ny = cur.y+d[1];
            if(nx<0||ny<0||nx>=MAP||ny>=MAP) return;
            if(visited[nx][ny]) return;
            if(isBlockedFor(entity, nx, ny)) return;
            visited[nx][ny]=true; prev[nx][ny]=cur; q.push({x:nx,y:ny});
        });
    }
    let path=[], cx=tx, cy=ty;
    if(!prev[cx][cy] && !(cx===sx&&cy===sy)) return null;
    while(cx!==sx||cy!==sy){ path.push({x:cx,y:cy}); let p=prev[cx][cy]; if(!p) break; cx=p.x; cy=p.y;}
    path.reverse(); return path;
}

/* ==================== FLASH ЭФФЕКТ ==================== */
function flash(x,y,color){flashes.push({x,y,color,alpha:1});}

/* ==================== ПРОВЕРКА ЛОВУШЕК И ТУПИКОВ ==================== */
function isTrappedOrStuck(x, y, entity) {
    let visited = Array.from({length:MAP},()=>Array(MAP).fill(false));
    let q = [{x, y}];
    visited[x][y] = true;
    
    while(q.length) {
        let cur = q.shift();
        
        // Проверка на границу карты
        if(cur.x === 0 || cur.x === MAP-1 || cur.y === 0 || cur.y === MAP-1) {
            // Если достигнута граница - это не ловушка, но может быть тупик
            return {isTrapped: false, isStuck: false};
        }
        
        let hasEmpty = false;
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
            let nx = cur.x+d[0], ny = cur.y+d[1];
            if(nx<0||ny<0||nx>=MAP||ny>=MAP) return;
            if(visited[nx][ny]) return;
            
            // Проверка на белые клетки (стены)
            let isDeadZone = deadZones.some(dz => dz.x === nx && dz.y === ny);
            if(!isDeadZone && !isBlockedFor(entity, nx, ny)) {
                hasEmpty = true;
            }
            
            // Если клетка не стена и доступна
            if(!isDeadZone && !visited[nx][ny] && !isBlockedFor(entity, nx, ny)) {
                visited[nx][ny] = true;
                q.push({x:nx, y:ny});
            }
        });
        
        // Если нашли пустую клетку, значит не тупик
        if (hasEmpty) {
            return {isTrapped: false, isStuck: false};
        }
    }
    
    // Если не нашли выход - это либо ловушка, либо тупик
    return {isTrapped: true, isStuck: true};
}

/* ==================== ПРИМЕНЕНИЕ ШТРАФА ==================== */
function applyPenalty(entity, penaltyType) {
    // Находим все белые клетки вокруг области
    let surroundingWhite = [];
    let visited = Array.from({length:MAP},()=>Array(MAP).fill(false));
    let q = [{x:entity.x,y:entity.y}];
    visited[entity.x][entity.y] = true;
    
    while(q.length) {
        let cur = q.shift();
        
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
            let nx = cur.x+d[0], ny = cur.y+d[1];
            if(nx<0||ny<0||nx>=MAP||ny>=MAP) return;
            if(visited[nx][ny]) return;
            
            // Ищем белые клетки
            let deadZoneMatch = deadZones.find(dz => dz.x === nx && dz.y === ny);
            if (deadZoneMatch) {
                surroundingWhite.push(deadZoneMatch.number);
                return;
            }
            
            // Пропускаем стены и недоступные клетки
            if (isBlockedFor(entity, nx, ny)) return;
            
            // Продолжаем поиск
            if (!visited[nx][ny]) {
                visited[nx][ny] = true;
                q.push({x:nx, y:ny});
            }
        });
    }
    
    // Находим максимальный номер белой клетки
    if (surroundingWhite.length === 0) return;
    let maxNumber = Math.max(...surroundingWhite);
    
    // Применяем штраф
    if (penaltyType === "trap") {
        // Для ловушки: если сила меньше максимального числа - персонаж умирает
        if (entity.power < maxNumber) {
            if (entity === player) {
                endGame(`Game Over: ${entity.id} trapped with power ${entity.power} < ${maxNumber}`);
            } else {
                entity.alive = false;
                log(`${entity.id} died in trap (power ${entity.power} < ${maxNumber})`);
                flash(entity.x, entity.y, "red");
            }
            return;
        }
    }
    
    // Для всех: уменьшаем силу
    entity.power -= maxNumber;
    entity.power = Math.max(0, entity.power);
    log(`${entity.id} penalty: -${maxNumber} power (now ${entity.power})`);
    flash(entity.x, entity.y, "white");
    
    // Удаляем одну белую клетку с максимальным номером
    let index = deadZones.findIndex(dz => dz.number === maxNumber);
    if (index !== -1) {
        deadZones.splice(index, 1);
    }
}

/* ==================== COLLECT ==================== */
function collect(e){

    if(gameOver) return;

    let playerDidSomething = false;


    /* ---------- СУНДУКИ ---------- */
    chests = chests.filter(c=>{

        if(c.x === e.x && c.y === e.y){

            e.power += c.power;

            if(e === player){
                chestsCollectedThisLevel++;
                playerDidSomething = true;
            }

            log(`${e.id || 'entity'} collected chest +${c.power} (power:${e.power} speed:${e.speed})`);
            flash(c.x,c.y,"yellow");

            deadZones.push({
                x:c.x,
                y:c.y,
                number:c.power
            });

            playChestSound();

            return false;
        }

        return true;
    });



    /* ---------- МОНСТРЫ ---------- */
    monsters = monsters.filter(m=>{

        if(m.x === e.x && m.y === e.y){

            if(e.power >= m.power){

                e.speed += 1;

                if(e === player){
                    monstersKilledThisLevel++;
                    playerDidSomething = true;
                }

                log(`${e.id || 'entity'} killed monster (power:${e.power} speed:${e.speed})`);
                flash(m.x,m.y,"red");

                deadZones.push({
                    x:m.x,
                    y:m.y,
                    number:m.power
                });

                playMonsterSound();

                return false;

            } else {

                // непроходимая клетка
                deadZones.push({
                    x:m.x,
                    y:m.y,
                    number:m.power
                });

            }
        }

        return true;
    });



    /* ---------- УБИЙСТВО ИГРОКА ---------- */
    if(
        e !== player &&
        player.x === e.x &&
        player.y === e.y &&
        e.power >= player.power &&
        !gameOver
    ){

        log(`player killed by ${e.id} (power:${e.power} >= ${player.power})`);

        endGame(`Game Over with ${player.power} power and ${player.speed} speed, killed by ${e.id}`);

        return;
    }



    /* ---------- БОТЫ ---------- */
    bots.forEach(b=>{

        if(
            b !== e &&
            b.alive &&
            b.x === e.x &&
            b.y === e.y
        ){

            if(e.power >= b.power){

                b.alive = false;
                e.speed += 2;

                if(e === player){
                    botsKilledThisLevel++;
                    playerDidSomething = true;
                }

                log(`${e.id || 'entity'} killed ${b.id} (power:${e.power} speed:${e.speed})`);
                flash(b.x,b.y,"blue");

                deadZones.push({
                    x:b.x,
                    y:b.y,
                    number:b.power
                });

                playBotSound();

            }
        }
    });



    /* ---------- ОБНОВЛЕНИЕ SCORE ---------- */
    if(e === player){
        // даже если просто походил — очки могли измениться (deadZones, power и т.д.)
        updateScore();
    }



    /* ---------- ПРОВЕРКА ПОБЕДЫ ---------- */
    if(e === player){

        if(bots.every(b=>!b.alive) && !gameOver){

            endGame(`You Win with ${player.power} power and ${player.speed} speed!`);

        }
    }

}

/* ==================== BOT MOVE ==================== */
function botStep(b){

    if(!b.alive || gameOver) return;

    b.movesLeft = b.speed;

    while(b.movesLeft > 0 && !gameOver){

        let bestTarget = null;
        let bestValue = -Infinity;

        const entities = [];

        chests.forEach(c=>entities.push({type:"chest",obj:c}));
        monsters.forEach(m=>entities.push({type:"monster",obj:m}));
        bots.forEach(o=>{
            if(o!==b && o.alive) entities.push({type:"bot",obj:o});
        });
        entities.push({type:"player",obj:player});

        function dangerAt(x,y){

            let danger = 0;

            bots.forEach(o=>{
                if(o===b || !o.alive) return;
                const d = Math.abs(o.x-x)+Math.abs(o.y-y);
                if(d<=2 && o.power > b.power){
                    danger += (o.power - b.power) * 20;
                }
            });

            if(player !== b){
                const d = Math.abs(player.x-x)+Math.abs(player.y-y);
                if(d<=2 && player.power > b.power){
                    danger += (player.power - b.power) * 25;
                }
            }

            return danger;
        }

        function trapRisk(x,y){
            if(isImmediateDeadEnd({x,y,power:b.power})) return 200;
            return 0;
        }

        entities.forEach(e=>{

            const t = e.obj;

            if(e.type==="monster" && t.power > b.power) return;
            if(e.type==="bot" && t.power >= b.power) return;
            if(e.type==="player" && player.power >= b.power) return;

            const dist = Math.abs(b.x-t.x)+Math.abs(b.y-t.y);
            if(dist===0) return;

            let reward = 0;

            if(e.type==="chest") reward = 40 + t.power*12;
            if(e.type==="monster") reward = 70 + t.power*18;
            if(e.type==="bot") reward = 160 + t.power*25;
            if(e.type==="player") reward = 300 + player.power*35;

            const path = bfsPath(b, b.x, b.y, t.x, t.y);
            if(!path || path.length===0) return;

            const next = path[0];

            let value =
                reward
                - dist*15
                - dangerAt(next.x,next.y)
                - trapRisk(next.x,next.y);

            // агрессия если бот сильный
            if(b.power > player.power * 1.3 && e.type==="player"){
                value += 200;
            }

            // охота на лидера
            let strongest = Math.max(
                player.power,
                ...bots.filter(o=>o.alive).map(o=>o.power)
            );

            if(t.power === strongest){
                value += 120;
            }

            if(value > bestValue){
                bestValue = value;
                bestTarget = {target:t,step:next};
            }
        });

        let step = null;

        if(bestTarget){
            step = bestTarget.step;
        }

        // fallback движение
        if(!step){

            const dirs = [
                {x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}
            ];

            dirs.sort(()=>Math.random()-0.5);

            for(let d of dirs){
                let nx = b.x + d.x;
                let ny = b.y + d.y;
                if(!isBlockedFor(b,nx,ny)){
                    step = {x:nx,y:ny};
                    break;
                }
            }
        }

        if(!step) break;

        b.x = step.x;
        b.y = step.y;
        b.movesLeft--;

        collect(b);

        if(!b.alive) break;

        if(isImmediateDeadEnd(b)){
            b.movesLeft = 0;
            break;
        }
    }
}

/* ==================== ПРОВЕРКА ЗАМКНУТОЙ ОБЛАСТИ В НАЧАЛЕ ХОДА ==================== */
function resolveAreaTrap(entity){

    if(gameOver) return;
    if(entity.dead || entity.alive === false) return;

    const visited = Array.from({length:MAP},()=>Array(MAP).fill(false));
    const q = [{x:entity.x, y:entity.y}];
    visited[entity.x][entity.y] = true;

    let perimeterWhites = [];
    let foundDestroyableTarget = false;

    while(q.length){

        const cur = q.shift();

        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

        for(const d of dirs){

            const nx = cur.x + d[0];
            const ny = cur.y + d[1];

            // граница карты = белая клетка силы 0
            if(nx < 0 || ny < 0 || nx >= MAP || ny >= MAP){
                continue;
            }

            // белая клетка
            const dz = deadZones.find(z => z.x === nx && z.y === ny);
            if(dz){
                perimeterWhites.push(dz);
                continue;
            }

            // проверяем уничтожаемые цели
            const monster = monsters.find(m=>m.x===nx && m.y===ny);
            if(monster && monster.power <= entity.power){
                foundDestroyableTarget = true;
            }

            const chest = chests.find(c=>c.x===nx && c.y===ny);
            if(chest){
                foundDestroyableTarget = true;
            }

            const bot = bots.find(b=>b.alive && b.x===nx && b.y===ny);
            if(bot && bot !== entity && bot.power <= entity.power){
                foundDestroyableTarget = true;
            }

            if(player !== entity && player.x===nx && player.y===ny && player.power <= entity.power){
                foundDestroyableTarget = true;
            }

            // проходимая клетка — расширяем BFS
            if(!visited[nx][ny] && !isBlockedFor(entity, nx, ny)){
                visited[nx][ny] = true;
                q.push({x:nx, y:ny});
            }
        }
    }

    // если есть цель — НЕ ловушка
    if(foundDestroyableTarget) return;

    if(perimeterWhites.length === 0) return;

    // выбираем белую клетку максимальной силы
    let maxWhite = perimeterWhites.reduce((a,b)=> b.number > a.number ? b : a);

    const damage = maxWhite.number;
    const prevPower = entity.power;

    entity.power -= damage;

    log(`${entity.id || 'entity'} trapped in area: -${damage} power (${prevPower}→${entity.power})`);

    // смерть
    if(entity.power <= 0){

        deadZones.push({
            x: entity.x,
            y: entity.y,
            number: prevPower
        });

        if(entity === player){
            endGame(`Game Over: trapped with ${prevPower} power`);
        }else{
            entity.alive = false;
            flash(entity.x, entity.y, "red");
        }

        return;
    }

    // удаляем белую клетку
    const idx = deadZones.indexOf(maxWhite);
    if(idx !== -1) deadZones.splice(idx,1);

    flash(maxWhite.x, maxWhite.y, "white");
}


/* ==================== ПРОВЕРКА ЛОВУШЕК ПЕРЕД ХОДАМИ ==================== */
function checkTrapsAndStucks(){

    resolveAreaTrap(player);

    bots.forEach(b=>{
        if(!b.alive) return;
        resolveAreaTrap(b);
    });
}





function endPlayerTurn(){
    // Проверка ловушек и тупиков после хода игрока
    checkTrapsAndStucks();

    // Ход ботов
    bots.forEach(b=>botStep(b));

    if(gameOver) return;

    // Усиление существующих объектов
    monsters.forEach(m=>m.power++);
    chests.forEach(c=>c.power++);

    // Возрождение объектов, уничтоженных в прошлом раунде
    while(chests.length < CHESTS){
        let x=Math.floor(Math.random()*MAP), y=Math.floor(Math.random()*MAP);
        if(!deadZones.some(d=>d.x===x&&d.y===y) && !chests.some(c=>c.x===x&&c.y===y) &&
           !monsters.some(m=>m.x===x&&m.y===y) && !bots.some(b=>b.alive && b.x===x && b.y===y) &&
           !(player.x===x && player.y===y)){
            chests.push({x,y,power:1});
        }
    }
    while(monsters.length < MONSTERS){
        let x=Math.floor(Math.random()*MAP), y=Math.floor(Math.random()*MAP);
        if(!deadZones.some(d=>d.x===x&&d.y===y) && !monsters.some(m=>m.x===x&&m.y===y) &&
           !chests.some(c=>c.x===x&&c.y===y) && !bots.some(b=>b.alive && b.x===x && b.y===y) &&
           !(player.x===x && player.y===y)){
            monsters.push({x,y,power:1});
        }
    }

    roundNumber++;
    player.movesLeft = player.speed;
    playNewRoundSound();
}

/* ==================== TOUCH DRAG И PINCH ==================== */
canvas.addEventListener("pointerdown", e => {
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(pointers.size === 2){
        const [p1, p2] = Array.from(pointers.values());
        lastPinch = Math.hypot(p2.x-p1.x, p2.y-p1.y);

        // Центр между пальцами в экранных координатах
        pinchCenter = {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};

        // Центр в "мировых" координатах
        pinchWorld = {
            x: (pinchCenter.x - camX) / scale,
            y: (pinchCenter.y - camY) / scale
        };
    }
});

canvas.addEventListener("pointermove", e => {
    if(!pointers.has(e.pointerId)) return;

    const prev = pointers.get(e.pointerId);
    const dx = e.clientX - prev.x;
    const dy = e.clientY - prev.y;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(pointers.size === 1){
        // Обычное перемещение одним пальцем
        camX += dx;
        camY += dy;
    } else if(pointers.size === 2){
        const [p1, p2] = Array.from(pointers.values());
        const dist = Math.hypot(p2.x-p1.x, p2.y-p1.y);
        const newCenter = {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};

        if(lastPinch){
            const factor = dist / lastPinch;

            // Масштабируем
            scale *= factor;
            scale = Math.min(Math.max(scale,0.1),7);

            // Смещаем камеру так, чтобы центр pinch оставался на месте
            camX = newCenter.x - pinchWorld.x * scale;
            camY = newCenter.y - pinchWorld.y * scale;
        }

        lastPinch = dist;
    }
});

canvas.addEventListener("pointerup", e => { 
    pointers.delete(e.pointerId); 
    if(pointers.size < 2) lastPinch = null; 
});
canvas.addEventListener("pointercancel", e => { 
    pointers.delete(e.pointerId); 
    if(pointers.size < 2) lastPinch = null; 
});
canvas.addEventListener("wheel", e => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const factor = 1 - e.deltaY * 0.001;
    scale *= factor;
    scale = Math.min(Math.max(scale, 0.2), 2);

    // Смещаем камеру так, чтобы точка под мышью оставалась на месте
    camX = mouseX - (mouseX - camX) * factor;
    camY = mouseY - (mouseY - camY) * factor;
});





// ===== UI STATS GLOW SYSTEM =====
const statFX = {
    power: { glow: 0, delta: 0 },
    speed: { glow: 0, delta: 0 },
    movesLeft: { glow: 0, delta: 0 },
    chests: { glow: 0, delta: 0 },
    monsters: { glow: 0, delta: 0 },
    bots: { glow: 0, delta: 0 },
    roundNumber: { glow: 0, delta: 0 },
    blockedCells: { glow: 0, delta: 0 }
};

const statLast = {
    power: player.power,
    speed: player.speed,
    movesLeft: player.movesLeft,
    chests: chests.length,
    monsters: monsters.length,
    bots: bots.filter(b=>b.alive).length,
    roundNumber: roundNumber,
    blockedCells: deadZones.length
};

function updateStatFX() {
    const stats = [
        { key: "power", value: player.power },
        { key: "speed", value: player.speed },
        { key: "movesLeft", value: player.movesLeft },
        { key: "chests", value: chests.length },
        { key: "monsters", value: monsters.length },
        { key: "bots", value: bots.filter(b=>b.alive).length },
        { key: "roundNumber", value: roundNumber },
        { key: "blockedCells", value: deadZones.length }
    ];
    stats.forEach(s => {
        if (s.value !== statLast[s.key]) {
            statFX[s.key].glow = 18;
            statFX[s.key].delta = s.value > statLast[s.key] ? 1 : -1;
            statLast[s.key] = s.value;
        }
    });
}

function decrementGlow() {
    for (let k in statFX) {
        if (statFX[k].glow > 0) statFX[k].glow--;
    }
}

function glowStyleNumber(fx) {
    if (fx.glow <= 0) return "color:white; font-weight:bold;";
    const intensity = fx.glow / 18;
    const color = fx.delta > 0
        ? `rgba(0,255,0,${0.6 + 0.4*intensity})`
        : `rgba(255,0,0,${0.6 + 0.4*intensity})`;
    const shadow = fx.delta > 0
        ? `0 0 ${6 + 10*intensity}px rgba(0,255,0,${0.7 + 0.3*intensity})`
        : `0 0 ${6 + 10*intensity}px rgba(255,0,0,${0.7 + 0.3*intensity})`;
    return `font-weight:bold; color:${color}; text-shadow:${shadow};`;
}

function glowStyleLabel(cls) {
    switch(cls) {
        case "player": return "color:#00ced1;"; // бирюзовый
        case "chest": return "color:#f5c542;";   // жёлтый
        case "monster": return "color:#e53935;"; // красный
        case "bot": return "color:#1e90ff;";     // синий
        case "round": return "color:#0f0;";   // зелёный 
        case "blocked": return "color:#ffffff;"; // белый
        default: return "color:white;";
    }
}



/* ==================== DRAW ==================== */
function draw() {
    // Сброс трансформации и очистка канваса
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, camX, camY);

    // Обновляем statFX для отображения
    updateStatFX();

    // ===== СЕТКА ПОЛЯ =====
    for (let x = 0; x < MAP; x++) {
        for (let y = 0; y < MAP; y++) {
            ctx.strokeStyle = "#333";
            ctx.strokeRect(x * TILE, y * TILE, TILE, TILE);
        }
    }

    // Подсветка достижимых клеток игрока
    bfsReachable(player).forEach(c => {
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        roundRect(c.x * TILE, c.y * TILE, TILE, TILE, 6, true);
    });

    // Подсветка достижимых клеток ботов
    bots.filter(b => b.alive).forEach(b => {
        const savedMoves = b.movesLeft;
        b.movesLeft = b.speed;

        bfsReachable(b).forEach(c => {
            ctx.fillStyle = "rgba(80,80,200,0.10)";
            roundRect(c.x * TILE, c.y * TILE, TILE, TILE, 6, true);
        });

        b.movesLeft = savedMoves;
    });

    // === Вспомогательные функции для рисования ===
    function roundRect(x, y, w, h, r, fill = true) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        if (fill) ctx.fill(); else ctx.stroke();
    }

    function lightenColor(color, percent) {
        const f = parseInt(color.slice(1), 16),
            t = 255,
            R = f >> 16,
            G = (f >> 8) & 0x00FF,
            B = f & 0x0000FF;
        return "#" + (0x1000000 + ((Math.round((t - R) * percent) + R) * 0x10000 + (Math.round((t - G) * percent) + G) * 0x100 + (Math.round((t - B) * percent) + B))).toString(16).slice(1);
    }

    function darkenColor(color, percent) {
        const f = parseInt(color.slice(1), 16),
            t = 0,
            R = f >> 16,
            G = (f >> 8) & 0x00FF,
            B = f & 0x0000FF;
        return "#" + (0x1000000 + ((Math.round((t - R) * percent) + R) * 0x10000 + (Math.round((t - G) * percent) + G) * 0x100 + (Math.round((t - B) * percent) + B))).toString(16).slice(1);
    }

    function drawCandy(x, y, size, baseColor, softCenter = false, noGradient = false) {
        if (noGradient) { ctx.fillStyle = baseColor; }
        else {
            let grad = ctx.createLinearGradient(x, y, x, y + size);
            if (softCenter) {
                grad.addColorStop(0, lightenColor(baseColor, 0.15));
                grad.addColorStop(0.5, darkenColor(baseColor, 0.05));
                grad.addColorStop(1, lightenColor(baseColor, 0.15));
            } else {
                grad.addColorStop(0, lightenColor(baseColor, 0.4));
                grad.addColorStop(0.5, baseColor);
                grad.addColorStop(1, darkenColor(baseColor, 0.2));
            }
            ctx.fillStyle = grad;
        }
        roundRect(x, y, size, size, size / 4, true);

        const shine = ctx.createLinearGradient(x, y, x, y + size / 3);
        shine.addColorStop(0, "rgba(255,255,255,0.2)");
        shine.addColorStop(1, "rgba(255,255,255,0)");
        roundRect(x, y, size, size / 3, size / 4, true);

        const cellX = Math.floor(x / TILE);
        const cellY = Math.floor(y / TILE);
        if (deadZones.some(d => d.x === cellX && d.y === cellY)) {
            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;
            roundRect(x, y, size, size, size / 4, false);
        }
    }

    // ===== РИСУЕМ ОБЪЕКТЫ =====
    deadZones.forEach(d => {
        drawCandy(d.x * TILE + 4, d.y * TILE + 4, TILE - 8, "#ffffff");
        ctx.fillStyle = "#000";
        ctx.fillText(d.number, d.x * TILE + 12, d.y * TILE + 28);
    });

    chests.forEach(c => {
        drawCandy(c.x * TILE + 8, c.y * TILE + 8, 28, "#f5c542");
        ctx.fillStyle = "#000";
        ctx.fillText(c.power, c.x * TILE + 14, c.y * TILE + 30);
    });

    monsters.forEach(m => {
        drawCandy(m.x * TILE + 6, m.y * TILE + 6, 32, "#e53935");
        ctx.fillStyle = "white";
        ctx.fillText(m.power, m.x * TILE + 12, m.y * TILE + 30);
    });

    bots.forEach(b => {
        if (!b.alive) return;
        let soft = false, color = b.color;
        if (color === "blue") { color = "#1e90ff"; soft = true; }
        drawCandy(b.x * TILE + 6, b.y * TILE + 6, 32, color, soft);
        ctx.fillStyle = "white";
        ctx.fillText(b.power, b.x * TILE + 12, b.y * TILE + 30);
    });

    drawCandy(player.x * TILE + 5, player.y * TILE + 5, 34, "#00ced1", false);
    ctx.fillStyle = "white";
    ctx.fillText(player.power, player.x * TILE + 12, player.y * TILE + 30);

    // ===== FLASHES =====
    flashes.forEach(f => {
        ctx.fillStyle = `rgba(255,255,255,${f.alpha})`;
        roundRect(f.x * TILE + 4, f.y * TILE + 4, TILE - 8, TILE - 8, 6, true);
        f.alpha -= 0.05;
    });
    flashes = flashes.filter(f => f.alpha > 0);

    // ===== ОБНОВЛЯЕМ INFO БЛОК СЧЕТЧИКА =====
    let currentLevelScore = typeof levelScore !== "undefined" ? levelScore : 0;
    let currentTotalScore = typeof totalScore !== "undefined" ? totalScore : 0;

    // ===== Обновляем свечением цифры очков =====
    if (!statFX.levelScore) statFX.levelScore = 0;
    if (!statFX.totalScore) statFX.totalScore = 0;

    // Легкое сглаживание свечения
    statFX.levelScore += (currentLevelScore - statFX.levelScore) * 0.1;
    statFX.totalScore += (currentTotalScore - statFX.totalScore) * 0.1;

    document.getElementById("info").innerHTML = `
<span class="lbl player" style="${glowStyleLabel('player')}">Power</span><span class="val" style="${glowStyleNumber(statFX.power)}">${player.power}</span>
<span class="lbl player" style="${glowStyleLabel('player')}">Speed</span><span class="val" style="${glowStyleNumber(statFX.speed)}">${player.speed}</span>
<span class="lbl player" style="${glowStyleLabel('player')}">Steps left</span><span class="val" style="${glowStyleNumber(statFX.movesLeft)}">${player.movesLeft}</span><br>
<span class="lbl chest" style="${glowStyleLabel('chest')}">Chests</span><span class="val" style="${glowStyleNumber(statFX.chests)}">${chests.length}</span>
<span class="lbl monster" style="${glowStyleLabel('monster')}">Monsters</span><span class="val" style="${glowStyleNumber(statFX.monsters)}">${monsters.length}</span>
<span class="lbl bot" style="${glowStyleLabel('bot')}">Bots</span><span class="val" style="${glowStyleNumber(statFX.bots)}">${bots.filter(b => b.alive).length}</span><br>
<span class="lbl round" style="${glowStyleLabel('round')}">Round</span><span class="val" style="${glowStyleNumber(statFX.roundNumber)}">${roundNumber}</span>
<span class="lbl blocked" style="${glowStyleLabel('blocked')}">Blocked cells</span><span class="val" style="${glowStyleNumber(statFX.blockedCells)}">${deadZones.length}</span><br>
<span class="lbl score" style="${glowStyleLabel('round')}">Level ${level} Score</span><span class="val" style="${glowStyleNumber(statFX.levelScore)}">${Math.round(statFX.levelScore)}</span>
<span class="lbl score" style="${glowStyleLabel('round')}">Total</span><span class="val" style="${glowStyleNumber(statFX.totalScore)}">${Math.round(statFX.totalScore)}</span>`;

    // ===== Декрементируем эффект свечения для остальных значений =====
    decrementGlow();
}



// ===== Вспомогательная функция скруглённого прямоугольника =====
function roundRect(ctx, x, y, w, h, r, fill, stroke) {
    if (typeof r === 'undefined') r = 5;
    if (typeof r === 'number') r = {tl:r, tr:r, br:r, bl:r};
    else {
        const defaultR = {tl:0,tr:0,br:0,bl:0};
        for(let side in defaultR){ r[side] = r[side] || defaultR[side]; }
    }
    ctx.beginPath();
    ctx.moveTo(x + r.tl, y);
    ctx.lineTo(x + w - r.tr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
    ctx.lineTo(x + w, y + h - r.br);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
    ctx.lineTo(x + r.bl, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
    ctx.lineTo(x, y + r.tl);
    ctx.quadraticCurveTo(x, y, x + r.tl, y);
    ctx.closePath();
    if(fill) ctx.fill();
    if(stroke) ctx.stroke();
}

// ===== Вспомогательная функция затемнения цвета =====
function shadeColor(color, percent) {
    const f=parseInt(color.slice(1),16),t=percent<0?0:255,p=percent<0?percent*-1:percent;
    const R=f>>16,G=f>>8&0x00FF,B=f&0x0000FF;
    return "#" + (0x1000000 + (Math.round((t-R)*p/100)+R)*0x10000 + (Math.round((t-G)*p/100)+G)*0x100 + (Math.round((t-B)*p/100)+B)).toString(16).slice(1);
}
